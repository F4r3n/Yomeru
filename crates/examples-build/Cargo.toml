[package]
name = "examples-build"
version = "0.20.0"
license.workspace = true
edition = "2024"

[[bin]]
name = "examples-build"
path = "src/main.rs"

[dependencies]
examples-types = { path = "../examples-types" }
jmdict-build   = { path = "../jmdict-build" }
jmdict-types   = { path = "../jmdict-types" }
aho-corasick   = "1"
postcard       = { version = "1", features = ["alloc"] }
anyhow         = "1"
clap           = { version = "4", features = ["derive"] }

[lints]
workspace = true
