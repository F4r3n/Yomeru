[package]
name = "kanjidic-core"
version = "0.19.1"
license.workspace = true
edition = "2021"

[features]
# Builders for in-memory test binaries (`test_utils`), for this crate's
# tests and the server's endpoint tests. Off in production builds.
test-utils = []

[dependencies]
kanjidic-types = { path = "../kanjidic-types" }
japanese-utils = { path = "../japanese-utils" }
postcard       = { version = "1", features = ["alloc"] }
once_cell      = "1"
serde          = { version = "1", features = ["derive"] }
anyhow         = "1"

[lints]
workspace = true
