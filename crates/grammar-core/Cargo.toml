[package]
name = "grammar-core"
version = "0.21.0"
license.workspace = true
edition = "2024"

[dependencies]
deinflect  = { path = "../deinflect" }
anyhow     = "1"
fst        = "0.4"
postcard   = { version = "1", features = ["alloc"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust deflate only: the conversion runs in WASM too, so no zlib, and
# none of zip's other codecs (Yomitan ZIPs are deflate or stored).
flate2     = { version = "1", default-features = false, features = ["rust_backend"] }
zip        = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
