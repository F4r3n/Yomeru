[package]
name = "examples-core"
version = "0.19.1"
edition = "2024"

[features]
# Builders for in-memory test binaries (`test_utils`), for this crate's
# tests and the server's endpoint tests. Off in production builds.
test-utils = []

[dependencies]
examples-types = { path = "../examples-types" }
postcard       = { version = "1", features = ["alloc"] }
once_cell      = "1"
anyhow         = "1"

[lints]
workspace = true
