name: Release

on:
  push:
    tags:
      - 'v*'

# dicts ──┬──> extension ──> (GitHub release, AMO, updates.json) ──┐
#         │                                                       ├──> android-upload
#         └──> android (build + sign APK) ────────────────────────┘
#
# The extension and the Android APK build in parallel from the same dict
# indexes. The release itself only waits for the extension, so a broken
# Android build never holds up the Firefox one; the APK is attached once
# both exist.

jobs:
  dicts:
    name: Dictionaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: dicts

      # Upstream sources. Saved by CI on main (see ci.yml): a tag run can only
      # restore caches from its own ref or the default branch, so a cache
      # saved by an earlier tag would never be found here.
      - name: Cache dictionary sources
        uses: actions/cache/restore@v5
        with:
          path: |
            JMdict_e
            kanjidic2
            examples.utf
            kanjivg.xml
          key: dict-sources-${{ hashFiles('xtask/dict-sources.env') }}

      - name: Build dictionary indexes
        run: cargo xtask build-dicts

      - uses: actions/upload-artifact@v4
        with:
          name: dict-data
          path: |
            extension/data/jmdict.bin
            extension/data/kanjidic.bin
            extension/data/examples.bin
            extension/data/kanji-mnemonics.tsv
            extension/data/part-names.tsv
          retention-days: 1

  extension:
    name: Extension & release
    needs: dicts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: dict-data
          path: extension/data

      - name: Build
        run: cargo xtask build-extension

      - name: Package
        run: cargo xtask package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: yomeru.zip

      - name: Publish to AMO
        run: npx web-ext sign --channel=unlisted --source-dir=release/ --amo-metadata=amo-metadata.json
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Upload signed XPI and updates.json to release
        run: |
          XPI=$(ls web-ext-artifacts/*.xpi | head -1)
          XPI_NAME=$(basename "$XPI")
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          XPI_URL="https://github.com/F4r3n/Yomeru/releases/download/${{ github.ref_name }}/${XPI_NAME}"
          jq -n --arg v "$VERSION" --arg url "$XPI_URL" \
            '{"addons":{"{7ed2e7e9-a883-42ef-b811-2f069d8b612c}":{"updates":[{"version":$v,"update_link":$url}]}}}' \
            > updates.json
          gh release upload "${{ github.ref_name }}" "$XPI" updates.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Built directly on the runner, which already ships the Android SDK and
  # Java. Versions match app/android/Dockerfile (the local podman build):
  # NDK r27c, dx 0.7.10, bundletool 1.17.2. Both paths sign with
  # app/android/sign-release.sh.
  android:
    name: Android APK
    needs: dicts
    runs-on: ubuntu-latest
    env:
      DX_VERSION: 0.7.10
      BUNDLETOOL_VERSION: 1.17.2
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release

      # The bundled offline dictionaries (see app/android/src/main.rs).
      - uses: actions/download-artifact@v4
        with:
          name: dict-data
          path: app/android/assets/dict

      - name: Install dx and bundletool
        run: |
          curl -sSL https://dioxus.dev/install.sh | bash -s "v$DX_VERSION"
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"

      - name: Build
        run: dx bundle --package yomeru-android --platform android --target aarch64-linux-android --release
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          YOMERU_SERVER_URL: ${{ secrets.YOMERU_SERVER_URL }}

      # dx always writes its default icon; swap ours in and repackage.
      - name: Launcher icon
        run: app/android/icon/apply.sh target/dx/yomeru/release/android/app bundleRelease

      - name: Sign
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          aab=$(find target/dx/yomeru/release/android -name '*.aab' -path '*outputs/bundle/release/*' | head -1)
          app/android/sign-release.sh "$aab" "$RUNNER_TEMP/release.jks" yomeru \
            "dist/android/yomeru-${GITHUB_REF_NAME#v}.apk"
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          YOMERU_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUNDLETOOL: ${{ runner.temp }}/bundletool.jar

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/android/*.apk
          retention-days: 1

  android-upload:
    name: Attach APK to release
    needs: [extension, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk

      - name: Upload APK to release
        run: gh release upload "${{ github.ref_name }}" apk/*.apk --clobber -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
