[package]
name = "yomeru-shared"
version = "0.20.0"
license.workspace = true
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
manganis = "0.7.10"

# The app's logic (card store, SRS, sync, dictionary clients). Dict lookup
# itself lives on the server (or in core's offline `local_dict` on Android).
yomeru-core      = { path = "../core" }
jmdict-types     = { path = "../../crates/jmdict-types" }
kanjidic-types   = { path = "../../crates/kanjidic-types" }
examples-types   = { path = "../../crates/examples-types" }
srs-core         = { path = "../../crates/srs-core" }
# Pure suffix rules, no deps — runs client-side for the search toggle.
deinflect        = { path = "../../crates/deinflect" }

serde_json    = "1"
log           = "0.4"


# Browser glue: the website and the extension (wasm32).
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7.10", features = ["router", "web"] }
wasm-bindgen          = "0.2"
js-sys                = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlAnchorElement",
    "Url",
    "Blob",
    "BlobPropertyBag",
    "KeyboardEvent",
    "EventTarget",
] }
gloo-events  = "0.3"

# Native: the offline dictionary blocks on Dioxus' async asset reader from
# a blocking thread (see src/local_dict.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt"] }


[lints]
workspace = true
