[application]
name = "Yomeru"
# Our own manifest and activity instead of the generated ones, so the
# keyboard stays open (see the comments in each file). Copies of dx 0.7.10's
# templates: keep them in step when bumping dx.
android_manifest = "AndroidManifest.xml"
android_main_activity = "MainActivity.kt"

[bundle]
# Reverse of yomeru.faren.ovh. Never change it once the app is installed
# anywhere: Android treats a different id as a different app, so users would
# get a second copy and lose their local data on the update.
identifier = "ovh.faren.yomeru"
publisher = "F4r3n"
short_description = "Japanese dictionary and SRS vocabulary trainer"
