examples = [
  { tatoeba = "308751_87985", ja = "彼女は沢山欠点がある。{それでも}私は彼女が好きです。", en = "She has a lot of faults. Still, I like her." },
  { tatoeba = "302937_100760", ja = "彼は疲れていたが、{それでも}彼らの手伝いに行った。", en = "He was tired, and yet he went to help them." },
]

[[point]]
id = "da-ga"
pattern = "だが"
forms = []
jlpt = "N4"
meaning = "but, however (plain, written)"
formation = ["Sentence。 + だが、 + Sentence", "Noun / ［な］Adjective + だが、 + Sentence"]
explanation = """
At the start of a sentence, だが is the plain-style "but", common in \
writing and narration: 計画はよかった。だが、お金がなかった, "the plan \
was good. But there was no money". Inside a sentence it is just だ + が: \
学生だが、働いている, "I'm a student, but I work"."""
notes = """
In speech, だが sounds firm and a bit masculine; でも is the everyday \
choice, けど is casual, and しかし is formal. The polite version is \
ですが."""
related = ["demo", "shikashi", "kedo", "ga-particle"]
