would be junior high"."""
notes = """
It follows a viewpoint, not a person: for "from my point of view" use \
私から見ると or 私としては. The four forms mean the same. Close to \
からすると, and to から見ると, which can follow a person."""
related = ["kara-miru-to", "ni-totte", "kara-suru-to"]
