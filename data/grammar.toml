合う means "fit, suit, match": 口に合う, "suit one's taste"."""
related = ["komu"]
examples = [
  { tatoeba = "43607_206359", ja = "その問題を話し{合いましょう}。", en = "Let's talk over the matter." },
  { tatoeba = "293818_109871", ja = "彼は一箱のお菓子を友達全員と分け{合った}。", en = "He shared his box of biscuits with all his friends." },
  { source = "yomeru", ja = "家族で助け{合って}生きている。", en = "We live helping each other as a family." },
]

[[point]]
id = "agaru"
pattern = "上がる"
forms = ["あがる"]
jlpt = "N3"
hover = false
meaning = "up; be finished, be done"
formation = ["Verb［stem］ + 上がる   (立ち上がる, でき上がる)"]
explanation = """
Joined to a verb stem, adds an upward movement: 立ち上がる, "stand \
up"; 飛び上がる, "jump up". It also says something is completed and \
ready: でき上がる, "be finished"; 仕上がる, "be done, turn out"."""
