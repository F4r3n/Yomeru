explanation = """
A casual "I have to": 早く帰らないと, "I've got to get home". The full \
〜ないといけない is common in speech, and the end is often left off for \
the listener to fill in. It is the と conditional on a negative, and \
keeps that meaning too: 急がないと遅れるよ, "if you don't hurry, \
