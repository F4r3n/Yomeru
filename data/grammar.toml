  { tatoeba = "37377_200176", ja = "トムとマイクはお互いの友人{を通じて}知り合った。", en = "Tom and Mike became acquainted through their mutual friends." },
  { source = "yomeru", ja = "インターネット{を通して}友だちができた。", en = "I made friends through the internet." },
]

[[point]]
id = "wo-to-suru"
pattern = "を〜とする"
forms = ["を〜として", "を〜とした", "を〜とし"]
jlpt = "N3"
meaning = "take A as B, treat A as B, with A as B"
