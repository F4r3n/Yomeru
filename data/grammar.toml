  { tatoeba = "288992_114679", ja = "彼はいくぶん太り{気味だ}。", en = "He is on the heavy side." },
  { tatoeba = "253313_161205", ja = "風邪{気味だった}ので、早く寝たよ。", en = "Having a slight cold, I went to bed early." },
]

[[point]]
id = "gatai"
pattern = "がたい"
forms = ["難い"]
jlpt = "N3"
hover = false
meaning = "hard to (bring oneself to), almost impossible to"
formation = ["Verb［stem］ + がたい   (信じがたい)"]
explanation = """
Joined to a verb stem, makes an い-adjective: the speaker can hardly \
bring themselves to do it, or feels it can't be done: 信じがたい話, \
"a hard-to-believe story"; 許しがたい, "unforgivable". Formal, found \
more in writing."""
notes = """
にくい and づらい are about difficulty in practice: 読みにくい字, \
"writing that's hard to read". がたい is about feelings or judgement, \
close to "can't", but never for lack of skill: ×この字は読みがたい. It fits verbs like 信じる, 理解\
する, 許す, 忘れる. ありがたい, "grateful", is a word of its own."""
