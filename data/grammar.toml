  { tatoeba = "267054_147506", ja = "初心者{向けの}コースはありますか。", en = "Do you have a course for beginners?" },
  { tatoeba = "291262_112415", ja = "彼はその物語を子供{向けに}書き直した。", en = "He adapted the story for children." },
]

[[point]]
id = "muki"
pattern = "向き"
forms = ["向きの", "向きに", "向きだ"]
jlpt = "N3"
