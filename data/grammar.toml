[[point]]
id = "kanarazu"
pattern = "必ず"
forms = ["かならず"]
jlpt = "N4"
meaning = "without fail, always, certainly"
formation = ["必ず + Verb"]
explanation = """
Says something always or certainly happens: 必ず電話します, "I'll call \
you, I promise"; 毎朝必ず走る, "I run every morning without fail". It \
states a rule or a firm promise, not a guess."""
notes = """
きっと is a confident guess (きっと来る, "I'm sure he'll come"); ぜひ is \
a wish or invitation (ぜひ来てください). For "never", use 決して〜ない \
rather than 必ず with a negative. 必ずしも〜ない, "not necessarily", \
is a separate point."""
related = ["kitto", "zehi", "kesshite"]
examples = [
  { tatoeba = "303624_100073", ja = "彼は母の誕生日には{必ず}電話をかける。", en = "He never fails to call his mother on her birthday." },
  { tatoeba = "270047_144518", ja = "人は皆{必ず}死ぬ。", en = "All men must die." },
  { source = "yomeru", ja = "明日は{必ず}来てください。", en = "Be sure to come tomorrow." },
]

[[point]]
id = "omo-ni"
pattern = "主に"
forms = ["おもに"]
jlpt = "N4"
meaning = "mainly, mostly, chiefly"
formation = ["主に + Verb", "主に + Noun + だ"]
explanation = """
Says what makes up the largest part of something: このパソコンは主に\
仕事で使う, "I mostly use this computer for work". It points at the main \
part while allowing for others."""
notes = """
Compare だいたい, "roughly, mostly done", about amount, and ほとんど, \
"almost all". Don't confuse it with 主 inside words like 持ち主 (owner) \
followed by に."""
related = ["daitai"]
examples = [
  { tatoeba = "281755_122247", ja = "日本人は{主に}米を食べる。", en = "The Japanese live mainly on rice." },
  { source = "yomeru", ja = "このかばんは{主に}旅行で使います。", en = "I mainly use this bag for travel." },
]

[[point]]
id = "ainiku"
pattern = "あいにく"
forms = ["生憎", "あいにくですが"]
jlpt = "N4"
meaning = "unfortunately, I'm sorry but (an inconvenient fact)"
formation = ["あいにく + Sentence", "あいにく + の + Noun   (あいにくの雨)"]
explanation = """
Introduces a fact that gets in the way of what someone wanted: あいにく\
父は出かけています, "I'm sorry, my father is out". Polite and a bit \
apologetic, it's common in shops, on the phone and in business."""
notes = """
あいにくですが opens a polite refusal. あいにくの雨 is "the bad luck of \
rain". 残念ながら is a general "regrettably"; あいにく is specifically \
bad luck or bad timing that gets in someone's way. Don't use it for \
your own fault."""
related = []
examples = [
  { tatoeba = "71930_234554", ja = "{あいにく}父は留守です。", en = "I'm sorry, my father is out." },
  { tatoeba = "71935_234558", ja = "{あいにく}店は閉まっていた。", en = "Unfortunately, the store was closed." },
  { tatoeba = "71949_234572", ja = "{あいにく}ですが本日は予約でいっぱいです。", en = "I'm sorry, today is fully booked." },
]

[[point]]
id = "goro"
pattern = "ごろ"
forms = ["頃"]
jlpt = "N4"
meaning = "around, about (a point in time)"
formation = ["Time Noun + ごろ   (三時ごろ, 来週ごろ)", "Time Noun + ごろ + に + Verb"]
explanation = """
After a time, ごろ means "around that time": 三時ごろ行きます, "I'll go \
around three". It works with clock times, days, months and seasons: \
来月ごろ, 春ごろ. Ask with 何時ごろ, "around what time?"."""
notes = """
ごろ is for a point in time; くらい / ぐらい is for an amount or a length \
of time: 三時ごろ (around three o'clock) but 三時間ぐらい (about three \
hours). に after ごろ is optional. As a noun, 頃 (read ころ) means "the \
time when": 子供の頃, "when I was a child"."""
related = ["kurai"]
examples = [
  { tatoeba = "266488_148071", ja = "十時{ごろ}ですか。", en = "Is it about ten o'clock?" },
  { tatoeba = "16775_177923", ja = "いつも何時{頃}に寝るの？", en = "What time do you usually go to bed?" },
  { tatoeba = "243292_171185", ja = "今夜、８時{頃}に電話します。", en = "I'll call you up around eight this evening." },
]

[[point]]
id = "goto-ni"
pattern = "ごとに"
forms = ["毎に"]
jlpt = "N4"
meaning = "every, each (time, group, thing)"
formation = ["Number + Counter + ごとに   (五分ごとに)", "Noun + ごとに   (日曜日ごとに, 家ごとに)"]
explanation = """
Says something happens again at each interval or for each one of a \
group: バスは十分ごとに来る, "the bus comes every ten minutes"; 国ごとに\
違う, "it differs from country to country". 日ごとに means "day by \
day", for a gradual change."""
notes = """
With days, ごとに and おきに differ: 二日ごとに is "every two days", but \
一日おきに is "every other day", skipping one in between. With minutes \
and hours they are used much alike. 毎 (毎日, 毎週) is the usual word \
for "every day, every week"; ごとに puts weight on each interval or \
each member. After a verb (会うごとに) it means "each time", though たびに \
is more usual there."""
related = ["oki-ni"]
examples = [
  { tatoeba = "252616_161900", ja = "私は６時間{ごとに}２粒飲まなければなりません。", en = "I have to take two pills every six hours." },
  { tatoeba = "302195_101500", ja = "彼は日{ごとに}よくなってきている。", en = "He is getting better day by day." },
  { source = "yomeru", ja = "このバスは十分{ごとに}来ます。", en = "This bus comes every ten minutes." },
]

[[point]]
id = "sa-noun"
pattern = "さ"
forms = []
jlpt = "N4"
meaning = "-ness, degree (turns an adjective into a noun)"
formation = ["［い］Adjective［い̶］ + さ   (高い → 高さ)", "［な］Adjective + さ   (便利 → 便利さ)"]
explanation = """
Turns an adjective into a noun for its degree or amount: 高い → 高さ, \
"height"; 重い → 重さ, "weight"; 大切 → 大切さ, "importance". It's how \
you ask or state a size: 長さは二メートルです, "the length is two \
meters"."""
notes = """
いい becomes よさ. さ is neutral and measurable (深さ, "depth" in \
meters); み, a later point, adds a felt quality (深み, "depth" of a \
flavor or a person). Not every word takes み, but almost any adjective \
takes さ."""
related = ["mi-suffix"]
homographs = ["sa-particle"]
examples = [
  { tatoeba = "68363_230996", ja = "あの山はどれくらいの{高さ}がありますか。", en = "How high is that mountain?" },
  { tatoeba = "242931_171544", ja = "今日は昼と夜の{長さ}が同じです。", en = "The lengths of day and night are the same today." },
  { source = "yomeru", ja = "この箱の{重さ}は五キロです。", en = "This box weighs five kilos." },
]

[[point]]
id = "dai-age"
pattern = "代"
forms = ["年代"]
jlpt = "N4"
meaning = "(age) in one's …s; (era) the …s; charge, fee"
formation = ["Number + 代   (二十代)", "Year + 年代   (九十年代)", "Noun + 代   (電気代, バス代)"]
explanation = """
After a round number, 代 (だい) is a span of ten years of age: 二十代, \
"in one's twenties"; 十代, "teens". After a year, 年代 is a decade: \
一九九〇年代, "the 1990s". After a noun, 代 is the money paid for it: \
電気代, "the electricity bill"; 食事代, "the cost of the meal"."""
notes = """
二十代 covers 20 to 29, so it never means exactly twenty. For fees, \
料金 is the general word for a charge; 代 is joined to what you pay \
for. 時代 ("era, period") is a word of its own."""
related = []
examples = [
  { tatoeba = "318947_84767", ja = "父は５０{代}です。", en = "My father is in his fifties." },
  { tatoeba = "251623_162890", ja = "私の父は２０{代}で結婚しました。", en = "My father got married in his twenties." },
  { source = "yomeru", ja = "今月は電気{代}が高かった。", en = "The electricity bill was high this month." },
]

[[point]]
id = "kaku"
pattern = "各"
forms = []
jlpt = "N4"
meaning = "each, every (member of a group)"
formation = ["各 + Noun   (各国, 各部屋, 各駅)"]
explanation = """
A prefix for "each" of a group, taken one by one: 各国, "each country"; \
各部屋, "each room"; 各自, "each person". It's common in writing, \
notices and announcements: 各駅停車, "a train stopping at every \
station"."""
notes = """
In everyday speech, それぞれの or どの〜も sound more natural: それぞれの\
部屋. 毎 (毎日, 毎年) is "every" repeating in time; 各 is each member \
of a group. 各 joins mostly short kanji nouns."""
related = ["goto-ni"]
examples = [
  { tatoeba = "21756_184628", ja = "{各}国にはそれぞれの習慣がある。", en = "Each country has its own customs." },
  { tatoeba = "43433_206187", ja = "その列車は{各}駅停車です。", en = "The train stops at every station." },
  { source = "yomeru", ja = "{各}部屋にテレビがあります。", en = "Each room has a TV." },
]

[[point]]
id = "me-ordinal"
pattern = "目"
forms = []
jlpt = "N4"
meaning = "-th (first, second, third … in order)"
formation = ["Number + Counter + 目   (二つ目, 三回目, 二番目)"]
explanation = """
After a number and counter, 目 (め) turns it into a position in order: \
三つ目の駅, "the third station"; 二回目, "the second time"; 二番目に\
高い, "the second tallest". 日目 and 年目 count days or years from the \
start: 三日目, "day three"."""
notes = """
Without 目 the counter is just an amount: 三回 is "three times", \
三回目 "the third time". 一番 alone means "first, the most". Keep 三日目 \
(day three) apart from 三日 (the third of the month, or three days)."""
related = []
examples = [
  { tatoeba = "635028_635027", ja = "東京駅は三つ{目}です。", en = "Tokyo Station is the third stop." },
  { tatoeba = "55478_218166", ja = "これは日本で２番{目}に長い川だ。", en = "This is the second longest river in Japan." },
  { source = "yomeru", ja = "日本は三回{目}です。", en = "This is my third time in Japan." },
]

[[point]]
id = "ma-prefix"
pattern = "真"
forms = ["真っ", "真ん"]
jlpt = "N4"
meaning = "right, completely, pure (intensifying prefix)"
formation = ["真っ + Word   (真っ白, 真っ暗, 真っすぐ)", "真ん + Word   (真ん中, 真ん前)", "真 + Noun   (真夜中, 真冬)"]
explanation = """
A prefix (ま) that makes a word full or exact: 白い → 真っ白, "pure \
white"; 暗い → 真っ暗, "pitch dark"; 中 → 真ん中, "the very middle"; \
夜中 → 真夜中, "the dead of night". It takes the form 真っ, 真ん or \
真 depending on the word."""
notes = """
These are fixed words, not a free rule: learn each one. Some readings \
change: 真っ赤 (まっか), 真っ青 (まっさお). Most results work as な-adjectives \
or nouns (真っ白な雪, 真っ赤な顔); 真っ白い and 真っ黒い are heard too. 真っすぐ ("straight") is a \
word of its own."""
related = []
examples = [
  { tatoeba = "21995_184864", ja = "外は{真っ}暗だった。", en = "It was pitch black outside." },
  { tatoeba = "44891_207638", ja = "その店はちょうど駅の{真ん}前にあります。", en = "The shop is just in front of the station." },
  { source = "yomeru", ja = "雪で庭が{真っ}白になった。", en = "The garden turned white with snow." },
]

[[point]]
id = "fuu"
pattern = "風"
forms = ["ふうに"]
jlpt = "N4"
meaning = "way, manner (こんな風に); style (日本風)"
formation = ["こんな / そんな / あんな / どんな + 風に + Verb", "Noun + 風   (日本風, 和風)"]
explanation = """
風 (ふう) is a way of doing something: こんな風に書く, "write it like \
this"; どんな風に, "in what way, how". After a noun, it means "in the \
style of": 日本風の部屋, "a Japanese-style room"; 和風 and 洋風, \
"Japanese style" and "Western style"."""
notes = """
Often written in kana: こんなふうに. こういう風に and こうやって both mean \
"this way". On its own, 風 is read かぜ, "wind": 風に is usually "in \
the wind" unless こんな or どんな comes before it."""
related = ["you-da"]
examples = [
  { tatoeba = "71566_234191", ja = "あなたがそんな{風に}考えるのは残念です。", en = "I'm sorry that you should think that way." },
  { tatoeba = "37564_232508", ja = "あなたはどういう{風に}してここへ来ましたか。", en = "How did you come here?" },
  { source = "yomeru", ja = "日本{風}の部屋に泊まりました。", en = "I stayed in a Japanese-style room." },
]

[[point]]
id = "ka-suru"
pattern = "化"
forms = ["化する"]
jlpt = "N4"
meaning = "-ization, becoming (国際化, 映画化)"
formation = ["Noun + 化   (国際化)", "Noun + 化 + する / される   (映画化される)"]
explanation = """
A suffix (か) for a change into something, like "-ization": 国際化, \
"internationalization"; 自動化, "automation". With する it becomes a \
verb: その本は映画化された, "the book was made into a film". It's \
common in news and writing."""
notes = """
It mostly joins kanji nouns. 化 also sits inside words of their own: \
変化 ("change"), 文化 ("culture"). Learn these as words rather than as \
the suffix."""
related = []
examples = [
  { tatoeba = "43961_206713", ja = "その本が映画{化}されてから５年になる。", en = "It is five years since the book was made into a movie." },
  { source = "yomeru", ja = "この町も国際{化}が進んでいる。", en = "This town is becoming international too." },
]

[[point]]
id = "ika"
pattern = "以下"
forms = []
jlpt = "N4"
meaning = "or less, … and under, below; the following"
formation = ["Number + Counter + 以下   (六歳以下)", "Noun + 以下   (平均以下)", "以下 + の + Noun   (以下の文)"]
explanation = """
After an amount, 以下 means "that much or less", including the number: \
六歳以下, "six and under". After a noun, it means "below": 平均以下, \
"below average". On its own, 以下 is "the following": 以下の質問, "the \
questions below"."""
notes = """
To leave the number out, use 未満: 十八歳未満, "under eighteen" (17 and \
below). The opposite is 以上, "or more". For "within" a time or \
distance, use 以内: 一時間以内, "within an hour"."""
related = ["ijou", "inai"]
examples = [
  { source = "yomeru", ja = "六歳{以下}の子供は無料です。", en = "Children six and under are free." },
  { tatoeba = "28378_191218", ja = "{以下}は彼の話です。", en = "The following is his story." },
  { source = "yomeru", ja = "一万円{以下}のカメラを探しています。", en = "I'm looking for a camera for 10,000 yen or less." },
]

[[point]]
id = "igai"
pattern = "以外"
forms = ["以外に", "以外は"]
jlpt = "N4"
meaning = "except, other than, besides"
formation = ["Noun + 以外 (+ は)   (日曜日以外)", "Noun + 以外 + の + Noun   (日本以外の国)", "Noun + 以外 + に   (besides)"]
explanation = """
Sets one thing apart from the rest: 日曜日以外は毎日働く, "I work every \
day except Sunday"; 日本以外の国, "countries other than Japan". With に, \
it means "besides": 英語以外に何語を話しますか, "what languages do you \
speak besides English?"."""
notes = """
Mind the homophone 意外 (いがい), "unexpected": 意外に安い, "surprisingly \
cheap". With a negative, 以外に gives "no … other than": これ以外に方法\
がない, "there's no other way". のほか is a more written \
"besides"."""
related = ["shika-nai", "dake"]
examples = [
  { tatoeba = "262459_152094", ja = "私{以外}の誰もがそれを知っています。", en = "Everybody knows it except me." },
  { tatoeba = "34453_197271", ja = "ビル{以外は}みなあつまった。", en = "Except for Bill, they all made it." },
  { source = "yomeru", ja = "英語{以外に}何語を話しますか。", en = "What languages do you speak besides English?" },
]

[[point]]
id = "ijou"
pattern = "以上"
forms = ["以上です"]
jlpt = "N4"
meaning = "or more, … and over, above; (以上です) that's all"
formation = ["Number + Counter + 以上   (二十歳以上)", "Noun / Verb［た］ + 以上 + に   (予想以上に, 思った以上に)", "これ / それ + 以上 + Negative"]
explanation = """
After an amount, 以上 means "that much or more", including the number: \
二十歳以上, "twenty and over". After a noun or a thought, it means \
"more than": 思った以上に難しい, "harder than I thought". これ以上 with \
a negative is "no more, any further". 以上です closes a talk or a \
list: "that's all"."""
notes = """
English "more than five" leaves out five; 五人以上 includes it. To \
leave the number out, say 五人より多い or 五人を超える. The opposite is \
以下. Later, 以上 after a verb also means "since, now that"."""
related = ["ika"]
examples = [
  { tatoeba = "50529_213243", ja = "そのクラブには５０人{以上}の会員がいる。", en = "The club has more than fifty members." },
  { tatoeba = "37788_200587", ja = "とても暑くて、それ{以上}我慢できなかった。", en = "It was hot. I couldn't stand it any longer." },
  { source = "yomeru", ja = "私の話は{以上}です。", en = "That's all I have to say." },
]

[[point]]
id = "number-wa"
pattern = "は"
forms = []
jlpt = "N4"
meaning = "at least (after an amount)"
formation = ["Number + Counter + は   (一日二回は, 三十分は)"]
explanation = """
After an amount, は sets a minimum: "at least that much". 駅まで三十分は\
かかる, "it takes at least thirty minutes to the station"; 一度は行って\
みたい, "I want to go at least once". 少なくとも often comes before it \
for the same sense."""
notes = """
The opposite stress is も, "as many as": 三十分もかかった (that's a lot). \
しか + negative is "only": 三十分しかない. An amount at the start of a \
sentence is often just the topic: 二人は結婚した, "the two of them got \
married"."""
related = ["number-mo", "shika-nai", "wa-particle"]
homographs = ["wa-particle"]
examples = [
  { tatoeba = "267805_146756", ja = "少なくとも１００人{は}出席していた。", en = "No less than one hundred people were present." },
  { source = "yomeru", ja = "一日に二回{は}歯をみがきます。", en = "I brush my teeth at least twice a day." },
  { source = "yomeru", ja = "駅まで三十分{は}かかる。", en = "It takes at least thirty minutes to the station." },
]

[[point]]
id = "number-mo"
pattern = "も"
forms = []
jlpt = "N4"
meaning = "as many as, as much as, as long as (a lot)"
formation = ["Number + Counter + も   (五つも, 三時間も)"]
explanation = """
After an amount, も stresses that it's large, more than expected: \
ケーキを五つも食べた, "I ate five cakes, no less!"; 三時間も待った, "I \
waited a full three hours". The speaker's surprise or complaint is in \
the も."""
notes = """
With one and a negative, も means "not even one": 一人もいない, "there's \
no one"; 一度も行ったことがない. The opposite stress is は, "at least", \
or しか + negative, "only". 何 + counter + も is "many": 何回も."""
related = ["number-wa", "nan-mo", "mo-particle"]
homographs = ["mo-particle"]
examples = [
  { tatoeba = "269176_145386", ja = "新しい自転車は５００００円{も}した。", en = "The new bicycle cost me as much as 50,000 yen." },
  { tatoeba = "27006_189850", ja = "雨が３時間{も}激しく降り続いています。", en = "It has been raining heavily for three hours." },
  { source = "yomeru", ja = "ケーキを五つ{も}食べた。", en = "I ate five pieces of cake, no less." },
]

[[point]]
id = "nan-counter-ka"
pattern = "何〜か"
forms = ["何人か", "何回か", "何度か", "何冊か", "何本か", "何日か", "いくつか"]
jlpt = "N4"
meaning = "some, a few, several (people, times, things …)"
formation = ["何 + Counter + か   (何人か, 何回か)", "いくつか   (some things)"]
explanation = """
何 with a counter and か gives an unstated small number: 何人か来た, \
"a few people came"; 何回か行った, "I've been a few times". いくつか \
does the same for things: りんごをいくつか買った, "I bought some \
apples". Add の before a noun: 何人かの学生."""
notes = """
Don't confuse it with 何〜も, "many": 何回か is "a few times", 何回も \
"many times". Without か it's a question: 何人, "how many people?". \
Mind the reading: 何人か is なんにんか."""
related = ["nan-mo", "ka-mo-question-words"]
examples = [
  { tatoeba = "24518_187382", ja = "{何人か}遅刻した。", en = "Some were late." },
  { tatoeba = "29636_192472", ja = "りんごが{いくつか}木から落ちた。", en = "Some apples fell down from the tree." },
  { tatoeba = "252937_161579", ja = "私はあの学校の生徒を{何人か}知ってます。", en = "I know some students in that school." },
]

[[point]]
id = "ku-adverb"
pattern = "く"
forms = []
jlpt = "N4"
meaning = "-ly (an adjective describing an action)"
formation = ["［い］Adjective［く］ + Verb   (早く起きる)", "［な］Adjective + に + Verb   (静かに話す)"]
explanation = """
To describe how an action is done, an い-adjective takes its く form: \
早い → 早く起きる, "get up early"; 楽しい → 楽しく遊ぶ, "play happily". \
A な-adjective takes に instead: 静かに話す, "speak quietly"; きれいに\
書く, "write neatly"."""
notes = """
いい becomes よく: よく寝た, "I slept well". The same forms go before \
なる and する: 大きくなる (become big), 静かにする (be quiet). Keep \
早く (early) and 速く (fast) apart in writing; both read はやく."""
related = ["naru", "ni-suru"]
examples = [
  { tatoeba = "301024_102670", ja = "彼は{速く}走れる。", en = "He can run fast." },
  { tatoeba = "242176_172299", ja = "今朝は１時間{早く}起きた。", en = "He got up an hour early this morning." },
  { source = "yomeru", ja = "図書館では{静かに}話してください。", en = "Please speak quietly in the library." },
]

[[point]]
id = "toka"
pattern = "とか"
forms = ["とか〜とか"]
jlpt = "N4"
meaning = "things like, such as (casual list); … or something"
formation = ["Noun A + とか + Noun B + (とか)", "Verb［る］ + とか + Verb［る］ + とか", "Noun + とか   (or something)"]
explanation = """
A casual way to give examples: すしとかてんぷらとかが好き, "I like \
things like sushi and tempura". Unlike や, it can also join verbs: \
掃除するとか洗濯するとか, "cleaning, laundry, that kind of thing". \
After one noun, it softens a suggestion: お茶とか飲む？, "want some tea \
or something?"."""
notes = """
や is the neutral, written choice and joins nouns only; とか belongs to \
conversation. The last とか can be dropped. Later levels add a \
hearsay use, "I heard that …", at the end of a sentence."""
related = ["ya-particle", "nado", "tari-tari"]
hover = false
examples = [
  { source = "yomeru", ja = "週末は映画{とか買い物とか}に行きます。", en = "On weekends I go to movies, shopping and so on." },
  { source = "yomeru", ja = "すし{とかてんぷらとか}が好きです。", en = "I like things like sushi and tempura." },
  { source = "yomeru", ja = "お茶{とか}飲まない？", en = "Want some tea or something?" },
]

[[point]]
id = "nado"
pattern = "など"
forms = ["なんか", "なんて"]
jlpt = "N4"
meaning = "etc., and so on, such as; (なんか, なんて) the likes of"
formation = ["Noun A + や + Noun B + など", "Noun + など   (お茶などいかが)", "Noun + なんか / なんて (casual)"]
explanation = """
After a list of examples, など means "and so on": 京都や奈良などに行った, \
"I went to Kyoto, Nara and other places". After one noun, it softens a \
suggestion: お茶などいかがですか, "how about some tea?". In speech, \
なんか and なんて are the casual versions."""
notes = """
なんか / なんて can also play something down: 宿題なんかしたくない, "I \
don't want to do (stupid) homework"; 私なんか, "someone like me", is \
humble. About other people's things it sounds dismissive. なんて \
before an adjective, "how …!", is a separate point."""
related = ["ya-particle", "toka"]
examples = [
  { source = "yomeru", ja = "京都や奈良{など}に行きました。", en = "I went to places like Kyoto and Nara." },
  { source = "yomeru", ja = "お茶{など}いかがですか。", en = "Would you like some tea or something?" },
  { source = "yomeru", ja = "私{なんか}には無理です。", en = "Someone like me couldn't do it." },
]

[[point]]
id = "demo-demo"
pattern = "でも〜でも"
forms = []
jlpt = "N4"
meaning = "whether A or B, either A or B (it doesn't matter)"
formation = ["Noun A + でも + Noun B + でも"]
explanation = """
Names two choices and says the result is the same for both: 雨でも雪\
でも行く, "rain or snow, I'm going"; 肉でも魚でもいい, "meat or fish, \
either is fine". It often comes before いい or a statement that holds \
in every case."""
notes = """
For verbs and adjectives, use ても〜ても: 降っても降らなくても, "whether it \
rains or not". AもBも is "both A and B", a plain list without the \
"no matter which" feeling. Single でも, "or something, even", is its \
own point."""
related = ["demo", "temo", "mo-particle"]
examples = [
  { source = "yomeru", ja = "雨{でも雪でも}、毎日走ります。", en = "Rain or snow, I run every day." },
  { source = "yomeru", ja = "肉{でも魚でも}いいですよ。", en = "Meat or fish, either is fine." },
  { source = "yomeru", ja = "大人{でも子供でも}楽しめる映画です。", en = "It's a movie both adults and children can enjoy." },
]

[[point]]
id = "transitive-intransitive"
pattern = "自動詞・他動詞"
forms = ["自動詞", "他動詞"]
jlpt = "N4"
meaning = "intransitive and transitive verb pairs (開く / 開ける)"
formation = ["Noun + が + Intransitive Verb   (ドアが開く)", "Noun + を + Transitive Verb   (ドアを開ける)"]
explanation = """
Many verbs come in pairs: an intransitive one (自動詞) for something \
that happens by itself, with が, and a transitive one (他動詞) for \
someone doing it, with を. ドアが開く, "the door opens"; ドアを開ける, \
"(I) open the door". Others: 閉まる / 閉める, つく / つける, 消える / 消す, \
始まる / 始める."""
notes = """
There's no single rule for which is which, so learn them as pairs. \
For a state, the intransitive takes ている (窓が開いている, "the window is \
open"); the transitive takes てある when someone did it on purpose \
(窓が開けてある, "the window has been left open")."""
related = ["te-aru", "te-iru"]
hover = false
examples = [
  { tatoeba = "39002_201791", ja = "ドアを{開け}なさい。", en = "Open the door." },
  { tatoeba = "319557_84158", ja = "部屋の電気が{つかない}。", en = "The light doesn't come on in my room." },
  { source = "yomeru", ja = "風でドアが{開きました}。", en = "The door opened in the wind." },
]

[[point]]
id = "ga-mirareru"
pattern = "が見られる"
forms = ["がみられる"]
jlpt = "N4"
meaning = "can be seen, is found; (written) there is"
formation = ["Noun + が見られる"]
explanation = """
The potential of 見る with が: something can be seen in a place or at \
a time: 今夜は満月が見られる, "you can see a full moon tonight". In \
reports and the news, it means "is found, is observed": 変化が見られる, \
"a change can be seen"."""
notes = """
見える is what comes into view by itself (窓から山が見える); 見られる is \
being able to see it given the chance (この映画館で古い映画が見られる). \
見られる is also the passive, "be seen, be watched". In casual speech, \
見れる is heard for the potential."""
related = ["mieru", "potential-form", "passive"]
examples = [
  { tatoeba = "243395_171084", ja = "今夜は満月{が見られる}。", en = "A full moon can be seen tonight." },
  { tatoeba = "58344_221022", ja = "この森では多くの動物{が見られる}。", en = "You can see many animals in this forest." },
]

[[point]]
id = "sukunakunai"
pattern = "少なくない"
forms = ["すくなくない"]
jlpt = "N4"
meaning = "not a few, quite a lot, many"
formation = ["Noun + は / が / も + 少なくない"]
explanation = """
"Not few", which means "quite a lot": 日本食が好きな外国人は少なくない, \
"many foreigners like Japanese food". It's an understatement, more \
careful than 多い, and common in writing and the news."""
notes = """
Don't confuse it with 少なくとも, "at least". 少なくない is a plain \
negative of 少ない and conjugates the same way: 少なくなかった."""
related = []
examples = [
  { tatoeba = "281694_122306", ja = "日本食が好きな外国人は{少なくない}。", en = "Not a few foreigners like Japanese food." },
  { tatoeba = "286407_117257", ja = "彼の作文は誤りが{少なくない}。", en = "His composition has not a few mistakes." },
]

[[point]]
id = "ni-ki-ga-tsuku"
pattern = "に気がつく"
forms = ["に気が付く", "に気づく", "に気付く", "にきがつく", "気がつく", "気が付く"]
jlpt = "N4"
meaning = "notice, realize, become aware of"
formation = [
  "Noun + に気がつく",
  "Verb / ［い］Adjective + の / こと + に気がつく   (ないのに気がつく)",
]
explanation = """
Says that something comes to your attention, by sight or by thinking: \
間違いに気がついた, "I noticed the mistake". What you notice takes に; a \
whole clause becomes a noun first with の or こと: かさがないのに気がつい\
た, "I noticed my umbrella was gone". 気づく is a shorter verb with the \
same meaning."""
notes = """
It's about noticing, not about seeing: 見る and 見える just say what is \
in view. Don't mix it up with 気をつける ("be careful", を) or 気にする \
("worry about", を). The negative 気がつかなかった is the usual way to \
say "I didn't realize"."""
related = ["ga-suru", "mieru", "no-nominalizer"]
examples = [
  { tatoeba = "69043_231677", ja = "彼が家を出て行くのに{気が付き}ましたか？", en = "Did you notice him leave the house?" },
  { tatoeba = "290658_113017", ja = "彼はその危険{に気がつかなかった}。", en = "He was not aware of the danger." },
  { source = "yomeru", ja = "家に帰ってから、かさを忘れたこと{に気がついた}。", en = "After I got home, I realized I had forgotten my umbrella." },
]

[[point]]
id = "no-wa-da"
pattern = "のは〜だ"
forms = ["のは〜です", "のは〜からだ"]
jlpt = "N4"
meaning = "it's … that …, the one who / the reason … is …"
formation = [
  "Verb / ［い］Adjective + のは + Noun + だ",
  "［な］Adjective + な + のは + Noun + だ",
  "… + のは + Clause + からだ   (the reason)",
]
explanation = """
Puts the known part first, made into a noun with のは, and saves the \
new information for the end, before だ: まちがっているのは私だ, "it's me \
who's wrong". With からだ at the end it gives a reason: 遅れたのは電車\
が止まったからです, "the reason I was late is that the train stopped"."""
notes = """
English stresses the word with its voice or "it's … that"; Japanese \
moves it to the end. A plain sentence (私がまちがっている) states a \
fact; the のは version answers "who?" or "why?". Use からだ, not ので\
だ, for the reason."""
related = ["no-nominalizer", "kara-reason", "n-desu"]
examples = [
  { tatoeba = "32552_195378", ja = "まちがっている{のは}私だ。", en = "It is me that is wrong." },
  { tatoeba = "246656_167842", ja = "私が会いたい{のは}彼女なんです。", en = "It is her that I want to meet." },
  { source = "yomeru", ja = "遅れた{のは}電車が止まったからです。", en = "The reason I was late is that the train stopped." },
]

[[point]]
id = "nai-ka"
pattern = "ないか"
forms = ["ないかい"]
jlpt = "N4"
hover = false
meaning = "won't you, how about (casual invitation)"
formation = ["Verb［ない］ + か"]
explanation = """
The casual way to invite or suggest, the plain version of 〜ませんか: \
今夜映画を見に行かないか, "how about going to a movie tonight?". In \
speech it's often just 行かない？ with a rising tone."""
notes = """
With か it sounds rather masculine and a bit firm; 行かない？ suits \
everyone. Not every ないか invites: 寒くないか asks "aren't you cold?", \
and 〜ないかな is a wish or a doubt. To a superior, use 〜ませんか."""
related = ["masen-ka", "mashou", "volitional"]
examples = [
  { tatoeba = "243401_171078", ja = "今夜映画を見に行か{ないか}。", en = "How about going to the movie tonight?" },
  { tatoeba = "435631_171208", ja = "今晩少し飲ま{ないか}。", en = "Let's have a few drinks tonight." },
]

[[point]]
id = "tame-ni"
pattern = "ために"
forms = ["為に", "のために", "のため"]
jlpt = "N3"
meaning = "in order to, for (the sake of); because of (formal)"
formation = [
  "Verb［る］ + ために   (purpose)",
  "Noun + のために   (for, for the sake of)",
  "Verb / ［い］Adjective + ために   (cause: 遅れたために)",
  "［な］Adjective + な / Noun + の + ために   (cause)",
]
explanation = """
Gives a goal: 留学するためにお金をためている, "I'm saving money to \
study abroad". After a noun with の it means "for": 家族のために働く, \
"I work for my family". In a more formal style it gives a cause \
instead: 事故のために電車が遅れた, "the train was late because of an \
accident"."""
notes = """
For a goal, the verb must be something you choose to do, with the same \
subject in both halves; for states and potentials (見える, 話せる) use \
ように. A past verb before it always means a cause, and a cause can't \
be followed by an order, a request or the speaker's will. ため without \
に is the same and can end a sentence: 健康のためだ. The cause use is \
stiff: in speech, から or ので."""
related = ["you-ni-purpose", "noni-purpose", "kara-reason", "node", "sono-tame"]
examples = [
  { tatoeba = "257442_157092", ja = "私は黒板を見る{ために}眼鏡をかけた。", en = "I put on my glasses to see the blackboard." },
  { tatoeba = "314623_89083", ja = "彼女は自分{のために}おいしい料理を作った。", en = "She cooked herself a good meal." },
  { source = "yomeru", ja = "事故{のために}、電車が遅れた。", en = "The train was late because of an accident." },
]

[[point]]
id = "okage-de"
pattern = "おかげで"
forms = ["お陰で", "おかげだ", "おかげです", "おかげさまで"]
jlpt = "N3"
meaning = "thanks to, because of (a good result)"
formation = [
  "Verb / ［い］Adjective + おかげで",
  "［な］Adjective + な + おかげで",
  "Noun + の + おかげで",
]
explanation = """
Credits something or someone for a good result: 先生のおかげで合格\
できた, "I passed thanks to my teacher". At the end of a sentence, \
おかげだ / おかげです says what you owe it to. おかげさまで is a polite \
set phrase for good news about yourself, as in "I'm fine, thank you", \
thanking people in general."""
notes = """
For a bad result, use せいで. おかげで with a bad result is sarcastic, \
like "thanks a lot": 君のおかげで遅刻したよ. A verb before it is \
usually past: 手伝ってくれたおかげで."""
related = ["sei-de", "tame-ni", "kara-reason"]
examples = [
  { tatoeba = "28037_190875", ja = "医者の{おかげで}彼女は病気が治った。", en = "With the help of doctors, she got over her illness." },
  { tatoeba = "71001_233629", ja = "あなたの{おかげで}、私は早く終えることが出来ました。", en = "Thanks to your help, I was able to finish early." },
  { tatoeba = "65115_227762", ja = "{おかげさまで}元気です。", en = "I'm fine, thank you." },
]

[[point]]
id = "sei-de"
pattern = "せいで"
forms = ["せいだ", "せいです", "せいか", "せいにする"]
jlpt = "N3"
meaning = "because of, due to (a bad result); someone's fault"
formation = [
  "Verb / ［い］Adjective + せいで",
  "［な］Adjective + な + せいで",
  "Noun + の + せいで",
  "Noun + の + せいにする   (blame on)",
]
explanation = """
Blames something for a bad result: 雪のせいで電車が止まった, "the \
trains stopped because of the snow". At the end, お前のせいだ: \
"it's your fault". 〜のせいにする pins the blame on someone, and せいか \
means "maybe because": 疲れたせいか、頭が痛い, "my head hurts, maybe \
because I'm tired"."""
notes = """
For a good result, use おかげで; for a neutral reason, から, ので or \
ために. せいか only guesses at the cause and blames less; it also fits \
results that aren't bad (年のせいか、早く目が覚める)."""
related = ["okage-de", "bakari-ni", "tame-ni"]
examples = [
  { tatoeba = "64308_226960", ja = "お前の{せいだ}ぞ。", en = "This is your fault." },
  { tatoeba = "297755_105931", ja = "彼は私の{せいにし}ようとした。", en = "He tried to put the blame on me." },
  { source = "yomeru", ja = "雨の{せいで}、洗濯物がぬれてしまった。", en = "The laundry got wet because of the rain." },
]

[[point]]
id = "kara-koso"
pattern = "からこそ"
forms = ["だからこそ"]
jlpt = "N3"
meaning = "precisely because, it's because … that; that's exactly why"
formation = [
  "Verb / ［い］Adjective + からこそ",
  "［な］Adjective / Noun + だからこそ",
  "Sentence。 + だからこそ + Sentence",
]
explanation = """
Stresses that this, and nothing else, is the real reason, often one \
the listener wouldn't expect: 簡単じゃないからこそ、おもしろい, "it's \
fun precisely because it isn't easy". At the start of a sentence, \
だからこそ means "that's exactly why"."""
notes = """
The sentence often ends with のだ / んです. The reason is one the \
speaker finds meaningful, so it rarely gives a plain everyday cause \
(not 雨だからこそ遅れた). こそ follows から, never ので: no のでこそ."""
related = ["kara-reason", "koso"]
examples = [
  { tatoeba = "308743_94961", ja = "彼女には欠点がある{からこそ}僕は一層彼女が好きだ。", en = "I love her all the more for her faults." },
  { tatoeba = "41061_203836", ja = "{だからこそ}、車で行くなといったんですよ。", en = "That's why I told you not to go by car." },
  { source = "yomeru", ja = "毎日練習した{からこそ}、勝てたんだ。", en = "It's because we practiced every day that we won." },
]

[[point]]
id = "koto-kara"
pattern = "ことから"
forms = []
jlpt = "N3"
meaning = "from the fact that, since (a basis, or a name's origin)"
formation = [
  "Verb / ［い］Adjective + ことから",
  "［な］Adjective + な / である + ことから",
  "Noun + である + ことから",
]
explanation = """
Gives the fact that leads to a conclusion, or explains how something \
got its name: 星の形をしていることから、星の砂と呼ばれる, "it's called \
star sand because it's shaped like a star". Formal and written; the \
sentence often ends in と呼ばれる, とわかった or と考えられる."""
notes = """
Not for everyday personal reasons (I was tired, so I went home): use \
から or ので. Don't confuse with ことから始める, "start with", where \
から is just "from": 簡単なことから始めよう."""
related = ["kara-reason", "node"]
examples = [
  { tatoeba = "20796_183673", ja = "眼鏡の形をしている{ことから}、その橋を眼鏡橋とよぶ。", en = "Since the bridge looks like a pair of glasses, they call it Meganebashi." },
  { tatoeba = "61128_223792", ja = "この{ことから}、会社には事故の責任が無いことになる。", en = "It follows from this that the company is not responsible for the accident." },
]

[[point]]
id = "to-iu-riyuu-de"
pattern = "という理由で"
forms = ["という理由から", "というりゆうで"]
jlpt = "N3"
meaning = "on the grounds that, for the reason that"
formation = [
  "Verb / ［い］Adjective + という理由で",
  "［な］Adjective / Noun (+ だ) + という理由で",
]
explanation = """
Names the reason given for a decision, often someone else's: 高いと\
いう理由で買わなかった, "I didn't buy it on the grounds that it was too \
expensive". Because the reason is quoted, it can be an excuse, or one \
the speaker doesn't quite accept."""
notes = """
Common with decisions done to someone: 許された, 断られた, 首になった. \
という理由から is the same, more written. A plain から or ので gives \
the reason as your own; という理由で puts a little distance."""
related = ["to-iu", "kara-reason", "tame-ni"]
examples = [
  { tatoeba = "299111_104579", ja = "彼は若い{という理由で}許された。", en = "He was excused on the ground that he was young." },
  { source = "yomeru", ja = "子どもだ{という理由で}、入れてもらえなかった。", en = "I wasn't let in on the grounds that I was a child." },
]

[[point]]
id = "bakari-ni"
pattern = "ばかりに"
forms = []
jlpt = "N3"
meaning = "just because, only because (with regret)"
formation = [
  "Verb［た］ / Verb［ない］ + ばかりに",
  "［い］Adjective + ばかりに",
  "［な］Adjective + な / である + ばかりに",
  "Noun + である + ばかりに",
]
explanation = """
Blames one small thing for a big, unwanted result: 一言言ったばかりに、\
けんかになった, "just because I said one word, it turned into a \
fight". The tone is regret: if only that one thing hadn't happened."""
notes = """
The result is usually bad and out of the speaker's control, so no \
orders or plans after it. 〜たいばかりに is "just wanting to…", for \
what someone went through for that one wish: 会いたいばかりに遠くから\
来た. Not the たばかり of "just did"."""
related = ["sei-de", "ta-bakari", "te-bakari"]
examples = [
  { source = "yomeru", ja = "傘を忘れた{ばかりに}、びしょぬれになった。", en = "Just because I forgot my umbrella, I got soaked." },
  { source = "yomeru", ja = "英語ができない{ばかりに}、その仕事につけなかった。", en = "Just because I can't speak English, I couldn't get that job." },
]

[[point]]
id = "sono-tame"
pattern = "そのため"
forms = ["そのために", "そのためか"]
jlpt = "N3"
meaning = "for that reason, because of that; for that purpose"
formation = ["Sentence。 + そのため + Sentence"]
explanation = """
Starts a sentence with the result of what came before, in a formal or \
written style: 大雪が降った。そのため、電車が止まった, "there was \
heavy snow. Because of that, the trains stopped". そのために can also \
mean "for that purpose": 留学したい。そのためにお金をためている."""
notes = """
In conversation, だから or それで. そのためか: "perhaps because of \
that". Before a noun, そのための means "for that": そのための時間."""
related = ["tame-ni", "sorede", "sono-kekka"]
examples = [
  { tatoeba = "50269_212984", ja = "{そのため}大勢の人が亡くなった。", en = "Therefore many people passed away." },
  { tatoeba = "50271_212986", ja = "{そのために}問題はますます複雑になった。", en = "That made the problem all the more complicated." },
  { source = "yomeru", ja = "台風が来た。{そのため}、学校は休みになった。", en = "A typhoon came. Because of that, school was closed." },
]

[[point]]
id = "sono-kekka"
pattern = "その結果"
forms = ["そのけっか"]
jlpt = "N3"
meaning = "as a result, consequently"
formation = ["Sentence。 + その結果 + Sentence"]
explanation = """
Links an action or event to the result it brought: 駅前に大きな店が\
できた。その結果、小さな店が閉まった, "a big store opened by the \
station. As a result, the small shops closed". Neutral to formal; common in reports and the news."""
notes = """
The result is something that has happened, so no orders or plans \
after it. Inside one sentence, Verb［た］ + 結果 does the same: よく\
考えた結果、やめることにした. その結果 can also be just "that \
result": その結果に驚いた."""
related = ["sono-tame", "sorede"]
examples = [
  { tatoeba = "48408_211134", ja = "{その結果}、彼女は、職を失うこととなった。", en = "The consequence was that she lost her job." },
  { source = "yomeru", ja = "毎日日記を書いた。{その結果}、漢字を覚えた。", en = "I wrote a diary every day. As a result, I learned kanji." },
]

[[point]]
id = "sokode"
pattern = "そこで"
forms = []
jlpt = "N3"
meaning = "so, therefore (taking a step to deal with it)"
formation = ["Sentence。 + そこで + Sentence"]
explanation = """
Introduces what someone did about the situation just described: 道が\
わからなかった。そこで、駅の人に聞いた, "I didn't know the way, so I \
asked someone at the station". What follows is usually an action or \
a decision."""
notes = """
それで reports any result (I overslept, so I was late); そこで is for \
a step taken on purpose, so it doesn't fit results nobody chose. \
Taken literally, そこで is "there, at that place" (そこで待って, \
"wait there") or "at that point" (そこでやめた, "I stopped there"). \
The context tells which."""
related = ["sorede", "suruto", "sono-tame"]
examples = [
  { source = "yomeru", ja = "部屋が暑かった。{そこで}、窓を開けた。", en = "The room was hot, so I opened the window." },
  { source = "yomeru", ja = "一人では無理だった。{そこで}、友達に頼んだ。", en = "I couldn't do it alone, so I asked a friend." },
]

[[point]]
id = "suruto"
pattern = "すると"
forms = ["そうすると"]
jlpt = "N3"
hover = false
meaning = "then, thereupon; (in that case) so"
formation = ["Sentence。 + すると + Sentence"]
explanation = """
Tells what happened right after the previous event, often something \
unexpected: ドアを開けた。すると、猫が飛び出してきた, "I opened the \
door, and a cat jumped out". In conversation, (そう)すると draws a \
conclusion from what was just said: すると、明日は休みですね, "so \
tomorrow is a day off, then"."""
notes = """
It comes from the と of "when" (Verb + と), so what follows is \
something that happened or follows naturally, not the speaker's own \
choice: for that, そこで. それから just lists the next step. Search \
only: inside a sentence, する + と (練習すると) is the plain \
conditional."""
related = ["to-conditional", "sokode", "sorekara"]
examples = [
  { source = "yomeru", ja = "ボタンを押した。{すると}、ドアが開いた。", en = "I pushed the button, and the door opened." },
  { source = "yomeru", ja = "窓を開けた。{すると}、冷たい風が入ってきた。", en = "I opened the window. Then a cold wind came in." },
]

[[point]]
id = "naze-nara"
pattern = "なぜなら"
forms = ["なぜならば", "なぜかというと", "なぜかと言うと"]
jlpt = "N3"
meaning = "because, the reason is (starting a sentence)"
formation = ["Sentence。 + なぜなら + Clause + からだ"]
explanation = """
Gives the reason after the statement, in a new sentence that ends \
with からだ / からです: 今日は早く寝る。なぜなら明日は試験だからだ, "I'm \
going to bed early. Because tomorrow is the exam". It sounds written \
or like a speech; in conversation, なぜかというと, or just 〜からです."""
notes = """
Don't drop the ending: なぜなら with a bare sentence after it sounds \
unfinished. The "because" in the middle of an English sentence is から \
or ので, not なぜなら."""
related = ["kara-reason", "doushite", "no-wa-da"]
examples = [
  { tatoeba = "36426_199225", ja = "{なぜなら}新聞記者だったからです。", en = "Because I was a newspaper reporter." },
  { tatoeba = "36430_199229", ja = "{なぜなら}私は昨日長い間勉強したからです。", en = "Because I studied for a long time yesterday." },
]

[[point]]
id = "nanishiro"
pattern = "なにしろ"
forms = ["何しろ"]
jlpt = "N3"
meaning = "after all, you see, what with (stressing a reason)"
formation = ["なにしろ + Sentence   (often + から / ので)"]
explanation = """
Puts the reason that explains everything up front, often something \
extreme: なにしろ忙しくて、寝る時間もない, "I'm just so busy, I don't \
even have time to sleep". The sentence often ends with から, ので or \
のだ."""
notes = """
Conversational and a little emphatic. とにかく is "anyway": it pushes \
other things aside instead of giving a reason."""
related = ["tonikaku", "kara-reason"]
examples = [
  { source = "yomeru", ja = "{なにしろ}初めてなので、よくわかりません。", en = "It's my first time, after all, so I don't really know." },
  { source = "yomeru", ja = "{なにしろ}人が多くて、何も見えなかった。", en = "There were just so many people, I couldn't see anything." },
]

[[point]]
id = "tsumari"
pattern = "つまり"
forms = []
jlpt = "N3"
meaning = "in other words, that is, in short"
formation = [
  "Sentence。 + つまり + Sentence",
  "A、つまり B   (B restates A)",
]
explanation = """
Says what came before in other words, or sums it up: 店は五時に閉まる。\
つまり、あと十分だ, "the store closes at five. So that's ten minutes \
from now". As a \
conclusion, the sentence often ends in ということだ or のだ: つまり、\
行けないということ？, "so basically, you can't go?"."""
notes = """
すなわち does the same in writing, mostly for an exact "namely"; \
つまり is everyday and also sums up or draws a conclusion."""
related = ["sunawachi"]
examples = [
  { tatoeba = "305431_98271", ja = "彼らは３日後、{つまり}６月１０日に出発します。", en = "They are leaving in three days, that is to say June 10th." },
  { tatoeba = "18618_179759", ja = "金と私とは他人同士だ。{つまり}、貧しいのだ。", en = "Money and I are strangers; in other words, I am poor." },
]

[[point]]
id = "sunawachi"
pattern = "すなわち"
forms = ["即ち"]
jlpt = "N3"
meaning = "namely, that is to say (formal)"
formation = ["A、すなわち B   (B is the same as A, said exactly)"]
explanation = """
Says that two things are the same, the second making the first exact: \
日本の首都、すなわち東京, "the capital of Japan, namely Tokyo". \
Found in writing, speeches and the news, rarely in conversation."""
notes = """
つまり is the everyday word, and it can also sum up a point; すなわち \
mostly links two names for one thing."""
related = ["tsumari"]
examples = [
  { tatoeba = "42825_205579", ja = "それは３年後、{すなわち}１９６５年に起こった。", en = "It happened three years later, that is in 1965." },
  { tatoeba = "301770_101923", ja = "彼は天文学、{すなわち}星の研究をしている。", en = "He studies astronomy, or the science of stars." },
]

[[point]]
id = "to-iu"
pattern = "という"
forms = ["っていう"]
jlpt = "N3"
hover = false
meaning = "called, named; (that) which says, the … that"
formation = [
  "Noun + という + Noun   (さくらという店)",
  "Sentence (plain) + という + Noun   (雨が降るという話)",
]
explanation = """
Links a name or a content to the noun it describes: 田中という人, "a \
person called Tanaka"; 明日休みだという話, "the news that tomorrow is \
a day off". 何という is the way to ask a name: これは何という花ですか, \
"what is this flower called?"."""
notes = """
The noun after it often is 人, 名前, 話, こと, 意味. Usually written in \
kana; と言う with the kanji is the verb "say" in its literal sense. \
Casual speech says っていう: ポチっていう犬. Search only: という is \
everywhere in text."""
related = ["to-iu-koto", "to-iu-no-wa", "tte"]
examples = [
  { tatoeba = "48271_211000", ja = "その犬はジョン{という}名前です。", en = "The dog answers to the name John." },
  { tatoeba = "58126_220804", ja = "この川は何{という}のですか。", en = "What is the name of this river?" },
  { tatoeba = "71092_233719", ja = "あなたに会いたい{という}人がいます。", en = "There's somebody who wants to meet you." },
]

[[point]]
id = "to-iu-no-wa"
pattern = "というのは"
forms = ["というものは"]
jlpt = "N3"
meaning = "X means, what is called X; (that's) because"
formation = [
  "Noun + というのは + Explanation   (「ゆうべ」というのは昨日の夜のことだ)",
  "Sentence (plain) + というのは + Comment",
  "Sentence。 + というのは + Reason + からだ",
]
explanation = """
Picks out a word or a statement to explain or judge it: 「ゆうべ」というの\
は昨日の夜のことです, "'yuube' means last night". After a whole \
sentence it turns it into a topic: 彼が来るというのは本当だ, "it's true \
that he's coming". At the start of a sentence it gives a reason, \
ending in からだ."""
notes = """
For a definition, the sentence often ends in のことだ or という意味だ. \
というものは is about the nature of a thing in general: 人生というものは, \
"life, as such". Casual speech says って: ゆうべって何？. The reason use \
is spoken: なぜなら is its written \
counterpart."""
related = ["to-iu", "tte", "naze-nara"]
examples = [
  { tatoeba = "284180_119483", ja = "彼が忙しかった{というのは}本当だ。", en = "That he was busy is true." },
  { source = "yomeru", ja = "「ゆうべ」{というのは}昨日の夜のことです。", en = "\"Yuube\" means last night." },
]

[[point]]
id = "to-ieba"
pattern = "といえば"
forms = ["と言えば", "というと", "と言うと", "といったら", "と言ったら"]
jlpt = "N3"
meaning = "speaking of, when it comes to, if you say X"
formation = ["Noun + といえば / というと / といったら"]
explanation = """
Takes up a topic someone has just mentioned, or names a thing and the \
first thing it brings to mind: 夏といえばスイカだ, "when you say \
summer, it's watermelon". In conversation it turns the talk: 京都と\
いえば、来月行くんだ, "speaking of Kyoto, I'm going next month"."""
notes = """
といったら can also stress how extreme something is: 寒さといったら, \
"the cold, I tell you". In a question, というと asks what someone \
means: というと？, "meaning?". どちらかといえば / どちらかというと is a \
set phrase, "if anything, rather". 私はといえば is "as for me"."""
related = ["to-iu", "ka-to-iu-to", "ni-tsuite"]
examples = [
  { tatoeba = "240332_174138", ja = "交通事故{と言えば}、去年１件見た。", en = "Speaking of traffic accidents, I saw one last year." },
  { tatoeba = "32035_194861", ja = "メアリー{と言えば}、しばらく会ってないな。", en = "Speaking of Mary, I have not seen her for a long time." },
  { tatoeba = "307277_96428", ja = "彼らは日本{といえば}富士山を想像する。", en = "They often connect Japan with Mt. Fuji." },
]

[[point]]
id = "to-itte-mo"
pattern = "といっても"
forms = ["と言っても", "とはいっても", "とは言っても"]
jlpt = "N3"
meaning = "although I say X, even though it's called X (it's not much)"
formation = [
  "Noun + といっても   (旅行といっても)",
  "Sentence (plain) + といっても   (料理ができるといっても)",
]
explanation = """
Says something, then corrects what the listener would expect from it, \
usually downward: 旅行といっても、近くの町に一泊しただけだ, "I say a \
trip, but I just spent a night in a nearby town". The second half \
explains how it is less than the word suggests."""
notes = """
とはいっても also starts a sentence: "that said, still". Don't confuse \
it with と言ってもいい, "you could say", where もいい follows, or with \
the plain "even if you say": やめてといってもやめない, "he won't stop \
even when told to". 何といっても is a set phrase, "above all"."""
related = ["to-itte-mo-ii", "temo", "kedo"]
examples = [
  { source = "yomeru", ja = "旅行{といっても}、近くの町に一泊しただけだ。", en = "I say a trip, but I just stayed one night in a nearby town." },
  { source = "yomeru", ja = "料理ができる{といっても}、カレーくらいです。", en = "I say I can cook, but it's only curry, really." },
]

[[point]]
id = "to-iu-yori"
pattern = "というより"
forms = ["というよりも", "というよりは", "と言うより"]
jlpt = "N3"
meaning = "rather than, more … than, not so much X as Y"
formation = [
  "Noun / ［な］Adjective + というより + Y",
  "Verb / ［い］Adjective + というより + Y",
]
explanation = """
Replaces a description with a better one: 彼は先生というより友だちだ, \
"he's more a friend than a teacher". The first word isn't wrong, \
just not the best fit; Y is the more accurate word. むしろ often comes \
before Y: というよりむしろ."""
notes = """
Unlike より in a comparison of two things (AはBより大きい), the two \
words here describe one and the same thing. Casual speech says って\
いうか to correct oneself: 寒いっていうか、痛い."""
related = ["yori-hou-ga", "mushiro"]
examples = [
  { tatoeba = "52537_215239", ja = "ジョンは天才{というより}努力家だ。", en = "John is not so much a genius as a hard worker." },
  { source = "yomeru", ja = "今日は暖かい{というより}暑い。", en = "Today it's not so much warm as hot." },
]

[[point]]
id = "ka-to-iu-to"
pattern = "かというと"
forms = ["かといえば", "かと言うと", "かと言えば"]
jlpt = "N3"
meaning = "if you ask why/what…; if you ask whether…, (not really)"
formation = [
  "Question word + Sentence + かというと + Answer   (なぜかというと)",
  "Sentence + かというと + Negative   (好きかというと、そうでもない)",
]
explanation = """
Asks a question aloud and answers it right away. With a question word, \
it explains: どうして遅れたかというと、電車が止まったからだ, "why was I \
late? Because the train stopped". Without one, it doubts: 高ければいい\
かというと、そうでもない, "is expensive always better? Not really"."""
notes = """
The second use is followed by a negative or そうとは限らない. \
どちらかというと is a set phrase, "if anything, rather". かといって, \
"but that doesn't mean", is a different point. なぜかというと has its \
own entry under なぜなら."""
related = ["naze-nara", "to-ieba", "to-wa-kagiranai"]
examples = [
  { source = "yomeru", ja = "どうして遅れた{かというと}、電車が止まったからです。", en = "Why was I late? Because the train stopped." },
  { source = "yomeru", ja = "毎日走る{かというと}、それは無理だ。", en = "Will I run every day? That's impossible." },
  { tatoeba = "38022_200818", ja = "どちら{かといえば}彼とは離婚したい。", en = "I would rather divorce him." },
]

[[point]]
id = "ni-yoru-to"
pattern = "によると"
forms = ["によれば", "の話では", "の話によると"]
jlpt = "N3"
meaning = "according to (a source)"
formation = ["Noun + によると / によれば   (天気予報によると)"]
explanation = """
Names where information comes from: a person, the news, a report. \
The sentence then ends with a hearsay ending such as そうだ, らしい or \
ということだ: 母によると、駅前に新しい店ができたそうだ, \
"according to my mother, a new shop has opened by the station"."""
notes = """
Leaving out the hearsay ending sounds odd in conversation, as if the \
speaker claimed it as their own knowledge. 〜の話では, "from what X \
says", is the everyday way for a person. によって is a different \
point: "by, depending on"."""
related = ["sou-da-hearsay", "rashii", "to-no-koto-da", "ni-yotte"]
examples = [
  { tatoeba = "39236_202024", ja = "テレビ{によれば}今日は晴れるそうだ。", en = "According to the TV, it will be fine today." },
  { tatoeba = "269406_145157", ja = "新聞{によれば}ペルーで地震があったそうだ。", en = "According to the paper, there was an earthquake in Peru." },
  { source = "yomeru", ja = "母{の話では}、兄は来月結婚するらしい。", en = "From what my mother says, my brother is getting married next month." },
]

[[point]]
id = "to-no-koto-da"
pattern = "とのことだ"
forms = ["とのことです", "とのこと"]
jlpt = "N3"
meaning = "I hear that, I'm told that (passing on a message)"
formation = ["Sentence (plain) + とのことだ   (遅れるとのことです)"]
explanation = """
Passes on what someone said, often a message for the listener: 部長は\
少し遅れるとのことです, "the manager says he'll be a little late". \
よろしくとのことです is the set way to pass on someone's regards."""
notes = """
Formal: business talk, letters, emails. Close to そうです, but it \
sounds more like relaying someone's exact words. Casual speech uses \
〜って or 〜んだって. Don't confuse it with やっとのことで, "at long \
last", where the と belongs to やっと."""
related = ["sou-da-hearsay", "to-iu-koto", "n-datte", "ni-yoru-to"]
examples = [
  { tatoeba = "237827_176636", ja = "兄があなたによろしく{とのことです}。", en = "My brother sends you his regards." },
  { tatoeba = "6637251_192626", ja = "ラジオによると、北海で嵐が起こる{とのことだ}。", en = "According to the radio, a storm is imminent in the North Sea." },
  { source = "yomeru", ja = "部長は少し遅れる{とのことです}。", en = "The manager says he'll be a little late." },
]

[[point]]
id = "n-datte"
pattern = "んだって"
forms = ["んですって"]
jlpt = "N3"
meaning = "I heard that, apparently (casual hearsay)"
formation = [
  "Verb / ［い］Adjective + んだって   (行くんだって)",
  "［な］Adjective / Noun + なんだって   (休みなんだって)",
]
explanation = """
Passes on something the speaker heard, in casual talk: 田中さん、\
結婚するんだって, "I heard Tanaka is getting married". With a rising \
tone it asks if what one heard is true: 引っ越すんだって？, "I hear \
you're moving?"."""
notes = """
It is the explaining ん(だ) plus って, "they say". んですって is the \
polite version, used mostly by women. Plain って after a sentence works \
too (来ないって); んだって adds that it's news or an explanation. \
In speech, なんだって alone can also be a surprised "what?!"."""
related = ["tte", "sou-da-hearsay", "n-desu", "datte-question"]
examples = [
  { tatoeba = "9795265_9681804", ja = "明君って毎週金曜日に弓道をする{んだって}。", en = "I hear Akira practices archery every Friday." },
  { tatoeba = "63150_225812", ja = "キャンセル料３割もとられる{んだって}。", en = "Apparently there's a cancellation charge of 30 percent." },
  { source = "yomeru", ja = "あの店、来月閉まる{んだって}。", en = "I heard that shop is closing next month." },
]

[[point]]
id = "datte-question"
pattern = "だって"
forms = ["ですって"]
jlpt = "N3"
hover = false
meaning = "… you say?, did you say …? (repeating in surprise)"
formation = [
  "Noun / Sentence + だって？   (明日だって？)",
  "Question word + だって？   (何だって？)",
]
explanation = """
Repeats what someone just said, to show surprise or to ask again: \
明日だって？, "tomorrow, you say?". 何だって？ asks "what did you \
say?", often with surprise or annoyance. ですって？ is the polite \
form, but only for people close to you: 何ですって？."""
notes = """
Casual. The tone rises. Don't confuse it with sentence-initial だって, \
"but, because" (だって、眠いもん), or the だって of "even" (子供だって\
わかる). Search only: だって appears in many words and uses."""
related = ["n-datte", "tte"]
examples = [
  { tatoeba = "28001_190841", ja = "医者は何{だって}？", en = "What'd the doctor say?" },
  { source = "yomeru", ja = "試験は明日{だって}？聞いてないよ。", en = "The exam is tomorrow, you say? Nobody told me." },
]

[[point]]
id = "kke"
pattern = "っけ"
forms = ["だっけ", "たっけ", "でしたっけ", "ましたっけ"]
jlpt = "N3"
meaning = "was it…?, did I…? (trying to remember)"
formation = [
  "Verb［た］ + っけ   (言ったっけ)",
  "Noun / ［な］Adjective + だっけ / だったっけ",
  "Polite: 〜でしたっけ / 〜ましたっけ",
]
explanation = """
Asks about something the speaker once knew but can't quite recall, or \
wants to confirm: 会議は何時だっけ？, "what time was the meeting \
again?". Said to oneself, it's musing: どこに置いたっけ, "where did I \
put it?"."""
notes = """
Conversational. Mostly after past forms (だった, た) or だ; the polite \
でしたっけ is fine with colleagues. Unlike plain か, it says the \
answer should be known, often to the speaker. A present verb takes \
んだ first: 行くんだっけ？. い-adjectives: 高かったっけ (no polite \
form)."""
related = ["kana", "ka-particle"]
examples = [
  { tatoeba = "264279_150277", ja = "次の時間は何だ{っけ}？", en = "What is the next class?" },
  { tatoeba = "24835_187697", ja = "何の話をしていた{っけ}？", en = "What were we talking about?" },
  { tatoeba = "33361_196185", ja = "ホテルの名前は何でした{っけ}。思い出せないんです。", en = "What was the name of the hotel? I can't recall it." },
]

[[point]]
id = "to-ieru"
pattern = "と言える"
forms = ["といえる", "と言えます"]
jlpt = "N3"
meaning = "one can say that, it can be said that"
formation = ["Noun / Sentence (plain) + と言える   (成功と言える)"]
explanation = """
States a judgement that the speaker thinks is fair from the facts: \
この計画は成功だったと言える, "you could say this plan was a \
success". Common in writing and reports. The negative とは言えない \
says something doesn't quite deserve the word: 安いとは言えない, "it's \
hard to call it cheap"."""
notes = """
と言ってもいい is a bolder "you could even say", stretching a bit; \
と言える is a measured conclusion. と言えるだろう softens it further. \
と言われている is "people say"."""
related = ["to-itte-mo-ii", "to-iwarete-iru"]
examples = [
  { source = "yomeru", ja = "この計画は成功だった{と言える}。", en = "You could say this plan was a success." },
  { source = "yomeru", ja = "このレストランは安い{とは言えない}。", en = "You can't really call this restaurant cheap." },
]

[[point]]
id = "kangaerarenai"
pattern = "考えられない"
forms = ["かんがえられない", "とは考えられない"]
jlpt = "N3"
meaning = "unthinkable, I can't imagine"
formation = [
  "Noun + は考えられない   (君なしの生活は考えられない)",
  "Sentence (plain) + とは考えられない   (彼がうそをつくとは考えられない)",
]
explanation = """
The negative of the potential 考えられる: something is so unlikely or \
so bad that the speaker can't picture it: 彼がうそをつくとは考えられ\
ない, "I can't imagine him lying". On its own, 考えられない！ is an \
outraged "unbelievable!"."""
notes = """
It can also be literal, "I can't think (about it)": 疲れて何も考えられ\
ない. 〜なんて考えられない adds feeling. Compare 信じられない, \
"unbelievable", for something that did happen."""
related = ["to-wa-omowanakatta", "potential-form"]
examples = [
  { tatoeba = "17581_178728", ja = "君なしの生活なんて{考えられない}。", en = "I can't think of life without you." },
  { tatoeba = "274645_138590", ja = "他の人は{考えられない}よ。", en = "I can't think of anybody else." },
  { source = "yomeru", ja = "彼がうそをつく{とは考えられない}。", en = "I can't imagine him telling a lie." },
]

[[point]]
id = "to-wa-omowanakatta"
pattern = "とは思わなかった"
forms = ["とはおもわなかった", "とは思いませんでした", "とばかり思っていた", "とばかりおもっていた"]
jlpt = "N3"
meaning = "I never thought that, I didn't expect (surprise)"
formation = [
  "Sentence (plain) + とは思わなかった   (会えるとは思わなかった)",
  "Sentence (plain) + とばかり思っていた   (I was sure that…)",
]
explanation = """
Expresses surprise at something that turned out true: ここで会うとは\
思わなかった, "I never expected to see you here". The は stresses \
the thought being denied. とばかり思っていた is the reverse: "I was \
sure that…", for a belief that turned out wrong."""
notes = """
まさか often comes first: まさか勝つとは思わなかった. Plain と思わな\
かった is a neutral "I didn't think"; とは adds surprise. Casual \
speech shortens it to とは or なんて: 雨が降るなんて！."""
related = ["to-omou", "kangaerarenai", "masaka"]
examples = [
  { tatoeba = "61900_224565", ja = "ここで君に会う{とは思わなかった}。", en = "Never did I expect to see you here." },
  { tatoeba = "18026_179170", ja = "君がこんなに早くくる{とは思わなかった}よ。", en = "I didn't expect you to get here so soon." },
  { source = "yomeru", ja = "今日は休みだ{とばかり思っていた}。", en = "I was sure today was a day off." },
]

[[point]]
id = "iu-made-mo-nai"
pattern = "言うまでもない"
forms = ["いうまでもない", "は言うまでもない", "言うまでもなく", "いうまでもなく"]
jlpt = "N3"
meaning = "it goes without saying, needless to say"
formation = [
  "Sentence (plain) + の / こと + は言うまでもない",
  "Noun + は言うまでもなく   (not to mention)",
  "言うまでもなく、+ Sentence",
]
explanation = """
Marks something as so obvious it hardly needs saying: 健康が大切なのは\
言うまでもない, "it goes without saying that health is important". \
言うまでもなく starts a sentence the same way: "needless to say"."""
notes = """
A little formal; in conversation, もちろん does the job. In AはBは言う\
までもなく, it means "not to mention": 英語は言うまでもなく、中国語も\
話せる, "she speaks Chinese, not to mention English"."""
related = ["mochiron"]
examples = [
  { tatoeba = "42466_205224", ja = "それは{言うまでもない}。", en = "That goes without saying." },
  { tatoeba = "239690_174778", ja = "{言うまでもない}ことだが、彼は賞を取れなかった。", en = "Needless to say, he did not win the prize." },
  { tatoeba = "40658_203420", ja = "たばこは健康に悪いことは{言うまでもない}。", en = "It goes without saying that smoking is bad for the health." },
]

[[point]]
id = "to-wa-kagiranai"
pattern = "とは限らない"
forms = ["とはかぎらない", "とは限りません", "とも限らない"]
jlpt = "N3"
meaning = "not necessarily, not always"
formation = [
  "Verb / ［い］Adjective + とは限らない   (高いとは限らない)",
  "［な］Adjective / Noun + だ + とは限らない   (便利だとは限らない)",
]
explanation = """
Says that what people usually assume isn't always true: 高いものがいい\
とは限らない, "expensive things aren't necessarily good". 必ずしも, \
いつも or だれでも often come before it."""
notes = """
とも限らない is the reverse: something can't be ruled out, "it might \
just": 雨が降らないとも限らない, "it might rain after all". Negating \
with ない alone (高いものはよくない) would deny it outright."""
related = ["kanarazushimo", "ka-to-iu-to"]
examples = [
  { tatoeba = "63595_227281", ja = "お金が幸福をもたらす{とは限らない}。", en = "Money does not always bring happiness." },
  { tatoeba = "275229_138006", ja = "体の大きい人が強い{とは限らない}。", en = "Big men are not always strong." },
  { source = "yomeru", ja = "日本人がみんな寿司が好きだ{とは限らない}。", en = "Not every Japanese person likes sushi." },
]

[[point]]
id = "to-shitara"
pattern = "としたら"
forms = ["とすれば", "とすると", "だとしたら", "だとすれば", "だとすると"]
jlpt = "N3"
meaning = "supposing that, if we assume, if it's true that"
formation = [
  "Verb / ［い］Adjective + としたら / とすれば / とすると",
  "［な］Adjective / Noun + だとしたら   (本当だとしたら)",
]
explanation = """
Sets up a supposition and reasons from it: "if we take it that X, then…". \
It is used for imagined situations (宝くじが当たったとしたら, "if I \
won the lottery") and for drawing a conclusion from what you just heard: \
それが本当だとしたら、大変だ, "if that's true, we're in trouble"."""
notes = """
The three are close; とすれば and とすると sound more logical and suit \
reasoning, while before a wish or plan (〜たい, 〜つもり) としたら is the \
natural one. 仮に or もし often comes first. Plain たら \
is about a real possible event; としたら keeps a distance, treating it \
as an assumption. Don't confuse with 〜ようとしたら, "when I tried to", \
or with ひょっとしたら, "perhaps", which only contain the same sounds."""
related = ["tara", "ba", "nara", "moshi"]
examples = [
  { tatoeba = "25325_188185", ja = "仮に戦争が起こる{としたら}どうしますか。", en = "What would you do if war were to break out?" },
  { tatoeba = "73480_236104", ja = "１００万円持っている{としたら}どうしますか。", en = "Supposing you had one million yen, what would you do with it?" },
  { tatoeba = "25334_188194", ja = "仮に海外へ行く{としたら}、フランスへ行くだろう。", en = "If I were to go abroad, I would go to France." },
]

[[point]]
id = "tatoe-temo"
pattern = "たとえ〜ても"
forms = ["たとえ", "たとえ〜でも", "例え〜ても", "例え〜でも"]
jlpt = "N3"
meaning = "even if, even supposing"
formation = [
  "たとえ + Verb［て］ + も",
  "たとえ + ［い］Adjective［い̶］ + くても",
  "たとえ + ［な］Adjective / Noun + でも   (たとえ雨でも)",
]
explanation = """
たとえ announces from the start that a 〜ても "even if" is coming, and \
makes it stronger: whatever happens in the first half, the second half \
stays true. たとえ雨でも行きます, "I'll go even if it rains"."""
notes = """
たとえ never stands alone: the clause it opens must end in ても or でも \
(or casual たって). It suits hypothetical cases and firm decisions; \
for "no matter how much", use いくら〜ても or どんなに〜ても, which can \
also follow たとえ. Don't confuse with たとえば, "for example", written \
with the same kanji 例."""
related = ["temo", "ikura-temo", "tatoeba", "to-shitara"]
examples = [
  { tatoeba = "40688_203450", ja = "{たとえ両親が反対しても}私は留学したい。", en = "I want to study abroad, even if my parents are against it." },
  { tatoeba = "40738_203500", ja = "{たとえ君が何を言っても}私の意見は変わらない。", en = "Whatever you may say, I will not change my opinion." },
  { tatoeba = "40785_203547", ja = "{たとえどんなにお金があっても}、幸せは買えません。", en = "No amount of money can buy happiness." },
]

[[point]]
id = "ikura-temo"
pattern = "いくら〜ても"
forms = ["いくら〜でも", "どんなに〜ても", "どんなに〜でも"]
jlpt = "N3"
meaning = "no matter how (much), however much"
formation = [
  "いくら / どんなに + Verb［て］ + も   (いくら呼んでも)",
  "いくら / どんなに + ［い］Adjective［い̶］ + くても",
  "いくら / どんなに + ［な］Adjective / Noun + でも   (いくら子供でも)",
]
explanation = """
However much the first part happens or is true, the result doesn't \
change. The second half is often a disappointment or a firm fact: \
いくら食べても太らない, "however much I eat, I don't gain weight"."""
notes = """
いくら stresses amount or repetition (いくら呼んでも, "however many times \
I call"); どんなに stresses degree, often with adjectives (どんなに寒くて\
も). いくら + Noun + でも means "even for a…": いくら子供でも、それは\
分かるはずだ. Alone, いくら is "how much (price)"; the "no matter how" \
use always needs ても / でも."""
related = ["temo", "tatoe-temo", "sonnani"]
examples = [
  { tatoeba = "66519_229161", ja = "{いくら呼んでも}返事がない。", en = "I've called and called, but there's no answer." },
  { tatoeba = "36746_199544", ja = "{どんなに寒くても}、彼は決してコートを着なかった。", en = "No matter how cold it was, he never wore an overcoat." },
  { source = "yomeru", ja = "{いくら食べても}太らない。", en = "No matter how much I eat, I don't gain weight." },
]

[[point]]
id = "temo-nakutemo"
pattern = "ても〜なくても"
forms = ["でも〜なくても"]
jlpt = "N3"
meaning = "whether or not, whether…or not"
formation = [
  "Verb［て］ + も + Verb［な̶い̶］ + なくても   (来ても来なくても)",
  "［い］Adjective［い̶］ + くても + ［い］Adjective［い̶］ + くなくても",
]
explanation = """
Puts the same word in the positive and the negative to say that either \
way, the result is the same: 雨が降っても降らなくても、行きます, "I'll \
go whether it rains or not". The second half is often 関係ない, \
かまわない or 同じだ."""
notes = """
The same verb is repeated; with する verbs the second one is just \
しなくても (賛成してもしなくても). Two different choices work the \
same way: 晴れても雨でも, "rain or shine". Compare 〜かどう\
か, which asks whether something happens rather than saying it \
doesn't matter."""
related = ["temo", "ka-dou-ka", "te-mo-kamawanai"]
examples = [
  { tatoeba = "283681_120328", ja = "彼が賛成し{てもしなくても}かまわない。", en = "It doesn't matter whether he agrees or not." },
  { tatoeba = "308017_95688", ja = "彼女がここに来{ても来なくても}私には関係ない。", en = "It doesn't matter to me whether she comes here or not." },
  { source = "yomeru", ja = "雨が降っ{ても降らなくても}、試合はあります。", en = "The game is on whether it rains or not." },
]

[[point]]
id = "sae"
pattern = "さえ"
forms = ["でさえ", "にさえ", "とさえ"]
jlpt = "N3"
meaning = "even (an extreme example)"
formation = [
  "Noun + さえ / でさえ   (子供でさえ)",
  "Noun + Particle + さえ   (友達にさえ)",
  "Verb［stem］ + さえ + しない   (謝りさえしない)",
]
explanation = """
Picks the most extreme case to show how far something goes: if even \
this is true, the rest goes without saying. 名前さえ書けない, "can't \
even write his own name"; 子供でさえ知っている, "even a child knows"."""
notes = """
さえ replaces が and を but follows other particles (に, と, から). With \
a person as subject, でさえ is common. It is close to も in 名前も書けない, \
but more emphatic. In negative sentences it often shows surprise or \
criticism. It can also add one more bad thing: 雨さえ降ってきた, "and \
now it's even started to rain". Followed by a ば condition it means "as long as" instead: see \
さえ〜ば."""
related = ["sae-ba", "mo-particle", "demo"]
hover = false
examples = [
  { tatoeba = "245798_168693", ja = "子供{でさえ}これを読むことが出来る。", en = "Even a child can read this." },
  { tatoeba = "297630_106056", ja = "彼は私に謝り{さえ}しなかった。", en = "He did not so much as apologize to me." },
  { source = "yomeru", ja = "忙しくて、昼ご飯を食べる時間{さえ}ない。", en = "I'm so busy I don't even have time to eat lunch." },
]

[[point]]
id = "sae-ba"
pattern = "さえ〜ば"
forms = ["さえあれば", "さえすれば", "さえいれば", "さえなければ", "さえ〜なければ", "さえ〜たら"]
jlpt = "N3"
meaning = "as long as, if only, all it takes is"
formation = [
  "Noun + さえ + Verb［ば］   (お金さえあれば)",
  "Noun + さえ + ［い］Adjective［い̶］ + ければ   (天気さえよければ)",
  "Verb［stem］ + さえ + すれば   (飲みさえすれば)",
  "Verb［て］ + さえ + いれば   (待ってさえいれば)",
]
explanation = """
Names the one condition that is enough: if only this is met, nothing \
else matters. 時間さえあれば、行けるのに, "if only I had the time, I \
could go"; この薬を飲みさえすれば治る, "all you have to do is take this \
medicine"."""
notes = """
The ending is usually ば, sometimes たら. With a verb, さえ goes between \
the stem and すれば (行きさえすれば), or between て and いれば. The \
result is often good news (大丈夫, いい), or, with のに, regret about \
what's missing. Without ば, さえ is just "even" (see さえ)."""
related = ["sae", "ba", "dake"]
examples = [
  { tatoeba = "28736_191572", ja = "愛{さえあれば}僕らは大丈夫だよ。", en = "As long as we love each other, we'll be all right." },
  { tatoeba = "272554_142016", ja = "雪{さえ降らなければ}ね！", en = "As long as it doesn't snow!" },
  { source = "yomeru", ja = "この薬を飲み{さえすれば}、すぐ治りますよ。", en = "Just take this medicine and you'll get better soon." },
]

[[point]]
id = "ba-hodo"
pattern = "ば〜ほど"
forms = ["れば〜ほど", "ければ〜ほど", "なら〜ほど"]
jlpt = "N3"
meaning = "the more…, the more…"
formation = [
  "Verb［ば］ + Verb［る］ + ほど   (読めば読むほど)",
  "［い］Adjective［い̶］ + ければ + ［い］Adjective + ほど   (早ければ早いほど)",
  "［な］Adjective + なら + ［な］Adjective + な + ほど   (静かなら静かなほど)",
]
explanation = """
Says that as one thing increases, another changes with it. The same \
word appears twice, first in the ば form, then plain before ほど: \
歩けば歩くほど疲れる, "the more you walk, the more tired you \
get"."""
notes = """
With する verbs, the second half is just するほど (勉強すればするほど). \
The first half can be dropped: 歩くほど疲れる means the same, \
a little more plainly. 早ければ早いほどいい is a set phrase: "the sooner \
the better"."""
related = ["ba", "hodo-nai"]
examples = [
  { tatoeba = "2308_139697", ja = "{早ければ早いほど}いい。", en = "The sooner, the better." },
  { tatoeba = "282186_121819", ja = "年を{取れば取るほど}記憶力が悪くなる。", en = "The older we become, the worse our memory gets." },
  { tatoeba = "239250_175216", ja = "研究{すればするほど}、好奇心が強くなるでしょう。", en = "The more you study, the more curious you will become." },
]

[[point]]
id = "nagara-mo"
pattern = "ながらも"
forms = []
jlpt = "N3"
meaning = "although, while, despite"
formation = [
  "Verb［stem］ + ながらも   (知りながらも)",
  "［い］Adjective + ながらも   (狭いながらも)",
  "［な］Adjective / Noun + ながらも   (子供ながらも)",
]
explanation = """
Joins two facts that don't seem to fit together: "although A, still B". \
悪いと知りながらも、うそをついた, "although he knew it was wrong, he \
lied". It sounds written or formal."""
notes = """
With a verb it uses the same stem as ながら "while", but here the two \
facts clash: no simultaneous action is meant, and the verb is usually \
a state or feeling (思う, 知っている). ながら alone can also \
mean "although" with some words (残念ながら, 知っていながら); も makes \
the contrast clearer. In speech, のに or けど is more usual."""
related = ["nagara", "noni", "kedo"]
examples = [
  { tatoeba = "324793_78923", ja = "幼い{ながらも}、その子供は勇敢だった。", en = "Child as he was, he was brave." },
  { tatoeba = "267200_147360", ja = "女{ながらも}彼女は勇敢だった。", en = "Woman as she was, she was brave." },
  { source = "yomeru", ja = "彼は疲れてい{ながらも}、最後まで走った。", en = "Although he was tired, he ran to the end." },
]

[[point]]
id = "kuse-ni"
pattern = "くせに"
forms = ["くせして", "癖に"]
jlpt = "N3"
meaning = "even though, and yet (criticism, contempt)"
formation = [
  "Verb / ［い］Adjective + くせに",
  "［な］Adjective + な + くせに",
  "Noun + の + くせに   (子供のくせに)",
]
explanation = """
Like のに, but it blames the person: what they do doesn't fit who they \
are or what they know. 分かっているくせに黙っている, "she understands \
perfectly, and still says nothing". It is spoken and emotional."""
notes = """
Strong: it can sound rude, so avoid it about a superior or in polite \
talk. Unlike のに, both halves must be about the same person. At \
the end of a sentence it scolds or teases: 嬉しいくせに, "you're happy, \
admit it". のに states a surprise or disappointment without blaming \
anyone."""
related = ["noni", "nagara-mo", "ni-shite-wa"]
examples = [
  { tatoeba = "20618_183495", ja = "嬉しい{くせに}。素直に喜びなよ。", en = "I know you're happy about it. Why don't you just show it?" },
  { tatoeba = "238088_176375", ja = "警官の{くせに}泥棒を怖がるなんて。", en = "Even though he's a policeman, he's afraid of thieves." },
  { source = "yomeru", ja = "何も知らない{くせに}、文句を言わないで。", en = "Don't complain when you don't know anything." },
]

[[point]]
id = "ni-shite-wa"
pattern = "にしては"
forms = []
jlpt = "N3"
meaning = "for (a…), considering it's (unexpectedly)"
formation = [
  "Noun + にしては   (６月にしては)",
  "Verb + にしては   (初めて作ったにしては)",
]
explanation = """
Compares something with what you'd expect from X, and finds it \
different: ６月にしては寒い, "it's cold for June". The result can be \
better or worse than expected."""
notes = """
X is a specific fact (this is June, he is a child), and the speaker \
judges from it. 割に is close but weighs the result against a measure \
(age, price, effort): 値段の割に安い. It mostly judges others, rarely the \
speaker. Don't confuse with the にしてはいけない of 馬鹿に\
してはいけない, "you mustn't make fun of", which is just にする + \
てはいけない."""
related = ["wari-ni", "kuse-ni"]
hover = false
examples = [
  { tatoeba = "72449_235070", ja = "６月{にしては}寒い朝だ。", en = "It is a cold morning for June." },
  { tatoeba = "297115_106571", ja = "彼は、子供{にしては}なかなか物わかりがよい。", en = "He has a good deal of intelligence for a child." },
  { source = "yomeru", ja = "初めて作った{にしては}、おいしいね。", en = "For your first try, it's pretty good." },
]

[[point]]
id = "wari-ni"
pattern = "割に"
forms = ["割には", "の割に", "の割には", "のわりに", "のわりには"]
jlpt = "N3"
meaning = "considering, for, more/less than you'd expect"
formation = [
  "Noun + の + 割に   (年の割に)",
  "Verb / ［い］Adjective + 割に   (よく勉強した割に)",
  "［な］Adjective + な + 割に",
]
explanation = """
Says the result doesn't match the degree you'd expect from X: 年の割に\
若く見える, "looks young for his age". X is often a measure (age, \
price, effort), and the result is out of balance with it."""
notes = """
Also spelled わりに. Without a word in front, わりに / 割と is an adverb, \
"fairly, rather": わりにおいしい. にしては is close but takes a \
specific fact (a child, June), not a measure. Don't confuse with \
代わりに, "instead", or 終わりに, "at the end", which only contain the \
same sounds, and from 割に合わない, "it doesn't pay"."""
related = ["ni-shite-wa", "noni"]
examples = [
  { tatoeba = "282145_101369", ja = "彼は年の{割には}若く見える。", en = "He looks young considering his age." },
  { tatoeba = "57398_220078", ja = "この布は値段の{割に}品質が良い。", en = "This cloth is good in quality for its price." },
  { source = "yomeru", ja = "よく勉強した{割に}、点数が悪かった。", en = "I studied a lot, but my score was low for it." },
]

[[point]]
id = "dekireba"
pattern = "できれば"
forms = ["できたら", "出来れば", "出来たら"]
jlpt = "N3"
meaning = "if possible, if you can, ideally"
formation = ["できれば / できたら + request or wish"]
explanation = """
Softens a request or a wish by adding "if it's possible": できれば明日\
来てください, "please come tomorrow, if you can". With a negative wish \
it means "if I can avoid it": できれば行きたくない."""
notes = """
It goes at the start, before the request. できたら is a little more \
casual. It is also the plain "if (someone) can": 一人でできれば, "if \
you can do it alone". For the most one can do, see できるだけ."""
related = ["dekiru-dake", "de-yokereba", "narubeku"]
examples = [
  { tatoeba = "39570_202359", ja = "{できたら}火曜日に来なさい。", en = "Come on Tuesday if possible." },
  { tatoeba = "39481_202269", ja = "{できれば}飛行機では行きたくない。", en = "I don't want to go by plane, if I can help it." },
  { tatoeba = "39483_202271", ja = "{できれば}今週末ですね。", en = "This weekend, if possible." },
]

[[point]]
id = "de-yokereba"
pattern = "でよければ"
forms = ["でよかったら", "でもよければ", "でもよかったら", "よかったら", "もしよければ", "もしよかったら"]
jlpt = "N3"
meaning = "if X is OK (with you), if you like"
formation = [
  "Noun + でよければ / でよかったら   (私でよければ)",
  "(もし) よかったら + offer or invitation",
]
explanation = """
Offers something modestly, leaving the choice to the listener: 私でよけ\
れば、手伝います, "if I'm of any use, I'll help". Alone, よかったら is the \
everyday way to invite or offer: よかったら一緒に行きませんか, "would \
you like to come along?"."""
notes = """
The offer is humble: it suggests X may not be perfect (古いのでよければ, \
"if an old one is fine"). でもよければ is even more modest. Don't read \
every よければ this way: 天気がよければ is just "if the weather is \
good". できれば asks the listener for something; よかったら offers \
something to them."""
related = ["dekireba", "ba", "tara"]
examples = [
  { tatoeba = "30004_192838", ja = "{よかったら}一緒にいらっしゃい。", en = "Come along with us if you like." },
  { source = "yomeru", ja = "私{でよければ}、手伝いますよ。", en = "If I'm of any use, I'll help you." },
  { source = "yomeru", ja = "古い自転車{でよければ}、あげます。", en = "If an old bike is OK, you can have it." },
]

[[point]]
id = "ba-noni"
pattern = "ば〜のに"
forms = ["たら〜のに", "なら〜のに"]
jlpt = "N3"
meaning = "if…, (I) would… (but it isn't so)"
formation = [
  "Verb［ば］ / Verb［た］ + ら + Verb + のに   (お金があれば買えるのに)",
  "［な］Adjective / Noun + なら + Verb + のに",
]
explanation = """
Imagines a situation that isn't real and the result it would bring, \
with regret that it isn't so: お金があれば買えるのに, "if I had money, \
I could buy it (but I don't)". It sounds wistful or frustrated."""
notes = """
The first half is contrary to fact. The common wish 〜ばいいのに / \
〜たらいいのに ("I wish…") is the same shape: see たらいい. About the \
past, 〜ばよかったのに is "should have" (see ばよかった). Without のに, \
the sentence would be a real condition, not a regret."""
related = ["ba-yokatta", "tara-ii", "noni", "ba"]
examples = [
  { tatoeba = "30859_193691", ja = "もし健康{なら研究を続けられるのに}。", en = "If I were in good health, I could pursue my studies." },
  { source = "yomeru", ja = "時間があっ{たら手伝えるのに}。", en = "If I had time, I could help." },
  { source = "yomeru", ja = "車があ{れば、すぐ行けるのに}。", en = "If I had a car, I could go right away." },
]

[[point]]
id = "mo-ba-mo"
pattern = "も〜ば〜も"
forms = ["も〜なら〜も", "も〜ば、〜も"]
jlpt = "N2"
meaning = "both…and…; some…, others…"
formation = [
  "Noun + も + Verb［ば］、Noun + も + Verb   (雨も降れば、風も吹く)",
  "Noun + もあれば / もいれば、Noun + もある / もいる",
]
explanation = """
Lists two things side by side, the first in the ば form. With ある or \
いる it means "there are some…, and there are others…": 賛成する人もい\
れば、反対する人もいる, "some agree, others are against it". With other \
verbs it adds facts: "not only…, but also…"."""
notes = """
The ば here isn't a condition. Don't confuse with a number + もあれば, \
"if there's as much as": 一時間もあれば終わる, "an hour is plenty". It's a little more formal than \
も〜し〜も. A set pattern with なら criticises both sides: 父も父なら、\
息子も息子, "the father is no better than the son"."""
related = ["mo-particle", "shi", "ba"]
examples = [
  { tatoeba = "266934_147626", ja = "春に咲く花{もあれば、秋に咲く花も}ある。", en = "Some flowers bloom in spring and others in autumn." },
  { tatoeba = "22263_185132", ja = "海が好きな人{もいれば、山が好きな人も}いる。", en = "Some people like the sea; others prefer the mountains." },
  { tatoeba = "2345_84318", ja = "{父も父なら、息子も息子}。", en = "Like father, like son." },
]

[[point]]
id = "te-mo-kamawanai"
pattern = "てもかまわない"
forms = ["でもかまわない", "ても構わない", "でも構わない", "てもかまいません", "ても構いません", "でもかまいません", "でも構いません"]
jlpt = "N3"
meaning = "it's all right if, I don't mind if (permission)"
formation = [
  "Verb［て］ + もかまわない",
  "［い］Adjective［い̶］ + くてもかまわない",
  "［な］Adjective / Noun + でもかまわない   (明日でもかまわない)",
]
explanation = """
Says that something is acceptable, literally "even if…, it doesn't \
matter". It is close to 〜てもいい but a bit more formal, and stresses \
that the speaker has no objection: 窓を開けてもかまいませんか, "do you \
mind if I open the window?"."""
notes = """
As a question it asks for permission; かまいませんか is more reserved \
than いいですか. To grant it, ええ、どうぞ sounds friendlier, and a \
superior shouldn't be granted permission with かまいません. It also accepts a second best: 少し古くて\
もかまわない, "it's fine even if it's a bit old". \
The negative 〜なくてもかまわない is "you don't have to" (see なくても\
いい). Alone, かまわない also means "it doesn't matter"."""
related = ["te-mo-ii", "nakute-mo-ii", "temo-nakutemo"]
examples = [
  { tatoeba = "281989_122014", ja = "濡れ{てもかまわない}。", en = "I don't mind if I get wet." },
  { tatoeba = "65959_228602", ja = "いつ来{てもかまわない}よ。", en = "It doesn't matter when you come." },
  { tatoeba = "40190_202956", ja = "チャンネルを替え{てもかまわない}？", en = "Do you mind if I change the channel?" },
]

[[point]]
id = "wake-da"
pattern = "わけだ"
forms = ["わけです", "訳だ", "というわけだ", "というわけです"]
jlpt = "N3"
meaning = "so that's why, no wonder, that means (conclusion)"
formation = [
  "Verb / ［い］Adjective + わけだ",
  "［な］Adjective + な + わけだ",
  "Noun + の / という + わけだ   (休みというわけだ)",
]
explanation = """
Draws the natural conclusion from what has just been said or seen: \
everything fits together. 毎日練習しているから、上手なわけだ, \
"she practises every day, so no wonder she's good". With \
つまり, it restates the point: "in other words…"."""
notes = """
はずだ expects something before checking; わけだ explains a fact \
already known. 道理で or だから often come before it. Don't mix up the \
family: わけではない "it's not that", わけがない "there's no way", \
わけにはいかない "I can't very well"."""
related = ["wake-de-wa-nai", "wake-ga-nai", "wake-ni-wa-ikanai", "hazu"]
examples = [
  { tatoeba = "280455_123542", ja = "道理で、君が喜ぶ{わけだ}。", en = "No wonder you are so happy." },
  { tatoeba = "51245_213957", ja = "そういう{わけだ}から私は出席できなかったのです。", en = "Such being the case, I could not be present." },
  { source = "yomeru", ja = "毎日練習しているんだ。上手な{わけだ}ね。", en = "So she practises every day. No wonder she's good." },
]

[[point]]
id = "wake-ga-nai"
pattern = "わけがない"
forms = ["わけはない", "わけない", "訳がない", "わけがありません", "わけありません"]
jlpt = "N3"
meaning = "there's no way that, it can't be"
formation = [
  "Verb / ［い］Adjective + わけがない",
  "［な］Adjective + な + わけがない",
  "Noun + の / な + わけがない",
]
explanation = """
Rejects an idea outright: there is no reason at all for it to be so. \
一日で覚えられるわけがない, "there's no way I can learn it in one \
day". In casual speech the particle drops: 分かるわけない."""
notes = """
Very close to はずがない; わけがない is more emotional and common in \
speech. Don't confuse with わけではない, which only denies one \
conclusion ("it's not that…"). わけない alone can also mean "easy, no \
trouble": そんなのわけないよ, "that's nothing"."""
related = ["hazu-ga-nai", "wake-de-wa-nai", "wake-da"]
examples = [
  { tatoeba = "25498_204428", ja = "そんなこと、分かる{わけない}でしょう。", en = "How should I know?" },
  { source = "yomeru", ja = "一日で覚えられる{わけがない}。", en = "There's no way I can learn it in one day." },
  { source = "yomeru", ja = "あの優しい人が怒る{わけがない}よ。", en = "There's no way that kind person would get angry." },
]

[[point]]
id = "wake-ni-wa-ikanai"
pattern = "わけにはいかない"
forms = ["わけにもいかない", "わけにはいきません", "わけにもいきません", "訳にはいかない"]
jlpt = "N3"
meaning = "can't very well, can't afford to (social or moral reasons)"
formation = [
  "Verb［る］ + わけにはいかない   (帰るわけにはいかない)",
  "Verb［ない］ + わけにはいかない   (must: 行かないわけにはいかない)",
]
explanation = """
Something is possible, but common sense, duty or the situation rules \
it out: 仕事が残っているから、帰るわけにはいかない, "there's work left, \
so I can't just go home". After a negative it means "have no choice \
but to": 行かないわけにはいかない, "I can't not go"."""
notes = """
Not for ability: "I can't swim" is 泳げない. わけにもいかない adds \
"nor can I…" when another option was also ruled out. Compare わけがない \
"there's no way it's true", about facts, not choices."""
related = ["wake-de-wa-nai", "wake-ga-nai", "nakereba-naranai"]
examples = [
  { tatoeba = "18018_157461", ja = "それをさせる{わけにはいかない}。", en = "I can't allow you to do that." },
  { tatoeba = "322194_81520", ja = "本当に捨てる{わけにはいかない}よ。", en = "We can't really throw it away!" },
  { source = "yomeru", ja = "友だちの結婚式だから、出ない{わけにはいかない}。", en = "It's my friend's wedding, so I can't not attend." },
]

[[point]]
id = "ni-kimatte-iru"
pattern = "に決まっている"
forms = ["にきまっている", "に決まってる", "に決まっています", "にきまってる", "に決まってます"]
jlpt = "N3"
meaning = "surely, bound to, of course"
formation = [
  "Verb / ［い］Adjective + に決まっている",
  "［な］Adjective / Noun + に決まっている   (no だ: うそに決まっている)",
]
explanation = """
The speaker is completely sure, with no room for doubt: そんな計画は\
失敗するに決まっている, "a plan like that is bound to fail". Mostly \
spoken, usually shortened to に決まってる; also "of course!": いいに\
決まってるよ."""
notes = """
More subjective and forceful than に違いない, which is calmer and more \
written; it can sound pushy, as if no other view were possible. Don't \
confuse with 〜に決まった, "it was decided on…" (会議は月曜に決まった)."""
related = ["ni-chigai-nai", "hazu", "kitto"]
examples = [
  { tatoeba = "41397_204155", ja = "そんな計画は失敗する{に決まっている}。", en = "Such a plan is bound to fail." },
  { tatoeba = "65512_228158", ja = "うちの母はノーと言う{に決まっている}。", en = "My mother is certain to say no." },
  { tatoeba = "25033_187894", ja = "何か別の方法がある{に決まってる}。", en = "There must be another way." },
]

[[point]]
id = "kanarazushimo"
pattern = "必ずしも"
forms = ["かならずしも"]
jlpt = "N3"
meaning = "not necessarily, not always (with a negative)"
formation = [
  "必ずしも + Verb［ない］ / ［い］Adjective［く］ない   (必ずしも正しくない)",
  "必ずしも + 〜わけではない / 〜とは限らない",
]
explanation = """
Softens a negative into a partial one: what is usually true isn't \
true every time. 金持ちは必ずしも幸せではない, "the rich are not \
always happy". It is almost always followed by わけではない, とは限\
らない or a plain negative."""
notes = """
必ず alone is the opposite, "always, without fail", with positive \
verbs: 必ず来る. 必ずしも never goes with a positive. A bit formal; in \
conversation いつも〜わけじゃない is common."""
related = ["to-wa-kagiranai", "wake-de-wa-nai", "kanarazu"]
examples = [
  { tatoeba = "245079_169408", ja = "山は{必ずしも}緑ではない。", en = "Mountains are not necessarily green." },
  { tatoeba = "18514_236780", ja = "金持ちは{必ずしも}幸せではない。", en = "The rich are not always happy." },
  { tatoeba = "245369_169118", ja = "仕事はおもしろい、が{必ずしも}やさしくはない。", en = "The job is interesting, but not always easy." },
]

[[point]]
id = "nai-koto-wa-nai"
pattern = "ないことはない"
forms = ["ないこともない", "ないことはありません", "ないこともありません"]
jlpt = "N3"
meaning = "it's not that I can't; I could, I suppose (hesitant yes)"
formation = [
  "Verb［ない］ + ことはない   (行けないことはない)",
  "［い］Adjective［い̶］ + くないことはない",
  "［な］Adjective / Noun + じゃないことはない",
]
explanation = """
A double negative giving a reluctant or partial yes: 辛い料理は食べら\
れないことはない, "it's not that I can't eat spicy food". Something is \
possible or true, but with reservations, often followed by けど."""
notes = """
It can also firmly correct a "can't": できないことはないよ, "of course \
you can". ないこともない is softer, for the hesitant yes only. Don't confuse with ことはない \
after a plain verb, "there's no need to" (心配することはない): only \
the ない before こと makes the double negative."""
related = ["koto-wa-nai", "wake-de-wa-nai"]
examples = [
  { tatoeba = "36702_199501", ja = "どんなに年をとっていても学べ{ないことはない}。", en = "No man is so old he cannot learn." },
  { source = "yomeru", ja = "辛い料理は食べられ{ないことはない}けど、好きじゃない。", en = "It's not that I can't eat spicy food, but I don't like it." },
  { source = "yomeru", ja = "明日なら、行け{ないこともない}よ。", en = "Tomorrow, I could go, I suppose." },
]

[[point]]
id = "koto-wa-nai"
pattern = "ことはない"
forms = ["ことはありません", "こともない"]
jlpt = "N3"
meaning = "there's no need to, you don't have to"
formation = ["Verb［る］ + ことはない   (心配することはない)"]
explanation = """
Reassures someone or tells them an action is unnecessary: そんなに急ぐ\
ことはないよ, "there's no need to rush like that". こともない adds \
"not even": 謝ることもない, "you don't even need to apologise"."""
notes = """
Gentler than 〜なくてもいい; なにも or わざわざ often come before it, and \
said sharply it turns into criticism. The same words can also \
say something never happens: 日曜日に家にいることはありません, "I'm \
never home on Sundays"; context tells which. After た it is "have never": \
行ったことはない (see たことがある)."""
related = ["nakute-mo-ii", "nai-koto-wa-nai", "ta-koto-ga-aru"]
examples = [
  { tatoeba = "22108_184978", ja = "皆さんは心配する{ことはありません}。", en = "You don't have to trouble yourselves." },
  { tatoeba = "323686_80032", ja = "黙って悩んでいる{ことはありません}よ。", en = "You needn't suffer in silence." },
  { source = "yomeru", ja = "そんなに急ぐ{ことはない}よ。", en = "There's no need to rush like that." },
]

[[point]]
id = "beki-da"
pattern = "べきだ"
forms = ["べき", "べきです", "べきではない", "べきじゃない", "べきだった", "べきではなかった"]
jlpt = "N3"
meaning = "should, ought to (duty, what's right)"
formation = [
  "Verb［る］ + べきだ   (する → すべきだ or するべきだ)",
  "［い］Adjective［い̶］ + くあるべきだ",
  "［な］Adjective / Noun + であるべきだ",
  "Verb［る］ + べき + Noun   (読むべき本)",
]
explanation = """
States what is right or expected by duty or common sense: 約束は守る\
べきだ, "you should keep your promises". べきではない is "should not"; \
べきだった looks back with regret: "I should have…"."""
notes = """
Stronger and more judging than 〜たほうがいい, which is friendly advice; \
said to a superior, べきです sounds rude. Not for rules or physical \
necessity: for "I have to go to work", use なければならない. The \
negative goes on べき, not on the verb: 行くべきではない."""
related = ["ta-hou-ga-ii", "nakereba-naranai", "koto-da-advice", "mono-da"]
examples = [
  { tatoeba = "248556_165947", ja = "私たちは規則に従う{べきだ}。", en = "We should obey the rules." },
  { tatoeba = "265758_148752", ja = "若者は、老人に親切にす{べきです}。", en = "The young should be kind to the old." },
  { source = "yomeru", ja = "人の悪口を言う{べきではない}。", en = "You shouldn't speak ill of others." },
]

[[point]]
id = "koto-da-advice"
pattern = "ことだ"
forms = ["ことです", "ないことだ", "ないことです"]
hover = false
jlpt = "N3"
meaning = "the best thing is to, you should (advice)"
formation = [
  "Verb［る］ + ことだ",
  "Verb［ない］ + ことだ   (無理をしないことだ)",
]
explanation = """
Advice on the best way to reach a goal, often after a condition: 上手に\
なりたければ、毎日練習することだ, "if you want to get better, practise \
every day". It sounds like someone with experience telling you what \
works."""
notes = """
Said to equals or people below; to a superior it sounds bossy. ものだ \
states what people in general should do (a social norm), べきだ what \
duty requires; ことだ is advice for this listener and this goal. The \
plain ことだ after a noun (趣味は踊ることだ) is just "it is doing…"."""
related = ["mono-da", "beki-da", "ta-hou-ga-ii"]
examples = [
  { tatoeba = "39462_202250", ja = "ですから信じる{ことです}。", en = "So you've got to be a believer." },
  { source = "yomeru", ja = "上手になりたければ、毎日練習する{ことだ}。", en = "If you want to get better, practise every day." },
  { source = "yomeru", ja = "風邪のときは、無理をしない{ことです}。", en = "When you have a cold, the best thing is not to push yourself." },
]

[[point]]
id = "mono-da"
pattern = "ものだ"
forms = ["ものです", "もんだ", "ものではない", "もんじゃない", "たいものだ", "たいものです"]
hover = false
jlpt = "N3"
meaning = "that's how things are; one should; how…! (feeling)"
formation = [
  "Verb / ［い］Adjective + ものだ",
  "［な］Adjective + な + ものだ",
  "Verb［stem］ + たいものだ   (wish: 行ってみたいものだ)",
]
explanation = """
Presents something as the nature of things: 子供はじっとしていないもの\
だ, "children just never keep still". It also states what people are \
expected to do (年上の人には敬語を使うものだ), and voices a feeling: \
時間がたつのは早いものだ, "how time flies!"."""
notes = """
ものではない is "one shouldn't" (人の悪口を言うものではない). ことだ \
is advice to one listener; ものだ is a general rule. After た, ものだ \
recalls a past habit (see たものだ). After たい it is a heartfelt wish: \
一度行ってみたいものだ, "I'd really love to go once". Casual: もんだ."""
related = ["koto-da-advice", "beki-da", "ta-mono-da", "mono-reason"]
examples = [
  { tatoeba = "245951_168541", ja = "子供は決してじっとしていない{ものだ}。", en = "Children are never at rest." },
  { tatoeba = "270584_143982", ja = "人生は思うようにはいかない{ものだ}。", en = "Life doesn't always go the way we want it to." },
  { source = "yomeru", ja = "人に会ったら、あいさつをする{ものだ}。", en = "When you meet someone, you're supposed to greet them." },
]

[[point]]
id = "ta-mono-da"
pattern = "たものだ"
forms = ["だものだ", "たものです", "たもんだ", "だもんだ", "たものだった", "だものだった"]
jlpt = "N3"
meaning = "used to (fond memory of a past habit)"
formation = ["Verb［た］ + ものだ   (よく泳いだものだ)"]
explanation = """
Looks back fondly on something done again and again in the past: 子供\
の頃よくこの川で泳いだものだ, "as kids we used to swim in this river". \
It is often paired with よく or 昔 and carries nostalgia."""
notes = """
Only for repeated actions or long states, not one event: "I went to \
Kyoto once" is 行ったことがある. 〜ていた is a neutral "was doing / \
used to"; たものだ adds feeling. Also an exclamation of admiration: \
よくがんばったものだ, "you really did well"."""
related = ["mono-da", "ta-koto-ga-aru"]
examples = [
  { tatoeba = "248771_165734", ja = "私たちは子供の頃よくこの川で泳い{だものだ}。", en = "We used to bathe in this river in our childhood." },
  { tatoeba = "293293_110394", ja = "彼はよく図書館に行っ{たものだ}。", en = "He would often go to the library." },
  { tatoeba = "272162_142408", ja = "昔はここに広い公園があっ{たものだ}。", en = "There used to be a large park here." },
]

[[point]]
id = "mono-reason"
pattern = "もの"
forms = ["もん", "だもの", "だもん", "んだもの", "んだもん", "ですもの"]
hover = false
jlpt = "N3"
meaning = "because, after all (casual excuse)"
formation = [
  "Verb / ［い］Adjective + もの / もん   (寒いもん)",
  "［な］Adjective / Noun + だもの / だもん",
]
explanation = """
Ends a sentence with a reason, often to justify oneself: 行きたくない。\
寒いもん, "I don't want to go. It's cold". Often with だって at the \
start: だって、まだ子供だもん, "well, I'm still a kid"."""
notes = """
Casual and a bit childish or pouting; avoid it at work. もの is a little \
softer than もん, ですもの polite but dated. Only at the end of a \
sentence: in the middle, use から."""
related = ["kara-reason", "datte-question", "mono-da"]
examples = [
  { source = "yomeru", ja = "だって、だれも教えてくれなかったん{だもん}。", en = "Well, nobody told me!" },
  { source = "yomeru", ja = "行きたくないよ。寒い{もん}。", en = "I don't want to go. It's cold." },
  { source = "yomeru", ja = "だって、まだ子供{だもん}。", en = "Well, I'm still a kid." },
]

[[point]]
id = "koto-ka"
pattern = "ことか"
forms = ["ことだろう", "ことでしょう"]
hover = false
jlpt = "N3"
meaning = "how very…!, how many times…! (strong feeling)"
formation = [
  "なんと / どんなに / 何度 + Verb / ［い］Adjective + ことか",
  "なんと / どんなに + ［な］Adjective + な + ことか",
]
explanation = """
An exclamation that stresses how strong a feeling or how great an \
amount is: 何度言ったことか, "how many times have I told you!". It \
usually comes with a question word like なんと, どんなに or 何度."""
notes = """
It isn't a question: no answer is expected. Mostly written, or \
dramatic in speech; ことだろう is softer. The set phrase 知ったことか means "none of my \
business!". In everyday talk, なんて〜んだろう says the same more \
lightly."""
related = ["nante", "koto-ni-emotion"]
examples = [
  { tatoeba = "60067_222737", ja = "この花はなんときれいな{ことか}。", en = "How pretty is this flower!" },
  { tatoeba = "24882_187743", ja = "何と素晴らしい時を過ごした{ことか}。", en = "How wonderful a time we have had!" },
  { source = "yomeru", ja = "何度言った{ことか}。", en = "How many times have I told you!" },
]

[[point]]
id = "koto-ni-emotion"
pattern = "ことに"
forms = []
hover = false
jlpt = "N3"
meaning = "to my (surprise, regret…), what's (strange) is"
formation = [
  "Verb［た］ + ことに   (驚いたことに)",
  "［い］Adjective + ことに   (悲しいことに)",
  "［な］Adjective + な + ことに   (残念なことに)",
]
explanation = """
Opens a sentence by stating the speaker's feeling about what follows: \
驚いたことに、彼は歌が上手かった, "to my surprise, he sang well". Only \
with words of feeling: 驚く, 困る, うれしい, 悲しい, 残念, 不思議."""
notes = """
A bit formal, common in writing and speeches. What follows is a fact, \
not a wish or request. Not the ことに of ことに\
する / ことになる, which follow a plain verb and are about decisions. \
ことに alone as an adverb (殊に) means "especially"."""
related = ["koto-ni-suru", "koto-ni-naru", "koto-ka"]
examples = [
  { tatoeba = "18915_180055", ja = "驚いた{ことに}、彼は歌が上手かった。", en = "To my surprise, he had a beautiful voice." },
  { tatoeba = "53988_216682", ja = "さらに悪い{ことに}、彼の母が病気になった。", en = "To make matters worse, his mother became ill." },
  { tatoeba = "317737_85974", ja = "悲しい{ことに}、父はその会合には出られない。", en = "To my sorrow, my father cannot attend the meeting." },
]

[[point]]
id = "you-na-ki-ga-suru"
pattern = "ような気がする"
forms = ["ようなきがする", "ような気がします", "気がする", "気がします"]
jlpt = "N3"
meaning = "I have a feeling that, it feels as if"
formation = [
  "Verb / ［い］Adjective + ような気がする",
  "［な］Adjective + な + ような気がする",
  "Noun + の + ような気がする   (夢のような気がする)",
  "Verb / ［い］Adjective + 気がする   (without ような)",
]
explanation = """
States an impression or hunch without claiming it is true: 彼女は今日\
来るような気がする, "I have a feeling she'll come today". It softens an \
opinion too: 少し高いような気がします, "it seems a bit expensive to me"."""
notes = """
Vaguer than と思う: it is a feeling, not a judgement. 〜たい気がする is \
"I feel like doing". 気がつく is different: "to notice"."""
related = ["ga-suru", "you-da", "to-omou"]
examples = [
  { tatoeba = "320004_83713", ja = "分かる{ような気がする}。", en = "I think I understand." },
  { tatoeba = "313732_89983", ja = "彼女は今日来る{ような気がする}。", en = "I have an idea she will come today." },
  { tatoeba = "28374_191213", ja = "以前、彼女に会った{ような気がする}。", en = "It feels like I've seen her before." },
]

[[point]]
id = "masaka"
pattern = "まさか"
forms = []
jlpt = "N3"
meaning = "surely not, no way, I never imagined"
formation = [
  "まさか + 〜ないだろう / 〜ないでしょうね",
  "まさか + 〜とは思わなかった",
  "まさか！   (on its own)",
]
explanation = """
Shows disbelief: the speaker can hardly believe something is or will be \
so. まさか、うそでしょう, "no way, you're joking". With とは思わなかっ\
た it means "I never dreamed that": まさか彼が来るとは思わなかった."""
notes = """
もしかして raises a possibility the speaker half expects; まさか doubts \
or rejects one. まさかの時 is a set phrase: "in an emergency"."""
related = ["moshikashitara", "hazu-ga-nai"]
examples = [
  { tatoeba = "32858_195684", ja = "{まさか}、嘘でしょう。", en = "You must be kidding!" },
  { tatoeba = "32857_195682", ja = "{まさか}あれは私たちの探している家じゃないだろう。", en = "That wouldn't be the house we're looking for, surely." },
  { source = "yomeru", ja = "{まさか}彼が来るとは思わなかった。", en = "I never imagined he would come." },
]

[[point]]
id = "n-ja-nai"
pattern = "んじゃない"
forms = ["んじゃないか", "のではないか", "んじゃないかな", "のではないでしょうか", "んじゃないの", "んじゃないですか", "んじゃありません"]
jlpt = "N3"
meaning = "isn't it maybe…? (guess); don't…! (prohibition)"
formation = [
  "Verb / ［い］Adjective + んじゃないか   (guess: 来ないんじゃないか)",
  "［な］Adjective / Noun + なんじゃないか",
  "Verb［る］ + んじゃない   (prohibition: 触るんじゃない)",
]
explanation = """
With a rising tone or か, かな, it is a soft guess: 雨になるんじゃないか\
な, "I think it might rain". Written and polite: のではないでしょうか. \
Said firmly to a child or junior after a dictionary form, it forbids: \
触るんじゃない, "don't touch that!"."""
notes = """
The guess form hedges an opinion, so it is very common in polite \
discussion. Without ん, じゃないか asks for agreement about something \
plain to see (see じゃないか). The prohibition is stern and only for \
those below you; んじゃありません is the softer, polite version."""
related = ["ja-nai-ka", "kamoshirenai", "na-prohibition"]
examples = [
  { tatoeba = "26790_189637", ja = "雨になっちゃう{んじゃないかな}あ。", en = "I'm afraid it will be rainy." },
  { tatoeba = "17256_178404", ja = "君の計画はうまくいかない{のではないか}と思う。", en = "I'm afraid your plan will not work." },
  { tatoeba = "274722_138513", ja = "他人の顔をじろじろ見る{んじゃない}。", en = "Don't stare others in the face." },
]

[[point]]
id = "to-mieru"
pattern = "とみえる"
forms = ["と見える", "とみえて", "と見えて", "とみえます", "と見えます"]
hover = false
jlpt = "N3"
meaning = "it seems that, apparently (judging from what can be seen)"
formation = [
  "Verb / ［い］Adjective + とみえる",
  "［な］Adjective / Noun + だ + とみえる   (病気だとみえる)",
]
explanation = """
Infers something from visible signs, like "judging by this, it seems": \
部屋が暗い。もう寝たとみえる, "the room is dark: they must be asleep". \
とみえて links the guess to what follows."""
notes = """
Written or narrative; in speech ようだ or らしい is usual. It sounds \
fairly confident, as there is a clear sign to go on. Spelled \
と見える, it can also simply mean "can be seen as" (はっきりと見える)."""
related = ["you-da", "rashii", "sou-da-appearance"]
examples = [
  { source = "yomeru", ja = "部屋が暗い。もう寝た{とみえる}。", en = "The room is dark. They seem to be asleep already." },
  { source = "yomeru", ja = "とても疲れていた{とみえて}、彼はすぐ寝てしまった。", en = "He must have been very tired: he fell asleep right away." },
]

[[point]]
id = "uchi-ni"
pattern = "うちに"
forms = ["内に", "うちは", "内は"]
jlpt = "N3"
meaning = "while (still), before it changes; in the course of"
formation = [
  "Verb［る］ + うちに   (いるうちに)",
  "Verb［て］ + いる + うちに   (見ているうちに)",
  "［い］Adjective + うちに   (若いうちに)",
  "［な］Adjective + な + うちに   (元気なうちに)",
  "Noun + の + うちに   (午前のうちに)",
]
explanation = """
Marks a window of time that won't last: do it now, while the state still \
holds. 若いうちに旅行したい, "I want to travel while I'm young". With an \
ongoing action, it means something changed without you noticing: 話して\
いるうちに仲良くなった, "as we talked, we became friends"."""
notes = """
間に just places an event inside a stretch; うちに adds "before it ends" \
or "little by little". うちは stresses the stretch itself, often against \
what comes later: 若いうちは無理がきく, "while you're young, you can push \
yourself". Not to be confused with うち (home): うちに帰る, "go home"."""
related = ["aida-ni", "nai-uchi-ni", "saichuu-ni"]
examples = [
  { tatoeba = "52330_215034", ja = "スープは熱い{うちに}召し上がれ。", en = "Eat your soup while it is hot." },
  { tatoeba = "240718_125244", ja = "鉄は熱い{うちに}打て。", en = "Strike while the iron is hot." },
  { source = "yomeru", ja = "話している{うちに}、仲良くなった。", en = "As we talked, we became friends." },
]

[[point]]
id = "nai-uchi-ni"
pattern = "ないうちに"
forms = ["ない内に"]
jlpt = "N3"
meaning = "before (something happens), while not yet"
formation = ["Verb［ない］ + うちに   (暗くならないうちに)"]
explanation = """
Do something before a change you'd rather avoid sets in: 暗くならない\
うちに帰ろう, "let's go home before it gets dark". In the past, it says \
something happened sooner than expected: 五分も待たないうちにバスが来た, \
"the bus came before I'd even waited five minutes"."""
notes = """
Close to 前に, but 前に is just order in time; ないうちに adds urgency or \
surprise, so it fits changes like getting dark, cold, forgetting or \
being found out. It can also mean "while not (noticing), before you \
knew it": しばらく会わないうちに大きくなったね, "you've grown so much \
since I last saw you"."""
related = ["uchi-ni", "mae-ni"]
examples = [
  { tatoeba = "267108_147452", ja = "暑くなら{ないうちに}出かけよう。", en = "Let's go out before it gets hot." },
  { tatoeba = "41485_204242", ja = "そんなに待た{ないうちに}バスが来た。", en = "I had not waited long before the bus came." },
  { source = "yomeru", ja = "忘れ{ないうちに}メモしておこう。", en = "I'll write it down before I forget." },
]

[[point]]
id = "ta-totan-ni"
pattern = "たとたん"
forms = ["たとたんに", "だとたん", "だとたんに", "た途端", "た途端に", "だ途端", "だ途端に"]
jlpt = "N3"
meaning = "the moment (that), just as, as soon as"
formation = ["Verb［た］ + とたん(に)   (立ったとたん)"]
explanation = """
Something happens right at the moment another action ends, usually \
something sudden or unexpected: 立ち上がったとたん、頭が痛くなった, \
"the moment I stood up, I got a headache". The first part is past \
whatever the tense of the sentence."""
notes = """
The second part is what you saw or what happened to you, not a choice, \
an order or a negative: ×家に着いたとたん、テレビをつけよう. For "as soon as" with a plan, use \
次第 or すぐ. Compare たら, which is neutral, and や否や (N1), which is \
written."""
related = ["shidai", "tara", "to-douji-ni"]
examples = [
  { tatoeba = "24212_187075", ja = "家に着い{たとたん}嵐になった。", en = "I had barely got home when the storm broke." },
  { tatoeba = "241505_172968", ja = "腰を下ろし{たとたんに}、電話が鳴った。", en = "I had no sooner sat down than the telephone rang." },
  { tatoeba = "24124_186987", ja = "家を出{たとたん}、通りで偶然彼女に会った。", en = "As soon as I left home, I came across her in the street." },
]

[[point]]
id = "tabi-ni"
pattern = "たびに"
forms = ["度に", "のたびに", "の度に", "のたび", "の度"]
jlpt = "N3"
meaning = "every time, whenever"
formation = ["Verb［る］ + たびに   (会うたびに)", "Noun + の + たびに   (旅行のたびに)"]
explanation = """
Each time the first thing happens, the second follows too: この歌を聞く\
たびに、夏を思い出す, "every time I hear this song, I think of summer". \
The two things come round together, again and again."""
notes = """
Not for natural laws or plain conditions: for "when you press it, it \
opens" use と. The first part is an action or event that comes round \
again, not a plain stretch of time: for "every two weeks" use ごとに \
(二週間ごとに)."""
related = ["to-conditional", "toki"]
examples = [
  { tatoeba = "58776_221452", ja = "この写真を見る{たびに}私の父を思い出す。", en = "Every time I see this picture, I remember my father." },
  { tatoeba = "255845_158683", ja = "私はやる{たびに}失敗した。", en = "Each time I tried, I failed." },
  { tatoeba = "315478_88229", ja = "彼女は洗い物{のたびに}皿を割る。", en = "She breaks a dish every time she washes dishes." },
]

[[point]]
id = "saichuu-ni"
pattern = "最中に"
forms = ["さいちゅうに", "最中", "さいちゅう", "最中だ", "最中です"]
jlpt = "N3"
meaning = "in the middle of, right while (doing)"
formation = [
  "Verb［て］ + いる + 最中に   (食べている最中に)",
  "Noun + の + 最中に   (会議の最中に)",
]
explanation = """
Puts something right in the busiest part of an action, often as an \
interruption: 食事の最中に電話が鳴った, "the phone rang right in the \
middle of dinner". 最中だ on its own says you're deep in it now: 今、\
勉強している最中だ."""
notes = """
Stronger than 間に or ているところ: it's the peak of the action, so it \
suits things with a clear course (meetings, meals, games), and the \
event is usually unwelcome. 真っ最中 is the emphatic form. Read さい\
ちゅう; もなか is a sweet."""
related = ["aida-ni", "te-iru-tokoro", "uchi-ni"]
examples = [
  { tatoeba = "26469_189321", ja = "映画の{最中に}彼は震え始めた。", en = "He began to tremble during the movie." },
  { tatoeba = "310737_92972", ja = "彼女はきゅうりを切っている{最中だった}。", en = "She was right in the middle of cutting cucumbers." },
  { source = "yomeru", ja = "食事の{最中に}電話が鳴った。", en = "The phone rang right in the middle of dinner." },
]

[[point]]
id = "te-hajimete"
pattern = "て初めて"
forms = ["てはじめて", "で初めて", "ではじめて"]
jlpt = "N3"
meaning = "only after, not until (doing)"
formation = ["Verb［て］ + 初めて   (失って初めて)"]
explanation = """
Something only becomes true, often a realization, once an experience \
has happened: 病気になって初めて健康の大切さがわかった, "it wasn't until \
I got ill that I understood how important health is". The second part \
is usually わかる, 気づく or a change that came late."""
notes = """
Don't mix it up with plain 初めて, "for the first time": 生まれて初めて\
海を見た is "I saw the sea for the first time in my life", not "only \
after". If the sentence works with "not until", it's this pattern. \
The second part can't be a wish or a request."""
related = ["te-kara", "te-irai"]
examples = [
  { tatoeba = "326576_77143", ja = "話すのを聞い{て初めて}彼だとわかった。", en = "It wasn't until I heard him speak that I recognized him." },
  { tatoeba = "239016_175449", ja = "健康を失っ{て初めて}健康のありがたみがわかる。", en = "People do not know the blessing of good health until they lose it." },
  { tatoeba = "246744_167755", ja = "私が呼ん{ではじめて}彼は来た。", en = "It was not until I called that he came." },
]

[[point]]
id = "te-irai"
pattern = "て以来"
forms = ["で以来", "以来", "いらい"]
jlpt = "N3"
meaning = "(ever) since"
formation = ["Verb［て］ + 以来   (日本に来て以来)", "Noun + 以来   (去年以来, それ以来)"]
explanation = """
From a point in the past up to now, a state has held: 日本に来て以来、\
毎日日本語を話している, "since coming to Japan, I've spoken Japanese \
every day". それ以来, "since then", is very common on its own."""
notes = """
The span runs to the present and the state is ongoing or unchanged, so \
it fits ている or a negative (以来、会っていない). For a single next step \
use てから: ×朝ご飯を食べて以来、出かけた. Slightly formal; てから\
ずっと is the everyday way to say it."""
related = ["te-kara", "zutto", "te-hajimete"]
examples = [
  { tatoeba = "53868_216564", ja = "ジェインが東京に引っ越し{て以来}、連絡がないんだ。", en = "I haven't heard from Jane since she moved to Tokyo." },
  { tatoeba = "41725_204483", ja = "それ{以来}彼から一度も便りがない。", en = "We have never heard from him since." },
  { tatoeba = "28315_191155", ja = "{以来}ずっと友人です。", en = "We've been friends ever since." },
]

[[point]]
id = "ta-ue-de"
pattern = "た上で"
forms = ["たうえで", "だ上で", "だうえで"]
jlpt = "N3"
meaning = "after (doing first), once (done), on the basis of"
formation = [
  "Verb［た］ + 上で   (よく考えた上で)",
  "Noun + の + 上で   (相談の上で)",
]
explanation = """
First do one thing properly, then act on it: よく考えた上で決めます, \
"I'll decide after thinking it over carefully". The first step is a \
needed check, talk or look, and the second is a decision or action \
built on it."""
notes = """
More formal and more deliberate than てから, typical of business and \
notices: 確認の上でご連絡ください. The で often drops: 相談の上、決め\
ます. With a dictionary form, 上で means "for, when doing" instead: 生活\
する上で大切なこと, "something important for daily life"."""
related = ["te-kara", "ta-ato-de", "sue-ni"]
examples = [
  { tatoeba = "70534_233165", ja = "あなたの申し出はよく調べ{た上で}ご返事しましょう。", en = "I'll give you our answer after we go into your proposal in greater detail." },
  { tatoeba = "274929_138306", ja = "多くの買い物は注意深く考え{た上で}行われている。", en = "Many purchases are carefully thought out." },
  { source = "yomeru", ja = "家族と相談し{たうえで}決めます。", en = "I'll decide after talking it over with my family." },
]

[[point]]
id = "shidai"
pattern = "次第"
forms = ["しだい"]
jlpt = "N3"
homographs = ["shidai-depending"]
meaning = "as soon as (something is done)"
formation = ["Verb［stem］ + 次第   (着き次第, 決まり次第)"]
explanation = """
The moment the first thing is done, the speaker will do the second: \
着き次第、電話します, "I'll call as soon as I arrive". It's formal and \
forward-looking, typical in business and announcements."""
notes = """
The second part is a plan, request or promise, so it doesn't narrate \
the past: ×着き次第、雨が降った (use たとたん). Not to be confused with \
Noun + 次第, "depending on", or the adverb 次第に, "gradually"."""
related = ["shidai-depending", "ta-totan-ni", "te-kara"]
examples = [
  { tatoeba = "238542_175922", ja = "決まり{次第}教えてください。", en = "Please let me know as soon as it's decided." },
  { tatoeba = "20128_183007", ja = "あなたの用意が出来{次第}出発しましょう。", en = "We'll leave as soon as you are ready." },
  { tatoeba = "266386_148173", ja = "終わり{次第}すぐにこの質問用紙を送ります。", en = "I'll mail this questionnaire as soon as I finish." },
]

[[point]]
id = "shidai-depending"
pattern = "次第で"
forms = ["次第だ", "次第です", "しだいで", "しだいだ", "次第", "しだい"]
jlpt = "N3"
homographs = ["shidai"]
meaning = "depending on, up to (someone)"
formation = ["Noun + 次第で / 次第だ   (天気次第で, 君次第だ)"]
explanation = """
The outcome rests on the noun: 天気次第で、行くかどうか決める, "we'll \
decide whether to go depending on the weather". 次第だ ends the sentence: \
あなた次第です, "it's up to you"."""
notes = """
Close to によって, but 次第 says the noun is what decides it, often \
something someone can influence (努力次第, "it depends on your \
effort"). によって can also just list how things differ. The adverb \
次第に, "gradually", is a different word."""
related = ["shidai", "ni-yotte"]
examples = [
  { tatoeba = "237713_231410", ja = "あなた{次第です}。", en = "It's up to you." },
  { tatoeba = "17798_178944", ja = "君が成功できるかは君の努力{次第だ}。", en = "Your success depends on your efforts." },
  { source = "yomeru", ja = "天気{次第で}、行くかどうか決めよう。", en = "Let's decide whether to go depending on the weather." },
]

[[point]]
id = "sue-ni"
pattern = "末に"
forms = ["すえに", "の末に", "た末に", "の末", "た末", "末の"]
jlpt = "N3"
meaning = "after (a long effort), in the end, finally"
formation = ["Verb［た］ + 末に   (悩んだ末に)", "Noun + の + 末に   (長い議論の末に)"]
explanation = """
After a long or hard process, a result came at last: さんざん悩んだ末\
に、仕事をやめた, "after agonizing for ages, I quit my job". 末 is "the \
end", so the stress is on how much came before."""
notes = """
For the past and for real results, not plans. The first part is \
something long: thinking, arguing, trying. た上で is a careful step \
before acting; 末に is the end of a struggle. 末 alone can also mean \
"end of a period": 今月の末, "the end of this month"."""
related = ["ta-ue-de", "ageku"]
examples = [
  { tatoeba = "278034_125950", ja = "長い議論{の末}、彼らは一つの計画を出した。", en = "They came up with a plan after a long discussion." },
  { tatoeba = "29944_192778", ja = "よく考え{た末}、私は家にいることに決めた。", en = "After some careful thought, I elected to stay at home." },
  { source = "yomeru", ja = "何度も失敗し{た末に}、やっと合格した。", en = "After failing again and again, I finally passed." },
]

[[point]]
id = "sai-ni"
pattern = "際に"
forms = ["さいに", "の際", "の際に", "の際は", "際は", "際には"]
hover = false
jlpt = "N3"
meaning = "when, at the time of, on the occasion of (formal)"
formation = [
  "Verb［る］ / Verb［た］ + 際に   (帰る際に)",
  "Noun + の + 際に   (お帰りの際に)",
]
explanation = """
A formal とき, for one particular occasion: お帰りの際は、忘れ物にご注意\
ください, "when you leave, please make sure you have all your things". \
Typical of notices, instructions and polite speech."""
notes = """
In everyday talk, とき is the natural choice; 際 sounds stiff with \
small daily things. It's for a specific occasion, not a long stretch: \
×子供の際. Inside words like 実際, 国際 or 間際, 際 is not this \
pattern."""
related = ["toki", "ni-atatte"]
examples = [
  { tatoeba = "23823_186687", ja = "火事{の際は}１１９番に電話してください。", en = "In the case of fire, dial 119." },
  { tatoeba = "61508_224171", ja = "こちらに立ち寄った{際には}電話をかけてね。", en = "If you're ever in the area, give me a call." },
  { tatoeba = "325393_78324", ja = "離陸{の際は}、シートベルトを締めなくてはならない。", en = "You must fasten your seat belts during take-off." },
]

[[point]]
id = "tsuide-ni"
pattern = "ついでに"
forms = ["のついでに"]
jlpt = "N3"
meaning = "while (you're) at it, on the way, taking the chance"
formation = [
  "Verb［る］ / Verb［た］ + ついでに   (出かけるついでに)",
  "Noun + の + ついでに   (買い物のついでに)",
  "ついでに + sentence   (alone, at the start)",
]
explanation = """
Since you're doing one thing anyway, you do another along with it: \
散歩のついでに郵便局に寄った, "I dropped by the post office on my walk". \
On its own at the start, it adds a small extra request or remark: \
ついでに、これもお願い, "while you're at it, this too, please"."""
notes = """
The first action is the main one; the second is extra and easy to \
add. If both matter equally, use し or て instead. In speech, Noun + \
ついでに without の also happens: 買い物ついでに."""
related = ["nagara"]
examples = [
  { tatoeba = "39921_202687", ja = "{ついでに}、私にもコーヒーを淹れてください。", en = "While you are about it, please make some coffee for me." },
  { tatoeba = "17930_179074", ja = "君が飲む{ついでに}、僕の分も入れてくれないかな。", en = "Would you mind making an extra cup of coffee whenever you decide to have some?" },
  { source = "yomeru", ja = "散歩{のついでに}郵便局に寄った。", en = "I dropped by the post office on my walk." },
]

[[point]]
id = "to-douji-ni"
pattern = "と同時に"
forms = ["とどうじに", "同時に", "どうじに"]
jlpt = "N3"
meaning = "at the same time as, as soon as; while also"
formation = [
  "Verb［る］ + と同時に   (始まると同時に)",
  "Noun + と同時に   (卒業と同時に)",
  "［い］Adjective + と同時に   (厳しいと同時に)",
  "［な］Adjective / Noun + である + と同時に   (便利であると同時に)",
]
explanation = """
Two things happen at one moment: ベルが鳴ると同時に、みんな立ち上がった, \
"the moment the bell rang, everyone stood up". It can also say \
something has two sides at once: 彼は厳しいと同時に優しい, "he's strict \
and kind at the same time"."""
notes = """
Unlike たとたん, the second part doesn't have to be a surprise, and it \
can be a plan: 卒業と同時に結婚する. 同時に alone at the start of a \
sentence means "at the same time, also". For the "two sides" use, \
nouns and な-adjectives often take である (便利であると同時に), though \
it can drop."""
related = ["ta-totan-ni", "nagara", "to-tomo-ni"]
examples = [
  { tatoeba = "270095_142816", ja = "生まれる{と同時に}死は始まる。", en = "As soon as man is born, he begins to die." },
  { tatoeba = "296054_107631", ja = "彼は厳しい{と同時に}優しい。", en = "He is at once stern and tender." },
  { source = "yomeru", ja = "ドアが開く{と同時に}、子供たちが走り出した。", en = "The moment the door opened, the children ran out." },
]

[[point]]
id = "ni-tsurete"
pattern = "につれて"
forms = ["につれ"]
jlpt = "N3"
meaning = "as (one thing changes, so does the other)"
formation = ["Verb［る］ + につれて   (年を取るにつれて)", "Noun + につれて   (時代につれて)"]
explanation = """
As one thing changes step by step, another changes along with it: 秋が\
近づくにつれて、涼しくなる, "as autumn draws near, it gets cooler". Both \
parts are gradual changes, often with なる or ていく."""
notes = """
Both sides must be changes, not one-off events: ×年を取るにつれて、車を\
買った. Close to に従って (N2), which can also mean "following (a \
rule)"; とともに is broader and more formal. Written in kana, it can \
also be the verb 連れる: 家につれていく, "take someone home"."""
related = ["ni-shitagatte", "to-tomo-ni", "ba-hodo"]
examples = [
  { tatoeba = "270120_144445", ja = "人は年を取る{につれて}忘れっぽくなる。", en = "The older we grow, the more forgetful we become." },
  { tatoeba = "282181_121824", ja = "年を取る{につれて}寒がるものです。", en = "They'll be more sensitive to the cold as they grow older." },
  { tatoeba = "25926_188780", ja = "演説が進む{につれて}ますます退屈になった。", en = "I got more and more bored as the speech went on." },
]

[[point]]
id = "ippou-da"
pattern = "一方だ"
forms = ["いっぽうだ", "一方です", "いっぽうです", "一方である"]
jlpt = "N3"
meaning = "keep on (rising, falling, worsening), more and more"
formation = ["Verb［る］ + 一方だ   (増える一方だ)"]
explanation = """
A change keeps going in one direction with no sign of stopping: 物価は\
上がる一方だ, "prices just keep going up". It goes with verbs of change \
like 増える, 減る, 悪くなる, 上がる."""
notes = """
Usually for unwelcome trends, but not always. ばかりだ is close and more \
clearly negative. 一方 on its own, or 一方で, means "on the other hand" \
or "while": 兄は背が高い一方、弟は低い."""
related = ["bakari-da", "te-iku"]
examples = [
  { tatoeba = "319932_11451466", ja = "物価は上がる{一方だ}。", en = "Prices go on rising." },
  { source = "yomeru", ja = "仕事は増える{一方です}。", en = "My work just keeps increasing." },
  { source = "yomeru", ja = "この町の人口は減る{一方だ}。", en = "This town's population keeps going down." },
]

[[point]]
id = "bakari-da"
pattern = "るばかりだ"
forms = ["るばかりです", "るばかりで", "るばかりだった"]
jlpt = "N3"
meaning = "just keeps (getting worse), only (getting more and more)"
formation = ["Verb［る］ + ばかりだ   (悪くなるばかりだ)"]
explanation = """
Things only move one way, almost always for the worse: 病気は悪くなる\
ばかりだ, "the illness just keeps getting worse". The speaker sounds \
worried or helpless."""
notes = """
Close to 一方だ, but more emotional and more clearly bad news. Keep it \
apart from たばかり ("just did") and てばかり ("do nothing but"). With \
a non-change verb it means "all one can do is": 泣くばかりだった, "she \
did nothing but cry"."""
related = ["ippou-da", "ta-bakari", "te-bakari"]
examples = [
  { tatoeba = "319927_83789", ja = "物価は安くなるどころか、高くな{るばかりだった}。", en = "Far from falling, the prices of commodities went on rising." },
  { source = "yomeru", ja = "病気は悪くな{るばかりだ}。", en = "The illness just keeps getting worse." },
  { source = "yomeru", ja = "雪は強くな{るばかりだった}。", en = "The snow only got heavier." },
]

[[point]]
id = "ta-tokoro-discovery"
pattern = "たところ"
forms = ["だところ", "たところが", "だところが"]
jlpt = "N3"
meaning = "when I did (it), (I found that); I did, and then"
formation = ["Verb［た］ + ところ   (聞いてみたところ)"]
explanation = """
You did something, and the second part is what you found or what \
happened as a result: 店に電話したところ、もう閉まっていた, "when I \
called the shop, it was already closed". Often with てみたところ, \
"when I tried"."""
notes = """
The second part is a past fact you learned, not your own next choice: \
×電話したところ、出かけた. Not the same as たところだ, "have just \
done", which ends the sentence. When the result goes against what you \
expected, it often becomes たところが: 頼んだところが、断られた, "I \
asked, but was turned down"."""
related = ["ta-tokoro", "tara", "ta-totan-ni"]
examples = [
  { tatoeba = "283346_120662", ja = "彼がリー嬢に結婚を申し込ん{だところ}、彼女は承諾した。", en = "He proposed to Miss Lee and she accepted." },
  { source = "yomeru", ja = "店に電話し{たところ}、もう閉まっていた。", en = "When I called the shop, it was already closed." },
  { source = "yomeru", ja = "先生に聞いてみ{たところ}、すぐ教えてくれた。", en = "When I asked the teacher, they told me right away." },
]

[[point]]
id = "tokoro-datta"
pattern = "ところだった"
forms = ["るところだった", "ないところだった", "ところでした", "るところでした"]
jlpt = "N3"
meaning = "almost, nearly (did, but didn't)"
formation = [
  "Verb［る］ + ところだった   (遅れるところだった)",
  "Verb［ない］ + ところだった   (間に合わないところだった)",
]
explanation = """
Something nearly happened, but in the end didn't: もう少しで車にひかれる\
ところだった, "I was nearly hit by a car". Often with もう少しで, 危うく, \
or a たら / なかったら clause saying what saved you."""
notes = """
Usually about a near miss, good or bad: 忘れるところだった, "I almost \
forgot". The same words can also be the plain past of るところだ, "was \
about to": 出かけるところだった, "I was just about to leave". Context \
and もう少しで tell them apart."""
related = ["ru-tokoro", "kakeru"]
examples = [
  { tatoeba = "20720_183598", ja = "危うく溺れ{るところだった}。", en = "I came near to being drowned." },
  { tatoeba = "293099_110587", ja = "彼はもう少しでひかれ{るところだった}。", en = "He came near to being run over." },
  { source = "yomeru", ja = "母が起こしてくれなければ、寝坊する{ところだった}。", en = "If Mum hadn't woken me, I would have overslept." },
]

[[point]]
id = "ni-tsuite"
pattern = "について"
forms = ["についての", "については", "についても"]
jlpt = "N3"
meaning = "about, concerning, on (a topic)"
formation = [
  "Noun + について",
  "Noun + についての + Noun   (日本についての本)",
]
explanation = """
Marks the topic that talking, thinking, writing or asking is about: \
将来について考える, "think about the future". Before a noun it becomes \
についての: 環境についての話, "a talk about the environment"."""
notes = """
The everyday word for "about", fine in speech and writing. に関して \
means the same but sounds more formal. については puts the topic up \
front, often as a contrast: その件については後で話します, "as for \
that matter, I'll talk about it later". Don't confuse it with the verb \
ついて, "follow, come along" (私についてきて)."""
related = ["ni-kanshite", "ni-taishite"]
examples = [
  { tatoeba = "256446_158084", ja = "私は何度も幽霊{について}考えたことがある。", en = "I have thought about ghosts many times." },
  { tatoeba = "305748_97955", ja = "彼らはその件{について}私に尋ねた。", en = "They inquired of me about the matter." },
  { source = "yomeru", ja = "日本の文化{についての}レポートを書いた。", en = "I wrote a report on Japanese culture." },
]

[[point]]
id = "ni-kanshite"
pattern = "に関して"
forms = ["に関する", "にかんして", "にかんする", "に関しては", "に関し"]
jlpt = "N3"
meaning = "regarding, concerning, in relation to"
formation = [
  "Noun + に関して",
  "Noun + に関する + Noun   (税金に関する質問)",
]
explanation = """
A more formal について: it names the subject a statement, question or \
document deals with. 事故に関して、警察が調べている, "the police are \
investigating the accident". Before a noun it is usually に関する, \
common in titles and notices: 環境に関する調査, "a survey on the \
environment"."""
notes = """
Sounds stiff in casual talk, where について is the natural choice. \
に関しては sets the topic apart, often with a contrast or a limit: \
値段に関しては問題ない, "as far as the price goes, no problem". \
Compare に対して, which points at a target of feelings or actions, \
not a subject matter."""
related = ["ni-tsuite", "ni-taishite"]
examples = [
  { tatoeba = "259004_142484", ja = "税金{に関する}あなたの意見に同感です。", en = "I agree with your opinion about taxes." },
  { tatoeba = "59005_221679", ja = "この事{に関しては}あなたの意見に賛成です。", en = "In this regard, I agree with you." },
  { source = "yomeru", ja = "新しい規則{に関して}、質問がありますか。", en = "Are there any questions about the new rules?" },
]

[[point]]
id = "ni-taishite"
pattern = "に対して"
forms = ["に対する", "にたいして", "にたいする", "に対し", "のに対して", "のに対し"]
jlpt = "N3"
meaning = "toward, against, to; whereas, in contrast to"
formation = [
  "Noun + に対して",
  "Noun + に対する + Noun   (親に対する態度)",
  "Verb / ［い］Adjective + のに対して",
  "［な］Adjective / Noun + なのに対して",
]
explanation = """
After a noun, it names the person or thing a feeling, attitude or \
action is aimed at: 客に対して丁寧に話す, "speak politely to \
customers"; 計画に対して反対する, "oppose the plan". After a clause \
with の, it sets two facts side by side as opposites: 兄が静かなのに\
対して、弟はよく話す, "my older brother is quiet, whereas my younger \
brother talks a lot"."""
notes = """
Not "about": 日本について話す is talking about Japan, 日本に対して is \
facing Japan as a target. In contrast use, both halves are facts, \
compared on the same point. With numbers it can mean "per": 学生十人\
に対して先生一人, "one teacher per ten students"."""
related = ["ni-tsuite", "ni-kanshite", "ni-kurabete", "ni-totte"]
examples = [
  { tatoeba = "302931_100766", ja = "彼は批評{に対して}たいへん敏感だ。", en = "He is very sensitive to criticism." },
  { tatoeba = "70687_233317", ja = "あなたの御援助{に対して}私達は感謝しています。", en = "We are grateful to you for your help." },
  { source = "yomeru", ja = "兄は背が高い{のに対して}、弟は低い。", en = "My older brother is tall, whereas my younger brother is short." },
]

[[point]]
id = "ni-totte"
pattern = "にとって"
forms = ["にとっては", "にとっても", "にとっての"]
jlpt = "N3"
meaning = "for, to (from someone's point of view)"
formation = [
  "Noun + にとって",
  "Noun + にとっての + Noun   (私にとっての幸せ)",
]
explanation = """
Says from whose point of view something is judged: 私にとって、家族が\
一番大切だ, "for me, family matters most". The rest of the sentence is \
an evaluation: important, difficult, necessary, a good chance."""
notes = """
Only for judgements, never for doing something for someone's sake: \
×母にとってケーキを作った; that is 母のために. Nor for stating a \
stance: say 私は賛成だ, not ×私にとって賛成だ. にとっては adds a \
contrast with other people's views: 子供にとっては難しい, "for \
children, at least, it's hard". に対して is a different point: the \
target of an attitude."""
related = ["tame-ni", "ni-taishite"]
examples = [
  { tatoeba = "270812_143754", ja = "水は人間{にとって}大切だ。", en = "Water is important for humans." },
  { tatoeba = "42390_205148", ja = "それは私{にとって}むずかしすぎます。", en = "It's too difficult for me." },
  { source = "yomeru", ja = "この写真は私{にとって}宝物です。", en = "This photo is a treasure to me." },
]

[[point]]
id = "ni-yotte"
pattern = "によって"
forms = ["による", "により", "によっては", "によって違う", "によってちがう"]
jlpt = "N3"
meaning = "by (means, cause, who did it); depending on"
formation = [
  "Noun + によって",
  "Noun + による + Noun   (地震による被害)",
]
explanation = """
Names what something comes about through: a method (話し合いによって\
決める, "decide by discussion"), a cause (台風によって木が倒れた, "the \
typhoon brought trees down"), or who created something in a passive \
sentence (この寺は有名な人によって建てられた). With 違う or 変わる it \
means "depending on": 人によって考え方が違う, "ways of thinking differ \
from person to person"."""
notes = """
For ordinary tools, で is the normal choice: ペンで書く, not ペンによって. \
In passives, によって is for things made, found or started (books, \
buildings, discoveries); a plain passive like 先生に叱られた uses に. \
によっては means "in some cases": 場合によっては, "depending on the \
situation". により is the written form. によると, "according to", is a \
different point."""
related = ["ni-yoru-to", "passive", "ni-motozuite"]
examples = [
  { tatoeba = "262979_151577", ja = "私達は経験{によって}多くを学ぶ。", en = "We learn much by experience." },
  { source = "yomeru", ja = "この本は有名な作家{によって}書かれた。", en = "This book was written by a famous author." },
  { source = "yomeru", ja = "国{によって}文化が違う。", en = "Culture differs from country to country." },
]

[[point]]
id = "ni-kurabete"
pattern = "に比べて"
forms = ["に比べ", "にくらべて", "と比べて", "とくらべて", "に比べると", "と比べると", "に比べれば"]
jlpt = "N3"
meaning = "compared to, compared with"
formation = [
  "Noun + に比べて / と比べて",
  "Verb + のに比べて   (歩くのに比べて)",
]
explanation = """
Sets one thing against another to show a difference: 去年に比べて、\
今年は雨が多い, "compared to last year, there's more rain this year". \
The second half says how the topic differs, often with ずっと or \
少し."""
notes = """
に and と both work here with no real difference. に比べると and に\
比べれば are a little softer, like "if you compare it with". より \
says the same in a plainer way: 去年より雨が多い. Compare のに対して, \
which sets two facts side by side as opposites rather than measuring \
one by the other."""
related = ["yori-hou-ga", "ni-taishite"]
examples = [
  { tatoeba = "64545_227196", ja = "お兄さんと{比べて}、彼は運動神経が鈍い。", en = "Compared with his brother, he is a poor athlete." },
  { source = "yomeru", ja = "昔{に比べて}、物の値段が高くなった。", en = "Compared to the old days, prices have gone up." },
  { source = "yomeru", ja = "東京{に比べて}、この町は静かだ。", en = "Compared to Tokyo, this town is quiet." },
]

[[point]]
id = "ni-oite"
pattern = "において"
forms = ["における", "に於いて", "に於ける", "においては", "においても"]
jlpt = "N3"
meaning = "in, at, on (formal); in the field of"
formation = [
  "Noun + において",
  "Noun + における + Noun   (日本における教育)",
]
explanation = """
A formal で for the place, time or field where something happens: \
式は大ホールにおいて行われます, "the ceremony will be held in the main \
hall". It also names an area of life or work: 人生において, "in life"; \
医学における発見, "discoveries in medicine"."""
notes = """
Belongs to speeches, announcements, reports and news, not chat: in \
conversation say 大ホールで. Before a noun, use における, since で \
can't link to a noun directly (日本での生活 is the everyday \
equivalent of 日本における生活)."""
related = ["de-particle"]
examples = [
  { tatoeba = "270536_144030", ja = "人生{において}健康ほど大切なものはない。", en = "Nothing is more important in life than health." },
  { tatoeba = "26265_189118", ja = "英語は商業{において}役立つ。", en = "English is useful in commerce." },
  { source = "yomeru", ja = "卒業式は体育館{において}行います。", en = "The graduation ceremony will take place in the gym." },
]

[[point]]
id = "ni-motozuite"
pattern = "に基づいて"
forms = ["にもとづいて", "に基づく", "にもとづく", "に基づき", "に基づいた"]
jlpt = "N3"
meaning = "based on, on the basis of"
formation = [
  "Noun + に基づいて",
  "Noun + に基づく / に基づいた + Noun   (事実に基づいた話)",
]
explanation = """
Says what serves as the foundation for an action, a decision or a work: \
データに基づいて計画を立てる, "make a plan based on the data". \
Common with facts, rules, experience, surveys and true stories: この\
映画は実話に基づいている, "this film is based on a true story"."""
notes = """
The basis is something solid that the result follows from. When one \
thing is only the starting point or the material for another (a song \
made from an old poem), をもとに is the usual choice. によって, \
"by", names a means or a cause, not a foundation."""
related = ["wo-moto-ni", "ni-yotte"]
examples = [
  { tatoeba = "286465_117200", ja = "彼の思想は彼の体験{に基づいて}いる。", en = "His ideas are based on his experience." },
  { tatoeba = "44141_206892", ja = "その物語は伝説{に基づいて}いる。", en = "The story is founded on tradition." },
  { source = "yomeru", ja = "アンケートの結果{に基づいて}、計画を変えた。", en = "We changed the plan based on the survey results." },
]

[[point]]
id = "ni-kawatte"
pattern = "に代わって"
forms = ["にかわって", "に代わり", "に替わって", "に代わる"]
jlpt = "N3"
meaning = "in place of, on behalf of; replacing"
formation = [
  "Noun + に代わって",
  "Noun + に代わる + Noun   (石油に代わるエネルギー)",
]
explanation = """
Someone or something takes another's place. For people, it means doing \
something on their behalf: 社長に代わって、私がご挨拶します, "I will \
give the greeting on behalf of the president". For things, it means \
one has replaced the other: 手紙に代わってメールが使われるようになった, \
"email has come to be used in place of letters"."""
notes = """
More formal than の代わりに, and it suits speeches and announcements. \
の代わりに also covers simple swaps (coffee instead of tea) and \
"in exchange"; に代わって is about standing in for someone or taking \
over a role. Don't confuse it with に変わって, "turning into": 雨が\
雪に変わった."""
related = ["kawari-ni"]
examples = [
  { tatoeba = "285123_118540", ja = "彼{に代わって}私が責任を負った。", en = "I undertook responsibility for him." },
  { tatoeba = "48544_211270", ja = "その計画{に代わる}ものが何かありますか。", en = "Do you have any alternatives to the plan?" },
  { source = "yomeru", ja = "社長{に代わって}、私がご挨拶します。", en = "I will give the greeting on behalf of the president." },
]

[[point]]
id = "kawari-ni"
pattern = "代わりに"
forms = ["かわりに", "の代わりに", "のかわりに", "その代わり", "そのかわり", "その代わりに"]
jlpt = "N3"
meaning = "instead of, in place of; in exchange for"
formation = [
  "Noun + の代わりに",
  "Verb / ［い］Adjective + 代わりに   (行く代わりに, 安い代わりに)",
]
explanation = """
One thing replaces another: コーヒーの代わりにお茶を飲む, "drink tea \
instead of coffee"; 母の代わりに私が行く, "I'll go in my mother's \
place". After a verb it can also mean "in exchange": 料理を作る代わりに、\
皿を洗ってね, "I'll cook, so in exchange, you wash the dishes"."""
notes = """
その代わり(に) starts a sentence: "instead" or "but in return". \
安い。その代わり、少し遠い, "it's cheap; on the other hand, it's a bit \
far". After an adjective, 代わりに weighs a plus against a minus the \
same way: 安い代わりに遠い. に代わって is a more formal way to act on \
someone's behalf."""
related = ["ni-kawatte"]
examples = [
  { tatoeba = "242181_172295", ja = "今朝はコーヒーの{代わりに}紅茶を飲んだ。", en = "I had tea instead of coffee this morning." },
  { tatoeba = "283734_120275", ja = "彼が私の{代わりに}行った。", en = "He went in place of me." },
  { source = "yomeru", ja = "料理を作る{代わりに}、皿を洗ってね。", en = "I'll cook, so in exchange, you wash the dishes." },
]

[[point]]
id = "to-tomo-ni"
pattern = "と共に"
forms = ["とともに"]
jlpt = "N3"
meaning = "together with; as (one change brings another)"
formation = [
  "Noun + と共に",
  "Verb［る］ + と共に   (年をとるとともに)",
]
explanation = """
A formal "with": 家族と共に暮らす, "live together with my family". \
With a change, it means one change goes along with another: 年をとる\
とともに、体が弱くなる, "as we get older, our bodies get weaker". It \
can also mean two things happen at once: ベルが鳴るとともに、生徒が\
教室を出た, "the moment the bell rang, the students left the room"."""
notes = """
Written and formal; in conversation と一緒に is the usual "together \
with". For a gradual change, につれて says much the same, but it \
only covers change. After an adjective, とともに means "both … and": \
この町は静かであるとともに、交通も便利だ, "this town is quiet, and \
convenient too"."""
related = ["ni-tsurete"]
examples = [
  { tatoeba = "249621_164886", ja = "私{と共に}来てくれませんか。", en = "Would you mind coming with me?" },
  { tatoeba = "317269_86442", ja = "彼女は友人達{とともに}立ち去った。", en = "She went off with her friends." },
  { source = "yomeru", ja = "年をとる{とともに}、体が弱くなる。", en = "As we get older, our bodies get weaker." },
]

[[point]]
id = "to-narande"
pattern = "と並んで"
forms = ["とならんで", "と並ぶ", "と並び"]
jlpt = "N3"
meaning = "along with, alongside, on a par with"
formation = ["Noun + と並んで"]
explanation = """
Literally "lined up beside": 友達と並んで歩く, "walk side by side with \
a friend". Used figuratively, it puts one thing in the same rank as \
another that is famous or important: すしは天ぷらと並んで人気がある, \
"along with tempura, sushi is popular"."""
notes = """
The figurative use praises both things as among the best of their \
kind, so it suits descriptions, guides and news, not everyday "and \
also". For simply adding an item, と or も is enough."""
related = ["to-tomo-ni"]
examples = [
  { tatoeba = "317000_86711", ja = "彼女は僕{と並んで}歩いた。", en = "She walked side by side with me." },
  { source = "yomeru", ja = "すしは天ぷら{と並んで}人気がある日本料理だ。", en = "Along with tempura, sushi is a popular Japanese dish." },
  { source = "yomeru", ja = "京都は奈良{と並んで}古い町として有名だ。", en = "Like Nara, Kyoto is famous as an old city." },
]

[[point]]
id = "ni-awasete"
pattern = "に合わせて"
forms = ["にあわせて", "に合わせる", "に合わせ", "に合った"]
jlpt = "N3"
meaning = "to match, in time with, to suit"
formation = ["Noun + に合わせて"]
explanation = """
Doing something so that it fits something else: 音楽に合わせて踊る, \
"dance to the music"; 子供の年に合わせて本を選ぶ, "choose books to \
suit the child's age". The noun is the standard you adjust to: a \
rhythm, someone's pace, a schedule, a size."""
notes = """
It's about adjusting yourself, so the noun is the fixed point and you \
are the one changing. Its partner に合った + Noun, "that suits", \
describes something that already fits: 自分に合った仕事, "a job that \
suits me". Not \
to be confused with 間に合わせる, "get it done in time"."""
related = ["ni-yotte"]
examples = [
  { tatoeba = "23095_151644", ja = "私達は音楽{に合わせて}踊った。", en = "We danced to the music." },
  { tatoeba = "310711_92998", ja = "彼女はギター{に合わせて}歌っている。", en = "She is singing with a guitar." },
  { source = "yomeru", ja = "みんなのペース{に合わせて}ゆっくり歩いた。", en = "I walked slowly to match everyone's pace." },
]

[[point]]
id = "ni-ataru"
pattern = "に当たる"
forms = ["にあたる", "に当たります", "にあたります"]
jlpt = "N3"
meaning = "is equivalent to, corresponds to; falls on (a date)"
formation = ["Noun + に当たる"]
explanation = """
Says what something counts as, or matches, in another system: 父の兄は\
私のおじに当たる, "my father's older brother is my uncle"; 「ありがとう」\
に当たる英語, "the English for arigatou". With dates it means "falls on": \
今年の誕生日は日曜日に当たる, "my birthday falls on a Sunday this \
year"."""
notes = """
Literally 当たる means "hit": ボールが頭に当たった, "the ball hit my \
head"; 日に当たる, "be in the sun". The grammar use is an \
equivalence: A is, in terms of B, the same as B. Not the same point \
as に当たって, "on the occasion of", a formal N2 expression."""
related = ["ni-atatte"]
examples = [
  { tatoeba = "251422_163090", ja = "私の誕生日は日曜日{に当たる}。", en = "My birthday falls on Sunday." },
  { tatoeba = "243126_171349", ja = "今年はお正月は日曜日{にあたる}。", en = "This year New Year's Day falls on Sunday." },
  { source = "yomeru", ja = "父の兄は私のおじ{に当たる}。", en = "My father's older brother is my uncle." },
]

[[point]]
id = "wo-hajime"
pattern = "をはじめ"
forms = ["を始め", "をはじめとして", "を始めとして", "をはじめとする", "を始めとする"]
jlpt = "N3"
hover = false
meaning = "starting with, including, not only… but also"
formation = [
  "Noun + をはじめ",
  "Noun + をはじめとする + Noun   (東京をはじめとする大都市)",
]
explanation = """
Names the main or best-known example first, then the wider group it \
belongs to: 先生をはじめ、クラスのみんなが喜んでくれた, "the whole \
class, the teacher first of all, was happy for me". The second half usually has 多くの, \
いろいろな, みんな or 全員."""
notes = """
The first item is the leading one, the one that stands out, not just \
the first in order: 東京をはじめ、大阪や名古屋にも店がある. Formal, \
suits speeches and writing. Search-only, since を始める, "start \
something", uses the same spelling."""
related = ["nado"]
examples = [
  { source = "yomeru", ja = "先生{をはじめ}、クラスのみんなが喜んでくれた。", en = "The whole class, the teacher first of all, was happy for me." },
  { source = "yomeru", ja = "京都{をはじめ}、日本には古い町が多い。", en = "Japan has many old cities, Kyoto first among them." },
  { source = "yomeru", ja = "すし{をはじめとする}日本料理が好きだ。", en = "I like Japanese food, sushi above all." },
]

[[point]]
id = "kara-ni-kakete"
pattern = "から〜にかけて"
forms = ["にかけて"]
jlpt = "N3"
hover = false
meaning = "from… through, over (a span of time or space)"
formation = ["Noun + から + Noun + にかけて   (夜から朝にかけて)"]
explanation = """
Something spreads over a stretch of time or an area, without exact \
edges: 今夜から明日にかけて雨が降るでしょう, "it will rain from tonight \
into tomorrow"; 九月から十月にかけて台風が多い, "there are many \
typhoons from September through October"."""
notes = """
から〜まで marks exact start and end points (九時から五時まで働く); \
から〜にかけて describes a rough spread, often weather, seasons, or \
parts of a body or region. にかけて can also stand alone: 週末にかけて, \
"through the weekend". Search-only, since 壁にかけて, "hang it on \
the wall", and 気にかけて, "be concerned", share the spelling."""
related = ["kara-made", "ni-kakete-wa"]
examples = [
  { tatoeba = "296450_107236", ja = "彼は腰からひざ{にかけて}びしょ濡れになった。", en = "He got wet from the waist to the knees." },
  { source = "yomeru", ja = "今夜から明日{にかけて}雨が降るでしょう。", en = "It will rain from tonight into tomorrow." },
  { source = "yomeru", ja = "九月から十月{にかけて}台風が多い。", en = "There are many typhoons from September through October." },
]

[[point]]
id = "ni-kakete-wa"
pattern = "にかけては"
forms = ["に掛けては", "にかけても"]
jlpt = "N3"
meaning = "when it comes to (being good at), in the matter of"
formation = ["Noun + にかけては   (料理にかけては)"]
explanation = """
Picks out a skill or field and says someone is excellent in it: 料理\
にかけては、母が一番だ, "when it comes to cooking, my mother is the \
best". The rest of the sentence praises: 誰にも負けない, 天才だ, \
自信がある."""
notes = """
Used for strong abilities, often with pride or admiration; it sounds \
odd for a weakness or a plain topic (for that, については). \
Different from から〜にかけて, "from… through"."""
related = ["ni-tsuite", "kara-ni-kakete"]
examples = [
  { tatoeba = "315281_88426", ja = "彼女は数学{にかけては}天才です。", en = "She is a genius at mathematics." },
  { tatoeba = "325781_77937", ja = "料理{にかけては}、彼女は名人だ。", en = "She is an expert when it comes to cooking." },
  { tatoeba = "26375_169373", ja = "山田は英語{にかけては}クラスの誰にも負けない。", en = "Yamada is second to none in English in his class." },
]

[[point]]
id = "ni-kagiru"
pattern = "に限る"
forms = ["にかぎる", "に限ります", "にかぎります"]
jlpt = "N3"
meaning = "X is best, there's nothing like X"
formation = [
  "Noun + に限る   (夏はビールに限る)",
  "Verb［る］ / Verb［ない］ + に限る   (早く寝るに限る)",
]
explanation = """
The speaker's personal view of the best thing, or the best thing to \
do, in a situation: 疲れた時は早く寝るに限る, "when you're tired, \
there's nothing better than an early night". The situation usually \
comes first with は or 時は."""
notes = """
It's an opinion, said with confidence, not a fact; fine in talk and \
in writing. The same words can also mean "limited to" in rules and \
notices: 参加者は学生に限る, "participants must be students". に限って \
("of all times") and とは限らない ("not always") are different \
points."""
related = ["to-wa-kagiranai", "ni-kagitte", "ta-hou-ga-ii"]
examples = [
  { tatoeba = "24344_187208", ja = "夏はビール{に限る}ね。", en = "Nothing beats a big glass of beer in summer." },
  { tatoeba = "26719_189566", ja = "雨の日は外に出ない{に限る}。", en = "The best bet on a rainy day is to remain indoors." },
  { source = "yomeru", ja = "疲れた時は早く寝る{に限る}。", en = "When you're tired, there's nothing like an early night." },
]

[[point]]
id = "to-onaji"
pattern = "と同じ"
forms = ["と同じで", "と同じように", "と同じく", "と違って", "とちがって", "と同じくらい", "と同じぐらい"]
jlpt = "N3"
meaning = "the same as, like; unlike (と違って)"
formation = [
  "Noun + と同じ + Noun   (君と同じカメラ)",
  "Verb / ［い］Adjective + のと同じ",
  "Noun + と違って",
]
explanation = """
と同じ says two things are the same: 兄と同じ学校に行く, "go to the same \
school as my brother". Before a noun, 同じ attaches directly, with no \
の: ×同じの本. と同じように means "in the same way as", and と同じ\
くらい means "as … as". The opposite, と違って, means "unlike": 去年と\
違って、今年は雪が多い."""
notes = """
同じ behaves like a noun before other nouns (同じ本) but takes な \
before のに or ので: 同じなので. For comparing size or degree, と同じ\
くらい: 兄と同じくらい背が高い, "as tall as my brother". に比べて is \
for showing a difference, not sameness."""
related = ["kurai", "ni-kurabete", "no-you-na"]
examples = [
  { tatoeba = "321762_81953", ja = "僕は君{と同じ}カメラを買った。", en = "I have bought the same camera as you have." },
  { tatoeba = "354238_380534", ja = "彼は父{と同じく}、たくさんの本を持っている。", en = "Like his father, he has many books." },
  { source = "yomeru", ja = "去年{と違って}、今年は雪が多い。", en = "Unlike last year, there's a lot of snow this year." },
]

[[point]]
id = "wo-kikkake-ni"
pattern = "をきっかけに"
forms = ["をきっかけにして", "をきっかけとして", "がきっかけで", "がきっかけになって"]
jlpt = "N3"
