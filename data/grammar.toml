  { tatoeba = "66787_229428", ja = "いいえ、{少しも}。", en = "Not at all." },
  { source = "yomeru", ja = "このコートは{少しも}暖かくない。", en = "This coat isn't warm at all." },
]

[[point]]
id = "chittomo"
pattern = "ちっとも〜ない"
forms = ["ちっとも"]
jlpt = "N4"
meaning = "not at all, not in the least (casual)"
formation = ["ちっとも + Verb［ない］", "ちっとも + ［い］Adjective［く］ + ない"]
