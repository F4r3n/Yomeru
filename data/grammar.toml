  { tatoeba = "61457_224121", ja = "コップ１杯の水{をください}。", en = "Give me a glass of water, please." },
  { tatoeba = "31300_194130", ja = "もう少しパン{をください}。", en = "I'd like some more bread, please." },
]

[[point]]
id = "ka-mo-question-words"
pattern = "誰か"
forms = ["だれか", "何か", "なにか", "どこか", "いつか", "誰も", "だれも", "何も", "なにも", "どこも", "どこにも"]
jlpt = "N5"
meaning = "someone, something (+か); no one, nothing (+も + negative)"
formation = [
  "Question word + か   (誰か, 何か, どこか)",
  "Question word + も + Verb［ない］   (誰も来ない)",
]
explanation = """
か after a question word makes "some-": 誰か, "someone"; 何か, \
"something"; どこか, "somewhere". も with a negative verb makes "no-": \
誰も来なかった, "no one came"; 何も食べない, "I eat nothing"."""
notes = """
が and を usually drop after か and も: 何か食べる, 誰も知らない. Other \
particles stay: after か (どこかへ行く, 誰かに聞く) but before も \
(どこにも行かない, "I go nowhere"). With a positive verb, 誰も means "everyone", though みんな is more \
common; いつも is its own word, "always"."""
related = ["mo-particle"]
examples = [
  { tatoeba = "40474_203238", ja = "{誰か}がピアノを弾いている。", en = "Somebody is playing the piano." },
  { tatoeba = "276639_136178", ja = "{誰も}質問に答えなかった。", en = "No one replied to the question." },
  { tatoeba = "239400_175066", ja = "鍵は{どこにも}見つからなかった。", en = "The key was nowhere to be found." },
]

[[point]]
id = "desu"
pattern = "です"
forms = ["だ", "でした", "だった", "ではありません", "じゃありません", "ではない", "じゃない", "ではなかった", "じゃなかった", "ですか", "でしたか"]
jlpt = "N5"
meaning = "is, am, are (linking a topic to what it is)"
formation = [
  "Noun / ［な］Adjective + です / だ",
  "［い］Adjective + です   (polite only: 高いです)",
]
explanation = """
Links the topic to what it is: これは本です, "this is a book". だ is \
the plain form, です the polite one. Past: だった / でした. Negative: \
ではない (じゃない in speech) / ではありません (じゃありません). For a \
question, add か: 学生ですか."""
notes = """
After い-adjectives, です only adds politeness: never 高いだ, and the \
past is 高かったです, not 高いでした (formal writing avoids い-adjective \
+ です altogether). Casual speech often drops だ, \
above all in questions (学生？). です doesn't mean "exist": "there is" \
is ある or いる. ではないです is also heard, a little less formal than \
ではありません."""
related = ["ga-aru", "n-desu"]
examples = [
  { tatoeba = "532959_431664", ja = "彼は大学生{です}。", en = "He's a university student." },
  { tatoeba = "293617_110071", ja = "彼は医者{ではありません}。", en = "He is not a doctor." },
  { source = "yomeru", ja = "昨日は一日中雨{でした}。", en = "It rained all day yesterday." },
]

[[point]]
id = "masu"
pattern = "ます"
forms = ["ません", "ました", "ませんでした"]
jlpt = "N5"
meaning = "polite verb ending (present, habit, future)"
formation = ["Verb［stem］ + ます   (食べます, 行きます)"]
explanation = """
The polite form of verbs, for people you don't know well, at work and \
in shops: 毎朝コーヒーを飲みます, "I drink coffee every morning". ます \
covers habits, the present and the future: 明日行きます, "I'll go \
tomorrow". Its other forms: ません (negative), ました (past), ません\
でした (past negative)."""
notes = """
Politeness goes at the end of the sentence; inside it (before とき, \
前に, or a noun) the plain form is normal even in polite speech: 行く前\
に電話します. With friends and family, use the plain form (飲む, 飲まな\
い). Irregular: する → します, 来る → 来ます (きます)."""
related = ["desu", "mashou", "masen-ka"]
examples = [
  { tatoeba = "261837_152712", ja = "私は毎朝顔を洗い{ます}。", en = "I wash my face every morning." },
  { tatoeba = "318959_84755", ja = "父はあんまり果物を食べ{ません}。", en = "My father does not eat much fruit." },
  { tatoeba = "1230839_195404", ja = "また電話し{ます}。", en = "I'll call later." },
]

[[point]]
id = "te-form-sequence"
pattern = "て"
forms = []
jlpt = "N5"
meaning = "and (then); by (doing); because (linking with the て-form)"
formation = ["Verb［て］ + (next phrase)"]
explanation = """
The て-form links actions in the order they happen: 朝起きて、顔を洗っ\
て、出かける, "I get up, wash my face and go out". Only the last verb \
shows tense and politeness: 起きて…出かけました. It can also show how \
an action is done, 歩いて行く, "go on foot", or a cause, 遅れてすみません, \
"sorry for being late"."""
notes = """
The order of the actions matters: swapping them changes the meaning. To \
stress that A must come first, use 〜てから; to list examples in no set \
order, 〜たり〜たりする. Adjectives and nouns link with くて and で. For \
"without doing", use ないで."""
related = ["te-kara", "tari-tari", "kute", "naide"]
examples = [
  { tatoeba = "279609_124385", ja = "冬が終わっ{て}、春が来ました。", en = "Winter is over and spring has come." },
  { source = "yomeru", ja = "駅まで歩い{て}行きました。", en = "I walked to the station." },
  { source = "yomeru", ja = "遅れ{て}すみません。", en = "Sorry I'm late." },
]

[[point]]
id = "kute"
pattern = "くて"
forms = []
jlpt = "N5"
meaning = "and (joining adjectives and nouns); so (a cause)"
formation = [
  "［い］Adjective［い̶］ + くて   (安くて)",
  "［な］Adjective / Noun + で   (静かで, 学生で)",
]
explanation = """
Joins descriptions into one sentence: この店は安くておいしい, "this \
place is cheap and tasty"; 部屋は静かできれいだ, "the room is quiet and \
clean". い-adjectives change い to くて; な-adjectives and nouns take で. \
The last word carries the tense: 安くておいしかった."""
notes = """
Both qualities should point the same way (both good or both bad); for a \
contrast, use けど or が: 安いけどおいしくない. いい becomes よくて. くて \
can also give a cause, often for a feeling or inability: 高くて買えない, \
"too expensive to buy". With nouns: 兄は医者で、姉は先生です."""
related = ["te-form-sequence", "kedo"]
examples = [
  { tatoeba = "48119_210848", ja = "その湖は大き{くて}美しい。", en = "The lake is large and beautiful." },
  { tatoeba = "322328_81387", ja = "妹は脚が長{くて}、スポーツが好きです。", en = "My sister has long legs and likes sports." },
  { source = "yomeru", ja = "この部屋は暑{くて}眠れない。", en = "This room is too hot to sleep in." },
]

[[point]]
id = "ne"
pattern = "ね"
forms = ["ねえ"]
jlpt = "N5"
meaning = "isn't it?, right? (seeking agreement, checking)"
formation = ["Sentence + ね   (いい天気ですね)"]
explanation = """
Invites the listener to agree, or confirms something both people know: \
いい天気ですね, "nice weather, isn't it?". It also softens a statement \
or checks information: 明日は三時ですね, "tomorrow at three, right?"."""
notes = """
Use ね when the listener already knows or can see it; for news they \
don't know, use よ. よね checks something you believe: 明日休みだよね, \
"tomorrow's a day off, right?". Too many ね's sound childish or pushy. A \
long ねえ adds feeling: すごいねえ."""
related = ["yo"]
examples = [
  { tatoeba = "66690_229331", ja = "いい天気です{ね}。", en = "It is a nice day, isn't it?" },
  { tatoeba = "60050_222720", ja = "この花は美しいです{ね}。", en = "This flower is beautiful, isn't it?" },
  { tatoeba = "66766_229407", ja = "いいコートだ{ね}。", en = "That's a nice coat." },
]

[[point]]
id = "yo"
pattern = "よ"
forms = []
jlpt = "N5"
meaning = "you know, I tell you (new information, emphasis)"
formation = ["Sentence + よ   (おいしいよ)"]
explanation = """
Marks something as new to the listener, or worth their attention: この\
店、おいしいよ, "this place is good, you know". Common with advice and \
warnings: 遅れるよ, "you'll be late!"."""
notes = """
Said to someone who already knows, it can sound pushy; ね fits better \
then. A light, rising よ is friendly; a heavy, falling one can sound \
like a reproach. In polite speech: ですよ, ますよ. Use it sparingly with \
superiors: そうですよ can sound like correcting them."""
related = ["ne"]
examples = [
  { source = "yomeru", ja = "明日はテストがある{よ}。", en = "There's a test tomorrow, you know." },
  { tatoeba = "17400_178548", ja = "君のかばんはここにある{よ}。", en = "Here is your bag." },
  { tatoeba = "39315_202103", ja = "でも１１時半近くです{よ}。", en = "But it's almost half past eleven." },
]

[[point]]
id = "wo-particle"
pattern = "を"
forms = []
jlpt = "N5"
meaning = "object marker; the place you move through or leave"
formation = ["Noun + を + Verb"]
explanation = """
Marks the direct object, the thing an action is done to: パンを食べる, \
"eat bread"; 映画を見る, "watch a film". With movement verbs it marks \
the place you go through or leave: 公園を歩く, "walk through the park"; \
家を出る, "leave home"."""
notes = """
Some English objects take が: 好き, 上手, ほしい, わかる, できる (猫が好\
き). Meeting and getting on take に: 友達に会う, バスに乗る. Casual \
speech often drops を: ご飯食べた？. Written を, it's pronounced like \
お."""
related = ["wa-ga", "ni-particle"]
examples = [
  { tatoeba = "244803_169683", ja = "昨夜テレビで野球{を}見た。", en = "We watched the baseball game on TV last night." },
  { tatoeba = "293524_110163", ja = "彼は以前は酒{を}飲まなかった。", en = "He didn't use to drink." },
  { source = "yomeru", ja = "毎朝八時に家{を}出ます。", en = "I leave home at eight every morning." },
]

[[point]]
id = "e-particle"
pattern = "へ"
forms = ["へ行く", "へいく", "へ来る", "へ帰る"]
jlpt = "N5"
meaning = "to, toward (direction of movement)"
formation = ["Place + へ + Verb of movement   (日本へ行く)"]
explanation = """
Marks the direction of movement: 東京へ行く, "go to Tokyo"; 家へ帰る, \
"go home". Written へ, it's pronounced like え. Followed by の, it can \
describe a noun: 友達への手紙, "a letter to a friend"."""
notes = """
With movement verbs に can replace へ: へ leans toward the direction, \
に toward the arrival point. Only に works where nothing moves (机の上に\
置く) and with times. Only へ takes の before a noun: にの is \
impossible."""
related = ["ni-iku", "ni-particle"]
examples = [
  { tatoeba = "256270_158260", ja = "私は駅{へ}行った。", en = "I went to the station." },
  { tatoeba = "300630_8839420", ja = "彼は先週アメリカ{へ}行った。", en = "He went to America last week." },
  { tatoeba = "18416_179558", ja = "銀行{へ}行く道を教えて下さい。", en = "Can you tell me the way to the bank?" },
]

[[point]]
id = "ga-aru"
pattern = "がある"
forms = ["がいる", "があります", "がいます"]
jlpt = "N5"
meaning = "there is, have (things: ある; people, animals: いる)"
formation = [
  "Place + に + Noun + が + ある / いる",
  "Noun + は + Place + に + ある / いる",
]
explanation = """
Says that something exists or is somewhere. ある is for things and \
plants, いる for people and animals: 机の上に本がある, "there's a book \
on the desk"; 庭に猫がいる, "there's a cat in the garden". It also \
means "have": 時間がある, "I have time"; 兄がいる, "I have an older \
brother"."""
notes = """
The negative of ある is ない (never あらない); いる becomes いない. Word \
order moves the focus: 公園に犬がいる, "there's a dog in the park", vs \
犬は公園にいる, "the dog is in the park". Events use ある too, with で \
for the place: 学校でテストがある."""
related = ["desu", "te-aru", "te-iru"]
examples = [
  { tatoeba = "250509_164001", ja = "家の前に公園{があります}。", en = "There is a park in front of my house." },
  { tatoeba = "275410_137826", ja = "台所に猫{がいる}。", en = "There is a cat in the kitchen." },
  { tatoeba = "249940_164567", ja = "先約{があります}。", en = "I have a previous appointment." },
]

[[point]]
id = "en-suru"
pattern = "円する"
forms = ["円もする"]
jlpt = "N5"
meaning = "cost (a price); (after a time) later"
formation = ["Price + する   (三千円する)", "Time + して   (一時間して)"]
explanation = """
After a price, する means "cost": この本は三千円する, "this book costs \
3,000 yen". With も it stresses that it's a lot: 七万円もした, "it cost \
a whole 70,000 yen". After a length of time, して means "later": 十分\
して戻った, "came back ten minutes later"."""
notes = """
No particle goes between the amount and する. かかる also means "cost", \
for money or time spent on something (修理に一万円かかった); する is the \
price of the thing itself. For time, たつ is the everyday verb: 一時間\
たって."""
related = []
examples = [
  { tatoeba = "56952_219631", ja = "この本は三千{円する}。", en = "This book costs 3,000 yen." },
  { tatoeba = "56434_219117", ja = "この腕時計は７万{円もしました}。", en = "This watch cost 70,000 yen." },
  { tatoeba = "29019_223521", ja = "このテープレコーダーは４万{円しました}。", en = "I paid 40,000 yen for this tape recorder." },
]

[[point]]
id = "tachi"
pattern = "たち"
forms = ["達", "ら"]
jlpt = "N5"
meaning = "(plural for people) -s, and the others"
formation = ["Noun (person) + たち   (子供たち, 私たち)"]
explanation = """
Makes a noun for people plural, or means "X and the people with them": \
子供たち, "the children"; 田中さんたち, "Tanaka and the others". It's \
how pronouns become plural: 私たち, "we"; あなたたち, "you all"."""
notes = """
Japanese nouns usually have no plural: 本 is one book or many, so たち \
isn't needed when the number doesn't matter. Mostly for people, some\
times animals; with things it sounds playful. Politer: 方 (先生方); more \
casual or looking down: ら (彼ら, 僕ら)."""
related = []
examples = [
  { tatoeba = "245759_168732", ja = "子供{たち}は元気？", en = "How are the kids?" },
  { tatoeba = "21327_184199", ja = "学生{たち}は今休憩時間中です。", en = "The students are having a recess now." },
  { tatoeba = "249415_165091", ja = "私{たち}は明日の午後出発します。", en = "We leave tomorrow afternoon." },
]

[[point]]
id = "ageru"
pattern = "あげる"
forms = ["上げる"]
jlpt = "N5"
meaning = "give (to someone else)"
formation = ["Giver + は / が + Receiver + に + Thing + を + あげる"]
explanation = """
Giving from you, or your side, to someone else, or between other \
people: 友達に本をあげた, "I gave my friend a book". The receiver takes \
に. あげる never points toward the speaker: for "gave me", use くれる."""
notes = """
To superiors あげる can sound patronising; さしあげる is the humble \
version. To animals, plants or younger family, やる is common. Verb［て］ \
+ あげる is doing someone a favour (a later point). Written 上げる, it \
also means "raise": 手を上げる."""
related = ["kureru", "morau"]
examples = [
  { source = "yomeru", ja = "友達に誕生日のプレゼントを{あげました}。", en = "I gave my friend a birthday present." },
  { tatoeba = "261211_153333", ja = "私は彼女に読むための漫画の本を{あげた}。", en = "I gave her a comic book to read." },
  { source = "yomeru", ja = "弟にお菓子を{あげた}。", en = "I gave my little brother some sweets." },
]

[[point]]
id = "kureru"
pattern = "くれる"
forms = ["呉れる"]
jlpt = "N5"
meaning = "give (to me or my side)"
formation = ["Giver + は / が + (私に) + Thing + を + くれる"]
explanation = """
Giving toward the speaker, or someone on the speaker's side: 友達が本を\
くれた, "my friend gave me a book". 私に is often left out, since \
くれる already points at you. For giving to others, use あげる."""
notes = """
The receiver must be you or your circle: 友達が先生にくれた is wrong \
(use あげた). Family works: 父が弟に時計をくれた. The respectful version \
is くださる, where ください comes from. Verb［て］ + くれる is a favour \
done for you: 手伝ってくれた, "they helped me"."""
related = ["ageru", "morau", "te-kudasai"]
examples = [
  { tatoeba = "297539_106147", ja = "彼は私にプレゼントを{くれた}。", en = "He gave me a present." },
  { tatoeba = "297538_106148", ja = "彼は私にヒントを{くれた}。", en = "He gave me a hint." },
  { tatoeba = "33256_196080", ja = "ボブが手伝って{くれた}。", en = "Bob helped me." },
]

[[point]]
id = "ko-so-a-do"
pattern = "こそあど"
forms = ["これ", "それ", "あれ", "どれ", "この", "その", "あの", "どの", "ここ", "そこ", "あそこ", "どこ", "こちら", "そちら", "あちら", "どちら", "こんな", "そんな", "あんな", "どんな", "こう", "そう", "ああ", "こういう", "そういう", "ああいう", "どういう"]
jlpt = "N5"
meaning = "this / that / that over there / which (demonstratives)"
formation = [
  "これ・それ・あれ・どれ   (a thing)",
  "この・その・あの・どの + Noun",
  "ここ・そこ・あそこ・どこ   (a place)",
]
explanation = """
Demonstratives come in sets of four: こ is near the speaker, そ near \
the listener, あ far from both, and ど asks "which". The ending sets \
the job: これ, "this one"; この本, "this book"; ここ, "here"; こちら, \
"this way" (polite); こんな, "this kind of"; こう, "like this"."""
notes = """
この, その, あの, どの need a noun after them: この本, but for "this one" \
alone, これ. In talk, そ points to something just mentioned and あ to \
something both people remember: あの店、よかったね. こちら also means \
"this person", politely: こちらは田中さんです. どれ is "which (of \
several)", どちら "which (of two)", or politely "where"."""
related = ["to-dochira", "dou-desu-ka"]
examples = [
  { source = "yomeru", ja = "{これ}は私の傘です。", en = "This is my umbrella." },
  { source = "yomeru", ja = "{その}かばんは誰のですか。", en = "Whose bag is that?" },
  { source = "yomeru", ja = "{あの}人は誰ですか。", en = "Who is that person?" },
]

[[point]]
id = "dou-desu-ka"
pattern = "はどうですか"
forms = ["どうですか", "はいかがですか", "いかがですか", "どう", "いかが", "てはどうですか"]
jlpt = "N5"
meaning = "how is …?, how about …? (asking, offering, suggesting)"
formation = ["Noun + はどうですか / はいかがですか", "Verb［て］ + はどうですか   (a suggestion)"]
explanation = """
Asks how something is: 仕事はどうですか, "how's work?". It also offers \
or suggests: コーヒーはいかがですか, "would you like some coffee?"; 医者\
に行ってはどうですか, "why not see a doctor?". いかが is the politer \
どう."""
notes = """
Offers to guests and customers use いかが. Casually: お茶、どう？. For a \
past event: 旅行はどうでしたか, "how was your trip?". Verb［た］ + \
らどうですか is the more common way to suggest: 休んだらどう？."""
related = ["ko-so-a-do", "ta-hou-ga-ii"]
examples = [
  { tatoeba = "281366_122636", ja = "日本の気候{はどうですか}。", en = "How do you like the climate of Japan?" },
  { tatoeba = "62256_224923", ja = "コーヒーのおかわり{はいかがですか}。", en = "Would you like another cup of coffee?" },
  { tatoeba = "245139_169337", ja = "散歩に出かけ{てはどうですか}。", en = "How about going for a walk?" },
]

[[point]]
id = "doushite"
pattern = "どうして"
forms = ["なぜ", "なんで"]
jlpt = "N5"
meaning = "why"
formation = ["どうして / なぜ / なんで + Question"]
explanation = """
Asks for a reason: どうして遅れたんですか, "why were you late?". どうして \
is the everyday word, なぜ more formal or written, なんで casual. The \
question often ends in んですか or の, asking for an explanation; the \
answer gives the reason with から or ので: 電車が遅れたからです."""
notes = """
In some tones なんで sounds like blame; どうして is softer. Don't confuse \
なんで (why) with 何で read なにで, "by what means": 何で来ましたか, \
"how did you get here?"."""
related = ["n-desu", "node", "kara-reason"]
examples = [
  { tatoeba = "38645_201435", ja = "{どうして}髪を乾かしているの。", en = "Why are you drying your hair?" },
  { tatoeba = "36366_199167", ja = "{なぜ}早く来たの。", en = "Why did you come early?" },
  { tatoeba = "36119_198921", ja = "{なんで}そんなに悲しむの。", en = "Why should you be so sad?" },
]

[[point]]
id = "dou-yatte"
pattern = "どうやって"
forms = []
jlpt = "N5"
meaning = "how, by what means"
formation = ["どうやって + Verb (question)"]
explanation = """
Asks about the method or the way: 駅までどうやって行きますか, "how do I \
get to the station?"; これはどうやって使うんですか, "how do you use \
this?". Literally, "doing what"."""
notes = """
Answers often use the て-form or で: バスで行きます; ここを押して使い\
ます. For "how is it?" (a quality or state), use どう: 味はどうですか. \
〜方 also gives "how to": 使い方を教えてください."""
related = ["dou-desu-ka", "kata", "te-form-sequence"]
examples = [
  { tatoeba = "38354_201148", ja = "{どうやって}私の家を見つけたのですか。", en = "How did you find my house?" },
  { tatoeba = "19277_181525", ja = "競技場には{どうやって}行ったの？", en = "How did you get to the stadium?" },
  { source = "yomeru", ja = "このカメラは{どうやって}使いますか。", en = "How do you use this camera?" },
]

[[point]]
id = "sorekara"
pattern = "それから"
forms = []
jlpt = "N5"
meaning = "and then, after that; since then"
formation = ["Sentence。 + それから + Sentence"]
explanation = """
Opens a sentence with what happens next: 宿題をしました。それから、テレ\
ビを見ました, "I did my homework. Then I watched TV". It also adds an \
item to a list or an order: コーヒーを二つ、それからケーキを一つ, "two \
coffees, and one cake"."""
notes = """
With ずっと it means "ever since": それからずっと会っていない. It often \
follows a て-form to stress the order: 手を洗って、それから食べる. それで, "so", gives a \
result, not just the next step."""
related = ["te-kara", "sorede"]
examples = [
  { tatoeba = "43168_205922", ja = "{それから}家に急いだ。", en = "Then she hurried home." },
  { tatoeba = "43153_205907", ja = "{それから}彼女はまた歩き始めた。", en = "Then she began to walk again." },
  { source = "yomeru", ja = "朝ご飯を食べて、{それから}学校に行きました。", en = "I ate breakfast, and then I went to school." },
]

[[point]]
id = "shikashi"
pattern = "しかし"
forms = []
jlpt = "N5"
meaning = "however, but (formal)"
