  { tatoeba = "267786_146775", ja = "少し眠ら{なきゃ}。", en = "I've got to catch some Z's." },
]

[[point]]
id = "temo"
pattern = "ても"
forms = ["くても"]
jlpt = "N4"
meaning = "even if, even though; no matter (who, what, how)"
formation = [
  "Verb［て］ + も   (行っても, 読んでも)",
  "［い］Adjective［い̶］ + くても   (高くても)",
  "［な］Adjective / Noun + でも   (雨でも)",
]
explanation = """
B happens or holds whatever A is: 雨が降っても行きます, "I'll go even if \
it rains". Often たとえ (even if) comes first, or a question word for \
"no matter": 何を言っても, "whatever you say"; いつ会っても, "every \
time I see him"."""
notes = """
After nouns and な-adjectives it is でも (雨でも, 静かでも), spelled like \
the particle でも ("or something, even"). どんなに〜ても means "however \
much". It is the reverse of たら and ば: B doesn't depend on A. Casual \
speech says 〜たって / 〜だって (高くたって). 〜てもいい (permission) is \
built on it."""
related = ["demo", "te-mo-ii", "tara", "noni"]
hover = false
examples = [
  { tatoeba = "40764_203526", ja = "たとえ雨が降っ{ても}、私は出発する。", en = "Even if it rains, I'll start." },
  { tatoeba = "66038_228680", ja = "いつ会っ{ても}、彼はにこにこしている。", en = "Every time I see him, he is smiling." },
  { tatoeba = "36732_199530", ja = "どんなに高く{ても}、あの古い時計を買います。", en = "I'll buy that old clock, however expensive it is." },
]

[[point]]
id = "nakute"
pattern = "なくて"
forms = ["くなくて"]
jlpt = "N4"
meaning = "not…, and so; not…, and (cause or link)"
formation = [
  "Verb［な̶い̶］ + なくて   (来なくて)",
  "［い］Adjective［い̶］ + くなくて   (高くなくて)",
]
explanation = """
The て-form of ない. It usually gives a reason, followed by a feeling or \
a result: 行けなくて残念です, "I'm sorry I can't go"; 彼女が来なくてがっか\
りした, "I was disappointed she didn't come"."""
notes = """
For "without doing" or "instead of doing", use 〜ないで, not なくて: 朝\
ご飯を食べないで出かけた. なくて gives causes; ないで tells how, or \
what instead, and requests are always 〜ないでください. "Not A but B" \
with nouns is ではなくて (じゃなくて)."""
related = ["naide", "de-wa-naku", "kute"]
examples = [
  { tatoeba = "28662_173368", ja = "行け{なくて}残念です。", en = "I'm sorry I can't go." },
  { tatoeba = "308531_95175", ja = "彼女が来{なくて}とてもがっかりした。", en = "Much to my disappointment, she did not come." },
  { tatoeba = "64629_227278", ja = "お金が足り{なくて}、それが出来ない。", en = "I can't do it for want of money." },
]

[[point]]
id = "koto-ni-suru"
pattern = "ことにする"
forms = ["ことにした", "ことにしている", "ないことにする"]
jlpt = "N3"
meaning = "decide to"
formation = [
  "Verb［る］ + ことにする",
  "Verb［ない］ + ことにする",
]
explanation = """
States a decision the speaker makes. ことにした reports a decision \
already taken: 来年日本へ行くことにした, "I've decided to go to Japan \
next year". ことにしている is a rule you have set for yourself and keep."""
notes = """
ことにする is your own choice; ことになる is a decision made by others \
or by circumstances ("it's been decided that…"). Compare ようにする, \
which is an ongoing effort rather than a decision. In formal writing: \
〜こととする."""
related = ["koto-ni-naru", "you-ni-suru"]
examples = [
  { tatoeba = "53090_215789", ja = "ジャックは予約を取り消す{ことにした}。", en = "Jack decided to cancel the reservations." },
  { tatoeba = "261798_152751", ja = "私は毎朝６時に起きる{ことにしている}。", en = "I make it a rule to get up at six every morning." },
  { tatoeba = "36972_199769", ja = "ともかく来る{ことにした}。", en = "We made up our mind to come in any case." },
]

[[point]]
id = "wake-de-wa-nai"
pattern = "わけではない"
forms = ["わけじゃない", "訳ではない", "わけではありません", "というわけではない"]
jlpt = "N3"
meaning = "it's not that, it doesn't necessarily mean"
formation = [
  "Verb / ［い］Adjective + わけではない",
  "［な］Adjective + な + わけではない",
  "Noun + の / である / という + わけではない",
]
explanation = """
Denies a conclusion the listener might draw, without denying \
everything: 嫌いなわけではない, "it's not that I dislike it". With \
いつも, 全部, みんな it makes a partial negative: "not always", "not \
all". Spoken: わけじゃない."""
notes = """
Softer and more nuanced than a plain negative. When the sentence spells \
out the reasoning being denied ("it's raining, so…"), というわけではない \
is the usual form. Compare わけがない, \
"there's no way that…", which is a strong denial, and わけにはいかない, \
"I can't very well…"."""
related = ["wake-ga-nai", "wake-ni-wa-ikanai"]
examples = [
  { tatoeba = "320622_83093", ja = "母はいつも家にいる{わけではない}。", en = "My mother is not always at home." },
  { tatoeba = "51772_214480", ja = "すべての医者が多額の金をかせぐ{わけではない}。", en = "Not all doctors make a lot of money." },
  { source = "yomeru", ja = "料理が苦手な{わけじゃない}けど、今日は外で食べたい。", en = "I can cook just fine, but today I feel like eating out." },
]

[[point]]
id = "ni-chigai-nai"
pattern = "に違いない"
forms = ["にちがいない", "に違いありません"]
jlpt = "N3"
meaning = "must be, there's no doubt that"
formation = [
  "Verb / ［い］Adjective + に違いない",
  "［な］Adjective / Noun + に違いない   (no だ: 本当に違いない)",
]
explanation = """
The speaker's firm conviction, reached by reasoning or intuition: \
"it must be so". More common in writing and in narration than in \
conversation, where きっと〜と思う or だろう sound more natural."""
notes = """
はずだ rests on facts or expectations anyone could check ("it should \
be, since…"); に違いない is the speaker's own strong feeling. かもしれ\
ない is the weak end of the same scale."""
related = ["hazu", "kamoshirenai"]
examples = [
  { tatoeba = "38241_201036", ja = "どこかで間違った{にちがいない}。", en = "I must have made a mistake somewhere." },
  { tatoeba = "315982_87725", ja = "彼女は当時金持ちだった{に違いない}。", en = "She must have been rich in those days." },
  { tatoeba = "43744_206496", ja = "その問題には何らかの解決法がある{に違いない}。", en = "There must be some solution to the problem." },
]

[[point]]
id = "zutsu"
pattern = "ずつ"
forms = []
jlpt = "N3"
meaning = "each, apiece, at a time; little by little"
formation = ["Number + Counter + ずつ   (一つずつ)", "少し + ずつ"]
explanation = """
Spreads an amount evenly: 一人二つずつ, "two each"; 一人ずつ入る, "come \
in one at a time". 少しずつ means "little by little": 少しずつ上手に\
なる, "get better bit by bit"."""
notes = """
It attaches to amounts, not plain nouns: 一人ずつ, not 人ずつ. For \
"every" day or week, use 毎 (毎日), not ずつ. Compare ごと, "every … \
unit": 三日ごとに, "every three days"."""
related = ["kurai"]
examples = [
  { tatoeba = "1225413_235766", ja = "３個{ずつ}ください。", en = "Please give me three of each kind." },
  { tatoeba = "38510_201302", ja = "どうぞ一人{ずつ}お入りください。", en = "Please come in one by one." },
  { tatoeba = "299574_104118", ja = "彼は少し{ずつ}回復してきた。", en = "He has recovered little by little." },
]

[[point]]
id = "tokorode"
pattern = "ところで"
forms = []
jlpt = "N3"
meaning = "by the way (changing the subject)"
formation = ["ところで + (new topic)"]
explanation = """
Switches to a new topic: ところで、明日は暇？, "by the way, are you free \
tomorrow?". It signals that what follows isn't tied to what was just \
said, often the point the speaker really wanted to raise."""
notes = """
Fine in polite speech; さて is a similar, more formal opener. Don't \
confuse it with Verb［た］ + ところで, "even if", a later point."""
related = ["sorekara"]
examples = [
  { tatoeba = "38064_200860", ja = "{ところで}、何歳ですか。", en = "By the way, how old are you?" },
  { tatoeba = "38047_200844", ja = "{ところで}あなたは今晩暇ですか。", en = "By the way, are you free tonight?" },
  { tatoeba = "38050_200847", ja = "{ところで}あなたはどこの出身ですか。", en = "By the way, where are you from?" },
]

[[point]]
id = "chuu-juu"
pattern = "中"
forms = []
jlpt = "N3"
meaning = "all through (じゅう); in the middle of, during (ちゅう)"
formation = [
  "Noun (time, place) + 中 (じゅう)   (一日中, 世界中)",
  "Noun (activity) + 中 (ちゅう)   (授業中, 電話中)",
]
explanation = """
Read じゅう after a time or a place, 中 means "all through": 一日中, \
"all day long"; 世界中, "all over the world". Read ちゅう after an \
activity, it means "in the middle of": 授業中, "during class"; 電話中, \
"on the phone"."""
notes = """
A few time words take ちゅう meaning "within": 午前中, "during the \
morning"; 今週中に, "by the end of this week". On its own, 中 is なか, \
"inside": 箱の中. The reading mostly comes with the word, so learn it \
with the word."""
related = ["aida-ni"]
examples = [
  { tatoeba = "27382_190223", ja = "一年{中}雨が多い。", en = "They have much rain all year round." },
  { tatoeba = "313540_90174", ja = "彼女は午前{中}そこにいた。", en = "She was there in the morning." },
  { source = "yomeru", ja = "父は今、電話{中}です。", en = "My father is on the phone right now." },
]

[[point]]
id = "tara-ii"
pattern = "たらいい"
forms = ["だらいい", "たらいいですか", "ばいい", "ばいいですか", "たらいいのに"]
jlpt = "N3"
meaning = "what should I…?; you can just…; I wish"
formation = [
  "Verb［た］ + らいい / Verb［ば］ + いい   (行ったらいい, 行けばいい)",
  "［い］Adjective［い̶］ + かったらいい / ければいい",
  "［な］Adjective / Noun + だったらいい / ならいい",
]
explanation = """
With a question word it asks for advice: どうしたらいいですか, "what \
should I do?"; 何時に行けばいいですか, "what time should I come?". As a \
statement it advises: 先生に聞けばいい, "you can just ask the teacher". \
With のに or なあ it becomes a wish: 晴れたらいいのに, "I wish it would \
clear up"."""
notes = """
〜ばいい can sound offhand ("just do X"), so as a reply to someone's \
worry it may come across as dismissive. 〜といい works for wishes \
(晴れるといいね) but not for asking what to do. To ask for permission, \
use 〜てもいいですか. For regrets about the past: 〜ばよかった."""
related = ["ba", "tara", "ba-yokatta", "te-mo-ii"]
examples = [
  { tatoeba = "30930_193762", ja = "もし雨が降ったらどうし{たらいい}のでしょうか。", en = "Suppose it rains, what shall we do?" },
  { source = "yomeru", ja = "このかばん、どこに置{けばいい}？", en = "Where should I put this bag?" },
  { tatoeba = "19042_180181", ja = "教室にエアコンがあ{ればいい}のにな。", en = "I wish our classroom were air-conditioned." },
]

[[point]]
id = "soretomo"
pattern = "それとも"
forms = []
jlpt = "N2"
meaning = "or (in a question offering a choice)"
formation = ["Question A + それとも + Question B"]
explanation = """
Joins two alternatives in a question: コーヒーにしますか、それとも紅茶に\
しますか, "will you have coffee, or tea?". Each side is usually a full \
question."""
notes = """
Only in questions: in statements, "or" is か or または (月曜日か火曜日), \
and a new sentence starts with それか. \
For two short nouns, か alone is enough: コーヒーか紅茶か. It can also \
open a second guess: 忘れたの？それとも、来たくないの？."""
related = ["ka-particle"]
examples = [
  { tatoeba = "320507_83209", ja = "歩きましょうか、{それとも}バスで行きますか。", en = "Shall we walk or take the bus?" },
  { tatoeba = "16605_212369", ja = "その意見に賛成ですか、{それとも}反対ですか。", en = "Are you for or against the plan?" },
  { tatoeba = "17394_178542", ja = "君のコップ？{それとも}妹のコップ？", en = "Is this your glass or your sister's?" },
]

[[point]]
id = "o-ni-naru"
pattern = "お〜になる"
forms = ["ご〜になる"]
jlpt = "N4"
meaning = "(respectful) does, is doing — said of someone you look up to"
formation = [
  "お + Verb［stem］ + になる   (待つ → お待ちになる)",
  "ご + Noun (a する-verb noun) + になる   (利用 → ご利用になる)",
]
explanation = """
Turns a verb into respectful language, raising the person who does it: \
a teacher, a customer, someone older. 先生はもうお帰りになりました, "the \
teacher has already gone home". It is the respectful rung of keigo; the \
humble rung (お〜する) lowers your own actions, and です／ます are just \
polite."""
notes = """
Never about yourself or your own family. Verbs with a respectful verb of \
their own use that instead: いる／行く／来る → いらっしゃる, する → \
なさる, 食べる → 召し上がる, 言う → おっしゃる, 見る → ご覧になる. \
Verbs with a one-kana stem (見る, いる, 寝る) don't take it. Most native \
verbs take お, most kanji compounds ご."""
related = ["o-suru", "irassharu", "nasaru", "o-kudasai"]
examples = [
  { tatoeba = "37614_200412", ja = "どのくらい私を{お待ちになって}いましたか。", en = "How long have you been waiting for me?" },
  { tatoeba = "66333_228975", ja = "いつここを{お立ちになります}か。", en = "What time do you leave here?" },
  { source = "yomeru", ja = "先生はもう{お帰りになりました}。", en = "The teacher has already gone home." },
]

[[point]]
id = "o-suru"
pattern = "お〜する"
forms = ["ご〜する", "お〜します", "お〜いたします"]
jlpt = "N4"
meaning = "(humble) I do (for you) — lowering your own action"
formation = [
  "お + Verb［stem］ + する   (持つ → お持ちする)",
  "ご + Noun (a する-verb noun) + する   (案内 → ご案内する)",
]
explanation = """
The humble rung of keigo: you lower your own action to show respect to \
the person it is done for or toward. 荷物をお持ちしましょうか, "shall I \
carry your bag?". Using いたす for する (お持ちいたします) makes it \
humbler still. The respectful rung, for the other person's actions, is \
お〜になる."""
notes = """
Only for actions that involve or affect the other person: お送りする \
(see someone home), お知らせする (let someone know); not for something \
you do on your own, like walking or sleeping. Never for the listener's \
actions: for those use お〜になる or お〜ください. Kanji compounds take \
ご, with a few common exceptions (お電話する, お約束する). お願いします \
is this pattern, worn into a set phrase."""
related = ["o-ni-naru", "itasu", "te-oru"]
examples = [
  { tatoeba = "24133_186996", ja = "家まで車で{お送りしましょう}か。", en = "Shall I drive you home?" },
  { source = "yomeru", ja = "荷物を{お持ちしましょう}か。", en = "Shall I carry your bag?" },
  { source = "yomeru", ja = "あとでメールで{お知らせします}。", en = "I'll let you know by email later." },
]

[[point]]
id = "o-kudasai"
pattern = "お〜ください"
forms = ["ご〜ください", "お〜下さい", "ご〜下さい"]
jlpt = "N4"
meaning = "please (do) — a respectful request"
formation = [
  "お + Verb［stem］ + ください   (待つ → お待ちください)",
  "ご + Noun (a する-verb noun) + ください   (連絡 → ご連絡ください)",
]
explanation = """
A more respectful version of 〜てください, heard from shop staff, on \
signs and in announcements: 少々お待ちください, "please wait a moment". \
It asks the listener to do something while raising them, like \
お〜になる."""
notes = """
Not the same as お茶をください, which asks for a thing (お茶 is just a \
noun). Verbs with a special respectful verb use it instead: \
いらっしゃってください (or おいでください), 召し上がってください, \
ご覧ください. Like お〜になる, it doesn't work with one-kana stems: \
not お見ください. Negative: お〜にならないでください, though signs \
prefer ご遠慮ください."""
related = ["te-kudasai", "o-ni-naru", "wo-kudasai"]
examples = [
  { tatoeba = "64133_226784", ja = "{お入りください}。", en = "Come right in." },
  { tatoeba = "18097_201282", ja = "どうぞ靴を{お脱ぎ下さい}。", en = "Please take off your shoes." },
  { source = "yomeru", ja = "少々{お待ちください}。", en = "Please wait a moment." },
]

[[point]]
id = "irassharu"
pattern = "いらっしゃる"
forms = ["いらっしゃいます", "いらっしゃい", "ていらっしゃる", "でいらっしゃる"]
jlpt = "N4"
meaning = "(respectful) be, go, come"
formation = [
  "いらっしゃる   (ます-form いらっしゃいます)",
  "Verb［て］ + いらっしゃる   (respectful ている)",
  "Noun + でいらっしゃる   (respectful です: 田中様でいらっしゃいますか)",
]
explanation = """
The respectful verb standing in for いる, 行く and 来る when the subject \
is someone you look up to: 社長は会議室にいらっしゃいます, "the \
president is in the meeting room". Which of the three it means comes \
from context. After a て-form it replaces ている: 待っていらっしゃる."""
notes = """
Its ます-form is いらっしゃいます, not いらっしゃります; the same goes \
for なさる, くださる and おっしゃる. いらっしゃいませ, "welcome", greets \
customers; plain いらっしゃい welcomes guests or, to a child, means \
"come here". Never for yourself: the humble verbs are おる (いる) and \
参る (行く, 来る)."""
related = ["o-ni-naru", "nasaru", "te-oru"]
examples = [
  { tatoeba = "278078_125914", ja = "長く{いらっしゃる}つもりですか。", en = "Are you going to stay long?" },
  { tatoeba = "323324_80392", ja = "明日また{いらっしゃい}。", en = "Come again tomorrow." },
  { source = "yomeru", ja = "先生は今、教室に{いらっしゃいます}。", en = "The teacher is in the classroom now." },
]

[[point]]
id = "nasaru"
pattern = "なさる"
forms = ["なさいます"]
jlpt = "N4"
meaning = "(respectful) do"
formation = [
  "なさる   (ます-form なさいます)",
  "Noun (a する-verb noun) + なさる   (心配なさる)",
]
explanation = """
The respectful verb for する, used for what a customer, a guest or a \
superior does. 何になさいますか, "what will you have?", is the stock \
question when someone orders. It replaces する after a noun too: \
ご心配なさらないでください, "please don't worry"."""
notes = """
The ます-form is なさいます, not なさります. Its command form, なさい, \
became a firm instruction to children (早く寝なさい): same root, very \
different feel. Never for yourself: the humble する is いたす. In very \
polite speech, ご + noun + なさる is common (ご利用なさる)."""
related = ["nasai", "itasu", "irassharu", "o-ni-naru"]
examples = [
  { tatoeba = "39470_202257", ja = "デザートは何に{なさいます}か？", en = "What would you like for dessert?" },
  { tatoeba = "70157_232787", ja = "あなたはお暇な時には何を{なさいます}？", en = "What do you do in your spare time?" },
]

[[point]]
id = "itasu"
pattern = "いたす"
forms = ["いたします", "致す", "致します"]
jlpt = "N4"
meaning = "(humble) do"
formation = [
  "いたす   (ます-form いたします)",
  "Noun (a する-verb noun) + いたす   (説明いたします)",
  "お + Verb［stem］ + いたす   (お持ちいたします)",
]
explanation = """
The humble verb for する: you lower your own doing, mostly in work \
settings, to customers, in speeches. 私がご案内いたします, "I will show \
you the way". よろしくお願いいたします is a humbler よろしくお願いし\
ます, closing emails and introductions."""
notes = """
Almost always in its ます-form; written in kana more often than as 致す. \
Never for the listener's actions: that is なさる. Other humble verbs at \
this level: おる for いる (te-oru), 参る for 行く／来る (明日参ります), \
申す for 言う (田中と申します, "my name is Tanaka")."""
related = ["nasaru", "o-suru", "te-oru"]
examples = [
  { tatoeba = "52790_215488", ja = "ジョンソン氏をご紹介{いたします}。", en = "May I present Mr Johnson to you?" },
  { source = "yomeru", ja = "では、私が説明{いたします}。", en = "Then I will explain." },
  { source = "yomeru", ja = "明日、こちらからお電話{いたします}。", en = "We'll call you tomorrow." },
]

[[point]]
id = "gozaimasu"
pattern = "ございます"
forms = ["でございます", "ござる"]
jlpt = "N4"
meaning = "(very polite) there is, have; でございます: is"
formation = [
  "Noun + が + ございます   (= あります)",
  "Noun + でございます   (= です)",
]
explanation = """
A very polite way of saying あります, and with で, of です. It is the \
voice of shops, hotels and announcements: お手洗いは二階でございます, \
"the restroom is on the second floor". It also lives on in set phrases: \
ありがとうございます, おはようございます."""
notes = """
For a person's presence, use いらっしゃる (someone else) or おります \
(you or your side), not ございます. でございます can describe yourself, \
though: 受付の田中でございます. Plain ござる is old: you'll meet it in \
samurai films, not in speech. With い-adjectives it gives old \
forms like おいしゅうございます, now rare outside set greetings \
(おめでとうございます)."""
related = ["desu", "ga-aru", "irassharu"]
examples = [
  { tatoeba = "280025_123970", ja = "当店にはいろいろな種類の本が{ございます}。", en = "We have a wide choice of books." },
  { source = "yomeru", ja = "お手洗いは二階{でございます}。", en = "The restroom is on the second floor." },
]

[[point]]
id = "te-oru"
pattern = "ておる"
forms = ["でおる", "ております", "でおります"]
jlpt = "N4"
meaning = "(humble, formal) am doing, have been doing"
formation = ["Verb［て］ + おる   (ます-form おります)"]
explanation = """
The humble version of ている, for what you or your side are doing: \
お待ちしております, "we look forward to seeing you". It sounds formal \
and is common at work, in shops and in letters. おる on its own is the \
humble いる: 父は家におります, "my father is at home"."""
notes = """
For your own actions or your group's, never the listener's: for theirs, \
use ていらっしゃる. Almost always in its ます-form. In western Japan \
おる is ordinary dialect for いる and isn't humble there."""
related = ["te-iru", "irassharu", "itasu"]
examples = [
  { tatoeba = "54417_217110", ja = "ご親切に感謝し{ております}。", en = "I appreciate your kindness." },
  { tatoeba = "325835_77853", ja = "良い返事をお待ちし{ております}。", en = "I am looking forward to receiving your favorable answer." },
  { tatoeba = "64339_226991", ja = "お席の上の棚の中に入っ{ております}。", en = "It's in the overhead compartment." },
]

[[point]]
id = "te-choudai"
pattern = "てちょうだい"
forms = ["でちょうだい", "ちょうだい", "て頂戴", "頂戴"]
jlpt = "N2"
meaning = "please (do), would you (soft, familiar request)"
formation = [
  "Verb［て］ + ちょうだい",
  "Verb［ない］ + でちょうだい   (please don't)",
  "Noun + (を) + ちょうだい   (give me)",
]
explanation = """
A soft, familiar way of asking someone to do something, close to \
〜てくれる？: ちょっと待ってちょうだい, "wait a moment, will you?". \
Alone after a noun it means "give me": それ、ちょうだい."""
notes = """
Familiar: to family, friends and children, and heard more from women \
and from children asking parents. Not for superiors: there, 〜てくださ\
い or 〜ていただけませんか. In formal speech, the verb 頂戴する is a \
humble "receive" (頂戴します), a different use."""
related = ["te-kudasai", "te-kureru", "wo-kudasai"]
examples = [
  { tatoeba = "265941_148618", ja = "手を貸し{てちょうだい}。", en = "Hey, could you give me a hand over here, please?" },
  { tatoeba = "66487_229129", ja = "いすで床をこすらない{でちょうだい}。", en = "Don't scrape your chair on the floor." },
  { source = "yomeru", ja = "そのりんご、一つ{ちょうだい}。", en = "Give me one of those apples." },
]

[[point]]
id = "n-desu-ga"
pattern = "んですが"
forms = ["んですけど", "んだけど", "のですが", "んですけれども"]
jlpt = "N4"
meaning = "…, but (could you…?) — opening a request or topic"
formation = [
  "Verb / ［い］Adjective + んですが",
  "［な］Adjective / Noun + なんですが",
]
explanation = """
Sets up the situation and leaves the sentence hanging so the listener \
can offer help or reply: すみません、駅に行きたいんですが…, "excuse me, \
I'm trying to get to the station…". It is how a request or a question \
usually starts politely, and the request can follow: 〜んですが、教えて\
もらえませんか."""
notes = """
The が／けど isn't really "but": it softens and opens the floor. \
のですが is more formal, んだけど casual. After a wish, it adds a hint \
of doubt: 間に合うといいんだけど, "I hope we make it…". Without ん \
(行きたいですが) it sounds like a flat contrast rather than a lead-in."""
related = ["n-desu", "kedo"]
examples = [
  { tatoeba = "27874_202853", ja = "ちょっとお願いしたいことがある{んだけど}。", en = "I have a favor to ask of you." },
  { tatoeba = "246478_1171676", ja = "コンサートに行けるといい{んだけど}。", en = "I wish I could go to the concert." },
  { source = "yomeru", ja = "すみません、駅に行きたい{んですが}…。", en = "Excuse me, I'm trying to get to the station…" },
]

[[point]]
id = "te-hoshii"
pattern = "てほしい"
forms = ["でほしい", "て欲しい", "で欲しい", "てほしくない", "ないでほしい", "ようにしてほしい", "ないようにしてほしい"]
jlpt = "N4"
meaning = "want (someone) to do"
formation = [
  "Person + に + Verb［て］ + ほしい",
  "Person + に + Verb［ない］ + でほしい   (want them not to)",
]
explanation = """
Says you want someone else to do something; the person is marked with \
に: 弟に手伝ってほしい, "I want my brother to help". For something you \
want to do yourself, use 〜たい. It conjugates like the い-adjective \
ほしい: 来てほしかった, "I wanted you to come"."""
notes = """
Said straight to a superior it sounds pushy: 〜ていただきたいんですが is \
the polite version. For a third person's wish, add と思っている \
(父は私に医者になってほしいと思っている). ようにしてほしい asks for a \
habit or effort rather than one act: 遅れないようにしてほしい. \
〜ないでほしい ("I want you not to") is more common than 〜てほしくない."""
related = ["tai", "ga-hoshii", "te-morau", "you-ni-suru"]
examples = [
  { tatoeba = "257068_157464", ja = "すぐ来{てほしい}。", en = "I want you to come at once." },
  { tatoeba = "17553_178701", ja = "君にその歌を歌っ{てほしい}。", en = "We want you to sing the song." },
  { source = "yomeru", ja = "このことは誰にも言わない{でほしい}。", en = "I'd like you not to tell anyone about this." },
]

[[point]]
id = "you-ni-iu"
pattern = "ように言う"
forms = ["ようにいう", "ないように言う", "ように言われた", "ように伝える", "ように頼む"]
jlpt = "N4"
meaning = "tell (someone) to do, ask (someone) to do"
formation = [
  "Person + に + Verb［る］ + ように言う",
  "Person + に + Verb［ない］ + ように言う   (tell not to)",
]
explanation = """
Reports an instruction or a request without quoting it word for word: \
母は私に早く帰るように言った, "my mother told me to come home early". \
言う can be swapped for 頼む (ask), 伝える (pass on) or 注意する (warn)."""
notes = """
The verb before ように stays in the plain dictionary or ない form, \
whatever the original words were. A direct quote uses と instead: \
「早く帰って」と言った. Passive ように言われた is how you say you were \
told to do something. With 頼む, 〜てくれるように頼む softens it \
further."""
related = ["you-ni-suru", "tte", "you-ni-inoru"]
examples = [
  { tatoeba = "260501_154042", ja = "私は彼に来る{ように言った}。", en = "I told him to come." },
  { tatoeba = "315572_88135", ja = "彼女は息子にちょっと待つ{ように言った}。", en = "She told her son to wait a minute." },
  { tatoeba = "321568_82147", ja = "僕は、彼女にちょっと待ってくれる{ように頼んだ}。", en = "I asked her to wait a minute." },
]

[[point]]
id = "you-ni-inoru"
pattern = "ように祈る"
forms = ["ようにいのる", "ますように", "ように願う"]
jlpt = "N4"
meaning = "pray that, hope that; (〜ますように) may…"
formation = [
  "Verb［る］ / Verb［ない］ + ように祈る",
  "Verb［stem］ + ますように   (on its own: a wish)",
]
explanation = """
Expresses a hope for something outside your control: 合格するように祈っ\
ています, "I'm praying you pass". Cut short as 〜ますように it becomes a \
wish on its own, the kind written on shrine plaques and cards: 夢が\
かないますように, "may my dream come true"."""
notes = """
The verb is one you can't simply do at will: a happening, or a potential \
form (会えますように). For your own effort, use ようにする. 願う works \
like 祈る but sounds more like "wish" than "pray". Cut short, a wish \
keeps its ます: a bare plain 〜ないように at the end of a sentence is \
usually a reminder instead (遅れないように, "don't be late")."""
related = ["you-ni-purpose", "you-ni-iu", "you-ni-suru"]
examples = [
  { tatoeba = "284020_119642", ja = "彼が長生きし{ますように}。", en = "May he live long!" },
  { tatoeba = "66697_229340", ja = "いい誕生日を迎えられ{ますように}。", en = "Hope you'll have a great one." },
  { tatoeba = "71357_233985", ja = "あなたが早くよくなる{ように祈って}います。", en = "We are hoping for your quick recovery." },
]

[[point]]
id = "you-ni-purpose"
pattern = "ように"
forms = ["ないように"]
jlpt = "N4"
meaning = "so that, in order that (a goal you can't simply do)"
formation = [
  "Verb［る］ + ように   (often a potential: 見えるように)",
  "Verb［ない］ + ように   (so as not to)",
]
explanation = """
Gives the aim behind an action, when that aim is a state or a result \
rather than something you choose to do: よく見えるように前に座った, "I \
sat at the front so I could see well". With ない it means "so as not \
to": 忘れないようにメモした, "I wrote it down so I wouldn't forget"."""
notes = """
ように goes with potential forms, ない forms and verbs like わかる, \
見える, 治る; ために takes a verb you do on purpose, with the same \
subject: 見るために, but 見えるように. Ending a sentence, it reminds or \
advises: 忘れないように, "don't forget". ように after a noun + の means \
"like, as" (いつものように), a different use."""
related = ["tame-ni", "you-ni-suru", "you-ni-inoru"]
examples = [
  { source = "yomeru", ja = "よく見える{ように}、前に座った。", en = "I sat at the front so I could see well." },
  { tatoeba = "31634_194461", ja = "もうこれ以上太らない{ように}、彼女はケーキを食べない。", en = "She does not eat cake, so as not to put on any more weight." },
  { tatoeba = "257938_156596", ja = "私は始発バスに乗れる{ように}、早めに出かけた。", en = "I made an early start in order to catch the first bus." },
]

[[point]]
id = "noni-purpose"
pattern = "のに"
forms = []
jlpt = "N4"
meaning = "for (doing), in order to (with 使う, いい, 必要, かかる)"
formation = [
  "Verb［る］ + のに + 使う / いい / 便利 / 必要 / かかる",
  "Noun + に + 使う / いい …   (料理に使う)",
]
explanation = """
Says what something is used for, good for, or what it takes to do \
something: この箱は本を入れるのに使う, "I use this box to keep books \
in"; 駅まで行くのに二十分かかる, "it takes twenty minutes to get to the \
station". A noun takes に alone: 料理に使う."""
notes = """
Different from ために, which states a purpose for any action: のに only \
comes before words of use, usefulness, need, time or cost. And not the \
のに meaning "although" (noni), which follows a full clause and sounds \
frustrated: 歩くのに便利 is purpose, 歩いたのに is "even though I \
walked"."""
related = ["noni", "tame-ni"]
homographs = ["noni"]
examples = [
  { tatoeba = "264898_149660", ja = "辞書はことばの意味を調べる{のに}使う。", en = "We use a dictionary to look up the meaning of words." },
  { tatoeba = "23337_186204", ja = "我々の目は暗闇に慣れる{のに}時間がかかる。", en = "Our eyes take time to adjust to the darkness." },
  { source = "yomeru", ja = "駅まで行く{のに}二十分かかります。", en = "It takes twenty minutes to get to the station." },
]

[[point]]
id = "noni"
pattern = "のに"
forms = ["なのに"]
jlpt = "N4"
meaning = "although, even though, despite (with frustration)"
formation = [
  "Verb / ［い］Adjective + のに",
  "［な］Adjective / Noun + なのに",
]
explanation = """
Joins two facts where the second goes against what the first led you \
to expect, usually with disappointment or surprise: 約束したのに、来な\
かった, "he promised, yet he didn't come". At the end of a sentence it \
voices regret: 言ってくれればよかったのに, "you could have told me"."""
notes = """
The second half is a fact, so it can't be a request, an invitation or a \
plan: not 雨なのに行こう; use けど or ても there. けど is neutral where \
のに complains. A noun or な-adjective needs な: 日曜日なのに. Don't \
confuse with のに "for (doing)" (noni-purpose)."""
related = ["kedo", "temo", "noni-purpose"]
homographs = ["noni-purpose"]
examples = [
  { tatoeba = "308859_94848", ja = "彼女に開けるなと言った{のに}、彼女は窓を開けた。", en = "She opened the window, though I told her not to." },
  { tatoeba = "295514_108172", ja = "彼は金持ち{なのに}、幸せでない。", en = "For all his riches he is not happy." },
  { source = "yomeru", ja = "昨日買った{のに}、もう壊れた。", en = "I only bought it yesterday, and it's already broken." },
]

[[point]]
id = "shi"
pattern = "し"
forms = []
jlpt = "N4"
meaning = "and, and what's more (listing reasons or points)"
formation = [
  "Verb / ［い］Adjective + し",
  "［な］Adjective / Noun + だし",
]
explanation = """
Lists points, often as reasons that add up: この店は安いし、おいしい\
し、よく来る, "this place is cheap, the food's good, so I come here a \
lot". A single し hints there are other reasons left unsaid: 雨だし、\
家にいよう, "it's raining (and all), let's stay in"."""
notes = """
Each part is a full clause in plain or polite form; unlike the て-form, \
it doesn't list events in order. The points should weigh about the same. Often with も inside the clauses \
(頭もいいし、性格もいい). Compared with から, し sounds softer, as if \
the reason were one among several."""
related = ["kara-reason", "te-form-sequence", "soreni"]
examples = [
  { tatoeba = "42426_205185", ja = "それは作りやすい{し}、しかも安い。", en = "It's easy to make and it's cheap." },
  { tatoeba = "299221_104470", ja = "彼は手紙も書かなかった{し}、電話もしなかった。", en = "He neither wrote nor telephoned." },
  { source = "yomeru", ja = "今日は雨だ{し}、家にいよう。", en = "It's raining today, so let's stay home." },
]

[[point]]
id = "dake-de-naku"
pattern = "だけでなく"
forms = ["だけじゃなく", "だけではなく", "だけでなくて", "だけじゃなくて"]
jlpt = "N4"
meaning = "not only … but also"
formation = [
  "Noun + だけでなく",
  "Verb / ［い］Adjective + だけでなく",
  "［な］Adjective + な + だけでなく",
]
explanation = """
Says that A is true and so is B, usually with も on the second item: 料\
理だけでなく、掃除も上手だ, "he's good not only at cooking but at \
cleaning too". It works with nouns, verbs and adjectives alike."""
notes = """
だけじゃなくて is the casual spoken form, だけではなく a little more \
formal. More formal still: ばかりでなく, and in writing のみならず. \
Don't confuse with だけ alone ("only"): 英語だけ話せる means English \
is all she speaks."""
related = ["dake", "mo-particle"]
examples = [
  { tatoeba = "293954_109736", ja = "彼は英語{だけでなく}フランス語も話す。", en = "He speaks French as well as English." },
  { tatoeba = "63267_225929", ja = "きみ{だけでなく}僕も悪い。", en = "It's not just you, I am also to blame." },
  { tatoeba = "294799_108891", ja = "彼は学校で教える{だけでなく}小説も書いた。", en = "Not only did he teach school, but he wrote novels." },
]

[[point]]
id = "ni-suru"
pattern = "にする"
forms = ["にします"]
jlpt = "N4"
meaning = "decide on, choose, go with (a thing); make it X"
formation = [
  "Noun + にする   (コーヒーにする)",
  "［な］Adjective + にする   (静かにする: make quiet)",
]
explanation = """
Picks one option out of several, typically when ordering or planning: \
私はコーヒーにします, "I'll have coffee"; 会議は金曜日にしましょう, \
"let's make the meeting Friday". With a な-adjective it means making \
something that way: 静かにしてください, "please be quiet"."""
notes = """
For deciding to do an action, use a verb and ことにする (行くことにする). \
にする is the choice you make; になる is how things turned out \
(会議は金曜日になった: it ended up on Friday). An い-adjective takes く \
instead: 部屋を明るくする."""
related = ["koto-ni-suru", "naru"]
examples = [
  { tatoeba = "238677_175788", ja = "結構です。それ{にしましょう}。", en = "All right. I'll take it." },
  { tatoeba = "61904_224570", ja = "ここで休憩{にしましょう}。", en = "Let's take a break now." },
  { source = "yomeru", ja = "私はコーヒー{にします}。", en = "I'll have coffee." },
]

[[point]]
id = "sou-da-hearsay"
pattern = "そうだ"
forms = ["そうです"]
jlpt = "N3"
meaning = "I hear that, they say that (hearsay)"
formation = [
  "Verb / ［い］Adjective + そうだ   (降るそうだ, 寒いそうだ)",
  "［な］Adjective / Noun + だそうだ   (元気だそうだ, 学生だそうだ)",
]
explanation = """
Passes on something you heard or read, without vouching for it: 明日は\
雨が降るそうです, "I hear it's going to rain tomorrow". The source often \
comes first with によると or では: ニュースによると, "according to the \
news". The part before そうだ can be past or negative; そうだ itself \
stays as it is."""
notes = """
Not the looks-like そうだ, which takes the stem: 降りそうだ "looks like \
rain", 降るそうだ "I hear it'll rain". そうだ itself is not made past \
or negative (×降るそうだった, ×降るそうではない). Compared with らしい, \
it reports more plainly; casual speech often uses って instead."""
related = ["sou-da-appearance", "rashii", "tte", "to-kiita"]
homographs = ["sou-da-appearance"]
examples = [
  { tatoeba = "32901_195726", ja = "マイクは病気で寝こんでいる{そうだ}。", en = "They say that Mike is sick in bed." },
  { tatoeba = "303840_99857", ja = "彼は麻雀が上手だ{そうです}。", en = "I hear he is good at mahjong." },
  { tatoeba = "278906_125087", ja = "天気予報によれば、まもなく梅雨に入る{そうだ}。", en = "According to the weather forecast, the rainy season will set in before long." },
]

[[point]]
id = "rashii"
pattern = "らしい"
forms = ["らしいです"]
jlpt = "N4"
meaning = "apparently, it seems, I hear (from what I've heard or seen)"
formation = [
  "Verb / ［い］Adjective + らしい   (行くらしい, 高いらしい)",
  "［な］Adjective / Noun + らしい   (元気らしい, 雨らしい)",
]
explanation = """
A guess based on something you heard, read or noticed, said with some \
distance, as information rather than your own judgement: 田中さんは会\
社をやめるらしい, "apparently Tanaka is quitting the company". It \
conjugates like an い-adjective: らしかった, らしくない."""
notes = """
No だ before it after nouns: 雨らしい, not ×雨だらしい. Next to its \
look-alikes: そうだ (stem) is what something looks like; ようだ / みたい \
are your own judgement from evidence; らしい leans on outside \
information, close to hearsay. Not the らしい of "typical of" (男らしい): \
彼は学生らしい can mean "he seems to be a student" or "he is very \
student-like", and context decides."""
related = ["you-da", "mitai", "sou-da-hearsay", "sou-da-appearance", "rashii-typical"]
homographs = ["rashii-typical"]
examples = [
  { tatoeba = "26782_189629", ja = "雨になる{らしい}よ。", en = "They say we're going to get rain!" },
  { tatoeba = "303438_100259", ja = "彼は風邪を引いた{らしい}。", en = "He seems to have caught a cold." },
  { tatoeba = "290359_113315", ja = "彼はすべて知っている{らしい}。", en = "It seems that he knows everything." },
]

[[point]]
id = "rashii-typical"
pattern = "らしい"
forms = []
jlpt = "N4"
meaning = "typical of, like a real, befitting"
formation = ["Noun + らしい   (男らしい, 春らしい)"]
explanation = """
After a noun, says something has the qualities you'd expect of it: 春\
らしい天気, "real spring weather"; 彼らしい, "just like him". It is an \
い-adjective: 子供らしくない, "not childlike"; 学生らしく, "the way a \
student should"."""
notes = """
The same spelling as the らしい of "apparently" (雨らしい, "it seems it's \
rain"); only context tells them apart. ～っぽい is close but looser, \
"-ish", and can be a bit negative: 子供っぽい is "childish", 子供らし\
い "childlike". Some are words of their own: 男らしい "manly", 女らしい \
"feminine"."""
related = ["rashii"]
homographs = ["rashii"]
examples = [
  { tatoeba = "311779_91933", ja = "彼女はとても女{らしい}。", en = "She is a very feminine person." },
  { source = "yomeru", ja = "今日は春{らしい}天気ですね。", en = "It's real spring weather today, isn't it?" },
  { source = "yomeru", ja = "遅れて来るのは彼{らしい}ね。", en = "Coming late is just like him." },
]

[[point]]
id = "you-da"
pattern = "ようだ"
forms = ["ようです", "ようでした"]
jlpt = "N4"
meaning = "seems, appears (my judgement); is like"
formation = [
  "Verb / ［い］Adjective + ようだ   (いないようだ)",
  "［な］Adjective + な + ようだ   (元気なようだ)",
  "Noun + の + ようだ   (留守のようだ)",
]
explanation = """
Your own conclusion, drawn from what you see, hear or feel: 電気が消え\
ている。留守のようだ, "the lights are off; they seem to be out". It \
also compares: 夢のようだ, "it's like a dream". It conjugates like a \
な-adjective: ような + noun, ように + verb."""
notes = """
みたい means the same and is its casual form; ようだ suits writing and \
polite speech. そうだ (stem) is a first look; ようだ weighs the signs; \
らしい leans on what others say. Often with どうやら or まるで \
(まるで夢のようだ). Not ように "so that" (you-ni-purpose)."""
related = ["mitai", "rashii", "sou-da-appearance", "no-you-na", "ni-mieru"]
examples = [
  { tatoeba = "66729_229370", ja = "いい家の{ようです}。", en = "It seems to be a good house." },
  { tatoeba = "50620_213334", ja = "そのエレベーターは故障している{ようだ}。", en = "The elevator seems to be out of order." },
  { tatoeba = "40360_136464", ja = "誰も本当の事を知らなかった{ようだ}。", en = "It seems that no one knew the truth." },
]

[[point]]
id = "mitai"
pattern = "みたい"
forms = ["みたいだ", "みたいです", "みたいな", "みたいに"]
jlpt = "N4"
meaning = "seems, looks like; like (casual)"
formation = [
  "Verb / ［い］Adjective + みたい   (いないみたい)",
  "［な］Adjective / Noun + みたい   (元気みたい, 夢みたい)",
]
explanation = """
The everyday form of ようだ, for a guess from what you notice or for a \
comparison: 誰もいないみたい, "looks like nobody's here"; 夢みたい, \
"it's like a dream". It conjugates like a な-adjective: みたいな + noun, \
みたいに + verb."""
notes = """
Unlike ようだ, no の or な before it: 子供みたい, not ×子供のみたい. \
Always in kana; don't mix it up with 見たい "want to see", or with the \
てみたい of "I'd like to try" (食べてみたい). Casual: in writing or \
polite talk, use ようだ."""
related = ["you-da", "rashii", "sou-da-appearance", "no-you-na"]
examples = [
  { tatoeba = "22010_184879", ja = "外は、夏{みたいだ}よ。", en = "It's like summer outside." },
  { tatoeba = "53865_216561", ja = "ジェインは新しいボーイフレンドがいる{みたいだ}。", en = "Jane seems to have a new boyfriend." },
  { tatoeba = "70145_232775", ja = "あなたはお母さん{みたいな}喋り方をするのね。", en = "You speak like your mother." },
]

[[point]]
id = "no-you-na"
pattern = "のような"
forms = ["のように", "ような"]
jlpt = "N4"
meaning = "like, such as; as (in the same way as)"
formation = [
  "Noun + のような + Noun   (東京のような町)",
  "Noun + のように + Verb / Adjective   (雪のように白い)",
]
explanation = """
Compares one thing to another or gives an example: 雪のように白い, \
"white as snow"; 東京のような大きい町, "a big city like Tokyo". Use \
ような before a noun and ように before a verb or adjective. いつものよ\
うに means "as usual"."""
notes = """
The casual equivalent is みたいな / みたいに, with no の: 東京みたいな町. \
A verb can also come before ような: 夢を見ているような気持ち. Not ように \
"so that" after a verb (you-ni-purpose), which has no の."""
related = ["you-da", "mitai", "mai-no-you-ni", "you-ni-purpose"]
examples = [
  { tatoeba = "272579_141991", ja = "雪{のように}白い。", en = "It is white as snow." },
  { source = "yomeru", ja = "東京{のような}大きい町に住みたい。", en = "I want to live in a big city like Tokyo." },
  { tatoeba = "66106_228748", ja = "いつも{のように}彼は最後に劇場に着いた。", en = "As usual, he was the last to arrive at the theater." },
]

[[point]]
id = "mai-no-you-ni"
pattern = "毎日のように"
forms = ["毎晩のように", "毎週のように", "毎年のように", "毎朝のように", "毎月のように"]
jlpt = "N4"
meaning = "almost every (day, week…)"
formation = ["毎 + time word + のように   (毎日のように, 毎週のように)"]
explanation = """
"Practically every day / week": something happens so often it feels \
like every time, without being strictly so. 毎日のようにコーヒーを飲\
む, "I drink coffee nearly every day". Without のように, 毎日 means \
every single day."""
notes = """
Stick to のように here: みたいに sounds odd with time words. Often with \
the past ていた or ている for a habit: 毎週のように会っていた."""
related = ["no-you-na"]
examples = [
  { tatoeba = "303902_99795", ja = "彼は{毎日のように}電話をしてきた。", en = "He called me up almost every day." },
  { source = "yomeru", ja = "{毎週のように}映画を見に行きます。", en = "I go to see a movie almost every week." },
]

[[point]]
id = "ni-mieru"
pattern = "に見える"
forms = ["にみえる", "に見えます", "そうに見える", "ように見える"]
jlpt = "N4"
meaning = "looks, looks like, appears (to be)"
formation = [
  "［な］Adjective / Noun + に見える   (元気に見える)",
  "［い］Adjective［く］ + 見える   (若く見える)",
  "Noun + のように見える   (医者のように見える)",
]
explanation = """
Says how something looks, based on its appearance: 若く見える, "looks \
young"; 静かに見える, "looks quiet". With ように or そうに it becomes \
more of a guess: 医者のように見える, "looks like a doctor"; 高そうに\
見える, "looks expensive"."""
notes = """
A noun right before に見える says what it looks like it is: 学生に見え\
る, "looks like a student". Often written にみえる in kana. 見える alone \
means "can be seen" (山が見える)."""
related = ["mieru", "sou-da-appearance", "you-da", "kikoeru"]
examples = [
  { tatoeba = "299153_104537", ja = "彼は若く{見えた}。", en = "He appeared young." },
  { tatoeba = "293639_110049", ja = "彼は医者のよう{に見えました}。", en = "He looked like a doctor." },
  { source = "yomeru", ja = "そのかばんは高そう{に見える}。", en = "That bag looks expensive." },
]

[[point]]
id = "mieru"
pattern = "見える"
forms = ["みえる"]
jlpt = "N4"
meaning = "can be seen, be visible; can see (without trying)"
formation = ["Noun + が + 見える   (山が見える)"]
explanation = """
Something comes into view on its own: 窓から海が見える, "you can see \
the sea from the window". What is seen takes が, and the person who sees \
it, if mentioned, takes は or に."""
notes = """
見られる, the potential form of 見る, is about having the chance or \
ability: 東京で富士山が見られる, "you get to see Mt Fuji from Tokyo". \
見える is what reaches your eyes anyway. With an adjective, 見える means \
"look": 若く見える (ni-mieru). The pair 聞こえる / 聞ける works the same \
way."""
related = ["kikoeru", "potential-form", "ni-mieru"]
examples = [
  { tatoeba = "240619_173851", ja = "向こうに大きな山が{見えます}。", en = "We can see a big mountain over there." },
  { tatoeba = "317979_85733", ja = "飛行機が{見えた}。", en = "I saw a plane." },
  { tatoeba = "25580_188437", ja = "屋根の上に月が{見えた}。", en = "I saw the moon above the roof." },
]

[[point]]
id = "kikoeru"
pattern = "聞こえる"
forms = ["きこえる"]
jlpt = "N4"
meaning = "can be heard, be audible; sound (like)"
formation = [
  "Noun + が + 聞こえる   (音楽が聞こえる)",
  "［い］Adjective［く］ + 聞こえる   (うるさく聞こえる)",
  "［な］Adjective / Noun + に聞こえる   (変に聞こえる)",
]
explanation = """
A sound reaches your ears without effort: 鳥の声が聞こえる, "I can hear \
birds". What you hear takes が. On the phone, 聞こえますか is "can you \
hear me?". With an adjective it means "sound": 変に聞こえる, "sounds \
strange"."""
notes = """
聞ける, the potential of 聞く, is about getting the chance: ここでジャズ\
が聞ける, "you can listen to jazz here". 聞こえる is what you hear \
anyway. The same split as 見える / 見られる."""
related = ["mieru", "potential-form"]
examples = [
  { tatoeba = "25441_188299", ja = "音楽が{聞こえる}。", en = "I hear music." },
  { tatoeba = "21574_184446", ja = "学校のベルが鳴るのが{聞こえた}。", en = "I heard the school bell ring." },
  { source = "yomeru", ja = "もしもし、{聞こえます}か。", en = "Hello, can you hear me?" },
]

[[point]]
id = "to-omou"
pattern = "と思う"
forms = ["と思います", "とおもう", "と思っている"]
jlpt = "N4"
meaning = "I think (that)"
formation = [
  "Verb / ［い］Adjective + と思う   (来ると思う)",
  "［な］Adjective / Noun + だ + と思う   (学生だと思う)",
]
explanation = """
Gives your opinion or guess: 明日は晴れると思います, "I think it'll be \
sunny tomorrow". The thought is in the plain form, so a noun needs だ: \
本当だと思う. It also softens statements, and is very common in polite \
speech for that reason."""
notes = """
For what someone else thinks, use と思っている: 田中さんは無理だと思っ\
ている. "I don't think" is usually ないと思う (the thought is \
negative), not と思わない. Volitional + と思う is "I'm thinking of \
doing" (you-to-omou). Casual speech often uses って思う."""
related = ["you-to-omou", "deshou", "to-kiita"]
examples = [
  { tatoeba = "36557_199355", ja = "ない{と思う}けど。", en = "I don't think so." },
  { tatoeba = "41060_136884", ja = "誰が選ばれる{と思います}か。", en = "Who do you think will be chosen?" },
  { tatoeba = "263853_150704", ja = "時がその問題を解決してくれる{と思います}。", en = "I think time will solve the problem." },
]

[[point]]
id = "to-kiita"
pattern = "と聞いた"
forms = ["と聞きました", "ときいた", "って聞いた"]
jlpt = "N4"
meaning = "I heard that"
formation = [
  "Verb / ［い］Adjective + と聞いた",
  "［な］Adjective / Noun + だ + と聞いた   (休みだと聞いた)",
]
explanation = """
Reports something you were told: 田中さんは来月結婚すると聞きました, \
"I heard Tanaka is getting married next month". The source takes から: \
友達から聞いた. In casual speech, って聞いた."""
notes = """
聞く also means "ask", so 彼に…と聞いた can be "I asked him …"; a \
question before と (どこかと聞いた) makes it "asked". Compared with \
そうだ, と聞いた names the act of hearing; そうだ just passes the news \
on."""
related = ["sou-da-hearsay", "to-omou", "tte"]
examples = [
  { tatoeba = "1053224_200216", ja = "トムが金持ちの女性と結婚した{と聞いた}。", en = "I heard that Tom got married to a rich woman." },
  { source = "yomeru", ja = "駅前に新しい店ができた{って聞いた}。", en = "I heard a new shop opened in front of the station." },
]

[[point]]
id = "to-iwarete-iru"
pattern = "と言われている"
forms = ["といわれている", "と言われています", "とされている", "と考えられている"]
jlpt = "N4"
meaning = "it is said that, is thought to be, is considered"
formation = [
  "Verb / ［い］Adjective + と言われている",
  "［な］Adjective / Noun + だ + と言われている   (天才だと言われている)",
]
explanation = """
Presents what people in general say or believe, not one person: 彼は天\
才だと言われている, "he is said to be a genius". With と考えられている \
it is "is thought to be"; とされている is more formal still, for what is \
officially accepted. Common in news and writing."""
notes = """
After a noun, だ is optional: 天才だと / 天才と言われている, and it is \
usually left out with とされている and と考えられている. For something one person \
told you, use そうだ or と聞いた instead."""
related = ["sou-da-hearsay", "to-kiita", "passive"]
examples = [
  { tatoeba = "301764_101929", ja = "彼は天才だ{と言われている}。", en = "He is said to be a genius." },
  { tatoeba = "300422_103271", ja = "彼は正直者だ{と言われている}。", en = "He is said to be honest." },
  { tatoeba = "294077_109613", ja = "彼は英雄{と考えられていた}。", en = "He was regarded as a hero." },
]

[[point]]
id = "to-iu-koto"
pattern = "ということ"
forms = ["ということだ", "ということです"]
jlpt = "N4"
meaning = "the fact that; that means; I hear that"
formation = ["Sentence (plain) + ということ   (学生だということ)"]
explanation = """
Wraps a whole statement into a noun: 問題はお金がないということです, \
"the problem is that we have no money". It also checks or sums up what \
something means: 来られないということですか, "so you mean you can't \
come?". At the end of a sentence, ということだ can pass on hearsay."""
notes = """
After nouns and な-adjectives, keep だ: 休みだということ. Casual speech \
shortens it to ってこと (行けないってこと？). Plain こと also turns a verb \
into a noun (行くこと); ということ is needed when the statement ends in \
だ. As hearsay it's a little formal, like とのことだ; casual speech \
says んだって."""
related = ["no-nominalizer", "sou-da-hearsay", "tte", "to-no-koto-da"]
examples = [
  { tatoeba = "243466_79848", ja = "問題はお金がない{ということです}。", en = "The trouble is that we have no money." },
  { tatoeba = "303435_100262", ja = "彼は風邪をひいている{ということです}。", en = "He is said to have a cold." },
  { source = "yomeru", ja = "つまり、来られない{ということ}ですか。", en = "So you mean you can't come?" },
]

[[point]]
id = "to-itte-mo-ii"
pattern = "と言ってもいい"
forms = ["といってもいい", "と言ってもいいです"]
jlpt = "N4"
meaning = "you could say, it's fair to say"
formation = ["Noun / Sentence + と言ってもいい   (家族と言ってもいい)"]
explanation = """
Puts a strong description forward while admitting it stretches things \
a little: 彼女はもう家族と言ってもいい, "you could say she's family \
now". Often followed by だろう or くらいだ to soften it further."""
notes = """
Built from Verb［て］ + もいい, "it's fine to say": the speaker allows \
themselves the word. Usually written in kana. Close to と言える, "can be \
said", which is more neutral."""
related = ["te-mo-ii", "to-iwarete-iru"]
examples = [
  { tatoeba = "303778_99919", ja = "彼は本の虫{と言ってもいい}ような人だ。", en = "He is what you might call a bookworm." },
  { source = "yomeru", ja = "彼女はもう家族{と言ってもいい}。", en = "You could say she's family now." },
]

[[point]]
id = "kana"
pattern = "かな"
forms = ["かなあ", "かなぁ"]
jlpt = "N4"
hover = false
meaning = "I wonder (casual, to oneself)"
formation = [
  "Verb / ［い］Adjective + かな   (来るかな)",
  "［な］Adjective / Noun + かな   (本当かな)",
]
explanation = """
Wonders aloud, mostly to yourself: 明日は晴れるかな, "I wonder if it'll \
be sunny tomorrow". After a volitional it means "maybe I'll …": 何を食\
べようかな, "what shall I eat?". Said to someone, ないかな softens a \
request or wish: 来てくれないかな."""
notes = """
Casual; it rarely follows です or ます. Used by everyone today; かしら is \
the softer, older, mostly feminine version. More formal ways of \
wondering: のだろうか, でしょうか. No だ after nouns: 雨かな."""
related = ["kashira", "no-darou-ka", "ka-particle", "volitional"]
examples = [
  { tatoeba = "271565_143003", ja = "晴れるの{かなあ}？", en = "I wonder if it will be nice." },
  { tatoeba = "68726_231358", ja = "あのお金で何を買おう{かな}。", en = "What shall we buy with that money?" },
  { tatoeba = "58058_220736", ja = "この前会ってからどのくらいになる{かな}。", en = "How long has it been since we last met?" },
]

[[point]]
id = "no-darou-ka"
pattern = "のだろうか"
forms = ["んだろうか", "のでしょうか", "んでしょうか", "んだろう", "のだろう"]
jlpt = "N4"
meaning = "I wonder (if / why …); is it that …?; must be (のだろう)"
formation = [
  "Verb / ［い］Adjective + のだろうか",
  "［な］Adjective / Noun + な + のだろうか   (本当なのだろうか)",
]
explanation = """
Wonders about something you can't explain, often to yourself: 彼はなぜ\
来ないのだろうか, "I wonder why he isn't coming". The polite のでしょう\
か is a gentle way to ask someone: どこで乗り換えるのでしょうか, \
"where should I change trains?"."""
notes = """
More serious than かな: のだろうか fits writing and reflection, かな \
casual chat. Speech shortens の to ん: んだろう. Without の, だろうか / \
でしょうか is a plain "I wonder"; with の it asks about a reason or \
explanation behind what you see. Without か, のだろう / んだろう is a \
confident guess at the reason: 疲れているんだろう, "he must be tired"."""
related = ["kana", "deshou", "n-desu", "kashira"]
examples = [
  { tatoeba = "23793_186657", ja = "火星には生き物がいる{のだろうか}。", en = "Is there any life on Mars?" },
  { tatoeba = "38164_200960", ja = "どこで乗り換える{のでしょうか}。", en = "Where do I have to change trains?" },
  { tatoeba = "259378_155161", ja = "私は誰な{のだろうか}。", en = "Who am I?" },
]

[[point]]
id = "ja-nai-ka"
pattern = "じゃないか"
forms = ["ではないか", "じゃないですか", "じゃありませんか"]
jlpt = "N4"
meaning = "isn't it?, you know; (surprise or reproach) look, it's …!"
formation = [
  "Verb / ［い］Adjective + じゃないか   (言ったじゃないか)",
  "［な］Adjective / Noun + じゃないか   (簡単じゃないか)",
]
explanation = """
Not a real negative: it asks the listener to agree with something both \
can see, or points it out with surprise or blame: いつも言ってるじゃない\
か, "I always tell you, don't I!". Politely, じゃないですか: 駅は近いじゃ\
ないですか, "the station's close, isn't it?"."""
notes = """
The tone falls; with a rising tone (and often ん before it: 雨なんじゃない\
か), it is a guess, "isn't it maybe …?". じゃないか sounds masculine; \
じゃない alone is softer, and じゃん more casual still. Volitional + じゃな\
いか (行こうじゃないか) is a firm "let's"."""
related = ["deshou", "desu", "volitional"]
examples = [
  { tatoeba = "66081_228724", ja = "いつも言ってる{じゃないか}。", en = "I say it all the time." },
  { tatoeba = "326520_77199", ja = "話が違う{じゃないか}。", en = "That's not what you said before." },
  { source = "yomeru", ja = "駅は近い{じゃないですか}。歩きましょう。", en = "The station's close, isn't it? Let's walk." },
]

[[point]]
id = "ga-suru"
pattern = "がする"
forms = ["がします"]
jlpt = "N4"
meaning = "there's a (sound, smell, taste); feel (that)"
formation = ["Noun + がする   (音がする, においがする, 味がする, 気がする)"]
explanation = """
Says a sense is reaching you: いいにおいがする, "something smells \
good"; 変な音がした, "there was a strange noise". With 気, it is a \
feeling or hunch: 雨が降るような気がする, "I have a feeling it'll \
rain"."""
notes = """
Used for sound, smell, taste and feelings, not for sight: for looks, \
use に見える. The thing giving off the sense is the topic: このスープは\
変な味がする, "this soup tastes odd". 寒気がする "feel a chill" and 吐き\
気がする "feel sick" are set phrases."""
related = ["ni-mieru", "kikoeru"]
examples = [
  { tatoeba = "52270_214974", ja = "すぐそばでかすかな音{がした}。", en = "I heard a faint sound nearby." },
  { source = "yomeru", ja = "この花はいいにおい{がする}。", en = "This flower smells nice." },
  { tatoeba = "25178_188039", ja = "何か甘いものを食べたい気{がする}。", en = "I feel like eating something sweet." },
]

[[point]]
id = "question-ka"
pattern = "か"
forms = []
jlpt = "N4"
meaning = "(question inside a sentence) who / what / where …"
formation = [
  "Question word … Verb / ［い］Adjective + か   (誰が来るか)",
  "Question word … ［な］Adjective / Noun + か   (誰が先生か)",
]
explanation = """
Puts a question inside a longer sentence, usually before わかる, 知る, \
教える or 聞く: 何時に始まるかわかりません, "I don't know what time it \
starts". It also works without a question word: 来るか教えて, "tell me \
if you're coming"."""
notes = """
Usually no だ before it: 誰が先生か, not 誰が先生だか. With a question word, \
use just か; for a yes-or-no question, かどうか is more common \
(来るかどうか). Not the か of 誰か "someone", which follows the question \
word directly."""
related = ["ka-dou-ka", "ka-particle", "ka-mo-question-words"]
homographs = ["ka-particle"]
examples = [
  { tatoeba = "56831_219510", ja = "この本を誰が書いた{か}知っていますか。", en = "Do you have any idea who wrote this book?" },
  { tatoeba = "55073_217763", ja = "この本をどこに置いたらいい{か}教えてください。", en = "Tell me where to put these books." },
  { source = "yomeru", ja = "何時に始まる{か}わかりません。", en = "I don't know what time it starts." },
]

[[point]]
id = "ru-tokoro"
pattern = "るところだ"
forms = ["るところです"]
jlpt = "N4"
meaning = "be about to, be just going to"
formation = ["Verb［る］ + ところだ"]
explanation = """
The action hasn't started yet but is about to, right now: 今から出かけ\
るところです, "I'm just about to go out". ところ is literally "place", \
here a point in time: the speaker is standing just before the action."""
notes = """
Three moments of one action: 食べるところ (about to eat), 食べている\
ところ (in the middle of eating), 食べたところ (just finished eating). \
In the past, るところだった often means "nearly": 遅れるところだった, \
"I almost missed it" (see ところだった)."""
related = ["te-iru-tokoro", "ta-tokoro", "tsumori", "tokoro-datta"]
examples = [
  { tatoeba = "396887_124606", ja = "登校{するところです}。", en = "I am going to school." },
  { source = "yomeru", ja = "これから晩ご飯を食べ{るところだ}。", en = "I'm just about to have dinner." },
  { source = "yomeru", ja = "今から電話をかけ{るところです}。", en = "I'm just about to make a call." },
]

[[point]]
id = "te-iru-tokoro"
pattern = "ているところだ"
forms = ["でいるところだ", "ているところです", "でいるところです", "ているところ", "でいるところ"]
jlpt = "N4"
meaning = "be in the middle of doing, be busy doing (right now)"
