# Yomeru's grammar dictionary — N5 complete, N4–N3 in progress.
#
# Written for Yomeru. The explanations and the sentences marked
# source = "yomeru" are ours. Sentences with a `tatoeba` id come from the
# Tatoeba corpus (CC BY 2.0 FR, https://tatoeba.org), via the Tanaka Corpus
# file the examples dictionary is built from; the id is `<ja>_<en>`.
#
# Fields
#   id           stable ASCII slug; cards point at it, never change it
#   pattern      the headword as learners look it up
#   forms        other spellings and variants a lookup should also find
#   jlpt         N5…N1. Levels are unofficial since 2010: we follow
#                Bunpro's level for the point
#   meaning      one line, for the popup and the card's back
#   formation    how it attaches, one line per construction, in Bunpro's
#                notation: Verb (plain form), Verb［て］, Verb［た］,
#                Verb［る］ (dictionary), Verb［ない］, Verb［stem］ (ます-stem),
#                Verb［できる］ (potential), ［い］Adjective［く］,
#                ［な］Adjective, Noun; a struck letter is dropped: ［い̶］
#   explanation  what it does and when to use it, a short paragraph
#   notes        nuances, pitfalls, look-alikes (optional)
#   related      ids of patterns worth comparing
#   homographs   optional: ids of entries sharing a spelling with this one
#                (passive and potential られる); each names the other, and
#                the lookup shows them all
#   examples     2–3 sentences; {…} marks the pattern in `ja`
#   hover        optional, default true; false keeps the entry out of the
#                hover popup, reachable by search only (って would match
#                inside 行って). One-char patterns (は, に, て) never show on
#                hover anyway: the popup skips matches under two chars

[[point]]
id = "te-mo-ii"
pattern = "てもいい"
forms = ["でもいい", "ていい", "てもいいです", "てもいいですか", "てもよろしい", "でもよろしい", "てもよろしいですか", "でもよろしいですか", "てもよろしいでしょうか", "でもよろしいでしょうか"]
jlpt = "N5"
meaning = "may, it's okay to (permission)"
formation = [
  "Verb［て］ + もいい",
  "［い］Adjective［く］ + てもいい   (高くてもいい)",
  "［な］Adjective / Noun + でもいい   (明日でもいい)",
]
explanation = """
Says that doing something is allowed or acceptable. As a question \
(〜てもいいですか) it is the everyday way to ask for permission. With \
adjectives and nouns it means the condition is acceptable: 明日でもいい, \
"tomorrow is fine too"."""
notes = """
More polite: 〜てもよろしいですか; dropping も (〜ていい) sounds more \
direct. Said about yourself, it offers to do something: 私が行ってもいい\
よ, "I can go". Don't grant permission to a superior with 〜てもいいです, \
which sounds condescending: 使ってください instead. To agree on a time, \
ask 何時に行けばいいですか, not 行ってもいいですか. The negative \
〜なくてもいい means "you don't have to"; refusing permission uses \
〜てはいけない, though a soft すみません、ちょっと… is more common."""
related = ["te-wa-ikenai", "nakute-mo-ii", "te-mo-kamawanai"]
examples = [
  { tatoeba = "56836_219515", ja = "この本を借り{てもいい}ですか。", en = "May I borrow this book?" },
  { tatoeba = "314124_89591", ja = "彼女は私に、自分の部屋を使っ{てもいい}と言った。", en = "She told me that I could use her room." },
  { source = "yomeru", ja = "時間がなければ、明日{でもいい}ですよ。", en = "If you don't have time, tomorrow is fine too." },
]

[[point]]
id = "ta-koto-ga-aru"
pattern = "たことがある"
forms = ["だことがある", "たことがない", "たことがあります"]
jlpt = "N5"
meaning = "have done before, have the experience of"
formation = ["Verb［た］ + ことがある / ことがない"]
explanation = """
Talks about experience: something that has happened at least once in \
your life. The negative ことがない says it never has. Often comes with \
一度 (once), 何度も (many times) or 一度も…ない (not even once)."""
notes = """
Only for experiences worth mentioning, not recent everyday events: for \
"I ate sushi yesterday", plain 食べた is right. It doesn't go with \
habit words like いつも or よく either. Don't confuse with \
Verb［る］ + ことがある, "it sometimes happens that…"."""
related = ["koto-ga-aru-sometimes"]
examples = [
  { tatoeba = "254086_160435", ja = "私はそこへ１度行っ{たことがある}。", en = "I've been there once." },
  { tatoeba = "281684_122319", ja = "日本国憲法を読ん{だことがあります}か。", en = "Have you ever read the Constitution of Japan?" },
  { tatoeba = "27467_190309", ja = "一度も会っ{たことがない}。", en = "I haven't met him even once." },
]

[[point]]
id = "te-kudasai"
pattern = "てください"
forms = ["でください", "て下さい", "で下さい"]
jlpt = "N5"
meaning = "please do (request)"
formation = ["Verb［て］ + ください"]
explanation = """
Asks someone to do something, politely. Put ください after the て-form: \
見てください, "please look". It's the standard request of shops, \
classrooms and instructions. After a noun, ください alone asks for a \
thing: 水をください, "water, please"."""
notes = """
Despite the "please", it is still a fairly direct request, close to an \
instruction. To ask a favour more softly, use 〜てくれませんか or \
〜てくださいませんか. Among friends the bare て-form does the same job: \
ちょっと待って, "wait a moment"."""
related = ["naide-kudasai", "te-kureru", "wo-kudasai"]
examples = [
  { tatoeba = "268373_146189", ja = "乗っ{てください}。", en = "Please get in." },
  { tatoeba = "70543_233174", ja = "あなたの新しい住所を教え{てください}。", en = "Let me know your new address." },
  { tatoeba = "48988_211711", ja = "その絵を見せ{てください}。", en = "Please let me have a look at those pictures." },
]

[[point]]
id = "naide-kudasai"
pattern = "ないでください"
forms = ["ないで下さい"]
jlpt = "N5"
meaning = "please don't (polite request)"
formation = ["Verb［ない］ + でください"]
explanation = """
Asks someone, politely, not to do something. Take the ない-form and add \
でください: 触らないでください, "please don't touch". Common on signs, in \
instructions, and to gently stop someone. It also reassures: 心配しない\
でください, "please don't worry"."""
notes = """
Casual speech drops ください: 行かないで, "don't go". It's ないで, not \
なくて: 行かなくてください is wrong. A rule-like ban is 〜てはいけません, \
stronger and stricter; the positive request is 〜てください."""
related = ["te-kudasai", "te-wa-ikenai", "naide"]
examples = [
  { tatoeba = "280204_123791", ja = "動か{ないでください}。", en = "Don't move, please." },
  { tatoeba = "250309_164201", ja = "私のコーヒーには砂糖を入れ{ないでください}。", en = "Don't put sugar in my coffee." },
  { tatoeba = "63555_226215", ja = "カメラを持っていくのを忘れ{ないでください}。", en = "Don't forget to take a camera with you." },
]

[[point]]
id = "te-wa-ikenai"
pattern = "てはいけない"
forms = ["ではいけない", "てはいけません", "ではいけません", "ちゃいけない", "じゃいけない", "てはだめ", "ちゃだめ", "じゃだめ"]
jlpt = "N5"
meaning = "must not, may not (prohibition)"
formation = ["Verb［て］ + はいけない"]
explanation = """
Says that something is not allowed. Literally "doing it won't do", it \
states a rule or a firm warning: ここで写真を撮ってはいけません, "you may \
not take photos here". Teachers, parents and signs use it; between equals \
it sounds strict."""
notes = """
In speech ては shrinks to ちゃ and では to じゃ: 食べちゃいけない, 飲んじゃ\
だめ. だめ in place of いけない is more conversational. 〜てはならない is \
the formal, written version. Answering 〜てもいいですか with いいえ、\
〜てはいけません is correct but blunt; a refusal usually sounds like すみ\
ません、ちょっと…. Not "don't have to": that is 〜なくてもいい."""
related = ["te-mo-ii", "nakute-wa-ikenai", "naide-kudasai", "nakute-mo-ii"]
examples = [
  { tatoeba = "281900_122103", ja = "入っ{てはいけません}。", en = "You may not come in." },
  { tatoeba = "69322_231955", ja = "あなたは私のペンを使っ{てはいけません}。", en = "You mustn't use my pen." },
  { source = "yomeru", ja = "授業中に寝{ちゃだめ}だよ。", en = "You can't sleep in class." },
]

[[point]]
id = "nakute-wa-ikenai"
pattern = "なくてはいけない"
forms = ["なくてはならない", "なくてはいけません", "なくてはなりません", "なくちゃいけない", "なくちゃ"]
jlpt = "N5"
meaning = "must, have to (obligation)"
formation = ["Verb［な̶い̶］ + なくてはいけない / なくてはならない"]
explanation = """
Says that something has to be done. Literally "not doing it won't do": \
行かなくてはいけない, "I have to go". いけない is the usual one in speech \
and for personal or practical needs; ならない sounds more formal and fits \
rules, duties and writing."""
notes = """
Casual speech shortens なくては to なくちゃ, often dropping the rest: もう\
寝なくちゃ, "I've got to go to bed". なければならない (なきゃ in speech) \
means the same and is more common in writing. The opposite, "don't have \
to", is 〜なくてもいい. Don't confuse with 〜てはいけない, "must not". \
Before a noun, なくてはならない also means "indispensable": なくてはな\
らない人, "someone we can't do without"."""
related = ["nakereba-naranai", "nakute-mo-ii", "te-wa-ikenai", "te-wa-naranai"]
examples = [
  { tatoeba = "402037_81993", ja = "僕は英語の試験の準備をし{なくてはいけない}。", en = "I have to prepare for the English test." },
  { tatoeba = "31382_194209", ja = "もう行か{なくてはならない}。", en = "I've got to leave soon." },
  { tatoeba = "18453_179595", ja = "銀行でお金をおろさ{なくちゃ}。", en = "I have to withdraw some cash from the bank." },
]

[[point]]
id = "ta-hou-ga-ii"
pattern = "たほうがいい"
forms = ["だほうがいい", "ないほうがいい", "た方がいい", "だ方がいい", "ない方がいい", "ほうがいい", "方がいい", "ほうがよかった", "方がよかった"]
jlpt = "N5"
meaning = "had better, should (advice)"
formation = ["Verb［た］ + ほうがいい", "Verb［ない］ + ほうがいい"]
explanation = """
Gives advice: doing this is the better choice. The verb is in the past \
form even though the advice is about now or later: 早く寝たほうがいい, \
"you'd better go to bed early". For "better not", use the ない-form: \
行かないほうがいい."""
notes = """
It is fairly direct; to a superior it can sound pushy, so soften it: \
〜たほうがいいと思います, 〜たほうがいいかもしれません. With the dictionary \
form (行くほうがいい) it sounds like a general comparison more than \
advice. The negative is ない, never なかった: 行かなかったほうがいい is \
wrong. In the past, 〜たほうがよかった is regret or blame, "should \
have": 傘を持ってきたほうがよかった."""
related = ["yori-hou-ga", "nakute-wa-ikenai"]
examples = [
  { tatoeba = "52148_214854", ja = "すぐに寝{たほうがいい}。", en = "You'd better go to bed at once." },
  { tatoeba = "26787_189634", ja = "雨になりそうです。窓を閉め{たほうがいい}でしょう。", en = "It looks like rain. We had better shut the windows." },
  { tatoeba = "270922_143645", ja = "水道水は飲ま{ないほうがいい}よ。", en = "You'd better not drink the tap water." },
]

[[point]]
id = "te-kara"
pattern = "てから"
forms = ["でから"]
jlpt = "N5"
meaning = "after doing, (do A) and then (B); since"
formation = ["Verb［て］ + から"]
explanation = """
Puts two actions in order and insists that A is finished before B \
starts: 手を洗ってから食べる, "I wash my hands, then eat". It also gives \
the starting point of a period up to now: 日本に来てから, "since I came \
to Japan"."""
notes = """
Plain て-linking (A て B) also lists actions in order, but てから stresses \
the order, often because A must come first. 〜たあとで also means \
"after", focusing on the time. Not the reason から: 行ったから is \
"because I went", 行ってから is "after going"."""
related = ["ta-ato-de", "mae-ni", "kara-reason"]
examples = [
  { tatoeba = "266703_147857", ja = "宿題を済ませ{てから}、彼はテレビを見た。", en = "After he had done his homework, he watched TV." },
  { tatoeba = "18098_179241", ja = "靴を脱い{でから}家には入ってください。", en = "Please remove your shoes before entering the house." },
  { source = "yomeru", ja = "日本に来{てから}、毎日日本語を話しています。", en = "Since I came to Japan, I've spoken Japanese every day." },
]

[[point]]
id = "mae-ni"
pattern = "前に"
forms = ["まえに", "前"]
jlpt = "N5"
meaning = "before (doing), before (something)"
formation = ["Verb［る］ + 前に", "Noun + の前に"]
explanation = """
Says that B happens before A. The verb before 前に stays in the \
dictionary form, even when talking about the past: 寝る前に本を読んだ, \
"I read before going to bed". After a noun, add の: 食事の前に, "before \
the meal"."""
notes = """
Never 寝た前に: the past goes at the end of the sentence. After a length \
of time, 前に means "ago": 三年前に, "three years ago", without の. \
Without に, 前 is about place: 駅の前, "in front of the station". The \
opposite is 〜たあとで, with the past form."""
related = ["ta-ato-de", "te-kara", "uchi-ni"]
examples = [
  { tatoeba = "268915_145647", ja = "寝る{前に}電灯を消してください。", en = "Please turn off the light before you go to bed." },
  { source = "yomeru", ja = "出かける{前に}、窓を閉めました。", en = "I closed the windows before going out." },
  { tatoeba = "268719_145846", ja = "食事の{前に}は手を洗いなさい。", en = "Wash your hands before meals." },
]

[[point]]
id = "tai"
pattern = "たい"
forms = ["たいです", "したい"]
jlpt = "N5"
meaning = "want to (do)"
formation = ["Verb［stem］ + たい"]
explanation = """
Says what you want to do. Add たい to the ます-stem: 食べたい, "I want to \
eat". The result works like an い-adjective: たくない (don't want to), \
たかった (wanted to), たいです (polite). In a question it asks what the \
listener wants: 何が食べたいですか."""
notes = """
The object can take が or を: 水が飲みたい, 水を飲みたい. For someone \
else, plain たい sounds like reading their mind: use 〜たがっている or \
〜たいと言っていた. Offering with 何か飲みたいですか is too direct: ask \
何か飲みますか. For a thing, not an action, use 〜がほしい; for "I want \
you to do", 〜てほしい."""
related = ["ga-hoshii", "tagaru", "mashou"]
examples = [
  { tatoeba = "62276_224941", ja = "コーヒーが飲み{たい}。", en = "I'd like a cup of coffee." },
  { tatoeba = "391033_161435", ja = "私はイタリアに住み{たい}。", en = "I want to live in Italy." },
  { source = "yomeru", ja = "今日はどこにも行き{たくない}。", en = "I don't want to go anywhere today." },
]

[[point]]
id = "mashou"
pattern = "ましょう"
forms = ["ましょうか"]
jlpt = "N5"
meaning = "let's (suggestion); shall I, shall we (offer)"
formation = ["Verb［stem］ + ましょう", "Verb［stem］ + ましょうか"]
explanation = """
The polite "let's": 行きましょう, "let's go". With か it becomes a \
question, either a suggestion, 始めましょうか, "shall we start?", or an \
offer to help, 窓を開けましょうか, "shall I open the window?". The casual \
version is the volitional form: 行こう, 行こうか."""
notes = """
ましょう pushes a decision; 〜ませんか invites more softly by leaving the \
choice to the listener. To accept an invitation, ええ、行きましょう is \
natural. With 私が it states what you will do: 私が払いましょう, "I'll \
pay". Teachers and guides \
also use it as a gentle instruction: 毎日練習しましょう, "practise every \
day"."""
related = ["masen-ka", "volitional", "tai"]
examples = [
  { tatoeba = "26197_189050", ja = "英語を話し{ましょう}。", en = "Let's speak English." },
  { tatoeba = "542540_237353", ja = "始め{ましょうか}。", en = "Shall we start?" },
  { tatoeba = "20746_183623", ja = "顔色が悪いですね。医者を呼び{ましょうか}。", en = "You look pale. Shall I call the doctor?" },
]

[[point]]
id = "masen-ka"
pattern = "ませんか"
forms = []
jlpt = "N5"
meaning = "won't you, would you like to (invitation)"
formation = ["Verb［stem］ + ませんか"]
explanation = """
Invites the listener to do something, often together, by asking "won't \
you…?": 一緒に映画を見ませんか, "would you like to see a film with me?". \
Being a negative question, it leaves room to say no, so it sounds softer \
than 〜ましょう."""
notes = """
Accept with ええ、いいですね or 〜ましょう; decline with すみません、\
ちょっと…. Casually it's the plain negative with a rising tone: 行かない？. \
With くれ or もらえ (〜てくれませんか) it asks a favour, not an invitation. \
And not every ませんか invites: 寒くありませんか just asks "aren't you \
cold?"."""
related = ["mashou", "te-kureru"]
examples = [
  { tatoeba = "245139_169347", ja = "散歩し{ませんか}。", en = "How about going for a walk?" },
  { tatoeba = "247401_167101", ja = "私たちのチームに入り{ませんか}。", en = "Would you like to join our team?" },
  { source = "yomeru", ja = "土曜日に一緒にテニスをし{ませんか}。", en = "Would you like to play tennis with me on Saturday?" },
]

[[point]]
id = "ni-iku"
pattern = "に行く"
forms = ["にいく", "に来る", "にくる", "に帰る", "にかえる", "に行きます"]
jlpt = "N5"
meaning = "go (somewhere) to do, come to do (purpose)"
formation = ["Verb［stem］ + に行く / に来る / に帰る", "Noun + に行く   (買い物に行く)"]
explanation = """
Gives the purpose of going or coming. The ます-stem, or a noun for an \
activity, comes before に: 昼ご飯を食べに行く, "go to eat lunch"; 買い物に\
来た, "came shopping". The place takes に or へ: 駅へ友達を迎えに行く, \
"go to the station to meet a friend"."""
notes = """
Only movement verbs follow: 行く, 来る, 帰る, 出かける, 戻る. For other \
purposes, use 〜ために. With する-verbs the noun alone is common: 勉強し\
に行く and 勉強に行く both work. Don't confuse with a place + に行く \
(学校に行く), where に marks the destination."""
related = ["tame-ni", "e-particle"]
examples = [
  { tatoeba = "315098_88609", ja = "彼女は食べ物を買い{に行った}。", en = "She went out to buy some food." },
  { tatoeba = "284427_119236", ja = "彼とはよく釣り{に行った}。", en = "I often went fishing with him." },
  { tatoeba = "320151_83565", ja = "平均して、月に二回映画を見{に行きます}。", en = "On an average, I go to the movies twice a month." },
]

[[point]]
id = "tari-tari"
pattern = "たり〜たりする"
forms = ["たりする", "たり", "だり", "たり〜たり"]
jlpt = "N5"
meaning = "do things like A and B; sometimes A, sometimes B"
formation = [
  "Verb［た］ + り、Verb［た］ + りする   (食べたり飲んだりする)",
  "［い］Adjective［かった］ + り   (高かったり)",
  "［な］Adjective / Noun + だったり",
]
explanation = """
Lists a few actions as examples, implying there are others: 週末は掃除\
したり買い物したりする, "on weekends I do things like cleaning and \
shopping". The final する carries the tense and politeness. With \
opposites it means things alternate: 行ったり来たり, "back and forth"."""
notes = """
A single たり also works, to give one example softly: 映画を見たりします, \
"I watch films, that kind of thing". Plain て-linking (掃除して、買い物\
する) gives a sequence, not examples. Keep the り on both verbs and the \
final する; casual speech sometimes drops する."""
related = ["te-form-sequence", "shi"]
examples = [
  { tatoeba = "23925_186788", ja = "歌っ{たり踊ったりし}ましょう。", en = "Let's sing and dance." },
  { tatoeba = "301688_102006", ja = "彼は通りを行っ{たり来たりし}た。", en = "He walked back and forth on the street." },
  { source = "yomeru", ja = "日曜日は本を読ん{だり、映画を見たりし}ます。", en = "On Sundays I do things like read books and watch films." },
]

[[point]]
id = "te-iru"
pattern = "ている"
forms = ["でいる", "てる"]
jlpt = "N5"
meaning = "be doing (ongoing); be in a state (result); habit"
formation = ["Verb［て］ + いる"]
explanation = """
Three main uses. An action in progress: 今テレビを見ている, "I'm watching \
TV". A state left by a change: 結婚している, "is married"; 窓が開いている, \
"the window is open". A habit or a job: 毎日走っている, "I run every \
day". Which one applies depends mostly on the verb."""
notes = """
Verbs of instant change (死ぬ, 着く, 結婚する, 知る) give the state, never \
"in the middle of": 死んでいる is "is dead". So 知っている is "know", and \
its negative is 知らない, not 知っていない. Likewise 行っている is "has \
gone (and is there)", not "is going". \
In speech い drops: 見てる, 読んでる. まだ〜ていない is "haven't … yet"."""
related = ["te-aru", "te-shimau", "mada-te-inai"]
examples = [
  { tatoeba = "248212_166292", ja = "私たちはテレビを見{ています}。", en = "We are watching TV." },
  { tatoeba = "250952_163560", ja = "私の姉は２人とも結婚し{ている}。", en = "Both of my sisters are married." },
  { tatoeba = "484917_140686", ja = "祖父は毎日散歩し{ています}。", en = "My grandfather goes for a walk every day." },
]

[[point]]
id = "node"
pattern = "ので"
forms = ["なので"]
jlpt = "N5"
meaning = "because, since, so (reason)"
formation = ["Verb / ［い］Adjective + ので", "［な］Adjective / Noun + なので   (雨なので)"]
explanation = """
Gives a reason, then its result: 雨なので、行きません, "it's raining, so \
I won't go". It presents the reason as a plain fact the listener can \
accept, which sounds softer and politer than から. Common in excuses, \
explanations and requests."""
notes = """
After nouns and な-adjectives, use な, not だ: 学生なので. から is more \
direct and fits opinions, orders and invitations: 寒いから窓を閉めて. To \
open a sentence, use だから or (more casually) なので, not ので alone. In \
very polite speech ので can follow ます: 参りますので; casual speech \
shortens it to んで."""
related = ["kara-reason", "n-desu"]
examples = [
  { tatoeba = "303101_100597", ja = "彼は病気だった{ので}、来られなかった。", en = "He was ill, so he couldn't come." },
  { tatoeba = "280174_123821", ja = "頭痛がする{ので}今日は休みたいと思います。", en = "I have a headache, so I would like to take a day off today." },
  { source = "yomeru", ja = "明日は休み{なので}、ゆっくり寝ます。", en = "Tomorrow is a day off, so I'll sleep in." },
]

[[point]]
id = "kedo"
pattern = "けど"
forms = ["けれど", "けれども", "けども"]
jlpt = "N5"
meaning = "but, although; (softening lead-in)"
formation = ["Verb / ［い］Adjective + けど", "［な］Adjective / Noun + だけど"]
explanation = """
Joins two contrasting clauses: 高いけど、おいしい, "it's expensive, but \
tasty". けれども is the full, politer form, けれど sits in between, and \
けど is the everyday one. A sentence can also end on けど, leaving the \
rest unsaid: 今ちょっと忙しいんですけど…, "I'm a bit busy right now…"."""
notes = """
It also works without contrast, to set up a question or request: 駅に行\
きたいんですけど、どう行きますか. が does the same jobs and suits writing \
and polite speech. To open a sentence, use でも or だけど rather than \
けど alone."""
related = ["ga-particle", "demo", "noni"]
examples = [
  { tatoeba = "266578_147981", ja = "重い{けど}、何とか運べます。", en = "It's heavy, but I can manage it." },
  { tatoeba = "63063_225725", ja = "具合が悪かった{けど}、仕事に行った。", en = "I didn't feel well, but I went to work." },
  { tatoeba = "317802_85909", ja = "疲れていた{けれども}、彼女は働き続けました。", en = "Though she was tired, she kept on working." },
]

[[point]]
id = "n-desu"
pattern = "んです"
forms = ["のです", "んだ", "のだ", "なの"]
jlpt = "N5"
meaning = "explaining, asking about the background"
formation = ["Verb / ［い］Adjective + んです", "［な］Adjective / Noun + なんです   (学生なんです)"]
explanation = """
Adds a sense of explanation: what is said is the reason or story behind \
something both people can see. 頭が痛いんです, "(it's that) I have a \
headache". In questions it asks for that story: どうしたんですか, "what \
happened?". Writing and formal speech use のです; casual speech uses \
んだ, or の."""
notes = """
Overused, it sounds insistent; for a plain fact, です/ます is enough. A \
んですか question shows interest in a situation, but without a reason to \
ask it can sound nosy. んですが or んですけど opens a request: 道を聞きたい\
んですが…."""
related = ["node", "kedo"]
examples = [
  { tatoeba = "280130_123865", ja = "頭が痛い{んです}。頭痛薬がありますか。", en = "My head hurts. Have you got any headache tablets?" },
  { tatoeba = "66356_228998", ja = "いつから雪が降っている{んです}か。", en = "How long has it been snowing?" },
  { tatoeba = "36363_199164", ja = "なぜ遅刻した{のです}か。", en = "Why were you late?" },
]

[[point]]
id = "no-ga-suki"
pattern = "のが好き"
forms = ["のがすき", "のが嫌い", "のがきらい", "のが大好き"]
jlpt = "N5"
meaning = "like doing, love doing (dislike: のが嫌い)"
formation = ["Verb［る］ + のが好き / のが嫌い"]
explanation = """
の turns an action into a noun so it can be liked: 泳ぐのが好きです, "I \
like swimming". It takes が because 好き is an adjective, not a verb. The \
same frame gives 〜のが嫌い (dislike doing) and 〜のが大好き (love \
doing)."""
notes = """
こと also works (泳ぐことが好き) but sounds more formal; の is the \
everyday choice. Use が, not を. For the past, only 好き changes: 走るの\
が好きだった. The same の + が frame gives skills: 歌う\
のが上手, "good at singing"; 〜のが下手, "bad at". For things, no の: 猫が\
好き."""
related = ["no-ga-jouzu", "koto-nominalizer"]
examples = [
  { tatoeba = "7966911_189291", ja = "映画を見る{のが好き}です。", en = "I like to watch movies." },
  { tatoeba = "252478_162037", ja = "私は一人で旅行する{のが好き}だ。", en = "I like to travel alone." },
  { source = "yomeru", ja = "朝早く起きる{のが嫌い}です。", en = "I don't like getting up early in the morning." },
]

[[point]]
id = "yori-hou-ga"
pattern = "より〜のほうが"
forms = ["のほうが", "の方が", "より〜の方が", "ほうが"]
jlpt = "N5"
meaning = "A is more … than B (comparison)"
formation = [
  "Noun B + より + Noun A + のほうが + Adjective",
  "Noun A + は + Noun B + より + Adjective",
  "Verb［る］ + ほうが   (歩くほうが速い)",
]
explanation = """
Compares two things. より marks the one with less of the quality, ほう \
("side") the one with more: 電車よりバスのほうが安い, "the bus is cheaper \
than the train". Each half also works alone: バスのほうが安い, or バスは\
電車より安い. Adjectives have no "-er" form: this frame does the job."""
notes = """
To ask, use どちら: 犬と猫とどちらが好きですか, answered with 〜のほうが. \
The two halves can swap places. Nouns take の before ほう; verbs and \
adjectives don't. For "the most" among three or more, use 〜の中で…が一番."""
related = ["ga-ichiban", "ta-hou-ga-ii", "to-dochira"]
examples = [
  { tatoeba = "266377_148182", ja = "秋{より春のほうが}好きだ。", en = "I prefer spring to fall." },
  { tatoeba = "33537_161076", ja = "私はコーヒー{よりお茶のほうが}よい。", en = "I prefer tea to coffee." },
  { source = "yomeru", ja = "東京は大阪{より}大きいです。", en = "Tokyo is bigger than Osaka." },
]

[[point]]
id = "ga-ichiban"
pattern = "が一番"
forms = ["がいちばん", "で一番", "の中で一番", "のなかでいちばん"]
jlpt = "N5"
meaning = "the most, the best (superlative)"
formation = [
  "Noun (group) + の中で + Noun + が一番 + Adjective",
  "Noun (place) + で + 一番 + Adjective",
]
explanation = """
Picks the top item of a group. 一番 ("number one") goes before the \
adjective: 果物の中でりんごが一番好きです, "of all fruit I like apples \
best". の中で or で sets the group or place: 日本で一番高い山, "the \
highest mountain in Japan"."""
notes = """
To ask, the question word takes が: 何が一番好きですか; likewise どれ, \
誰, いつ, どこ. With just two items, use どちら and 〜のほうが instead. \
一番 also goes before verbs and adverbs: 一番よく使う, "use most often". \
のうちで is a more formal alternative to の中で."""
related = ["yori-hou-ga", "to-dochira"]
examples = [
  { tatoeba = "257933_156601", ja = "私は四季の中で夏{が一番}好きだ。", en = "I like summer best of the four seasons." },
  { tatoeba = "37531_200330", ja = "どの季節{が一番}好きですか。", en = "What season do you like the best?" },
  { tatoeba = "318135_85578", ja = "琵琶湖は日本{で一番}大きな湖です。", en = "Lake Biwa is the largest lake in Japan." },
]

[[point]]
id = "kara-made"
pattern = "から〜まで"
forms = ["まで"]
jlpt = "N5"
meaning = "from A to B, from A until B; until"
formation = ["Noun A + から + Noun B + まで", "Verb［る］ + まで   (来るまで)"]
explanation = """
Marks the start and end of a range, in time or space: 九時から五時まで, \
"from nine to five"; 駅から家まで, "from the station to my house". Each \
half also works alone: 三時まで, "until three". After a verb, まで means \
"until it happens": バスが来るまで待つ, "wait until the bus comes"."""
notes = """
までに is different: a deadline, "by", for something done once before \
that point: 五時までに来て, "come by five". まで goes with something that \
lasts the whole time: 五時まで待つ. The verb before まで stays in the \
dictionary form, even in the past."""
related = ["made-ni", "kara-reason"]
examples = [
  { tatoeba = "288665_115006", ja = "彼は９時{から５時まで}働きました。", en = "He worked from nine to five." },
  { tatoeba = "62085_224750", ja = "ここ{から公園まで}どれくらいありますか。", en = "How far is it from here to the park?" },
  { source = "yomeru", ja = "雨がやむ{まで}、ここで待ちましょう。", en = "Let's wait here until the rain stops." },
]

[[point]]
id = "zenzen"
pattern = "全然"
forms = ["ぜんぜん"]
jlpt = "N4"
meaning = "not at all (with a negative)"
formation = ["全然 + Verb［ない］", "全然 + ［い］Adjective［く］ + ない"]
explanation = """
Strengthens a negative to "not at all": 全然わからない, "I don't \
understand at all". It is the strong end of a scale that starts with \
あまり〜ない, "not very". Very common in conversation."""
notes = """
Casual speech also uses 全然 with positive words, meaning "totally, no \
problem": 全然大丈夫, "totally fine". Many speakers accept it, but in \
polite or written language keep it with negatives. On its own, 全然 \
answers "not at all": 「疲れた？」「全然。」."""
related = ["amari-nai"]
examples = [
  { tatoeba = "56905_219584", ja = "この本は{全然}おもしろくない。", en = "This book isn't interesting at all." },
  { tatoeba = "292669_111017", ja = "彼はヘビを{全然}怖がらない。", en = "He's not at all afraid of snakes." },
  { tatoeba = "286047_117617", ja = "彼の言うことは{全然}わからない。", en = "I cannot make anything of what he says." },
]

[[point]]
id = "mada-te-inai"
pattern = "まだ〜ていない"
forms = ["まだ", "まだ〜ていません", "ていません"]
jlpt = "N5"
meaning = "not yet, haven't … yet; (positive) still"
formation = ["まだ + Verb［て］ + いない"]
explanation = """
Says something hasn't happened yet but is expected to: まだ食べていない, \
"I haven't eaten yet". The short answer is まだです, "not yet". With a \
positive state, まだ means "still": まだ雨が降っている, "it's still \
raining"."""
notes = """
Use ていない, not the plain negative: まだ食べない means "I won't eat \
yet", a choice rather than a fact. Its partner is もう: 「もう食べた？」\
「ううん、まだ。」. Don't answer いいえ、食べませんでした: that reports a \
closed past, "I didn't eat", not "not yet"."""
related = ["mou", "te-iru"]
examples = [
  { tatoeba = "32623_195449", ja = "{まだ決めていません}。", en = "I haven't made up my mind yet." },
  { tatoeba = "292853_110833", ja = "私は{まだ仕事を終えていない}。", en = "I have not yet done with the work." },
  { tatoeba = "312221_91492", ja = "彼女は{まだここへ来ていません}。", en = "She is not here yet." },
]

[[point]]
id = "mou"
pattern = "もう"
forms = []
jlpt = "N5"
meaning = "already; (with a negative) not anymore; (in questions) yet"
formation = ["もう + Verb［た］", "もう + Verb［ない］"]
explanation = """
With a past verb, もう means "already": もう食べました, "I've already \
eaten". With a negative, "no longer": もう行かない, "I won't go \
anymore". In a question it asks "yet?": もう宿題をしましたか, "have you \
done your homework yet?"."""
notes = """
Answer a もう question with はい、もう〜ました, or いいえ、まだです \
(まだ〜ていません). Before an amount, もう means "more": もう一つ, "one \
more"; もう少し, "a little more"."""
related = ["mada-te-inai"]
examples = [
  { tatoeba = "31141_193973", ja = "{もう}夕食は食べました。", en = "I've already had my supper." },
  { tatoeba = "254016_124609", ja = "私は{もう}宿題を終えました。", en = "I have already finished my homework." },
  { source = "yomeru", ja = "{もう}たばこは吸いません。", en = "I don't smoke anymore." },
]

[[point]]
id = "naru"
pattern = "なる"
forms = ["になる", "くなる"]
jlpt = "N5"
meaning = "become, get, turn (into)"
formation = [
  "［い］Adjective［く］ + なる   (寒くなる)",
  "［な］Adjective / Noun + になる   (元気になる)",
]
explanation = """
Describes a change: 寒くなった, "it got cold"; 先生になりたい, "I want to \
become a teacher"; 春になった, "spring has come". い-adjectives change \
い to く; な-adjectives and nouns take に."""
notes = """
なる is a change that happens; to make something change yourself, use \
する: 部屋をきれいにする, "tidy the room". Times "become" too: 十時に\
なった, "it's ten o'clock now". With verbs, use 〜ようになる (come to) \
or 〜なくなる (no longer)."""
related = ["you-ni-naru", "naku-naru", "ni-suru"]
examples = [
