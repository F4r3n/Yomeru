explanation = """
Gives the role or status someone acts in: 医者として働く, "work as a \
doctor". Before a noun, としての: 親としての責任, "one's responsibility \
as a parent". After "one" plus a counter, with a negative, it stresses \
"not even one": 一人として来なかった, "not a single person came"."""
notes = """
として is about a role; for "like, similar to", use のように. The \
"not a single" use sounds firm and a bit formal; 一人も来なかった is \
the everyday version. としては ("for a …") and としても ("even if") \
are later points."""
related = ["wo-to-suru", "no-you-na"]
examples = [
  { tatoeba = "295771_107914", ja = "彼は芸人{として}成功した。", en = "He made good as an entertainer." },
  { source = "yomeru", ja = "父は医者{として}働いている。", en = "My father works as a doctor." },
  { source = "yomeru", ja = "パーティーには一人{として}来なかった。", en = "Not a single person came to the party." },
]

[[point]]
id = "wa-mochiron"
pattern = "はもちろん"
forms = ["はもちろんのこと", "はもとより"]
jlpt = "N3"
meaning = "not to mention, … of course, and also"
formation = [
  "Noun + はもちろん + Noun + も",
]
explanation = """
Puts the obvious case first, then adds a less obvious one, usually with \
も or まで: 英語はもちろん、中国語も話せる, "she speaks Chinese, not \
to mention English". The first item goes without saying; the second \
is the news."""
notes = """
はもとより means the same and is more formal and written. Order \
matters: the obvious item comes before はもちろん, unlike English \
"not to mention", which puts it after. Compare ばかりでなく, which \
adds without the "of course" feeling."""
related = ["bakari-de-naku", "dake-de-naku", "dokoroka"]
examples = [
  { tatoeba = "21382_184254", ja = "学生{はもちろん}先生も来た。", en = "The teacher as well as his students has come." },
  { tatoeba = "293971_109719", ja = "彼は英語とドイツ語{はもちろん}、スペイン語も話す。", en = "He speaks Spanish, not to mention English and German." },
]

[[point]]
id = "bakari-de-naku"
pattern = "ばかりでなく"
forms = ["ばかりではなく", "ばかりじゃなく", "ばかりか"]
jlpt = "N3"
meaning = "not only … but also"
formation = [
  "Noun + ばかりでなく",
  "Verb / ［い］Adjective + ばかりでなく",
  "［な］Adjective + な + ばかりでなく",
]
explanation = """
Adds a second item to the first, usually with も: 彼は学問ばかりでなく\
経験もある, "he has experience as well as learning". It is the more \
formal, written cousin of だけでなく. ばかりか is stronger: the second \
item is more surprising, often something bad: 謝らないばかりか、笑って\
いた, "not only didn't he apologize, he was laughing"."""
notes = """
After ばかりか, the second part often has まで or さえ. Don't confuse \
with ばかり alone ("nothing but"). ばかりか cannot end in a command \
or invitation; ばかりでなく can."""
related = ["dake-de-naku", "wa-mochiron", "bakari-noun"]
examples = [
  { tatoeba = "294868_108821", ja = "彼は学問{ばかりでなく}経験もある。", en = "He has experience as well as learning." },
  { tatoeba = "70137_232767", ja = "あなた{ばかりでなく}私もまちがっている。", en = "Not only you but also I am in the wrong." },
  { source = "yomeru", ja = "彼は謝らない{ばかりか}、笑っていた。", en = "Not only did he not apologize, he was laughing." },
]

[[point]]
id = "dokoroka"
pattern = "どころか"
forms = []
jlpt = "N3"
meaning = "far from, let alone, not even"
formation = [
  "Noun / ［な］Adjective + どころか",
  "Verb / ［い］Adjective + どころか",
]
explanation = """
Denies the first idea strongly and replaces it with something further \
away: 雨はやむどころかひどくなった, "far from stopping, the rain got \
worse". With a negative it means "let alone": ドイツ語どころか英語も\
話せない, "I can't speak English, let alone German"."""
notes = """
With a negative, the harder item goes before どころか and the easier \
one after, with も or さえ. With a positive, it's the reverse: 漢字\
どころか古い本も読める, "she can read not just kanji but old books \
too". どころではない, "this is no time for", is a later point."""
related = ["wa-mochiron", "bakari-de-naku", "dokoro-de-wa-nai"]
examples = [
  { tatoeba = "256244_158286", ja = "私はドイツ語{どころか}英語も話せない。", en = "I cannot speak English, much less German." },
  { tatoeba = "26706_189552", ja = "雨はやむ{どころか}いよいよひどくなった。", en = "Instead of stopping, the rain increased." },
]

[[point]]
id = "de-yuumei"
pattern = "で有名"
forms = ["で有名だ", "でゆうめい", "で有名です", "で有名な"]
jlpt = "N3"
meaning = "famous for, known for"
formation = [
  "Noun + で有名",
  "Verb / ［い］Adjective + ことで有名 / ので有名",
]
explanation = """
Says what a place or person is known for: この公園はバラで有名です, \
"this park is famous for its roses". For a whole fact, put こと or の \
before it: 雨が多いことで有名だ, "it's known for its heavy rain"."""
notes = """
で marks the reason for the fame, but で after a place can also say \
where: 世界で有名, "famous around the world". It can \
also mean "notorious" when the thing is bad. として有名 says the role \
someone is known in: 歌手として有名."""
related = ["to-shite"]
examples = [
  { tatoeba = "59325_222001", ja = "この公園はバラ{で有名です}。", en = "This park is famous for its roses." },
  { tatoeba = "19296_181636", ja = "京都は古いお寺があるの{で有名だ}。", en = "Kyoto is famous for its old temples." },
]

[[point]]
id = "to-natte-iru"
pattern = "となっている"
forms = ["となっています", "となっており"]
jlpt = "N3"
meaning = "is (set as, stated as, by rule or arrangement)"
formation = [
  "Noun / ［な］Adjective + となっている",
]
explanation = """
States how things are set up, often by a rule, a schedule or what's \
written: この部屋は禁煙となっています, "this room is non-smoking". It \
is common on signs, in announcements and in formal writing, where a \
plain です would sound too blunt."""
notes = """
になっている means much the same and is more neutral. Unlike plain \
となる ("become"), it describes a present state, not a change you \
watch happen. ことになっている is the version for rules about \
actions: 九時に集まることになっている."""
related = ["naru", "koto-ni-naru"]
examples = [
  { tatoeba = "46767_209505", ja = "その手紙の日付は１９８７年４月１日{となっている}。", en = "The letter is dated April 1, 1987." },
  { source = "yomeru", ja = "この部屋は禁煙{となっています}。", en = "Smoking is not allowed in this room." },
]

[[point]]
id = "ippou-de"
pattern = "一方で"
forms = ["一方", "いっぽうで", "一方では", "その一方で"]
jlpt = "N3"
meaning = "while, on the other hand, at the same time"
formation = [
  "Verb / ［い］Adjective + 一方で",
  "［な］Adjective + な / である + 一方で",
  "Noun + である + 一方で",
  "Sentence。 + 一方、 / その一方で、",
]
explanation = """
Sets two sides next to each other: 兄は勉強が得意な一方で、スポーツは\
苦手だ, "my brother is good at studying, while he's bad at sports". \
At the start of a sentence, 一方、 or その一方で、 means "meanwhile, \
on the other hand"."""
notes = """
The two sides can be about the same thing or about different things. \
反面 is only for two sides of one thing. Don't confuse with 一方だ, \
"keeps getting more and more"."""
related = ["hanmen", "ippou-da", "nagara-mo"]
examples = [
  { source = "yomeru", ja = "兄は勉強が得意な{一方で}、スポーツは苦手だ。", en = "My brother is good at studying, but bad at sports." },
  { source = "yomeru", ja = "仕事が増える{一方で}、給料は変わらない。", en = "While the work increases, the pay stays the same." },
  { tatoeba = "27212_190056", ja = "{一方では}彼は親切だが、他方では怠け者だ。", en = "On one hand he is kind, but on the other hand he is lazy." },
]

[[point]]
id = "hanmen"
pattern = "反面"
forms = ["はんめん", "半面", "その反面"]
jlpt = "N3"
meaning = "on the other hand (two sides of one thing)"
formation = [
  "Verb / ［い］Adjective + 反面",
  "［な］Adjective + な / である + 反面",
  "Sentence。 + その反面、",
]
explanation = """
Shows that one thing has two opposite sides: 都会は便利な反面、物価が\
高い, "the city is convenient, but on the other hand things are \
expensive". The good and the bad belong to the same person, place or \
thing."""
notes = """
一方で can compare two different things; 反面 can't: it needs one \
subject with two faces. It sounds a little formal. 半面 is a \
less common spelling."""
related = ["ippou-de", "nagara-mo"]
examples = [
  { source = "yomeru", ja = "都会は便利な{反面}、物価が高い。", en = "The city is convenient, but things are expensive." },
  { source = "yomeru", ja = "この仕事は楽しい{反面}、とても疲れる。", en = "This job is fun, but on the other hand it's very tiring." },
  { tatoeba = "42230_204988", ja = "それは値段は安いが、その{反面}品質がよくない。", en = "It is cheap, but on the other hand it is not good." },
]

[[point]]
id = "hou-da"
pattern = "ほうだ"
forms = ["方だ", "ほうです", "方です", "のほうだ", "の方だ", "のほうです", "の方です"]
jlpt = "N3"
meaning = "rather, on the … side; (のは〜のほうだ) it's X that …"
formation = [
  "Verb［る］ / Verb［ない］ + ほうだ",
  "［い］Adjective + ほうだ",
  "［な］Adjective + な + ほうだ",
  "Noun + の + ほうだ",
  "… + のは + Noun + のほうだ   (悪いのは君のほうだ)",
]
explanation = """
Puts someone or something on one side of a scale, compared with the \
usual: 父はよく食べるほうだ, "my father is a fairly big eater". It is a \
soft judgement: "more … than most". のは〜のほうだ picks one of two \
sides, often against what was expected: 悪いのは君のほうだ, "you're the \
one to blame (not me)"."""
notes = """
It softens a statement about oneself: 私は朝は強いほうです sounds more \
modest than 朝に強い. Compare たほうがいい (advice) and より〜のほうが \
(a comparison of two named things)."""
related = ["yori-hou-ga", "ta-hou-ga-ii"]
examples = [
  { source = "yomeru", ja = "父はよく食べる{ほうだ}。", en = "My father is a pretty big eater." },
  { source = "yomeru", ja = "私は朝は強い{ほうです}。", en = "I'm fairly good at getting up in the morning." },
  { tatoeba = "28648_191488", ja = "悪いのはきみ{のほうだ}。", en = "It is you who is to blame." },
]

[[point]]
id = "kurai-extent"
pattern = "くらい"
forms = ["ぐらい", "くらいだ", "ぐらいだ", "くらいです", "ぐらいです"]
jlpt = "N3"
meaning = "so … that, to the point of; at least (a minimum)"
formation = [
  "Verb / ［い］Adjective + くらい / ぐらい",
  "［な］Adjective + な + くらい",
  "Noun + くらい   (電話くらい)",
]
explanation = """
Shows how far something goes by giving an example of its degree: 泣き\
たいくらいうれしかった, "I was so happy I could cry". After a noun, it \
can mark the least one could do: 電話ぐらいしてよ, "at least give me a \
call", or the only thing there is: 休みの日にするのは掃除くらいだ, \
"cleaning is about all I do on days off"."""
notes = """
ほど works the same for degree and sounds a bit more formal, but ほど \
doesn't take the "at least" or "only" uses. As a sentence end: 歩けない\
くらいだ, "I can barely walk". The "about, around" use after amounts \
(十分ぐらい) is the earlier くらい entry. くらい and ぐらい are \
interchangeable."""
related = ["kurai", "hodo-nai"]
homographs = ["kurai"]
examples = [
  { source = "yomeru", ja = "泣きたい{くらい}うれしかった。", en = "I was so happy I could cry." },
  { source = "yomeru", ja = "遅れるなら電話{ぐらい}してよ。", en = "If you're going to be late, at least call." },
  { tatoeba = "282024_121979", ja = "猫の手も借りたい{くらいだ}。", en = "We are so busy we'll take any help we can get." },
]

[[point]]
id = "hodo-nai"
pattern = "ほど〜ない"
forms = ["ほど〜はない", "くらい〜はない", "ぐらい〜はない"]
jlpt = "N3"
meaning = "not as … as; nothing is as … as"
formation = [
  "Noun + ほど + ［い］Adjective［い̶］ + くない",
  "Noun + ほど + Verb［ない］   (兄ほど食べない)",
  "Noun + ほど + Adjective + Noun + はない   (友情ほど大切なものはない)",
]
explanation = """
A ほど B ない says A doesn't reach the level of B: 今日は昨日ほど寒く\
ない, "today isn't as cold as yesterday". With a noun and はない, it \
says nothing beats the first item: 友情ほど大切なものはない, "nothing \
is as important as friendship"."""
notes = """
The thing compared with goes before ほど, and the sentence must be \
negative: ×昨日ほど寒い. くらい〜はない works the same in the "nothing \
is as" use. For a plain "more than", use より."""
related = ["yori-hou-ga", "kurai-extent", "ba-hodo"]
examples = [
  { tatoeba = "61223_223887", ja = "このカメラはあのカメラ{ほど高くない}。", en = "This camera is less expensive than that one." },
  { tatoeba = "324327_79390", ja = "友情{ほど重要なものはない}。", en = "There is nothing so important as friendship." },
  { source = "yomeru", ja = "今日は昨日{ほど寒くない}。", en = "Today isn't as cold as yesterday." },
]

[[point]]
id = "mama"
pattern = "まま"
forms = ["ままで", "ままに", "ままだ", "ままにする", "のまま", "たまま", "ないまま"]
jlpt = "N3"
meaning = "as it is, unchanged, while still (in a state)"
formation = [
  "Verb［た］ + まま",
  "Verb［ない］ + まま",
  "Noun + の + まま",
  "［い］Adjective + まま",
  "［な］Adjective + な + まま",
]
explanation = """
Says a state stays as it was while something else happens: 帽子をかぶ\
ったまま部屋に入った, "she came in with her hat still on". ままにする \
leaves something as it is on purpose: 窓を開けたままにしておく, "leave \
the window open". そのまま means "just as it is"."""
notes = """
The state usually feels out of place or unchanged when it should have \
changed. ながら joins two actions done together; まま keeps one state \
fixed. Use た before まま, not the dictionary form: ×かぶるまま. In casual \
speech まんま is heard."""
related = ["nagara", "te-oku"]
examples = [
  { tatoeba = "316984_86727", ja = "彼女は帽子をかぶった{まま}部屋に入ってきました。", en = "She came into the room with her hat on." },
  { tatoeba = "35443_198251", ja = "パジャマ{のまま}朝食を食べた。", en = "I had breakfast in pajamas." },
  { tatoeba = "274205_140368", ja = "窓を開けた{ままに}しておいて下さい。", en = "Please keep the windows open." },
]

[[point]]
id = "bakari-noun"
pattern = "ばかり"
forms = ["ばっかり", "ばっか", "ばかりで"]
jlpt = "N3"
meaning = "nothing but, only, all (too much of one thing)"
formation = [
  "Noun + ばかり",
  "Noun + ばかり + Verb   (肉ばかり食べる)",
]
explanation = """
Says one thing takes up everything, usually as a complaint: 弟は肉ばか\
り食べる, "my brother eats nothing but meat". It can replace を or が, \
or sit after other particles: 友だちとばかり遊ぶ."""
notes = """
だけ is a neutral "only"; ばかり adds "too much, again and again". \
ばっかり and ばっか are casual. Keep apart from てばかり ("do nothing \
but"), たばかり ("just did") and るばかりだ ("keeps getting"). After a \
number, ばかり can mean "about": 百円ばかり, a rather old-fashioned use."""
related = ["te-bakari", "ta-bakari", "bakari-da", "dake"]
examples = [
  { tatoeba = "289194_114477", ja = "彼はいつも同じ間違い{ばかり}している。", en = "He keeps making the same mistake." },
  { source = "yomeru", ja = "弟は肉{ばかり}食べる。", en = "My little brother eats nothing but meat." },
  { source = "yomeru", ja = "毎日雨{ばかりで}、どこにも行けない。", en = "It's rain every day, so I can't go anywhere." },
]

[[point]]
id = "nakanaka-nai"
pattern = "なかなか〜ない"
forms = ["なかなか", "中々"]
jlpt = "N3"
meaning = "not easily, just won't; (positive) quite, rather"
formation = ["なかなか + Verb［ない］", "なかなか + ［い］Adjective / ［な］Adjective (positive: quite)"]
explanation = """
With a negative, なかなか says something is slow or hard to happen, \
usually when you expect or want it to: バスがなかなか来ない, "the bus \
just won't come". It often goes with the potential: なかなか覚えられ\
ない, "I can't seem to remember it"."""
notes = """
With a positive word, なかなか means "quite, better than expected": \
なかなかおいしい, "pretty tasty". It is a mild compliment, so don't use \
it about a superior's work. Compare 全然〜ない (not at all): なかなか\
〜ない means it's hard or slow, not that it never happens."""
related = ["zenzen", "mattaku", "kanari"]
examples = [
  { tatoeba = "57285_219967", ja = "この風邪が{なかなか}治らない。", en = "I can't get rid of this cold." },
  { tatoeba = "284706_118957", ja = "彼には{なかなか}会えない。", en = "It is difficult to gain access to him." },
  { source = "yomeru", ja = "このラーメン、{なかなか}おいしいね。", en = "This ramen is pretty good, isn't it?" },
]

[[point]]
id = "kesshite"
pattern = "決して〜ない"
forms = ["決して", "けっして"]
jlpt = "N3"
meaning = "never, by no means, not in any way"
formation = ["決して + Verb［ない］", "決して + ［い］Adjective［く］ + ない", "決して + ［な］Adjective / Noun + ではない"]
explanation = """
A strong, firm negative: "absolutely not". It is used for promises \
and warnings (決して忘れません, "I will never forget"), and to deny a \
judgement firmly: 決して安くない, "it's by no means cheap"."""
notes = """
決して always needs a negative (or a strong refusal such as 〜ものか). \
It sounds more serious and written than 絶対に〜ない, which is the usual \
spoken choice. For "never again", use 二度と〜ない; for "have never \
done", use 一度も〜たことがない."""
related = ["nidoto", "mattaku", "zenzen"]
examples = [
  { tatoeba = "26657_189506", ja = "嘘は{決して}つくな！", en = "Never tell a lie!" },
  { tatoeba = "257191_157342", ja = "私は{決して}肉を食べません。", en = "I never eat meat." },
  { tatoeba = "313403_90311", ja = "彼女は{決して}幸せではなかった。", en = "She was by no means happy." },
]

[[point]]
id = "mattaku"
pattern = "全く"
forms = ["まったく", "全く〜ない", "まったく〜ない"]
jlpt = "N3"
meaning = "not at all (with negatives); completely, truly"
formation = ["全く + Verb［ない］", "全く + ［い］Adjective［く］ + ない", "全く + Phrase (completely)"]
explanation = """
With a negative, 全く makes it total: 全くわからない, "I don't \
understand at all". With a positive it means "completely, truly": 全く\
同じ, "exactly the same". Written in kanji or in hiragana."""
notes = """
全く〜ない and 全然〜ない mean the same; 全く sounds a little more \
serious and suits writing, 全然 is the everyday spoken word. On its own, \
まったく！ (or まったくもう) is a sigh of annoyance: "honestly!"."""
related = ["zenzen", "sukoshimo-nai", "kesshite"]
examples = [
  { tatoeba = "10536829_171386", ja = "今年の夏は{全く}食欲がない。", en = "I have no appetite at all this summer." },
  { tatoeba = "285960_117704", ja = "彼の計画は僕は{まったく}知らない。", en = "I am quite ignorant of his plan." },
  { tatoeba = "70919_233547", ja = "あなたのご意見に{全く}賛成です。", en = "I am in full accord with your view." },
]

[[point]]
id = "betsu-ni"
pattern = "別に"
forms = ["べつに", "別に〜ない", "べつに〜ない"]
jlpt = "N3"
meaning = "not particularly (with negatives); separately"
formation = ["別に + Verb［ない］", "別に + ［い］Adjective［く］ + ない", "別に + ［な］Adjective / Noun + ではない"]
explanation = """
With a negative, 別に softens it to "not really, not in particular": \
別に困っていない, "I'm not really in trouble". Alone, 「別に。」 is a \
short answer meaning "nothing much" or "not really"."""
notes = """
「別に。」 by itself can sound cold or sulky, so use it with care. It \
pairs naturally with わけではない: 別に嫌いなわけではない, "it's not \
that I dislike it". Without a negative, 別に keeps its literal sense, \
"separately, apart": 別に払う, "pay separately". A noun + 別 (年齢別) \
means "sorted by"."""
related = ["wake-de-wa-nai", "amari-nai"]
examples = [
  { tatoeba = "329671_74049", ja = "「何を考えてるの？」「{別に}・・・」", en = "\"What are you thinking about?\" \"Nothin'...\"" },
  { source = "yomeru", ja = "{別に}怒っていないよ。", en = "I'm not particularly angry." },
  { tatoeba = "51049_213762", ja = "ソースを{別に}ください。", en = "I'd like the sauce on the side." },
]

[[point]]
id = "metta-ni"
pattern = "めったに〜ない"
forms = ["めったに", "滅多に"]
jlpt = "N3"
meaning = "rarely, hardly ever, seldom"
formation = ["めったに + Verb［ない］", "めったに + Noun + はない"]
explanation = """
Says something happens very seldom: 父はめったに怒らない, "my father \
rarely gets angry". It always needs a negative. めったにない on its own \
means "rare": めったにないチャンス, "a rare chance"."""
notes = """
Usually written in hiragana. It is about how often, so it sits with \
frequency words: いつも (always), よく (often), ときどき (sometimes), \
あまり〜ない (not often), めったに〜ない (rarely), 全然〜ない (never)."""
related = ["amari-nai", "zenzen"]
examples = [
  { tatoeba = "293032_110654", ja = "彼は{めったに}テレビを見ない。", en = "He scarcely ever watches TV." },
  { source = "yomeru", ja = "父は{めったに}怒らない。", en = "My father rarely gets angry." },
  { source = "yomeru", ja = "ここでは雪が{めったに}降らない。", en = "It hardly ever snows here." },
]

[[point]]
id = "totemo-nai"
pattern = "とても〜ない"
forms = []
jlpt = "N3"
meaning = "cannot possibly, there's no way"
formation = ["とても + Verb［できる］［ない］", "とても + Verb［ない］"]
explanation = """
With a negative, とても stops meaning "very" and says something is \
impossible, far beyond what you can do: とても一人では運べない, "I \
can't possibly carry it alone". It usually goes with the potential \
form or できない."""
notes = """
Don't confuse it with とても + an adjective that happens to be negative \
in meaning: とても暑くて働けない is "it's so hot I can't work", where \
とても is still "very". The "impossible" reading needs とても to bear \
on the negative verb itself. It sounds personal and emotional, more than \
決して."""
related = ["kesshite", "potential-form", "doushitemo"]
examples = [
  { source = "yomeru", ja = "こんなにたくさん、{とても}一人では食べられない。", en = "I can't possibly eat this much by myself." },
  { source = "yomeru", ja = "明日までには{とても}終わらない。", en = "There's no way it'll be finished by tomorrow." },
  { tatoeba = "56940_219619", ja = "この本は私には{とても}わからない。", en = "This book is quite above me." },
]

[[point]]
id = "nidoto"
pattern = "二度と"
forms = ["にどと", "二度と〜ない", "にどと〜ない"]
jlpt = "N3"
meaning = "never again"
formation = ["二度と + Verb［ない］"]
explanation = """
Literally "a second time": with a negative it means "never again", \
often after a bad experience. あの店には二度と行かない, "I'll never go \
to that shop again". Used for strong resolutions and promises."""
notes = """
Always with a negative (or a negative wish such as 〜たくない, \
〜ないでください). For a plain "never" without the sense of repeating, \
use 決して〜ない or 一度も〜ない."""
related = ["kesshite"]
examples = [
  { tatoeba = "280961_123038", ja = "{二度と}しません。", en = "I will not do it again." },
  { tatoeba = "259776_154764", ja = "私は{二度と}それをしないつもりです。", en = "I will never do it again." },
  { source = "yomeru", ja = "あの店には{二度と}行かない。", en = "I'll never go to that shop again." },
]

[[point]]
id = "imada-ni"
pattern = "いまだに"
forms = ["未だに"]
jlpt = "N2"
meaning = "still, even now (surprisingly long)"
formation = ["いまだに + Phrase", "いまだに + Verb［ない］ (still not)"]
explanation = """
A stronger, more formal まだ: something has gone on for a long time \
and is still the case, often to the speaker's surprise or regret. \
いまだに覚えている, "I still remember it (even now)". With a negative: \
いまだに連絡がない, "still no word"."""
notes = """
いまだに stresses the long stretch of time; まだ is neutral. For a \
simple "not yet" (まだ食べていない), まだ is the natural word: \
いまだに〜ない says it has been far too long. いまだかつて〜ない is a separate, written phrase: "never \
before"."""
related = ["mada-te-inai", "mou"]
examples = [
  { tatoeba = "65898_228540", ja = "{いまだに}物理が苦手なのか。", en = "Are you still having difficulty with physics?" },
  { tatoeba = "289256_114415", ja = "彼は{いまだに}彼女の言葉を信じている。", en = "He still believes her words." },
]

[[point]]
id = "amari-ni"
pattern = "あまりに"
forms = ["あまりにも", "余りに", "余りにも", "あまりの"]
jlpt = "N3"
meaning = "too, so very (that…), excessively"
formation = ["あまりに(も) + ［い］Adjective / ［な］Adjective / Verb", "あまりの + Noun + に (あまりの寒さに)"]
explanation = """
Says a degree goes beyond what is normal, often so far that it causes \
something: あまりに高くて買えなかった, "it was so expensive I couldn't \
buy it". にも adds emphasis. Before a noun, use あまりの: あまりの暑さ\
に, "in the overwhelming heat"."""
notes = """
Different from あまり〜ない ("not very"): あまりに works with positive \
verbs and adjectives and means "too much". It often comes with \
〜すぎる or a result clause with ので / て. あんまり is the casual \
spoken form of both."""
related = ["amari-nai", "sugiru"]
examples = [
  { tatoeba = "50946_230351", ja = "{あまりに}早く着いた。", en = "I arrived there too early." },
  { tatoeba = "288807_114864", ja = "彼は{あまりにも}幼いので学校に行けなかった。", en = "He was too young to go to school." },
  { source = "yomeru", ja = "{あまりの}寒さに、外に出られなかった。", en = "It was so cold that I couldn't go outside." },
]

[[point]]
id = "kanari"
pattern = "かなり"
forms = []
jlpt = "N3"
meaning = "fairly, quite, considerably, pretty"
formation = ["かなり + ［い］Adjective / ［な］Adjective / Verb", "かなりの + Noun"]
explanation = """
Says something is clearly more than average, though not extreme: \
かなり寒い, "pretty cold". Before a noun it takes の: かなりの人, \
"quite a lot of people". It works for good and bad things alike."""
notes = """
Roughly, とても / すごく (very) > かなり (quite) > 少し (a little). \
ずいぶん is close but adds the speaker's surprise ("much more than I \
thought"). かなり is common in speech and writing; in formal writing \
相当 is a stiffer equivalent."""
related = ["nakanaka-nai", "masumasu"]
examples = [
  { tatoeba = "51989_214697", ja = "スコットランドの晩秋は{かなり}寒い。", en = "Late autumn in Scotland is rather cold." },
  { tatoeba = "72609_235233", ja = "４マイルは{かなりの}距離だ。", en = "Four miles is a good distance." },
  { source = "yomeru", ja = "今日は{かなり}疲れた。", en = "I'm pretty tired today." },
]

[[point]]
id = "masumasu"
pattern = "ますます"
forms = ["益々"]
jlpt = "N3"
meaning = "more and more, increasingly, even more"
formation = ["ますます + Verb (of change: なる, 増える…)", "ますます + ［い］Adjective / ［な］Adjective + なる"]
explanation = """
Says a state that was already growing keeps growing: 雨がますます強く\
なった, "the rain got heavier and heavier". Common with ほど and \
につれて: 読めば読むほどますます面白くなる."""
notes = """
ますます assumes the trend was already there and is speeding up. \
だんだん is a gradual, step-by-step change; どんどん is quick and \
steady progress. "Less and less" is also ますます with a word of \
decrease (ますます減る)."""
related = ["dandan", "dondon", "ba-hodo", "ni-tsurete"]
examples = [
  { tatoeba = "288060_115610", ja = "彼は、{ますます}背が高くなった。", en = "He has become taller and taller." },
  { tatoeba = "241236_173235", ja = "高く登るほど、{ますます}寒くなる。", en = "The higher we climb, the colder it becomes." },
  { source = "yomeru", ja = "雨が{ますます}強くなってきた。", en = "The rain is getting heavier and heavier." },
]

[[point]]
id = "marude"
pattern = "まるで"
forms = ["まるで〜ようだ", "まるで〜みたいだ", "まるで〜のよう"]
jlpt = "N3"
meaning = "just like, as if; (with negatives) not at all"
formation = ["まるで + Noun + のようだ / みたいだ", "まるで + Verb / Adjective + ようだ / みたいだ", "まるで + Verb［ない］ (not at all)"]
explanation = """
まるで strengthens a comparison with ようだ or みたいだ: it isn't really \
so, but it looks or feels exactly like it. まるで夢のようだ, "it's \
just like a dream". The "as if" comes from ようだ / みたいだ; まるで \
adds "completely"."""
notes = """
まるで is not used with らしい. With a negative it means "not \
at all", often with a note of disappointment: まるでわからない, "I \
can't make head or tail of it". かのように after a verb makes the \
"as if" even clearer: まるで夢を見ているかのように."""
related = ["you-da", "mitai", "mattaku"]
examples = [
  { tatoeba = "292954_110732", ja = "彼は{まるで}王様のように行動をする。", en = "He acts as if he were a king." },
  { tatoeba = "292946_110740", ja = "彼は{まるで}アメリカ人のように英語を話す。", en = "He speaks English as if he were an American." },
  { source = "yomeru", ja = "説明が{まるで}わからなかった。", en = "I didn't understand the explanation at all." },
]

[[point]]
id = "ittai"
pattern = "一体"
forms = ["いったい", "一体全体"]
jlpt = "N3"
meaning = "(what / who / why) on earth, in the world"
formation = ["一体 + Question word + Phrase + か / の"]
explanation = """
Adds surprise, confusion or irritation to a question: 一体何があった\
の？, "what on earth happened?". It goes before a question word (何, \
誰, どこ, どうして) and the sentence ends as a question. 一体全体 is \
even stronger."""
notes = """
Only in questions, often ones the speaker doesn't expect an answer to. \
It can sound accusing, so avoid it in polite requests. As a plain noun, \
一体 also means "one body, a unit" (一体になる, "become one"), which \
has nothing to do with this use."""
related = ["ka-mo-question-words"]
examples = [
  { tatoeba = "27508_190373", ja = "{一体}、どうしたの。", en = "What on earth is the matter?" },
  { tatoeba = "27515_190357", ja = "{一体}君は何を言おうとしているんだい。", en = "What in the world are you getting at?" },
  { source = "yomeru", ja = "{いったい}誰がこれを壊したの？", en = "Who on earth broke this?" },
]

[[point]]
id = "doushitemo"
pattern = "どうしても"
forms = []
jlpt = "N3"
meaning = "no matter what, at any cost; (with negatives) just can't"
formation = ["どうしても + Verb［stem］ + たい / Noun + がほしい", "どうしても + Verb［できる］［ない］"]
explanation = """
With a wish, it means "at all costs": どうしても行きたい, "I really \
want to go, whatever it takes". With a negative, it means "however \
hard I try, I can't": どうしても思い出せない, "I just can't remember"."""
notes = """
After と, it says a result can't be avoided: 牛乳を飲むと、どうしても\
おなかが痛くなる, "whenever I drink milk, I always get a stomachache". \
Don't confuse it with どうして ("why"). For "no matter how (much)", \
the pattern is どんなに〜ても."""
related = ["totemo-nai", "tai", "potential-form"]
examples = [
  { tatoeba = "39055_210874", ja = "その戸は{どうしても}開かなかった。", en = "The door would not open." },
  { tatoeba = "1318718_201503", ja = "{どうしても}正確な言葉を思い出せない。", en = "No matter how hard I try, I can't remember the exact words." },
  { source = "yomeru", ja = "{どうしても}この映画が見たい。", en = "I really want to see this movie, no matter what." },
]

[[point]]
id = "moshikashitara"
pattern = "もしかしたら"
forms = ["もしかすると", "もしかして"]
jlpt = "N3"
meaning = "maybe, perhaps, possibly; by any chance"
formation = ["もしかしたら + Phrase + かもしれない", "もしかして + Phrase + か (question)"]
explanation = """
Says something is a real but uncertain possibility, and usually pairs \
with かもしれない: もしかしたら明日は休みかもしれない, "I might have \
tomorrow off". \
もしかすると is the same; もしかして often opens a question: もしかして\
田中さんですか, "are you Tanaka-san, by any chance?"."""
notes = """
These sound less certain than たぶん (probably) and far less than きっと \
(surely). ひょっとしたら / ひょっとして are close equivalents. \
もしかしたら is not "if": it doesn't make a condition, even though it \
contains もし."""
related = ["kamoshirenai", "deshou"]
examples = [
  { tatoeba = "31046_193878", ja = "{もしかすると}彼は明日来るかもしれない。", en = "He might come tomorrow." },
  { tatoeba = "31051_193883", ja = "{もしかしたら}彼は気が変わるかもしれない。", en = "He might change his mind." },
  { source = "yomeru", ja = "{もしかして}、田中さんですか。", en = "Are you Tanaka-san, by any chance?" },
]

[[point]]
id = "nantonaku"
pattern = "なんとなく"
forms = ["何となく"]
jlpt = "N3"
meaning = "somehow, vaguely, for no particular reason"
formation = ["なんとなく + Phrase"]
explanation = """
Says you feel or do something without a clear reason you could name: \
なんとなく不安だ, "I feel uneasy, I don't know why". It also softens a \
statement to "sort of": なんとなくわかる, "I sort of get it"."""
notes = """
Casual and very common. Asked why you did something, 「なんとなく。」 \
alone means "no real reason". Don't confuse it with なんとか ("somehow \
or other, one way or another"), which is about managing to do \
something despite difficulty."""
related = []
examples = [
  { tatoeba = "24900_187763", ja = "{何となく}はわかりました。", en = "I sort of understand." },
  { source = "yomeru", ja = "{なんとなく}テレビをつけた。", en = "I turned on the TV for no real reason." },
]

[[point]]
id = "dourude"
pattern = "どうりで"
forms = ["道理で"]
jlpt = "N3"
meaning = "no wonder, that explains it"
formation = ["どうりで + Phrase (+ わけだ)"]
explanation = """
Said when you learn a reason that makes sense of something you'd \
noticed: 「昨日徹夜したんだ。」「どうりで眠そうだね。」, "No wonder \
you look sleepy". The sentence often ends with わけだ or はずだ."""
notes = """
It reacts to new information, so it comes in replies, not as the \
first statement. Close to なるほど ("I see"), but どうりで links the \
reason to something already observed. Usually written in hiragana."""
related = ["wake-da"]
examples = [
  { tatoeba = "280455_123542", ja = "{道理で}、君が喜ぶわけだ。", en = "No wonder you are so happy." },
  { source = "yomeru", ja = "「昨日徹夜したんだ。」「{どうりで}眠そうだね。」", en = "\"I stayed up all night.\" \"No wonder you look sleepy.\"" },
]

[[point]]
id = "chanto"
pattern = "ちゃんと"
forms = ["ちゃんとした", "ちゃんとする"]
jlpt = "N3"
meaning = "properly, neatly, as one should"
formation = ["ちゃんと + Verb", "ちゃんとした + Noun   (a proper, decent …)"]
explanation = """
Says something is done the way it should be, fully and without \
shortcuts: ちゃんと手を洗って, "wash your hands properly". ちゃんとした + \
Noun means "proper, decent": ちゃんとした仕事, "a proper job". \
ちゃんとする alone is "to behave, to get it together"."""
notes = """
Casual and very common, often in advice and scolding. きちんと is close \
but a little more formal and stresses neatness and precision \
(きちんと並べる, "line up neatly"); ちゃんと stresses doing what's \
expected. Don't confuse it with ちゃん + the particle と (美奈ちゃんと, \
"with Mina")."""
related = ["kichinto"]
examples = [
  { tatoeba = "305903_97801", ja = "彼らは{ちゃんと}面倒見てもらえるでしょう。", en = "They will be taken good care of." },
  { source = "yomeru", ja = "ご飯の前に{ちゃんと}手を洗いなさい。", en = "Wash your hands properly before eating." },
  { source = "yomeru", ja = "もっと{ちゃんとした}服を着て来て。", en = "Come in more decent clothes." },
]

[[point]]
id = "tsui"
pattern = "つい"
forms = ["ついつい"]
jlpt = "N3"
hover = false
meaning = "without meaning to, couldn't help; just (a moment ago)"
formation = ["つい + Verb［て］ + しまう", "つい + さっき / この間 / 最近   (just recently)"]
explanation = """
Says you did something you didn't intend, giving in to habit or \
temptation, so it nearly always comes with てしまう: つい食べてしまった, \
"I ate it without meaning to". ついつい stresses it. Before a time word \
it means "just": ついさっき, "just a moment ago"."""
notes = """
うっかり is a careless slip, like forgetting something; つい is a \
weakness you know about. Unlike ついに ("finally"), つい never means \
"at last". Mostly about yourself, or about people you sympathize \
with."""
related = ["te-shimau", "tsui-ni"]
examples = [
  { tatoeba = "39828_202594", ja = "{つい}眠ってしまった。", en = "I couldn't help falling asleep." },
  { tatoeba = "325764_77953", ja = "料理がおいしくて{つい}食べ過ぎた。", en = "The food was so good that I ate too much." },
  { source = "yomeru", ja = "{つい}さっき家に着いた。", en = "I got home just a moment ago." },
]

[[point]]
id = "wazawaza"
pattern = "わざわざ"
forms = ["態々"]
jlpt = "N3"
meaning = "going out of one's way, taking the trouble"
formation = ["わざわざ + Verb"]
explanation = """
Says someone made a special effort they didn't have to: わざわざ来て\
くれた, "they came all this way for me". Very common in thanks, with \
てくれる or てもらう. With a negative it says "no need to bother": \
わざわざ行かなくてもいい."""
notes = """
わざと means "on purpose", often with bad intent (わざと負けた, "lost \
on purpose"); わざわざ is about the trouble taken, usually for \
someone else. わざわざ can also sound critical, "go to the trouble of \
doing something pointless": わざわざ遠い店で買う."""
related = ["waza-to"]
examples = [
  { tatoeba = "293424_110264", ja = "彼は{わざわざ}私の手伝いをしてくれた。", en = "He went out of his way to help me." },
  { tatoeba = "60271_222940", ja = "この雨の中、{わざわざ}来てもらってありがとう。", en = "Thank you for coming all the way in this rain." },
  { tatoeba = "29153_191991", ja = "{わざわざ}家に来なくてもいいですよ。", en = "Do not bother to come to my home." },
]

[[point]]
id = "sekkaku"
pattern = "せっかく"
forms = ["折角", "せっかくの"]
jlpt = "N3"
meaning = "with all the trouble, precious (chance), since … anyway"
formation = ["せっかく + Verb / Phrase + のに", "せっかく + Verb / Phrase + (ん)だから", "せっかくの + Noun"]
explanation = """
Marks something valuable or hard-won. With のに it regrets that it went \
to waste: せっかく作ったのに、誰も食べない, "I made it specially, and \
nobody eats it". With から it says to make good use of it: せっかく来た\
んだから, "since we've come all this way". せっかくの + Noun is "a \
precious …": せっかくの休み."""
notes = """
The result decides the mood: のに for disappointment, から with a \
suggestion or a wish (〜ましょう, 〜たい). せっかくですが is a polite way \
to turn down an offer: "it's kind of you, but…". Not for things that \
cost no effort and have no special value."""
related = ["noni", "kara-reason"]
examples = [
  { tatoeba = "51329_214039", ja = "{せっかく}雨の中を会いに行ったのに彼女は留守だった。", en = "Though I went to see her all the way in the rain, she was out." },
  { source = "yomeru", ja = "{せっかくの}休みなのに、雨だ。", en = "It's my precious day off, and it's raining." },
  { source = "yomeru", ja = "{せっかく}来たんだから、ゆっくりしていって。", en = "Since you've come all this way, stay and relax." },
]

[[point]]
id = "kaette"
pattern = "かえって"
forms = ["却って"]
jlpt = "N3"
hover = false
meaning = "on the contrary, instead, all the more"
formation = ["かえって + Phrase"]
explanation = """
Says the result was the opposite of what you'd expect or intended: 薬を\
飲んだら、かえって悪くなった, "I took medicine, and it actually got \
worse". The first part is usually an action meant to help, followed \
by the unexpected outcome."""
notes = """
Usually written in hiragana, so it looks like 帰って ("go home"); \
context tells them apart. むしろ also means "rather", but it compares \
two choices (AよりむしろB); かえって reports an outcome that went \
against expectation."""
related = ["mushiro"]
examples = [
  { tatoeba = "263733_150824", ja = "事故は減らずに{かえって}多くなっている。", en = "Instead of fewer accidents there are more." },
  { source = "yomeru", ja = "薬を飲んだら、{かえって}悪くなった。", en = "I took medicine, and I actually got worse." },
  { source = "yomeru", ja = "タクシーで行ったら、{かえって}時間がかかった。", en = "I took a taxi, and it actually took longer." },
]

[[point]]
id = "mushiro"
pattern = "むしろ"
forms = ["寧ろ"]
jlpt = "N3"
meaning = "rather, if anything, sooner"
formation = ["A + より(も) + むしろ + B", "むしろ + Phrase"]
explanation = """
Picks the second of two options as the better fit or the preferred \
one: バスよりむしろ歩きたい, "I'd rather walk than take the bus". \
Alone it corrects an idea: 暑くない。むしろ寒い, "it's not hot; if \
anything, it's cold"."""
notes = """
Often with より or というより: 先生というよりむしろ友達, "more a friend \
than a teacher". かえって is about a result that went against \
expectation; むしろ is a choice or judgment. A little formal; in \
conversation people also say どっちかというと."""
related = ["kaette", "to-iu-yori", "yori-hou-ga"]
examples = [
  { tatoeba = "35264_198075", ja = "バスより{むしろ}歩きたい。", en = "I'd rather walk than take a bus." },
  { tatoeba = "294845_108844", ja = "彼は学者というよりも{むしろ}テレビタレントである。", en = "He is not so much a scholar as a TV personality." },
]

[[point]]
id = "tsui-ni"
pattern = "ついに"
forms = ["遂に", "終に"]
jlpt = "N3"
meaning = "at last, finally, in the end"
formation = ["ついに + Verb［た］", "ついに + Noun + だ   (ついに明日だ)"]
explanation = """
Marks the end point of a long wait or process, often an important or \
dramatic one: ついに完成した, "it was finally finished". It can also \
announce that the moment has come: ついに明日は試合だ, "the match is \
tomorrow at last"."""
notes = """
とうとう is the everyday word and is close in meaning; ついに sounds \
more formal or dramatic, as in news and stories. やっと adds relief at \
something hoped for. With a negative, ついに means "never, in the \
end": ついに来なかった. Not the same as つい ("without meaning to")."""
related = ["toutou", "yatto", "tsui"]
examples = [
  { tatoeba = "291777_111901", ja = "彼は{ついに}現れた。", en = "He appeared at last." },
  { tatoeba = "255045_159478", ja = "私は{ついに}課題を終わらせた。", en = "Finally I finished my task." },
]

[[point]]
id = "sude-ni"
pattern = "すでに"
forms = ["既に"]
jlpt = "N3"
meaning = "already (formal)"
formation = ["すでに + Phrase"]
explanation = """
The written, formal word for "already": 着いたときには、すでに電車は\
出ていた, "when I arrived, the train had already left". It's common in \
news, writing and polite speech, where もう would sound casual."""
notes = """
もう has more uses: "soon" (もう来る) and "no longer" (もう行かない). \
すでに means only "already", for something that has happened or is \
true by now."""
related = ["mou"]
examples = [
  { tatoeba = "51900_214607", ja = "{すでに}２０年経った。", en = "Twenty years already passed." },
  { tatoeba = "246611_167887", ja = "私が駅に着いたときは{すでに}電車は出ていた。", en = "The train had already left when I arrived at the station." },
]

[[point]]
id = "futatabi"
pattern = "再び"
forms = ["ふたたび"]
jlpt = "N3"
meaning = "again, once more (formal)"
formation = ["再び + Verb"]
explanation = """
A formal word for "again", common in writing and news: 再び会う, "meet \
again". It often describes going back to an earlier state: 森は再び静か\
になった, "the forest became quiet again"."""
notes = """
また is the everyday word and has more uses ("also", "see you"); \
再び is only "again" and sounds literary in casual talk. 二度と再び + \
negative is an emphatic "never again". It's for a second time; for \
"again and again", use 何度も."""
related = ["mata"]
examples = [
  { tatoeba = "308876_94830", ja = "彼女に{再び}会った。", en = "I saw her again." },
  { tatoeba = "269486_145077", ja = "森の中は{再び}静かになった。", en = "It became quiet again in the forest." },
]

[[point]]
id = "tadachi-ni"
pattern = "直ちに"
forms = ["ただちに"]
jlpt = "N3"
meaning = "immediately, at once (formal)"
formation = ["直ちに + Verb"]
explanation = """
A formal word for "immediately", used in orders, announcements and \
written reports: 直ちに病院へ行ってください, "go to the hospital at \
once". In everyday talk, すぐに says the same."""
notes = """
すぐ also means "close by" (駅のすぐ前) and "easily" (すぐ泣く); \
直ちに is only about time, and stresses no delay at all. Too stiff \
for casual requests between friends."""
related = []
examples = [
  { tatoeba = "301661_102033", ja = "彼は{直ちに}手紙の返事を書いた。", en = "He lost no time answering the letter." },
  { source = "yomeru", ja = "{直ちに}会議を始めます。", en = "We will start the meeting right away." },
]

[[point]]
id = "sorezore"
pattern = "それぞれ"
forms = ["それぞれの", "其々", "夫々"]
jlpt = "N3"
meaning = "each, respectively, each in their own way"
formation = ["それぞれ + Verb / Phrase", "それぞれの + Noun", "Noun + それぞれ   (人それぞれ)"]
explanation = """
Treats the members of a group one by one, each with its own thing: \
それぞれの部屋, "each room"; みんなそれぞれ意見がある, "everyone has \
their own opinion". 人それぞれ is a set phrase: "it differs from person \
to person"."""
notes = """
ずつ is about equal amounts per person (一人一つずつ, "one each"); \
それぞれ stresses that each one is separate or different. Works as a \
noun too: それぞれが, "each of them"."""
related = ["zutsu"]
examples = [
  { tatoeba = "305879_97825", ja = "彼らは{それぞれの}道を行った。", en = "They went their separate ways." },
  { tatoeba = "239167_175299", ja = "犬は{それぞれ}異なった性格をもっている。", en = "Each individual dog has a different character." },
]

[[point]]
id = "daiichi"
pattern = "第一"
forms = ["だいいち", "第一に", "まず第一に"]
jlpt = "N3"
hover = false
meaning = "first of all, to begin with, besides"
formation = ["第一(に)、 + Sentence", "まず第一に、 + Sentence"]
explanation = """
Introduces the first or most important reason or point: まず第一に、\
高すぎる, "first of all, it's too expensive". In conversation, 第一 \
alone adds the clinching reason against something: 行かない。第一、\
お金がない, "I'm not going. Besides, I have no money"."""
notes = """
The conversational 第一 sounds argumentative, like "and anyway". 第一 \
is also an ordinary prefix for "number one, first": 第一印象, "first \
impression"; 第一課, "lesson 1". As a noun it means "the top \
priority": 健康が第一だ, "health comes first"."""
related = []
examples = [
  { tatoeba = "32753_195579", ja = "まず{第一に}、それは高すぎる。", en = "First of all, it is too expensive." },
  { tatoeba = "32756_195582", ja = "まず{第一に}、あなたは正直でなければならない。", en = "To begin with, you must be honest." },
  { source = "yomeru", ja = "行きたくない。{第一}、お金がない。", en = "I don't want to go. Besides, I have no money." },
]

[[point]]
id = "tokoroga"
pattern = "ところが"
forms = []
jlpt = "N3"
hover = false
meaning = "however, but (contrary to expectation)"
formation = ["Sentence。 + ところが、 + Sentence"]
explanation = """
Starts a sentence that reports a surprising turn, against what the \
first sentence led you to expect: 晴れると思った。ところが、雨が降った, \
"I thought it would be sunny. But it rained". Common in stories and \
explanations."""
notes = """
The second part is a fact that happened or is true, never your own \
request, plan or wish: no ところが、行きましょう. In a reply, it \
corrects what the other person assumes: 「暇でしょう？」「ところが、\
忙しいんだ。」. しかし and でも work for \
any contrast; ところが stresses the surprise. Don't confuse it with \
ところ ("place") + が in the middle of a sentence."""
related = ["shikashi", "demo"]
examples = [
  { source = "yomeru", ja = "晴れると思った。{ところが}、雨が降った。", en = "I thought it would be sunny. But it rained." },
  { source = "yomeru", ja = "簡単だと思った。{ところが}、全然できなかった。", en = "I thought it was easy. But I couldn't do it at all." },
]

[[point]]
id = "sate"
pattern = "さて"
forms = ["さてと"]
jlpt = "N3"
meaning = "well, now, so (moving on)"
formation = ["さて、 + Sentence"]
explanation = """
Moves to the next topic or the next step, often in speeches, lessons \
and meetings: さて、次の話題に移ろう, "now, let's move on to the next \
topic". Said to yourself, さてと marks getting started: さてと、\
始めるか, "right, let's get going"."""
notes = """
ところで changes the subject suddenly ("by the way"), often to \
something unrelated; さて moves on in an orderly way, as the next part \
of the same talk."""
related = ["tokorode"]
examples = [
  { tatoeba = "54078_216772", ja = "{さて}、次の話題に移ろう。", en = "But now to our next topic." },
  { tatoeba = "54086_216780", ja = "{さて}、あなたの意見はどうですか。", en = "Now, what is your opinion?" },
]

[[point]]
id = "aruiwa"
pattern = "あるいは"
forms = ["或いは"]
jlpt = "N3"
meaning = "or; possibly, perhaps"
formation = ["Noun + (か) + あるいは + Noun", "Sentence + 、あるいは + Sentence", "あるいは + Phrase + かもしれない   (perhaps)"]
explanation = """
A formal "or" between two options: 電話あるいはメールで, "by phone or \
by email". With かもしれない it means "perhaps": あるいは本当かもしれない, \
"perhaps it's true"."""
notes = """
または is close and also formal. それとも only links questions and is \
the conversational choice there (コーヒー？それとも紅茶？). In everyday \
speech, か is enough: 電話かメール."""
related = ["mata-wa", "soretomo"]
examples = [
  { tatoeba = "17726_234269", ja = "あなたか{あるいは}私が間違っている。", en = "Either you or I am wrong." },
  { tatoeba = "63752_226408", ja = "ガスで調理しますか、{あるいは}電気ですか。", en = "Do you cook by gas or electricity?" },
  { tatoeba = "67318_229955", ja = "{あるいは}それは本当かもしれない。", en = "Perhaps that's true." },
]

[[point]]
id = "mottomo"
pattern = "もっとも"
forms = ["尤も"]
jlpt = "N3"
hover = false
meaning = "though, mind you, admittedly"
formation = ["Sentence。 + もっとも、 + Sentence"]
explanation = """
Adds a reservation to what you just said, limiting it: この店は安い。\
もっとも、いつも混んでいるけど, "This shop is cheap. Mind you, it's \
always crowded". The second sentence often ends in けど or が."""
notes = """
Written in kana it looks like 最も ("most": もっとも高い, "the \
highest"); the comma and its place at the start of a sentence tell them \
apart. もっともだ (尤もだ) is an adjective, "reasonable, natural": \
怒るのはもっともだ, "it's natural that you're angry"."""
related = ["kedo"]
examples = [
  { source = "yomeru", ja = "この店は安い。{もっとも}、いつも混んでいるけど。", en = "This shop is cheap. Mind you, it's always crowded." },
  { source = "yomeru", ja = "明日は休みだ。{もっとも}、宿題はある。", en = "Tomorrow's a day off. Mind you, I have homework." },
]

[[point]]
id = "de-wa-conj"
pattern = "では"
forms = ["それでは", "じゃあ", "それじゃあ", "それじゃ"]
jlpt = "N3"
hover = false
meaning = "well then, in that case, now"
formation = ["では、 + Sentence", "じゃあ、 + Sentence   (casual)"]
explanation = """
Starts a sentence that follows from what was just said or the \
situation: 「もう時間です。」「では、始めましょう。」, "Well then, let's \
start". Also used to close a conversation: じゃあ、また明日, "OK, see \
you tomorrow"."""
notes = """
では and それでは are polite or formal; じゃあ and じゃ are casual. \
Different from the particles で + は in the middle of a sentence \
(東京では, "in Tokyo") and from the では of ではない."""
related = ["sorede"]
examples = [
  { tatoeba = "39363_202152", ja = "{では}、後で会いましょう。", en = "Well, see you later." },
  { tatoeba = "39366_202155", ja = "{では}、急いだほうがいいですね。", en = "We'd better hurry then." },
  { tatoeba = "1389443_215897", ja = "{じゃあ}注文します。", en = "OK, I'll order it." },
]

[[point]]
id = "saa"
pattern = "さあ"
forms = ["さぁ"]
jlpt = "N3"
meaning = "come on, now; well, I don't know"
formation = ["さあ、 + Sentence"]
explanation = """
Urges action, yours or someone else's, often with a volitional or \
command form: さあ、行こう, "come on, let's go". Said slowly, as a reply, \
it means you don't know or aren't sure: 「どこにあるの？」「さあ…」, \
"Hmm, no idea"."""
notes = """
The "I don't know" さあ can sound dismissive to a superior; \
さあ、ちょっとわかりません softens it. さて moves on to the next topic; \
さあ pushes someone to act now."""
related = ["sate"]
examples = [
  { tatoeba = "54229_216921", ja = "{さあ}、入って入って。", en = "Come on in!" },
  { tatoeba = "54242_216935", ja = "{さあ}、仕事にとりかかろう。", en = "Now let's get down to work." },
  { source = "yomeru", ja = "「田中さんはどこ？」「{さあ}、知らない。」", en = "\"Where's Tanaka?\" \"Hmm, I don't know.\"" },
]

[[point]]
id = "sa-particle"
pattern = "さ"
forms = []
jlpt = "N3"
meaning = "(casual ending: sure, you know); hey (filler)"
formation = ["Verb / ［い］Adjective + さ", "［な］Adjective / Noun + さ   (no だ: 大丈夫さ)", "Phrase + さ、   (filler)"]
explanation = """
At the end of a sentence, さ states something lightly, as obvious: \
大丈夫さ, "it'll be fine, sure". In the middle of a sentence it's a \
filler, like "you know": あのさ、明日ひま？, "hey, are you free \
tomorrow?"."""
notes = """
Casual, and more common among men and in eastern Japan. だ drops \
before it: 学生さ, not 学生だ さ. ってさ reports hearsay: 来ないってさ, \
"he says he's not coming". Using the filler a lot sounds childish. A \
different word from the suffix さ of 高さ."""
related = ["yo", "tte"]
homographs = ["sa-noun"]
examples = [
  { tatoeba = "279068_124925", ja = "伝染病だって{さ}。", en = "He, um, said that it was contagious." },
  { source = "yomeru", ja = "大丈夫{さ}。きっとうまくいくよ。", en = "It's fine. I'm sure it'll go well." },
  { source = "yomeru", ja = "あの{さ}、明日ひま？", en = "Hey, are you free tomorrow?" },
]

[[point]]
id = "naa"
pattern = "なあ"
forms = ["なぁ"]
jlpt = "N3"
meaning = "(exclamation, wish, talking to oneself); hey"
formation = ["Sentence (plain) + なあ", "Verb［たい］ / たらいい + なあ   (wish)"]
explanation = """
Expresses a feeling, mostly to yourself: いい天気だなあ, "what nice \
weather!". With たい or たらいい it's a wish: 休みたいなあ, "I wish I \
could rest". It usually follows plain forms: いいなあ."""
notes = """
ね asks the listener to agree; なあ is more inward, a thought said out \
loud. Directed at someone, なあ works like a casual ね, mostly in men's \
speech, and なあ at the start of a sentence is "hey". Don't confuse it \
with the prohibition な (行くな, "don't go")."""
related = ["ne", "tai", "na-prohibition"]
examples = [
  { tatoeba = "66692_229334", ja = "いい天気だ{なあ}。", en = "Isn't it a lovely day!" },
  { tatoeba = "27370_190212", ja = "一杯やりたい{なあ}。", en = "I feel like a drink." },
  { tatoeba = "70850_233481", ja = "あなたのように英語が話せたらいい{なあ}。", en = "I wish I could speak English like you." },
]

[[point]]
id = "kakeru"
pattern = "かける"
forms = ["かけ", "かけの", "かけた"]
jlpt = "N3"
hover = false
meaning = "half-done, start to, be about to"
formation = ["Verb［stem］ + かける   (読みかける)", "Verb［stem］ + かけの + Noun   (読みかけの本)"]
explanation = """
Joined to a verb stem, says an action has started but isn't finished, \
or is just about to happen: 読みかけの本, "a book I'm partway through"; \
ボタンが取れかけている, "the button is coming off". It conjugates like \
the verb かける."""
notes = """
With verbs of change it means "about to, nearly": 死にかけた, "nearly \
died". Not every 〜かける is this: 話しかける, "speak to someone", and \
追いかける, "chase", are words of their own. Search only, since かける \
alone has many other meanings."""
related = ["hajimeru", "owaru", "ru-tokoro"]
examples = [
  { tatoeba = "33424_196249", ja = "ボタンが取れ{かけている}のに気付いた。", en = "I found the button loose." },
  { tatoeba = "323956_79761", ja = "夜が明け{かけて}きた。", en = "Day is breaking." },
  { source = "yomeru", ja = "机の上に読み{かけの}本がある。", en = "There's a half-read book on the desk." },
]

[[point]]
id = "kiru"
pattern = "切る"
forms = ["きる", "切れる", "きれる"]
jlpt = "N3"
hover = false
meaning = "do completely, all the way; can't (do it all)"
formation = ["Verb［stem］ + 切る   (使い切る)", "Verb［stem］ + 切れない   (食べきれない)"]
explanation = """
Joined to a verb stem, says something is done to the very end, with \
nothing left: お金を使い切った, "I spent all the money". The potential \
negative 〜きれない is the most common use: 食べきれない, "too much to \
eat it all"."""
notes = """
終わる just says an action is done; 切る stresses that it's done \
fully, often with effort: 読み終わった "finished reading", 読み切った \
"read it all the way through". It can also mean "totally" for a state: \
疲れ切る, "be worn out". Often in kana. 売り切れ, "sold out", is a word \
of its own."""
related = ["owaru", "te-shimau"]
examples = [
  { tatoeba = "62860_225524", ja = "クリームを使い{切って}しまった。", en = "We have run out of cream." },
  { tatoeba = "324950_78766", ja = "欲張っても食べ{きれない}よ。", en = "Your eyes are bigger than your stomach." },
  { source = "yomeru", ja = "一日でこの本を読み{きった}。", en = "I read this whole book in a day." },
]

[[point]]
id = "komu"
pattern = "込む"
forms = ["こむ"]
jlpt = "N3"
hover = false
meaning = "into, in; thoroughly, deeply"
formation = ["Verb［stem］ + 込む   (飛び込む)"]
explanation = """
Joined to a verb stem, adds the idea of going into something: 飛び込む, \
"jump in"; 乗り込む, "get on board". With verbs of thinking or states, \
it means deeply or for a long time: 考え込む, "be lost in thought"; \
