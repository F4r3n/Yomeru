  { tatoeba = "249207_165298", ja = "私たちは彼の行為を子供{っぽい}と思った。", en = "We regarded his behavior as childish." },
]

[[point]]
id = "darake"
pattern = "だらけ"
forms = []
jlpt = "N3"
meaning = "full of, covered in (something bad)"
formation = ["Noun + だらけ   (間違いだらけ)"]
explanation = """
After a noun, says something is full of it or covered all over: 間違\
いだらけ, "full of mistakes"; ほこりだらけ, "covered in dust". It works \
like a noun: だらけだ, だらけの + noun."""
notes = """
Almost always for unwanted things: dirt, mistakes, debt. For something \
good, use いっぱい: 花がいっぱい, ×花だらけ (unless it's a complaint). \
ばかり says "nothing but"; だらけ adds that it's everywhere and \
unpleasant."""
