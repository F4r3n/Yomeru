  { tatoeba = "308872_94835", ja = "彼女に今電話してみ{たらどう}ですか。", en = "Why not ring her up now?" },
]

[[point]]
id = "nai-to"
pattern = "ないと"
forms = ["ないといけない", "ないとだめ", "ないといけません"]
jlpt = "N4"
meaning = "have to, must (casual); if not, unless"
