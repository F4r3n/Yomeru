  { tatoeba = "328741_74978", ja = "{そんなに}緊張しなくてもいいですよ。", en = "There's no need to be that tense." },
  { source = "yomeru", ja = "「高かった？」「{そんなに}高くなかったよ。」", en = "\"Was it expensive?\" \"Not that expensive.\"" },
]

[[point]]
