  { source = "yomeru", ja = "このゲームは若い人{を中心に}人気がある。", en = "This game is popular, mainly with young people." },
  { source = "yomeru", ja = "会議は新しい計画{を中心に}話し合った。", en = "The meeting focused on the new plan." },
]

[[point]]
id = "wo-tooshite"
pattern = "を通して"
forms = ["をとおして", "を通じて", "をつうじて", "を通した", "を通じた"]
jlpt = "N3"
meaning = "through, by way of; throughout (a period)"
formation = [
  "Noun + を通して / を通じて",
]
