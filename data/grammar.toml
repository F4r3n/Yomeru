  { tatoeba = "49428_212149", ja = "その音楽は、年輩の人たちには理解し{がたい}。", en = "The music is difficult for grownups to understand." },
  { source = "yomeru", ja = "あの人のうそは許し{がたい}。", en = "His lies are hard to forgive." },
]

[[point]]
id = "ppoi"
pattern = "っぽい"
forms = []
jlpt = "N3"
meaning = "-ish, like, tends to"
formation = ["Noun + っぽい   (子供っぽい)", "Verb［stem］ + っぽい   (忘れっぽい)", "［い］Adjective［い̶］ + っぽい   (安っぽい)"]
explanation = """
Makes an い-adjective. After a noun or adjective, says something seems \
like it or has a lot of it: 子供っぽい, "childish"; 黒っぽい, "darkish"; \
熱っぽい, "feverish". After a verb stem, says someone tends to do it: \
忘れっぽい, "forgetful"; 怒りっぽい, "short-tempered"."""
notes = """
Casual. らしい says something is a true example of its kind \
(男らしい, "manly"); っぽい says it only looks like it, often as a \
criticism: 子供っぽい is "childish" for an adult. In speech it can also \
mean "seems": 雨っぽい, "looks like rain", close to みたい."""
related = ["rashii", "mitai", "gachi"]
