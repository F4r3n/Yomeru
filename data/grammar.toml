  { tatoeba = "303341_100348", ja = "彼は父親の言うことを{ちっとも}聞かない。", en = "He never takes any notice of what his father says." },
]

[[point]]
id = "dekiru-dake"
pattern = "できるだけ"
forms = ["出来るだけ"]
jlpt = "N4"
meaning = "as much as possible, as … as one can"
