  { tatoeba = "39592_202381", ja = "テーブルはほこり{だらけ}だった。", en = "The table was covered with dust." },
]

[[point]]
id = "mi-suffix"
pattern = "み"
forms = []
jlpt = "N3"
meaning = "(turns an adjective into a noun: a sense of, -ness)"
formation = ["［い］Adjective［い̶］ + み   (楽しみ, 重み)", "［な］Adjective + み   (新鮮み)"]
explanation = """
Replaces the い of some adjectives to make a noun for a feeling or a \
quality you sense: 楽しみ, "something to look forward to"; 痛み, \
"pain"; 甘み, "sweetness (as a taste)"; 重み, "weight, importance"."""
notes = """
さ is a measurable degree and works with almost any adjective: 重さ, \
"weight in kilos". み is the quality as felt, and only some adjectives \
take it: 重み, "a sense of weight, importance"; ×大きみ. Many み nouns \
are words of their own: 楽しみにする, "look forward to"."""
related = ["sa-noun"]
examples = [
  { tatoeba = "253411_161107", ja = "私はクリスマスを楽し{み}に待っています。", en = "I am looking forward to Christmas." },
  { tatoeba = "282466_121539", ja = "背中に痛{み}を感じる。", en = "I feel a pain in the back." },
  { tatoeba = "274737_138498", ja = "他人の弱{み}に付け込むな。", en = "Don't take advantage of others' weakness." },
]

[[point]]
id = "teki"
pattern = "的"
forms = ["的な", "的に"]
jlpt = "N3"
meaning = "-ic, -al, -ly (turns a noun into an adjective)"
formation = ["Noun + 的   (経済的, 科学的)", "Noun + 的な + Noun", "Noun + 的に + Verb"]
explanation = """
Added to a noun, mostly a two-kanji one, it makes a な-adjective: 科学\
的な考え, "a scientific way of thinking"; 個人的な問題, "a personal \
matter". With に it works as an adverb: 具体的に話す, "speak in \
concrete terms"."""
notes = """
It attaches mostly to Chinese-style nouns (経済, 一般, 国際): ×水的. \
In casual speech it also follows a name or pronoun to soften an \
opinion: 私的には, "as for me". Read alone, 的 (まと) is "a target"."""
related = ["ppoi", "rashii-typical"]
examples = [
  { tatoeba = "68485_231119", ja = "あの学者は、科学{的な}大発見をした。", en = "That scholar made a great scientific discovery." },
  { tatoeba = "250830_163681", ja = "私の個人{的な}問題に干渉しないで下さい。", en = "Don't stick your nose into my personal affairs." },
  { tatoeba = "18363_179505", ja = "具体{的に}話して欲しい。", en = "I want specific information." },
]

[[point]]
