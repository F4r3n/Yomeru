  { source = "yomeru", ja = "{できるだけ}毎日歩くようにしています。", en = "I try to walk every day as much as I can." },
]

[[point]]
id = "narubeku"
pattern = "なるべく"
forms = []
jlpt = "N4"
meaning = "as much as possible, if possible, where you can"
formation = ["なるべく + Verb / ［い］Adjective［く］", "なるべく + Verb［ない］ + ように"]
