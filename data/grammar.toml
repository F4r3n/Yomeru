notes = """
It can also mean putting something in: 詰め込む, "cram in"; 書き込む, \
"write in". 〜入れる is close but neutral; 込む adds pushing in, or \
staying in: 座り込む, "sit down and stay put". On its own, 込む (also 混む) means "be crowded": 電車が込んで\
いる."""
related = ["dasu", "kiru"]
examples = [
  { tatoeba = "248837_165668", ja = "私たちは車に乗り{込んだ}。", en = "We got into a car." },
  { tatoeba = "31761_194588", ja = "メアリーは台所へ飛び{込んで}きた。", en = "Mary burst into the kitchen." },
  { tatoeba = "303964_99733", ja = "私は眠り{込んだ}。", en = "I fell asleep." },
]

[[point]]
id = "au"
pattern = "合う"
forms = ["あう"]
jlpt = "N3"
hover = false
meaning = "each other, together"
formation = ["Verb［stem］ + 合う   (助け合う)"]
explanation = """
Joined to a verb stem, says two or more people do the action to each \
other or together: 助け合う, "help each other"; 話し合う, "talk it \
over". The people come with と or are the subject: 友達と分け合う, \
