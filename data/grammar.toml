]

[[point]]
id = "de-aru"
pattern = "である"
forms = ["であります", "であった", "であろう", "でもある"]
jlpt = "N3"
meaning = "is, am, are (formal written だ)"
formation = ["Noun / ［な］Adjective + である   (学生である, 大切である)"]
explanation = """
The written-style copula, used in essays, newspapers, reports and \
speeches instead of だ: 東京は日本の首都である. Unlike だ, it can stand \
before a noun: 健康である人, "a person who is healthy". The past is \
であった, the guess であろう, the negative ではない."""
notes = """
Keep one style in a text: である or です, not both. でもある is "is also": \
医者でもある. Don't confuse with で + ある: パーティーはどこであるの？ \
asks "where is the party held?", with で as the place. であります is old-\
fashioned speech-making."""
related = ["da", "desu"]
hover = false
examples = [
  { tatoeba = "269047_145516", ja = "慎重に運転することが大切{である}。", en = "It is important to drive carefully." },
  { tatoeba = "282896_121111", ja = "彼がアメリカにいることは本当{である}。", en = "It's true that he is in America." },
  { source = "yomeru", ja = "彼は医者であり、作家{でもある}。", en = "He is a doctor and also a writer." },
]

[[point]]
id = "ikura-demo"
pattern = "いくらでも"
forms = []
jlpt = "N3"
meaning = "as much as you like, any amount, plenty"
formation = ["いくらでも + Verb   (いくらでも食べていい)"]
explanation = """
Says there is no limit to the amount: いくらでもある, "there's plenty". \
With permission or an order, it means "as much as you want": いくらで\
も食べていいよ, "eat as much as you like"."""
notes = """
Not the same as いくら〜ても, "no matter how much", where the verb \
comes between いくら and ても. Its family: いつでも (any time), どこでも \
(anywhere), 何でも (anything)."""
related = ["ikura-temo"]
examples = [
  { tatoeba = "503835_145761", ja = "食料はまだ{いくらでも}ある。", en = "We still have a lot of food left." },
  { tatoeba = "240687_173783", ja = "好きな花を{いくらでも}選びなさい。", en = "Choose any flowers you like." },
  { source = "yomeru", ja = "ご飯は{いくらでも}食べていいよ。", en = "You can eat as much rice as you like." },
]

[[point]]
id = "kara-iu-to"
pattern = "から言うと"
forms = ["からいうと", "から言えば", "からいえば", "から言って", "からいって", "から言ったら", "からいったら", "で言うと", "でいうと"]
jlpt = "N3"
meaning = "from the point of view of, judging by; in terms of"
formation = [
  "Noun + から言うと / から言えば / から言って",
  "Noun + で言うと   (日本で言うと)",
]
explanation = """
Names the yardstick a judgement is made by: 値段から言うと、こっちの\
ほうがいい, "price-wise, this one is better". The noun is a standpoint, \
a criterion or a source of experience (経験から言って). で言うと puts \
