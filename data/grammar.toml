  "する → させる, 来る → 来させる",
]
explanation = """
Someone makes or lets another person do something: 子供に野菜を食べさせ\
る, "make the kids eat vegetables". Context decides which: a boss who \
残業させる makes you work late, parents who 遊ばせる let the kids \
play."""
notes = """
The one doing the action takes に when the verb has an object (子供に本\
を読ませる). With verbs that take none, を leans toward "make" (弟を泣か\
せた) and に toward "let". To ask to do something yourself: 〜させてくだ\
さい; with てあげる / てくれる it clearly means "let": 行かせてあげる. It \
goes from above to below: you don't 〜させる a superior."""
related = ["causative-passive", "sasete-kudasai", "passive"]
hover = false
examples = [
  { tatoeba = "306665_97039", ja = "彼らは私たちを一晩中働か{せた}。", en = "They made us work all night." },
  { tatoeba = "293415_110273", ja = "彼はわざと私を待た{せた}。", en = "He kept me waiting on purpose." },
  { tatoeba = "245622_168867", ja = "子どもに酒を飲ま{せて}はいけない。", en = "You should not give liquor to children." },
]

[[point]]
id = "causative-passive"
pattern = "させられる"
forms = ["せられる"]
jlpt = "N4"
meaning = "be made to do (against your will)"
formation = [
  "う-Verb: last kana to the あ row + せられる / される   (行かせられる, 行かされる)",
  "る-Verb: る → させられる   (食べる → 食べさせられる)",
  "する → させられる, 来る → 来させられる",
]
explanation = """
Causative plus passive: someone made you do something, usually something \
you didn't want to: 子供のころ、野菜を食べさせられた, "as a kid I was made \
to eat vegetables". The one who made you takes に."""
notes = """
う-verbs usually take the short form: 待たされる, 飲まされる. Verbs ending \
in す keep the long one (話させられる, not ×話さされる), and る-verbs have \
no short form. It often carries a complaint: 一時間も待たされた, "they \
kept me waiting a whole hour"."""
related = ["causative", "passive"]
