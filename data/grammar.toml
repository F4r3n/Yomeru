  { tatoeba = "280749_123250", ja = "奈良は京都と同じ{くらい}古い。", en = "Nara is as old as Kyoto." },
]

[[point]]
id = "to-dochira"
pattern = "とどちらが"
forms = ["どちらが", "とどっちが"]
jlpt = "N4"
meaning = "which (of the two) is more …?"
formation = [
  "Noun A + と + Noun B + と + どちらが + Adjective + か",
  "Noun A + と + Noun B + では + どちらが …",
]
explanation = """
Asks which of two things has more of a quality: 犬と猫とどちらが好き\
ですか, "which do you like better, dogs or cats?". The answer uses \
のほうが: 猫のほうが好きです. どちら works for any two things, people \
included."""
notes = """
Casual speech says どっち. For three or more, use 何, どれ or 誰 + が一番 \
instead. To say "both equally", answer どちらも好きです or 同じくらい."""
related = ["yori-hou-ga", "ga-ichiban"]
