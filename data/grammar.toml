  { source = "yomeru", ja = "この店は高い。{だが}、とてもおいしい。", en = "This restaurant is expensive. But it's very good." },
  { source = "yomeru", ja = "兄は医者{だが}、病院が嫌いだ。", en = "My brother is a doctor, but he hates hospitals." },
]

[[point]]
id = "sonnani"
pattern = "そんなに"
forms = ["こんなに", "あんなに", "どんなに"]
jlpt = "N4"
meaning = "so much, that much; (with a negative) not that"
formation = ["そんなに + Verb / Adjective", "そんなに + ［い］Adjective［く］ + ない"]
explanation = """
Points at a degree, like the other こそあど words: こんなに is "this much" \
(here, near me), そんなに "that much" (what you said or did), あんなに \
"that much" (something both know of). Very often with a negative: \
そんなに高くない, "not that expensive". どんなに asks "how much", or \
with ても means "no matter how"."""
notes = """
そんなに〜ない is a softer "not very", close to あまり〜ない. In requests \
it warns: そんなに急がないで, "don't rush like that". For "such a" before \
a noun, use そんな / こんな: そんな人, not そんなに人."""
related = ["ko-so-a-do", "amari-nai"]
examples = [
