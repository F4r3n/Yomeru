  { source = "yomeru", ja = "この店のランチは一人{当たり}千円ぐらいだ。", en = "Lunch at this shop is about 1,000 yen per person." },
]

[[point]]
id = "buri"
pattern = "ぶり"
forms = ["振り", "ぶりに", "ぶりの"]
jlpt = "N3"
hover = false
meaning = "for the first time in (a time); the way of (doing)"
formation = ["Time + ぶり   (五年ぶり)", "Verb［stem］ / Noun + ぶり   (話しぶり, 仕事ぶり)"]
explanation = """
After a length of time, says something happens again after that long \
a gap: 五年ぶりに会った, "met for the first time in five years"; 二十\
年ぶりの寒さ, "the coldest in twenty years". After a verb stem or a \
noun, it means the way someone does it: 話しぶり, "way of talking"."""
notes = """
The gap is long, or feels long to the speaker: 三日ぶりのお風呂 after \
being ill. 久しぶり, "it's been a while", is the everyday word built \
on it. In the manner use, 仕事ぶり often praises or criticizes, and \
some verbs take っぷり: 飲みっぷり. Alone, 振り (ふり) is "pretending"."""
related = ["furi-wo-suru"]
examples = [
  { tatoeba = "72491_235113", ja = "５年{ぶりに}吉田君に会った。", en = "I saw Yoshida for the first time in five years." },
  { tatoeba = "57669_220349", ja = "この冬は２０年{ぶりの}寒さだった。", en = "This was the coldest winter in twenty years." },
  { tatoeba = "19844_182717", ja = "久し{ぶりに}彼は帰ってきた。", en = "After a long absence he came back." },
]

[[point]]
id = "oki-ni"
pattern = "おきに"
forms = ["置きに", "おきの"]
jlpt = "N3"
meaning = "every (other), at intervals of"
formation = ["Number + Counter + おきに   (一日おきに, 五分おきに)"]
explanation = """
After an amount with its counter, says something repeats with that \
gap between: 一日おきに, "every other day"; 十分おきに, "every ten \
minutes". It works for space too: 一メートルおきに, "every metre"; 一\
行おきに書く, "write on every other line"."""
notes = """
With days, years and counted things, the number is what's skipped: 一\
日おき is every second day, unlike 毎日. With hours and minutes, ３時間\
おき is usually just "every three hours", like ３時間ごと. To be exact \
with days, use ごとに: 二日ごとに, "every two days"."""
related = ["goto-ni"]
examples = [
  { tatoeba = "310109_93598", ja = "彼女は１日{おきに}訪ねてくる。", en = "She visits us every other day." },
  { tatoeba = "326483_77236", ja = "六時間{おきに}体温を測った。", en = "I took my temperature every six hours." },
  { tatoeba = "27794_190635", ja = "一行{おきに}書け。", en = "Write on every other line." },
]

[[point]]
id = "kiri"
pattern = "きり"
forms = ["っきり", "きりで", "たきり", "たっきり"]
jlpt = "N3"
hover = false
meaning = "only, just; (did) and since then never"
formation = ["Noun + きり   (二人きり)", "Verb［た］ + きり + Negative   (出たきり帰らない)"]
explanation = """
After a noun or a number, it means "only, no more than": 二人きりで話\
す, "talk with just the two of us"; 一度きり, "only once". After a past \
verb, says the action was the last thing that happened: 出かけたきり帰\
らない, "went out and hasn't come back since"."""
notes = """
Speech often doubles it: っきり (二人っきり, それっきり). Close to だけ, \
but きり stresses that nothing follows or nobody else is there. After \
た, the sentence ends in a negative or a "since then" meaning; 寝たき\
り, "bedridden", is a word of its own, as is はっきり, "clearly"."""
related = ["dake", "mama"]
examples = [
  { tatoeba = "293705_109983", ja = "彼は一人{きりで}朝食を摂った。", en = "He had breakfast all alone." },
  { tatoeba = "288553_115118", ja = "彼は３年前に家を出た{きり}全然消息がない。", en = "He went away from home three years ago, and has never been heard of since." },
  { source = "yomeru", ja = "今日は家に一人{っきり}だ。", en = "I'm home all alone today." },
]

[[point]]
id = "dake-shika"
pattern = "だけしか"
forms = []
jlpt = "N3"
meaning = "only, nothing but (emphatic)"
formation = ["Noun + だけしか + Verb［ない］", "Verb［る］ + だけしか + Verb［ない］"]
explanation = """
Puts だけ and しか together for a stronger "only": これだけしか知らない, \
"this is all I know". Like しか, it needs a negative verb after it."""
notes = """
The meaning is the same as しか〜ない, with more weight on how little \
it is. Plain だけ takes a positive verb: これだけ知っている. \
×だけしか知っている."""
related = ["shika-nai", "dake"]
examples = [
  { tatoeba = "33526_160740", ja = "私はこれ{だけしか}知りません。", en = "I know nothing but this." },
  { tatoeba = "252597_161919", ja = "私は５千円{だけしか}持っていません。", en = "I have only five thousand yen." },
  { tatoeba = "40844_203606", ja = "ただ霧{だけしか}見えなかった。", en = "I could see nothing but fog." },
]

[[point]]
id = "dake-de-wa"
pattern = "だけでは"
forms = ["だけじゃ"]
jlpt = "N3"
meaning = "just (X) is not enough, by (X) alone … not"
formation = ["Noun + だけでは + Negative", "Verb［る］ + だけでは + Negative   (思っているだけでは)"]
explanation = """
Says that one thing alone won't do, so more is needed: 愛だけでは生き\
られない, "you can't live on love alone"; 見ているだけではわからない, \
"just watching won't teach you". The sentence ends in a negative or a \
word like だめ."""
notes = """
だけで says one thing is enough; だけでは says it isn't. Don't mix it \
up with だけではなく, "not only … but also", where なく continues the \
sentence: 英語だけではなく、中国語も話せる. だけじゃ is the spoken form."""
related = ["dake-de", "dake-de-naku"]
examples = [
  { tatoeba = "28693_191530", ja = "愛情{だけでは}生きてはいけない。", en = "You cannot live by love alone." },
  { source = "yomeru", ja = "見ている{だけでは}上手にならないよ。", en = "Just watching won't make you any better." },
  { source = "yomeru", ja = "薬を飲む{だけじゃ}治らないよ。", en = "Just taking medicine won't cure it." },
]

[[point]]
id = "ten"
pattern = "点"
forms = ["点で", "点では", "という点で", "の点で"]
jlpt = "N3"
meaning = "point, respect, in terms of"
formation = ["Noun + の + 点で", "Verb / ［い］Adjective + 点で   (安い点で)", "Phrase + という点で"]
explanation = """
Names the aspect a judgement is about: この点で, "on this point"; 値段\
の点では, "in terms of price"; 多くの点で違う, "differ in many ways". \
With という, a whole phrase becomes the point: 安いという点で, "in \
that it's cheap"."""
notes = """
点では often sets up a contrast: 値段の点ではいいが、色が…, "price-wise \
it's fine, but the color…". 面 (めん) is close: 経済面で, "on the \
economic side". On its own 点 is also "a score" or "a dot"."""
related = ["ni-kanshite", "to-shite"]
examples = [
  { tatoeba = "44850_207597", ja = "その{点では}君に賛成できない。", en = "I can't agree with you here." },
  { tatoeba = "281765_122238", ja = "日本人は多くの{点で}アメリカ人と違う。", en = "Japanese differ from Americans in many respects." },
  { tatoeba = "310330_93378", ja = "彼女はあらゆる{点で}君に追いついた。", en = "She has caught up with you in every respect." },
]

[[point]]
id = "nashi"
pattern = "なし"
forms = ["無し", "なしで", "なしに", "なしの", "なしでは"]
jlpt = "N3"
hover = false
meaning = "without, no (X)"
formation = ["Noun + なしで / なしに + Verb   (砂糖なしで)", "Noun + なしの + Noun", "Noun + なし   (in lists, signs)"]
explanation = """
After a noun, means "without it": 砂糖なしで飲む, "drink it without \
sugar"; 予告なしに, "without notice". なしでは + a negative says you \
can't manage without it: 水なしでは生きられない."""
notes = """
なしで is the everyday form; なしに is a bit more formal and also \
follows a noun for an action: 断りなしに, "without asking". For \
"without doing", use ないで or ずに after a verb. 抜き is a deliberate \
"leave out": わさび抜き. なしにする is "skip, call off"; on forms, \
なし alone means "none": 変更なし."""
related = ["ari", "naide", "zu-ni"]
examples = [
  { tatoeba = "270060_144505", ja = "人は空気{なしでは}生きられない。", en = "Men can not exist without air." },
  { tatoeba = "245324_169163", ja = "仕事{なしで}どうやって生活していくのか。", en = "How will you manage without a job?" },
  { tatoeba = "325331_78385", ja = "利用条件を予告{なしに}変更することがあります。", en = "Terms of use may be changed without notice." },
]

[[point]]
id = "ari"
pattern = "あり"
forms = ["有り"]
jlpt = "N3"
hover = false
meaning = "there is, with, available (written, list style)"
formation = ["Noun + あり   (駐車場あり)"]
explanation = """
The old form of ある, still used to say something exists or is \
included in short written notes: 駐車場あり, "parking available"; 経験\
あり, "has experience". It is also heard in proverbs: 壁に耳あり, \
"walls have ears"."""
notes = """
Its opposite is なし: 駐車場なし, "no parking". In casual speech, \
それもありだね means "that works too, that's acceptable"."""
related = ["nashi"]
examples = [
  { tatoeba = "18397_179538", ja = "苦あれば楽{あり}。", en = "No sweet without sweat." },
  { source = "yomeru", ja = "駐車場{あり}。", en = "Parking available." },
  { source = "yomeru", ja = "それも{あり}だね。", en = "That works too." },
]

[[point]]
id = "sugata"
pattern = "姿"
forms = ["の姿"]
jlpt = "N3"
meaning = "figure, sight of (someone); dressed in"
formation = ["Noun + の + 姿   (彼の姿)", "Verb + 姿   (働く姿)", "Noun + 姿   (着物姿)"]
explanation = """
The visible shape of a person, as you see them: 姿を見る, "catch \
sight of"; 姿を消す, "disappear"; 父の働く姿, "my father at work". After clothing it means \
dressed that way: 着物姿, "in a kimono"."""
notes = """
誰の姿も見えない is "not a soul in sight". 姿 is how someone looks \
from outside as a whole; 顔 is only the face, and 様子 is how things \
seem."""
related = ["you-da"]
examples = [
  { tatoeba = "250983_163529", ja = "私の{姿}を見ると彼は逃げた。", en = "When he saw me, he ran away." },
  { tatoeba = "21766_184638", ja = "街路には誰の{姿}も見られなかった。", en = "No one was to be seen in the street." },
  { tatoeba = "311829_91883", ja = "彼女はトラの{姿}を見て気絶した。", en = "She fainted at the sight of a tiger." },
]

[[point]]
id = "toori"
pattern = "とおり"
forms = ["通り", "どおり", "とおりに", "どおりに", "通りに", "の通り", "た通り"]
jlpt = "N3"
hover = false
meaning = "as, just as, in the way that"
formation = ["Verb［る］ / Verb［た］ + とおり   (言ったとおり)", "Noun + の + とおり   (この通り)", "Noun + どおり   (予定どおり)"]
explanation = """
Says something happens or is done the same way as something else: 言っ\
たとおりにする, "do as I said"; 予定どおり, "as planned"; 時間どおりに\
着く, "arrive on time"."""
notes = """
After a verb or の it's とおり; joined straight to a noun it becomes \
どおり: 説明のとおり = 説明どおり. ように after a verb is close but \
looser: 言ったように. その通り is "exactly". With numbers it counts \
ways: 三通り, "three ways". 通り alone is also "a street"."""
related = ["you-ni-iu", "mama"]
examples = [
  { tatoeba = "241105_173365", ja = "言った{通りに}しろ。", en = "Do as I told you." },
  { tatoeba = "257288_157245", ja = "私は言われた{とおりに}しただけです。", en = "I only did as I was told." },
  { tatoeba = "314475_89230", ja = "彼女は私達の期待{通りに}成長した。", en = "She lived up to our expectations." },
]

[[point]]
id = "kankei-ga-aru"
pattern = "関係がある"
forms = ["と関係がある", "に関係がある", "関係がない", "関係ない"]
jlpt = "N3"
meaning = "to be related to, to have to do with"
formation = ["Noun + と / に + 関係がある"]
explanation = """
Says two things are connected: 健康と関係がある, "has to do with \
health". The negative is common for "it's none of your business": 君\
には関係ない, "this has nothing to do with you"."""
notes = """
と is used for a link between two things on the same level; に points \
at what is affected: 生活に関係がある. 関係ない in speech often drops \
が. For "about, on the subject of", use に関して."""
related = ["ni-kanshite"]
examples = [
  { tatoeba = "55753_218445", ja = "これは君には{関係がない}。", en = "This has nothing to do with you." },
  { tatoeba = "42246_205005", ja = "それは大気汚染と{関係がある}。", en = "It is concerned with air pollution." },
  { tatoeba = "254615_159907", ja = "私はその犯罪とは{関係がない}。", en = "I have nothing to do with that crime." },
]

[[point]]
id = "sayuu-suru"
pattern = "左右する"
forms = ["に左右される"]
jlpt = "N3"
meaning = "to influence, to decide; to depend on (passive)"
formation = ["Noun + を + 左右する", "Noun + に + 左右される"]
explanation = """
Says something has a strong effect on how another thing turns out: 健\
康を左右する, "affects your health". The passive 〜に左右される says \
something depends on it: 天気に左右される, "depends on the weather"."""
notes = """
Formal, common in news and writing, and stronger than 影響する: it \
decides the result, not just touches it. Read as a noun, 左右 is just \
"left and right": 左右を見る, "look both ways"."""
related = ["ni-yotte"]
examples = [
  { tatoeba = "268669_145893", ja = "食べ物は健康を{左右する}。", en = "Food works on our health." },
  { tatoeba = "275724_137512", ja = "大衆の意見が大統領の決定を{左右する}。", en = "Public opinion governs the president's decisions." },
  { tatoeba = "34853_197667", ja = "ビールの消費量は天気におおいに{左右される}。", en = "How much beer people drink largely depends on the weather." },
]

[[point]]
id = "you-to-suru"
pattern = "ようとする"
forms = ["おうとする", "ようとした", "おうとした", "ようとしたが", "おうとしたが", "ようとしたけど"]
jlpt = "N3"
meaning = "to try to, to attempt; to be about to"
formation = ["Verb［volitional］ + とする   (開けようとする, 書こうとする)"]
explanation = """
Describes an effort at one moment, often one that fails: 窓を開けよう\
としたが、開かなかった, "I tried to open the window, but it wouldn't \
open". With a moment word like とき, it means "just about to": 寝よう\
としたとき, "just as I was going to sleep"."""
notes = """
〜てみる is trying something out to see how it goes; 〜ようとする is \
trying to make it happen, with the result uncertain. With things that \
have no will it means "about to": 電車が出ようとしている. For a \
lasting effort over time, use 〜ようにする. The negative 〜ようとしない \
is "refuses to"."""
related = ["volitional", "te-miru", "you-ni-suru", "you-to-shinai", "you-to-omou"]
examples = [
  { tatoeba = "291174_112503", ja = "彼はその鳥を捕まえ{ようとしたが}、出来なかった。", en = "He tried to catch the bird, but couldn't." },
  { tatoeba = "309216_94490", ja = "彼女の決心をかえ{ようとしたが}無理だった。", en = "I tried to change her mind, but I couldn't." },
  { source = "yomeru", ja = "家を出{ようとした}とき、電話が鳴った。", en = "Just as I was about to leave home, the phone rang." },
]

[[point]]
id = "you-to-shinai"
pattern = "ようとしない"
forms = ["おうとしない", "ようともしない", "おうともしない"]
jlpt = "N3"
meaning = "won't, refuses to, makes no effort to"
formation = ["Verb［volitional］ + としない   (聞こうとしない)"]
explanation = """
Says someone has no will to do something, even though they could or \
should: 彼は謝ろうとしない, "he won't apologize". Adding も, 〜ようとも\
しない, makes it stronger: "doesn't even try"."""
notes = """
Used about other people (or animals), since it judges their will from \
the outside; for yourself, say 〜たくない or 〜つもりはない. Often comes \
with どうしても or 全然 for emphasis. Plain 〜ない only states a fact; \
〜ようとしない adds the speaker's frustration."""
related = ["you-to-suru", "volitional"]
examples = [
  { tatoeba = "22022_184891", ja = "外に出{ようとしない}。", en = "He would not go out." },
  { tatoeba = "45413_208156", ja = "その男の子はどうしても私に名前を言{おうとしない}。", en = "That boy won't tell me his name." },
  { source = "yomeru", ja = "弟は野菜を食べ{ようとしない}。", en = "My little brother won't eat vegetables." },
]

[[point]]
id = "te-goran"
pattern = "てごらん"
forms = ["でごらん", "てご覧", "でご覧", "てごらんなさい", "でごらんなさい"]
jlpt = "N3"
meaning = "try (doing), have a go at (gentle, to juniors)"
formation = ["Verb［て］ + ごらん"]
explanation = """
A soft way to tell someone to try something or take a look: 食べてご\
らん, "go on, try it". It is what a parent says to a child or a teacher \
to a student; ごらんなさい is a bit more formal and more of an order."""
notes = """
ごらん comes from ご覧になる, the respectful "see", but here it is only \
used downward: never to a boss or a customer. To them, say 〜てみてくだ\
さい. Plain 〜てみて is the neutral version among equals."""
related = ["te-miru", "nasai"]
examples = [
  { tatoeba = "26377_189230", ja = "それを英語で言っ{てごらん}。", en = "Say it in English." },
  { tatoeba = "243983_170500", ja = "最初からもう一度やっ{てごらん}。", en = "Try it again from the first." },
  { tatoeba = "67803_230436", ja = "あの木のてっぺんを見{てごらん}。", en = "Look at the top of that tree." },
]

[[point]]
id = "sou-mo-nai"
pattern = "そうもない"
forms = ["そうにもない", "そうもありません"]
jlpt = "N3"
meaning = "not likely to, there's no sign that"
formation = ["Verb［stem］ + そうもない   (終わりそうもない)"]
explanation = """
The negative guess of 〜そうだ (looks like) for verbs: 雨はやみそうも\
ない, "the rain shows no sign of stopping". The speaker judges from how \
things look now that it probably won't happen."""
notes = """
〜そうにない means the same; も adds a little emphasis, like "not at \
all likely". With a potential verb it is "I don't think I can": 間に合\
いそうもない. For adjectives, the negative guess is なさそう (おいしく\
なさそう), not そうもない."""
related = ["sou-da-appearance", "sou-ni-naru"]
examples = [
  { tatoeba = "242908_171568", ja = "今日は晴れ{そうもない}よ。", en = "The weather doesn't look like clearing up today." },
  { tatoeba = "306436_97266", ja = "彼らは結婚し{そうもない}。", en = "They are unlikely to marry." },
  { tatoeba = "41287_204045", ja = "そんな不思議な事は起こり{そうもない}。", en = "Such a strange thing is not likely to happen." },
]

[[point]]
id = "sou-ni-naru"
pattern = "そうになる"
forms = ["そうになった", "そうになります"]
jlpt = "N3"
meaning = "almost, nearly (happened)"
formation = ["Verb［stem］ + そうになる   (落ちそうになる)"]
explanation = """
Says something came close to happening but didn't, usually in the past \
form: 転びそうになった, "I almost fell". Often used for things you \
don't control, like crying, laughing or an accident."""
notes = """
もう少しで or 危うく often comes before it for emphasis. Don't read \
かわいそうになった as this pattern: that is かわいそう ("pitiful") + \
になる. The verb form is the stem, as with 〜そうだ (looks like), not \
the dictionary form."""
related = ["sou-da-appearance", "sou-mo-nai"]
examples = [
  { tatoeba = "20721_183599", ja = "危うく車にひかれ{そうになった}。", en = "I was almost run over by a car." },
  { tatoeba = "311130_92580", ja = "彼女はそのニュースを聞いて、泣き{そうになった}。", en = "She felt like crying at the news." },
  { source = "yomeru", ja = "授業中に寝{そうになった}。", en = "I almost fell asleep in class." },
]

[[point]]
id = "furi-wo-suru"
pattern = "ふりをする"
forms = ["振りをする", "ふりをして", "ふりする"]
jlpt = "N3"
meaning = "to pretend, to act as if"
formation = [
  "Verb (plain) + ふりをする   (知らないふりをする, 寝たふりをする)",
  "［い］Adjective + ふりをする",
  "［な］Adjective + な + ふりをする",
  "Noun + の + ふりをする   (医者のふりをする)",
]
explanation = """
Says someone acts as though something were true when it isn't: 聞こえ\
ないふりをした, "he pretended not to hear". The past form before ふり \
pretends to a finished state: 寝たふり, "pretending to be asleep"."""
notes = """
Speech often drops を: 知らないふりする. ふり is the outward act; for \
"as if" in a description of how something looks, use 〜ように or まるで\
〜みたい. Don't confuse it with 振る, "to wave, to dump someone"."""
related = ["you-da", "marude"]
examples = [
  { tatoeba = "303507_100190", ja = "彼は聞いてない{ふりをした}。", en = "He pretended not to be listening." },
  { tatoeba = "298154_105535", ja = "彼は私を知らない{ふりをした}。", en = "He made believe not to know me." },
  { source = "yomeru", ja = "弟は寝た{ふりをして}いる。", en = "My little brother is pretending to be asleep." },
]

[[point]]
id = "zu-ni"
pattern = "ずに"
forms = ["せずに", "ず"]
jlpt = "N3"
meaning = "without doing (written ないで)"
formation = ["Verb［な̶い̶］ + ずに   (食べずに, 言わずに)", "する → せずに, 来る → 来ずに"]
explanation = """
The same as 〜ないで in the "without doing" sense, but a little more \
formal and common in writing: 何も言わずに帰った, "he went home \
without saying anything". 忘れずに, "without forgetting", is an \
everyday reminder: 忘れずに来てね."""
notes = """
Watch する: it becomes せずに, never しずに. Unlike ないで, ずに can't \
end a sentence as a request (行かないで, not 行かずに). Bare ず, in \
writing, joins two clauses like なくて: 雨が降らず、困った. It is the \
base of ずにいる, ずにすむ and ずにはいられない."""
related = ["naide", "zu-ni-iru", "zu-ni-sumu", "zu-ni-wa-irarenai"]
hover = false
examples = [
  { tatoeba = "289477_114195", ja = "彼はお金を払わ{ずに}レストランを出ました。", en = "He left the restaurant without paying." },
  { tatoeba = "321152_82564", ja = "忘れ{ずに}電話してね。", en = "Don't forget to call me." },
  { tatoeba = "266773_147786", ja = "出かける前に忘れ{ずに}ガスを閉めなさい。", en = "Don't forget to turn off the gas before going out." },
]

[[point]]
id = "zu-ni-iru"
pattern = "ずにいる"
forms = ["ないでいる", "ずにおく", "ないでおく"]
jlpt = "N3"
meaning = "to stay without doing, keep not doing; leave undone"
formation = [
  "Verb［な̶い̶］ + ずにいる / ずにおく",
  "Verb［ない］ + でいる / でおく",
]
explanation = """
〜ずにいる / 〜ないでいる is a state of not doing something over a \
while: 何も食べないでいる, "going without food". 〜ずにおく / 〜ないで\
おく is choosing to leave something undone on purpose, like 〜ておく \
in the negative: 鍵をかけないでおいた, "I left it unlocked"."""
notes = """
いる is just being in that state; おく is a deliberate choice, often for \
later: 言わないでおこう, "I'll keep it to myself". The potential form, \
ずにいられない, means "can't help", and belongs with \
ずにはいられない."""
related = ["zu-ni", "naide", "te-oku", "zu-ni-wa-irarenai"]
examples = [
  { tatoeba = "294370_109320", ja = "彼は何日も何も食べ{ないでいる}ことがよくある。", en = "He often goes without food for days." },
  { tatoeba = "291897_111781", ja = "彼はドアに鍵をかけ{ないでおいた}。", en = "He left the door unlocked." },
  { tatoeba = "42464_205223", ja = "それは言わ{ずにおいた}方がいい。", en = "You had better leave it unsaid." },
]

[[point]]
id = "zu-ni-sumu"
pattern = "ずにすむ"
forms = ["ずに済む", "ないですむ", "ないで済む", "なくてすむ", "なくて済む", "ですむ", "で済む", "て済む", "てすむ"]
jlpt = "N3"
meaning = "to get by without, be spared (from); X will do"
formation = [
  "Verb［な̶い̶］ + ずにすむ",
  "Verb［ない］ + ですむ / なくてすむ",
  "Noun + ですむ   (警告ですむ)",
  "Verb［て］ + すむ   (謝ってすむ)",
]
explanation = """
Says you were spared something unpleasant you expected to face: 歩かず\
にすんだ, "I didn't have to walk after all". After a noun, で済む says \
that small thing was enough, and nothing worse followed: 千円で済んだ, \
"a thousand yen covered it". After a て-form it says doing that much is \
enough: 謝ってすむ問題じゃない, "an apology won't settle this"."""
notes = """
Usually past (すんだ), with relief. Not the same as 〜なくてもいい, \
which gives permission not to do something; 〜ずにすむ reports that \
you got out of it. Other, rarer uses of 済む: 気が済む, "to be \
satisfied"."""
related = ["zu-ni", "nakute-mo-ii"]
examples = [
  { tatoeba = "253855_160665", ja = "幸い、怪我をせ{ずにすんだ}。", en = "I was lucky enough to escape unhurt." },
  { tatoeba = "295737_107948", ja = "彼は警告{ですんだ}。", en = "He got off with a warning." },
  { source = "yomeru", ja = "バスがあったので、歩か{ずに済んだ}。", en = "There was a bus, so I didn't have to walk." },
]

[[point]]
id = "zu-ni-wa-irarenai"
pattern = "ずにはいられない"
forms = ["ずにいられない", "ないではいられない", "ないでいられない", "ずにはいられません"]
jlpt = "N3"
meaning = "can't help (doing), can't stop oneself from"
formation = ["Verb［な̶い̶］ + ずにはいられない   (笑わずにはいられない)", "する → せずにはいられない"]
explanation = """
Says a feeling is so strong you can't hold back from acting on it: \
笑わずにはいられなかった, "I couldn't help laughing". Mostly about \
your own feelings and reactions: laughing, crying, worrying, saying \
something."""
notes = """
〜ないではいられない is a little more spoken; both are rather formal. \
About someone else, add ようだ or らしい: 彼は笑わずにはいられないよう\
だ. 〜ないわけにはいかない is different: duty, "I can't not do it", not \
a feeling. 〜てしかたがない is about a feeling \
itself (嬉しくてしかたがない), not about an action you can't stop."""
related = ["zu-ni", "te-shikata-ga-nai", "wake-ni-wa-ikanai"]
examples = [
  { tatoeba = "372354_155823", ja = "笑わ{ずにはいられなかった}。", en = "I couldn't help but laugh." },
  { tatoeba = "285322_118341", ja = "彼のことを気の毒に思わ{ずにはいられなかった}。", en = "I could not help feeling sorry for him." },
  { source = "yomeru", ja = "この歌を聞くと、いつも泣か{ずにはいられない}。", en = "Whenever I hear this song, I can't help crying." },
]

[[point]]
id = "te-shikata-ga-nai"
pattern = "てしかたがない"
forms = ["てしかたない", "て仕方がない", "て仕方ない", "でしかたがない", "で仕方がない", "で仕方ない", "てしょうがない", "でしょうがない", "てしようがない"]
jlpt = "N3"
meaning = "unbearably, terribly, can't help feeling"
formation = [
  "Verb［て］ + しかたがない   (気になってしかたがない)",
  "［い］Adjective［い̶］ + くてしかたがない   (暑くてしかたがない)",
  "［な］Adjective + でしかたがない   (心配でしかたがない)",
]
explanation = """
Says a feeling or sensation is so strong you can't do anything about \
it: 眠くてしかたがない, "I'm so sleepy I can't stand it". It goes with \
words for feelings, wants and body states: 〜たくてしかたがない, "I'm \
dying to"."""
notes = """
てしょうがない is the casual spoken version. Mostly about the speaker; \
for others add らしい or ようだ. Don't confuse it with 〜てもしかたがな\
い, "it's no use doing", which has も. Alone, しかたがない is "it can't \
be helped"."""
related = ["te-mo-shikata-ga-nai", "zu-ni-wa-irarenai", "te-tamaranai"]
examples = [
  { tatoeba = "243087_171388", ja = "今年の夏は暑{くてしかたがない}。", en = "It is unbearably hot this summer." },
  { tatoeba = "62275_224940", ja = "コーヒーが飲みた{くて仕方がない}。", en = "I'm dying for a cup of coffee." },
  { tatoeba = "242812_171663", ja = "今日は寒{くてしょうがない}。", en = "It's simply too cold today." },
]

[[point]]
id = "te-mo-shikata-ga-nai"
pattern = "てもしかたがない"
forms = ["てもしかたない", "ても仕方がない", "ても仕方ない", "てもしょうがない", "でもしかたがない", "でも仕方がない", "でも仕方ない", "でもしょうがない"]
jlpt = "N3"
meaning = "it's no use (doing), there's no point (in)"
formation = [
  "Verb［て］ + もしかたがない   (泣いてもしかたがない)",
  "［い］Adjective［い̶］ + くてもしかたがない",
  "［な］Adjective / Noun + でもしかたがない",
]
explanation = """
Says doing something won't change anything, so it's pointless: 終わっ\
たことを気にしてもしかたがない, "there's no use worrying about what's over". Often \
said to stop someone from worrying, complaining or crying."""
notes = """
It can also accept a bad outcome as deserved: 遅れたら怒られてもしか\
たがない, "if I'm late, I can't complain about being scolded". Casual: \
〜てもしょうがない. Different from 〜てしかたがない (without も), \
"unbearably"."""
related = ["te-shikata-ga-nai", "temo"]
examples = [
  { tatoeba = "50867_213580", ja = "そこへ行っ{ても仕方がない}。", en = "It is no use going there." },
  { tatoeba = "285178_118485", ja = "彼に腹を立て{てもしかたない}。", en = "It is no use getting angry at him." },
  { source = "yomeru", ja = "今さら言っ{てもしょうがない}よ。", en = "There's no point saying it now." },
]

[[point]]
id = "koto-ni-naru"
pattern = "ことになる"
forms = ["ことになった", "ことになっている", "こととなる", "ということになる", "たことになる"]
jlpt = "N3"
meaning = "it's been decided that; it turns out, it means; the rule is"
formation = ["Verb［る］ / Verb［ない］ + ことになる", "Verb［た］ + ことになる   (it amounts to)"]
explanation = """
Reports a decision or outcome not made by you alone: 来月、大阪に転勤\
することになった, "I'm being transferred to Osaka next month". It also \
draws a conclusion: 三回行ったことになる, "that makes three times". \
〜ことになっている states a rule or plan: 靴を脱ぐことになっている."""
notes = """
〜ことにする is your own decision; 〜ことになる sounds as if it came \
from outside, so it is also a modest way to announce your own plans. \
It can warn of a bad result: 後で困ることになるよ. 〜ようになる is a gradual change in ability or habit, not a decision. \
こととなる is the written form."""
related = ["koto-ni-suru", "you-ni-naru", "nakatta-koto-ni-suru"]
examples = [
  { source = "yomeru", ja = "来月、大阪に転勤する{ことになった}。", en = "It's been decided that I'll transfer to Osaka next month." },
  { tatoeba = "31719_194546", ja = "もう１度行けば、アメリカに３回いった{ことになる}。", en = "I will have been to the States three times if I go there again." },
  { source = "yomeru", ja = "この部屋では靴を脱ぐ{ことになっている}。", en = "In this room, you're supposed to take your shoes off." },
]

[[point]]
id = "nakatta-koto-ni-suru"
pattern = "なかったことにする"
forms = ["たことにする", "なかったことになる"]
jlpt = "N3"
meaning = "to act as if (it never happened); to count as done"
formation = ["Verb［なかった］ + ことにする   (聞かなかったことにする)", "Verb［た］ + ことにする   (行ったことにする)"]
explanation = """
Treats something as true, or not true, when the facts say otherwise: \
今の話は聞かなかったことにする, "I'll pretend I didn't hear that". \
With the past affirmative, it counts something as done: 私も行ったこ\
とにして, "say I went too"."""
notes = """
It is an agreed-on fiction, often a kind way to drop a subject or \
cover for someone. 〜ことにする after a dictionary form is a real \
decision (行くことにする); after the past form, a pretense. The \
intransitive なかったことになる: "it's as if it never happened"."""
related = ["koto-ni-suru", "koto-ni-naru", "furi-wo-suru"]
examples = [
  { source = "yomeru", ja = "今の話は聞か{なかったことにする}。", en = "I'll pretend I didn't hear that." },
  { source = "yomeru", ja = "昨日のことは{なかったことにしよう}。", en = "Let's act as if yesterday never happened." },
]

[[point]]
id = "sasete-itadaku"
pattern = "させていただく"
forms = ["せていただく", "させていただきます", "せていただきます"]
jlpt = "N3"
meaning = "(humble) I will, allow me to, with your permission"
formation = ["Verb［causative］［て］ + いただく   (休ませていただく, 説明させていただく)"]
explanation = """
A very humble way to say you'll do something, framed as receiving \
permission: 説明させていただきます, "allow me to explain". Common in \
business, speeches and shops, for announcing your own actions: 本日は\
休ませていただきます, "we're closed today"."""
notes = """
The asking form is 〜させていただけませんか (may I…?). Some find it \
overused for actions that need nobody's permission; 〜いたします is a \
humble alternative. Check the causative: 読む → 読ませて, not 読まさせ\
て, though that extra さ is common in speech."""
related = ["sasete-kudasai", "causative", "te-itadaku", "itasu"]
examples = [
  { tatoeba = "353241_150125", ja = "自己紹介を{させていただきます}。", en = "Let me introduce myself." },
  { tatoeba = "39494_202282", ja = "できる限りの事は{させていただきます}。", en = "I'll do everything I can." },
  { tatoeba = "274140_140432", ja = "相席{させていただけ}ますか。", en = "May I share this table with you?" },
]

[[point]]
id = "te-itadakeru-to-arigatai"
pattern = "ていただけるとありがたい"
forms = ["でいただけるとありがたい", "ていただけるとありがたいです", "ていただければありがたい", "ていただけるとうれしい", "ていただけると助かる", "てもらえるとありがたい", "てもらえるとうれしい", "てもらえると助かる"]
jlpt = "N3"
meaning = "I'd be grateful if you could (polite request)"
formation = ["Verb［て］ + いただけるとありがたい   (待っていただけるとありがたい)"]
explanation = """
A polite, indirect request: rather than asking outright, you say how \
thankful you'd be: 明日までに連絡していただけるとありがたい, "I'd \
appreciate hearing from you by tomorrow". Common in work emails."""
notes = """
More casual: 〜てもらえると助かる, "it'd help me if you could". \
うれしい instead of ありがたい sounds warmer. Ending with です or \
のですが softens it further. Gentler than 〜てください, which is still \
a direct request."""
