  { source = "yomeru", ja = "優勝{を目標として}練習している。", en = "We're training with winning the title as our goal." },
  { source = "yomeru", ja = "彼{をリーダーとする}チームができた。", en = "A team was formed with him as its leader." },
]

[[point]]
id = "to-shite"
