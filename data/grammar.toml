[[point]]
id = "hazu"
pattern = "はずだ"
forms = ["はずです", "はずだった", "はずでした", "はずの", "はずなのに", "たはずだ", "たはずなのに", "はずでは", "はずじゃ", "筈だ"]
jlpt = "N4"
meaning = "should be, is expected to (I'm fairly sure)"
formation = [
  "Verb / ［い］Adjective + はずだ",
  "［な］Adjective + な + はずだ",
  "Noun + の + はずだ   (休みのはずだ)",
]
explanation = """
A conclusion the speaker is fairly sure of, from facts or reasoning: 彼\
はもう家に着いているはずだ, "he should be home by now". Also for what \
a schedule says: 電車は五時に着くはずです."""
notes = """
Not for advice or duty: "you should study" is 勉強したほうがいい, \
never はず. Nor for your own plans: 来年帰るつもりです, not はずです. \
はずだった, "was supposed to", is for what didn't happen. \
Surer than かもしれない, and based on facts, where に違いない is a strong \
personal conviction."""
related = ["hazu-ga-nai", "kamoshirenai", "ni-chigai-nai"]
examples = [
  { tatoeba = "312326_91387", ja = "彼女はもう会社に着いている{はずだ}。", en = "She ought to be at the office by now." },
  { tatoeba = "326238_77481", ja = "列車は正午に到着する{はずです}。", en = "The train is due at noon." },
  { tatoeba = "323160_80557", ja = "明日の今ごろはパリにいる{はずだ}。", en = "We should be in Paris by this time tomorrow." },
]

[[point]]
id = "hazu-ga-nai"
pattern = "はずがない"
forms = ["はずはない", "はずない", "はずがありません", "はずはありません"]
jlpt = "N4"
meaning = "can't be, there's no way that"
