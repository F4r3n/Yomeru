  { source = "yomeru", ja = "危ない！止ま{れ}！", en = "Look out! Stop!" },
]

[[point]]
id = "passive"
pattern = "られる"
forms = ["れる"]
jlpt = "N4"
meaning = "be done (to), get (passive form)"
formation = [
  "う-Verb: last kana to the あ row + れる   (書く → 書かれる, 言う → 言われる)",
  "る-Verb: る → られる   (食べる → 食べられる)",
  "する → される, 来る → 来られる",
]
explanation = """
Turns the sentence around so the one affected becomes the subject, with \
the doer marked by に: 先生にほめられた, "I was praised by the \
teacher". It also states facts with no doer in mind: この橋は二年前に建\
てられた, "this bridge was built two years ago"."""
notes = """
Japanese also uses it to say you were affected, usually badly, even with \
verbs that take no object: 雨に降られた, "I got caught in the rain". \
Something of yours can stay as the object: 財布を盗まれた, "I had my \
wallet stolen". For る-verbs it looks like the potential form \
(食べられる): context tells. For who made or wrote something, use \
〜によって."""
related = ["potential-form", "causative-passive"]
homographs = ["potential-form"]
hover = false
examples = [
  { tatoeba = "59650_222324", ja = "この橋は二年前に建て{られた}。", en = "This bridge was built two years ago." },
  { tatoeba = "64556_227207", ja = "お金を盗ま{れた}。", en = "My money was stolen." },
  { tatoeba = "26767_189616", ja = "雨に降{られて}ぬれちゃったよ。", en = "I was caught in the rain and got wet." },
]

[[point]]
