it all; 通す is about not stopping. The noun 〜通し, with だ, is \
common: 立ち通しだった, "was on my feet the whole time"."""
related = ["tsuzukeru", "kiru"]
examples = [
  { tatoeba = "303792_99905", ja = "彼は本を読み{通した}。", en = "He read the book from cover to cover." },
  { tatoeba = "312603_91111", ja = "彼女は一晩中泣き{通した}。", en = "She kept crying all night long." },
  { tatoeba = "309896_93767", ja = "彼女は一日中泣き{通し}だった。", en = "She did nothing but cry all day." },
]

[[point]]
id = "mawaru"
pattern = "回る"
forms = ["まわる"]
jlpt = "N3"
meaning = "around, all over, here and there"
formation = ["Verb［stem］ + 回る   (歩き回る)", "Verb［て］ + 回る   (見て回る)"]
explanation = """
Joined to a verb stem, says someone moves around a place doing the \
action: 歩き回る, "walk around"; 走り回る, "run around". With the て \
form, it means going from place to place doing it: 店を見て回る, "look \
around the shops"."""
notes = """
The stem form is about moving all over; the て form is about visiting \
one place after another. 〜回す is the version with an object, moving \
something around or treating someone carelessly: 振り回す, "swing \
around". On its own, 回る means "turn, spin"."""
related = ["komu", "te-iku"]
examples = [
  { tatoeba = "27398_190239", ja = "一日中歩き{回って}くたくただ。", en = "I walked around all day, and I am done in." },
  { tatoeba = "23290_186156", ja = "我々はあちらこちらに走り{回った}。", en = "We were running to and fro." },
  { tatoeba = "290594_113080", ja = "彼はその家を見て{回った}。", en = "He went over the house." },
]

[[point]]
id = "kaesu"
pattern = "返す"
forms = ["かえす"]
jlpt = "N3"
meaning = "again (reread, redo); back (answer back)"
formation = ["Verb［stem］ + 返す   (読み返す, 言い返す)"]
explanation = """
Joined to a verb stem, says the action is done again, often to check \
it: 読み返す, "read over"; 見返す, "look again". With actions aimed at \
someone, it means doing it back: 言い返す, "talk back"; 送り返す, \
"send back"."""
notes = """
直す is redoing to fix or improve; 返す is just going over it again, \
or answering in kind. 繰り返す, "repeat", is a word of its own. On its \
own, 返す means "return, give back": 本を返す."""
related = ["naosu"]
examples = [
  { tatoeba = "280068_123928", ja = "答案を出す前にもう一度読み{返しなさい}。", en = "Read over your paper before you hand it in." },
  { source = "yomeru", ja = "母に言い{返して}しまった。", en = "I ended up talking back to my mother." },
  { tatoeba = "20844_183721", ja = "間違った商品を送り{返しましょう}か。", en = "Should we send back the wrong merchandise?" },
]

[[point]]
id = "nareru"
pattern = "慣れる"
forms = ["なれる"]
jlpt = "N3"
hover = false
meaning = "be used to doing, familiar from use"
formation = ["Verb［stem］ + 慣れる   (使い慣れる)", "Verb［stem］ + 慣れた + Noun   (住み慣れた町)"]
explanation = """
Joined to a verb stem, says something has become familiar because you \
do it often: 使い慣れたペン, "a pen I'm used to using"; 住み慣れた町, \
"the town I've long lived in". Mostly found as 慣れた before a noun, \
or as 〜慣れている."""
notes = """
For "get used to" with a noun or a whole action, 慣れる stands alone \
with に: 仕事に慣れた; 一人で住むことに慣れた. 見慣れない, "unfamiliar \
to the eye", is common for something new. Search only, since なれる is \
also "can become"."""
related = ["you-ni-naru"]
examples = [
  { source = "yomeru", ja = "使い{慣れた}ペンで書きたい。", en = "I want to write with a pen I'm used to." },
  { source = "yomeru", ja = "住み{慣れた}町を出るのは寂しい。", en = "It's sad to leave the town I've lived in so long." },
  { source = "yomeru", ja = "見{慣れない}車が止まっている。", en = "There's a car I've never seen parked there." },
]

[[point]]
id = "yamu"
pattern = "止む"
forms = ["やむ"]
jlpt = "N3"
hover = false
meaning = "stop (crying, raining)"
formation = ["Verb［stem］ + 止む   (泣き止む, 降り止む)"]
explanation = """
Joined to a verb stem, says something that was going on has stopped by \
itself: 赤ちゃんが泣き止んだ, "the baby stopped crying"; 雨が降り止ん\
だ, "the rain stopped". Used with a small set of verbs: crying, \
raining, a noise."""
notes = """
For stopping something on purpose, use やめる: 読むのをやめた, "I \
stopped reading". 止む is what stops by itself; やめる is what you \
stop. On its own, 止む is used for weather: 雨がやんだ. Often in kana."""
related = ["owaru", "dasu"]
examples = [
  { tatoeba = "310996_92713", ja = "彼女はすっかり泣き{止んだ}。", en = "She stopped crying altogether." },
  { tatoeba = "26896_189743", ja = "雨が降り{止んだ}。", en = "It has ceased raining." },
  { source = "yomeru", ja = "赤ちゃんがやっと泣き{やんだ}。", en = "The baby finally stopped crying." },
]

[[point]]
id = "tate"
pattern = "たて"
forms = ["たての", "立て"]
jlpt = "N3"
hover = false
meaning = "freshly, just (made, done)"
formation = ["Verb［stem］ + たて   (焼きたて)", "Verb［stem］ + たての + Noun   (焼きたてのパン)"]
explanation = """
Joined to a verb stem, says something has only just been done and is \
still fresh: 焼きたてのパン, "bread fresh from the oven"; できたて, \
"freshly made"; 塗りたて, "wet (paint)". Usually with の before a noun, \
or with だ at the end."""
notes = """
たばかり says any action was just done; たて is for a fresh state, \
mostly of food or new things, and is used with a small set of verbs: \
焼く, 作る, できる, 生まれる, 塗る. ×食べたて is not said. Search only, \
since たて is inside many words."""
related = ["ta-bakari"]
