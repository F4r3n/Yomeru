homework right now". Plain ている can also mean a habit or a state; \
ているところ is only "right now, in progress"."""
notes = """
Three moments of one action: 食べるところ (about to eat), 食べている\
ところ (in the middle of eating), 食べたところ (just finished eating). \
Before a noun, ところ can simply be a place: 父の働いているところ, "the \
place where my father works"."""
related = ["ru-tokoro", "ta-tokoro", "te-iru"]
