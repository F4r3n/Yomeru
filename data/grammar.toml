上がる takes no object; 上げる is the version with one, for \
finishing work yourself: 仕上げる, "finish (a job)"; 書き上げる, \
"finish writing". 終わる is about an action ending; 上がる is about a \
result being ready. On its own, 上がる means "go up, rise"."""
related = ["owaru", "kiru"]
examples = [
  { tatoeba = "45261_208004", ja = "その男は立ち{上がった}。", en = "The man stood up." },
  { tatoeba = "238019_176445", ja = "計画が出来{上がった}。", en = "The plans have been drawn up." },
  { tatoeba = "245472_169015", ja = "仕{上がった}ばかり。", en = "Just finished it." },
]

[[point]]
id = "toosu"
pattern = "通す"
forms = ["とおす"]
jlpt = "N3"
meaning = "do to the end, keep doing throughout"
formation = ["Verb［stem］ + 通す   (やり通す)", "Verb［stem］ + 通し   (noun: 泣き通しだ)"]
explanation = """
Joined to a verb stem, says an action goes on from start to finish \
without a break, often in spite of difficulty: 最後までやり通す, "see \
