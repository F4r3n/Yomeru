explanation = """
Turns a verb into "can do it". The result conjugates like a る-verb: \
泳げる, 泳げない, 泳げました. It covers ability and also whether \
circumstances allow it: 今日は行けない, "I can't go today"."""
notes = """
The thing you can do often takes が instead of を: 日本語が話せる. Speech \
often drops ら from る-verbs and 来る (見れる, 来れる): common, but still \
seen as incorrect in writing. 〜ことができる means the same and is more \
formal. For る-verbs it looks like the passive (食べられる): context \
tells. 見える / 聞こえる say something comes into view or reaches your \
ears; 見られる / 聞ける say you get the chance to."""
related = ["koto-ga-dekiru", "passive"]
