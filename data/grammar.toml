  { source = "yomeru", ja = "少し待っ{ていただけると助かり}ます。", en = "It would help me if you could wait a little." },
]

[[point]]
id = "te-iru-baai-ja-nai"
pattern = "ている場合じゃない"
forms = ["てる場合じゃない", "ている場合ではない", "ている場合ではありません", "でいる場合じゃない", "でる場合じゃない", "場合じゃない", "場合ではない"]
jlpt = "N3"
meaning = "this is no time to (be doing)"
formation = ["Verb［て］ + いる場合じゃない   (寝ている場合じゃない)"]
explanation = """
Says the situation is too urgent or serious for what someone is doing: \
笑っている場合じゃない, "this is no time to be laughing". Often a \
push to get to what really matters."""
notes = """
In speech いる often shrinks: 寝てる場合じゃない. Alone, そんな場合じゃ\
ない means "now's not the time for that". ではない is the more formal \
version. Compare 〜どころではない, "far from (being able to)"."""
