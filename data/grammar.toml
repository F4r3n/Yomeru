  { tatoeba = "31385_194212", ja = "もう行か{ないと}。", en = "Got to go now." },
  { tatoeba = "56586_219270", ja = "この薬を飲ま{ないといけません}か。", en = "Do I have to take this medicine?" },
  { tatoeba = "21566_184439", ja = "学校の決まりは守ら{ないといけない}ぞ。", en = "You must follow school rules." },
]

[[point]]
id = "nakereba-naranai"
pattern = "なければならない"
forms = ["なければいけない", "なければなりません", "なければいけません", "なきゃ", "なければだめ"]
jlpt = "N4"
meaning = "must, have to (obligation)"
formation = [
  "Verb［な̶い̶］ + なければならない / なければいけない   (行かなければならない)",
  "［い］Adjective［い̶］ + くなければならない   (安くなければならない)",
  "［な］Adjective / Noun + でなければならない   (静かでなければならない)",
]
explanation = """
Literally "if not, it won't do": something has to be done or be so. \
〜なければならない sounds firm and fits rules, duties and writing; \
〜なければいけない is more usual in speech and for personal needs: 明日は\
早く起きなければいけない, "I have to get up early tomorrow"."""
notes = """
Speech shortens it to 〜なきゃ (〜なきゃいけない, or just なきゃ): もう寝な\
きゃ. Same meaning as 〜なくてはいけない; 〜ないと is the most casual. The \
opposite, "don't have to", is 〜なくてもいい. 〜なければ alone is just \
"if not": 急がなければ遅れる."""
related = ["nakute-wa-ikenai", "nai-to", "nakute-mo-ii", "ba"]
examples = [
  { tatoeba = "311077_92632", ja = "彼女はそこへ行か{なければならない}。", en = "She must go there." },
