  { tatoeba = "285721_117937", ja = "彼の家族{はみな背が}高い。", en = "His family members are all tall." },
]

[[point]]
id = "wo-kudasai"
pattern = "をください"
forms = ["を下さい", "ください", "下さい"]
jlpt = "N5"
meaning = "please give me, I'd like (asking for a thing)"
formation = ["Noun + をください", "Noun + を + Number + ください   (りんごを三つください)"]
explanation = """
Asks for a thing, for example in a shop or restaurant: 水をください, \
"water, please". An amount goes after を, before ください: コーヒーを二つ\
ください, "two coffees, please"."""
notes = """
It's a direct request; softer options are 〜をお願いします (very common \
when ordering) or 〜をもらえますか. To ask someone to do something, use \
Verb［て］ + ください. For things you can't be handed, rephrase: "quiet, \
please" is 静かにしてください."""
related = ["te-kudasai", "ga-hoshii"]
