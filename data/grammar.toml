が or けど."""
related = ["demo", "kedo"]
examples = [
  { tatoeba = "53613_216308", ja = "{しかし}、車は欲しい。", en = "But I want a car." },
  { tatoeba = "53517_216214", ja = "{しかし}彼は英語を読むのは下手だ。", en = "But he is bad at reading English." },
  { tatoeba = "53518_216215", ja = "{しかし}彼もまた興奮していた。", en = "But he was excited too." },
]

[[point]]
id = "no-ga-jouzu"
pattern = "のが上手"
forms = ["のがじょうず", "のが下手", "のがへた", "のが得意", "のが苦手"]
jlpt = "N5"
meaning = "be good at doing (上手), bad at doing (下手)"
formation = ["Verb［る］ + のが上手 / のが下手"]
explanation = """
Says how well someone does something: 歌うのが上手です, "she's good at \
singing"; 料理するのが下手だ, "I'm bad at cooking". の turns the verb \
into a noun, and が marks it, as with 好き."""
notes = """
上手 is praise, so it sounds boastful about yourself: say 得意, "my \
strong point", and 苦手, the polite way to admit a weakness. Use が, not \
を. With a skill noun, no の: 彼は料理が上手だ."""
related = ["no-ga-suki", "wa-ga"]
examples = [
  { tatoeba = "294489_109201", ja = "彼は歌う{のが上手}だ。", en = "He is good at singing." },
  { tatoeba = "311649_92062", ja = "彼女はテニスをする{のが上手}です。", en = "She is good at playing tennis." },
  { source = "yomeru", ja = "私は絵を描く{のが下手}です。", en = "I'm bad at drawing." },
]

[[point]]
id = "no-nominalizer"
pattern = "のは"
forms = ["のが", "のを"]
jlpt = "N5"
meaning = "the act of …, the one (that) … (making a noun with の)"
formation = [
  "Verb / ［い］Adjective + の   (読むの, 赤いの)",
  "［な］Adjective + な + の   (静かなの)",
]
explanation = """
の after a verb or adjective turns it into a noun that can take は, が \
or を: 日本語を話すのは楽しい, "speaking Japanese is fun". After an \
adjective, の also means "one": 赤いのがほしい, "I want the red one". \
It can single out what you want to stress: 来たのは田中さんです, "the \
one who came was Tanaka"."""
notes = """
こと also makes nouns from verbs, but only こと fits ことができる, ことが\
ある and set phrases; only の fits verbs of sensing: 歌っているのが聞こ\
える. After な-adjectives, use な: 静かなの, not 静かだの."""
related = ["koto-nominalizer", "no-ga-suki", "n-desu"]
examples = [
  { tatoeba = "56816_219496", ja = "この本を読む{のは}私には簡単です。", en = "It is easy for me to read this book." },
  { tatoeba = "242071_172404", ja = "今私たちに必要な{のは}休息です。", en = "What we need now is a rest." },
  { source = "yomeru", ja = "赤い{のを}一つください。", en = "One red one, please." },
]

[[point]]
id = "i-adjective-forms"
pattern = "くない"
forms = ["くなかった", "くありません", "くありませんでした"]
jlpt = "N5"
meaning = "not …, was …, wasn't … (い-adjective endings)"
formation = [
  "［い］Adjective［い̶］ + くない   (高くない)",
  "［い］Adjective［い̶］ + かった   (高かった)",
  "［い］Adjective［い̶］ + くなかった   (高くなかった)",
]
explanation = """
い-adjectives conjugate on their own, like verbs: 高い, "expensive"; \
高くない, "not expensive"; 高かった, "was expensive"; 高くなかった, \
"wasn't expensive". Add です to any of these for politeness: 高くない\
です. A more formal negative is 高くありません (past: 高くありません\
でした)."""
notes = """
いい is irregular: よくない, よかった, よくなかった. The past never goes \
on です: 高いでした is wrong, 高かったです is right. な-adjectives don't \
change like this; they take だ/です like nouns (静かじゃない, 静かでし\
た). きれい and きらい end in い but are な-adjectives."""
related = ["desu", "kute", "naru"]
examples = [
  { tatoeba = "42451_205209", ja = "それは高{くない}。", en = "It isn't expensive." },
  { tatoeba = "37833_200632", ja = "とても楽し{かったです}。", en = "I really enjoyed myself." },
  { source = "yomeru", ja = "昨日はあまり寒{くなかった}。", en = "It wasn't very cold yesterday." },
]

[[point]]
id = "wa-contrast"
pattern = "は〜は"
forms = []
jlpt = "N5"
meaning = "A …, but B … (contrast with は)"
formation = ["Noun A + は … 、 Noun B + は …"]
explanation = """
Besides marking the topic, は sets things side by side in contrast: \
肉は食べるが、魚は食べない, "meat I eat, but fish I don't". A single \
は can hint at a contrast left unsaid: 今日は暇です, "today I'm free \
(other days, maybe not)"."""
notes = """
In answers, は often replaces が or を to contrast or soften: 「お酒を飲\
みますか」「ビールは飲みます」 suggests "but not other drinks". It can \
follow other particles: 東京には行った, "Tokyo, at least, I went to". \
But to answer "who?" or "which?", use が, not は: 「誰が行きましたか」\
「私が行きました」."""
related = ["wa-ga", "kedo"]
examples = [
  { tatoeba = "238911_175554", ja = "健{は背が高いが、私は}高くない。", en = "Ken is tall, but I'm not." },
  { tatoeba = "17015_178163", ja = "君の声{は聞こえるが、姿は}見えないよ。", en = "I can hear you, but I can't see you." },
  { source = "yomeru", ja = "犬{は好きですが、猫は}苦手です。", en = "I like dogs, but I'm not keen on cats." },
]

[[point]]
id = "wa-particle"
pattern = "は"
forms = []
jlpt = "N5"
meaning = "as for, about (topic marker)"
formation = ["Noun + は"]
explanation = """
Marks the topic, what the sentence is about; the rest says something \
about it: 私は学生です, "I'm a student" (as for me, a student). Written \
は, it's pronounced わ. Once the topic is clear, later sentences usually \
leave it out."""
notes = """
が points out who or what does something, or brings in new information; \
は marks what is already known or being talked about. Question words \
never take は: 誰が来ましたか, not 誰は. は replaces が and を, and \
follows other particles: 学校では, 東京には. It can also set up a \
contrast (see は〜は)."""
related = ["ga-particle", "wa-contrast", "wa-ga", "mo-particle"]
homographs = ["number-wa"]
examples = [
  { tatoeba = "67073_229712", ja = "あれ{は}古いお城です。", en = "That is an old castle." },
  { tatoeba = "18496_179638", ja = "金沢{は}静かな町です。", en = "Kanazawa is a quiet city." },
  { source = "yomeru", ja = "私{は}学生です。", en = "I'm a student." },
]

[[point]]
id = "ga-particle"
pattern = "が"
forms = []
jlpt = "N5"
meaning = "(subject marker); but"
formation = [
  "Noun + が   (subject)",
  "Sentence + が + Sentence   (but)",
]
explanation = """
Marks the subject, often as new information or the answer to "who?" or \
"what?": 「誰が来ましたか」「田中さんが来ました」. It also marks the \
thing liked, wanted or done well: 猫が好きです. Between two clauses, が \
means "but": 高いですが、おいしいです, "it's expensive, but good"."""
notes = """
は is the known topic, が singles one out: 田中さんは来ました tells you \
about Tanaka, 田中さんが来ました tells you who came. Question words \
take が, never は. The "but" が is a little more formal than けど, and \
also softens a lead-in: すみませんが、駅はどこですか."""
related = ["wa-particle", "wa-ga", "kedo"]
examples = [
  { tatoeba = "276295_136940", ja = "誰{が}英語を話せますか。", en = "Who can speak English?" },
  { source = "yomeru", ja = "雨{が}降っています。", en = "It's raining." },
  { source = "yomeru", ja = "すみません{が}、駅はどこですか。", en = "Excuse me, but where is the station?" },
]

[[point]]
id = "mo-particle"
pattern = "も"
forms = ["も〜も"]
jlpt = "N5"
meaning = "also, too; (A も B も) both A and B, neither A nor B"
formation = [
  "Noun + も",
  "Noun A + も + Noun B + も",
]
explanation = """
Means "also, too": 私も学生です, "I'm a student too". It takes the place \
of は, が and を: 弟も行きます, "my brother is going too". Doubled, it \
means "both": 犬も猫も好きです, "I like both dogs and cats"; with a \
negative, "neither": 肉も魚も食べない, "I eat neither meat nor fish"."""
notes = """
Other particles stay, before も: 東京にも行った, "I went to Tokyo too". \
After an amount, も stresses that it's a lot: 三時間も待った, "I waited a \
whole three hours". After a question word, it gives "every-" or, with a \
negative, "no-" (see 誰か / 誰も)."""
related = ["wa-particle", "ka-mo-question-words", "nan-mo"]
homographs = ["number-mo"]
examples = [
  { source = "yomeru", ja = "私{も}学生です。", en = "I'm a student too." },
  { source = "yomeru", ja = "弟{も}一緒に行きます。", en = "My little brother is coming too." },
  { tatoeba = "304262_99436", ja = "彼は野球{もフットボールも}好きではない。", en = "He likes neither baseball nor football." },
]

[[point]]
id = "ka-particle"
pattern = "か"
forms = []
jlpt = "N5"
meaning = "(question marker); or"
formation = [
  "Sentence + か   (行きますか)",
  "Noun A + か + Noun B   (お茶かコーヒー)",
]
explanation = """
At the end of a sentence, か makes it a question: 学生ですか, "are you a \
student?". Written Japanese needs no question mark after it. Between two \
nouns, か means "or": お茶かコーヒーを飲みます, "I drink tea or coffee"."""
notes = """
Casual questions usually drop か and just rise in tone: 行く？. A plain \
form + か (行くか) sounds rough or masculine. A question inside a \
sentence + か means "whether": 来るかわからない, "I don't know if he'll \
come". For "or" between two whole questions, use それとも. After a \
question word, か gives "some-" (誰か)."""
related = ["soretomo", "ka-mo-question-words", "kashira", "question-ka"]
homographs = ["question-ka"]
examples = [
  { tatoeba = "464592_229723", ja = "あれは何です{か}。", en = "What is that?" },
  { tatoeba = "56970_219649", ja = "この本は君のです{か}。", en = "Is this book yours?" },
  { source = "yomeru", ja = "お茶{か}コーヒーを飲みます。", en = "I drink tea or coffee." },
]

[[point]]
id = "de-particle"
pattern = "で"
forms = []
jlpt = "N5"
meaning = "at, in (where something happens); by, with (means)"
formation = [
  "Place + で + Verb",
  "Noun (tool, means, language) + で",
]
explanation = """
Marks the place where an action happens: 図書館で勉強する, "study in the \
library". It also marks the means or tool: バスで行く, "go by bus"; ペン\
で書く, "write with a pen"; 日本語で話す, "speak in Japanese"."""
notes = """
に marks where something is (ある, いる, 住む) or arrives; で where \
something is done: 公園で遊ぶ, but 公園にいる. で also sets a range, \
日本で一番高い山; a number of people, 三人で行く, "go as a group of \
three"; or a cause, 風邪で休む, "stay home with a cold"."""
related = ["ni-particle", "ga-ichiban"]
examples = [
  { tatoeba = "289834_113839", ja = "彼はここ{で}遊んでいます。", en = "He is playing here." },
  { tatoeba = "319359_84356", ja = "父は毎朝バス{で}会社に行きます。", en = "Father takes a bus to his office." },
  { source = "yomeru", ja = "ペン{で}書いてください。", en = "Please write in pen." },
]

[[point]]
id = "ni-particle"
pattern = "に"
forms = []
jlpt = "N5"
meaning = "at, in (a time, where something is); to (a place, a person)"
formation = [
  "Time + に   (七時に)",
  "Place + に + ある / いる",
  "Place + に + Verb of movement   (学校に行く)",
  "Person + に + Verb   (友達にあげる)",
]
explanation = """
Marks a point: a time, 七時に起きる, "get up at seven"; where something \
is, 部屋に猫がいる, "there's a cat in the room"; where you go or arrive, \
学校に行く; and the person something goes to, 友達に電話する, "phone a \
friend"."""
notes = """
Clock times, dates and days take に (三時に, 月曜日に); words relative to \
now don't: 今日, 明日, 毎朝. Where an action happens is で: 公園で遊ぶ. \
Some verbs take に where English has an object: 友達に会う, "meet a \
friend"; バスに乗る, "get on the bus". に and へ both mark a destination \
(see へ)."""
related = ["de-particle", "e-particle", "wo-particle"]
examples = [
  { tatoeba = "252455_162060", ja = "私は1時{に}寝た。", en = "I went to bed at one o'clock." },
  { source = "yomeru", ja = "机の上{に}本があります。", en = "There is a book on the desk." },
  { source = "yomeru", ja = "駅で友達{に}会いました。", en = "I met a friend at the station." },
]

[[point]]
id = "to-particle"
pattern = "と"
forms = ["と一緒に", "といっしょに"]
jlpt = "N5"
meaning = "and (joining nouns); with (someone)"
formation = [
  "Noun A + と + Noun B   (and)",
  "Noun (person) + と + Verb   (with)",
]
explanation = """
Between nouns, と means "and", naming every item: パンと牛乳を買った, "I \
bought bread and milk". After a person it means "with": 友達と映画を見\
た, "I saw a film with a friend"; 一緒に often follows: 母と一緒に行く, \
"I'm going with my mother"."""
notes = """
と joins nouns only: to join actions, use the て-form; to give a few \
examples, や. Some verbs take と for the other person: 友達と話す, "talk \
with a friend"; 彼と結婚する, "marry him". と after a sentence (と言う, \
と思う) quotes, and Verb［る］ + と is "when, if": later points."""
related = ["ya-particle", "te-form-sequence"]
homographs = ["to-conditional"]
examples = [
  { tatoeba = "51931_214638", ja = "スティーブはケート{と一緒に}学校に行く。", en = "Steve goes to school with Kate." },
  { source = "yomeru", ja = "パン{と}牛乳を買いました。", en = "I bought bread and milk." },
]

[[point]]
id = "ya-particle"
pattern = "や"
forms = ["や〜など"]
jlpt = "N5"
meaning = "and (naming some examples, not the full list)"
formation = ["Noun A + や + Noun B (+ など)"]
explanation = """
Joins nouns as examples, implying there are others: りんごやみかんを買\
った, "I bought apples, mandarins and so on". など after the last noun \
makes the "and so on" explicit: 本やノートなど."""
notes = """
と names the whole list, や only part of it. Like と, や joins nouns \
only; for actions, use 〜たり〜たりする. In speech, とか is a more \
casual alternative: りんごとかみかんとか."""
related = ["to-particle", "tari-tari"]
examples = [
  { source = "yomeru", ja = "りんご{や}みかんを買いました。", en = "I bought apples, mandarins and other fruit." },
  { source = "yomeru", ja = "机の上に本{や}ノートがあります。", en = "There are books, notebooks and such on the desk." },
]

[[point]]
id = "no-particle"
pattern = "の"
forms = []
jlpt = "N5"
meaning = "'s, of (linking two nouns)"
formation = ["Noun A + の + Noun B   (私の本)"]
explanation = """
Links two nouns, the first describing the second: 私の本, "my book"; \
日本の車, "a Japanese car"; 日本語の先生, "a Japanese teacher". The link \
can be owner, origin, kind, place or time: 東京の友達, "a friend in \
Tokyo"; 朝のニュース, "the morning news"."""
notes = """
With a pronoun it gives the possessive: 私の, あなたの, 彼の. The second \
noun can drop when it's clear: この本は私のです, "this book is mine". \
Adjectives don't take の: 赤い車, 静かな町. の also turns verbs into \
nouns (〜のが好き) and ends casual questions: separate points."""
related = ["no-nominalizer", "n-desu"]
examples = [
  { tatoeba = "251859_162655", ja = "私{の}母は毎日早く起きます。", en = "My mother gets up early every morning." },
  { tatoeba = "55516_218204", ja = "これは誰{の}辞書ですか。", en = "Whose dictionary is this?" },
]

[[point]]
id = "kara-reason"
pattern = "から"
forms = ["だから", "ですから"]
jlpt = "N5"
meaning = "because, so (giving a reason)"
formation = [
  "Verb / ［い］Adjective + から",
  "［な］Adjective / Noun + だから   (雨だから)",
]
explanation = """
Gives a reason, then its result: 寒いから、窓を閉めて, "it's cold, so \
shut the window". It's the everyday "because", direct enough for \
opinions, requests and invitations. An answer can end on it: 「どうし\
て？」「忙しいからです」, "because I'm busy"."""
notes = """
After nouns and な-adjectives, add だ: 雨だから. Plain or polite forms \
both go before it (行くから, 行きますから). In polite requests, refusals \
and excuses it can sound pushy; ので is softer there. だから opens a sentence: \
"that's why". After a place or time, から is "from" (see から〜まで); \
after a て-form, "after" (see 〜てから)."""
related = ["node", "kara-made", "te-kara", "doushite"]
examples = [
  { tatoeba = "322708_81006", ja = "眠い{から}帰ります。", en = "I'm sleepy, so I am leaving now." },
  { tatoeba = "21998_184867", ja = "外は寒い{から}中に入りなさい。", en = "Come inside because it's cold outside." },
  { source = "yomeru", ja = "雨{だから}、出かけません。", en = "It's raining, so I won't go out." },
]

[[point]]
id = "dake"
pattern = "だけ"
forms = []
jlpt = "N5"
meaning = "only, just"
formation = [
  "Noun + だけ   (一つだけ)",
  "Verb / ［い］Adjective + だけ   (見ているだけ)",
]
explanation = """
Limits something to what is named: 一つだけください, "just one, please"; \
日曜日だけ休みです, "I only have Sundays off". After a verb it means \
"just (doing)": 見ているだけです, "I'm just looking". The verb that \
follows can be positive or negative."""
notes = """
しか〜ない also means "only" but stresses that it's too little, and needs \
a negative; だけ is neutral. が and を can drop or stay after だけ: 水だけ\
飲む, 水だけを飲む. で and に can go on either side: 日本でだけ, 日本だ\
けで. これだけ is "this much" or "that's all"."""
related = ["shika-nai"]
examples = [
  { tatoeba = "40017_175178", ja = "見ている{だけ}だ。", en = "I'm just looking around." },
  { source = "yomeru", ja = "一つ{だけ}ください。", en = "Just one, please." },
  { source = "yomeru", ja = "日曜日{だけ}休みです。", en = "I only have Sundays off." },
]

[[point]]
id = "morau"
pattern = "もらう"
forms = ["貰う"]
jlpt = "N5"
meaning = "receive, get (from someone)"
formation = ["Receiver + は / が + Giver + に / から + Thing + を + もらう"]
explanation = """
Receiving something: 友達に本をもらった, "I got a book from a friend". \
The receiver is the subject, and the giver takes に or から. When you are \
the receiver, 私は is usually left out. Seen from the giver's side, the \
same event uses くれる: 友達が本をくれた."""
notes = """
Use から when the giver is a group or an organization: 会社からボーナス\
をもらった. The humble version, receiving from a superior, is いただく: \
先生に本をいただいた. Verb［て］ + もらう is having someone do something \
for you: 友達に手伝ってもらった, "a friend helped me", a later point."""
related = ["ageru", "kureru"]
examples = [
  { tatoeba = "33715_196536", ja = "ボーナスを{もらった}。", en = "I received my bonus." },
  { tatoeba = "316206_87502", ja = "彼女は彼からプレゼントを{もらった}。", en = "She got a present from her boyfriend." },
  { source = "yomeru", ja = "友達に本を{もらいました}。", en = "I got a book from a friend." },
]

[[point]]
id = "tsumori"
pattern = "つもり"
forms = ["つもりだ", "つもりです", "つもりはない"]
jlpt = "N5"
meaning = "intend to, plan to"
formation = [
  "Verb［る］ + つもりだ",
  "Verb［ない］ + つもりだ",
]
explanation = """
Says what you have decided or intend to do: 来年日本へ行くつもりです, "I \
plan to go to Japan next year". つもり is a noun, "intention", so it \
takes だ or です. With the ない-form it's what you intend not to do: 今日\
は出かけないつもりです."""
notes = """
〜つもりはない is a firmer "have no intention of": 行くつもりはない. \
The short answer keeps その: はい、そのつもりです, never つもりです alone. \
Asking a superior 〜つもりですか can sound blunt; 〜予定ですか, "is it \
planned?", is softer and fits fixed schedules. For a decision made just \
now, use 〜ことにする; for a passing idea, 〜ようと思う (行こうと思う)."""
related = ["koto-ni-suru", "volitional"]
examples = [
  { tatoeba = "252588_161928", ja = "私は５月に休暇をとる{つもりだ}。", en = "I expect to take a vacation in May." },
  { source = "yomeru", ja = "夏休みに日本へ行く{つもりです}。", en = "I plan to go to Japan in the summer holidays." },
  { source = "yomeru", ja = "今日は出かけない{つもりです}。", en = "I don't plan to go out today." },
]

[[point]]
id = "deshou"
pattern = "でしょう"
forms = ["だろう", "でしょうか", "だろうか", "でしょ"]
jlpt = "N5"
meaning = "probably, I suppose; right? (checking)"
formation = [
  "Verb / ［い］Adjective + でしょう / だろう",
  "［な］Adjective / Noun + でしょう / だろう   (雨でしょう)",
]
explanation = """
Says what the speaker thinks is likely, without being sure: 明日は雨が降\
るでしょう, "it will probably rain tomorrow"; weather forecasts use it \
constantly. でしょう is polite, だろう plain. With a rising tone it \
checks that the listener agrees: 行くでしょう？, "you're going, right?"."""
notes = """
No だ before it: 雨でしょう, not 雨だでしょう. It isn't used for your \
own plans: say 行くつもりです, not 私は行くでしょう. たぶん or きっと often \
comes first to show how sure you are. In casual speech だろう sounds \
rather masculine; many speakers check with でしょ instead. 〜でしょうか \
is a soft, polite question: 駅はどこでしょうか."""
related = ["kamoshirenai", "sou-da-appearance", "ne"]
examples = [
  { tatoeba = "274982_138253", ja = "多分今日は雨が降る{でしょう}。", en = "The chances are that it will rain today." },
  { tatoeba = "48540_211266", ja = "その計画はうまくいく{だろう}。", en = "The plan will work out." },
  { source = "yomeru", ja = "明日はたぶん晴れる{でしょう}。", en = "It will probably be sunny tomorrow." },
]

[[point]]
id = "tte"
pattern = "って"
forms = []
jlpt = "N5"
hover = false
meaning = "(casual) as for, what's …?; (quoting) they say, I heard"
formation = [
  "Noun + って   (topic: 東京って)",
  "Sentence + って   (quote: 来ないって)",
]
explanation = """
A casual particle with two common uses. After a noun it raises a topic, \
often to ask about it: 寿司って好き？, "sushi, do you like it?". After a \
sentence it passes on what someone said, in place of と言っていた: 田中\
さんは来ないって, "Tanaka says he isn't coming"."""
notes = """
Casual speech only: politely, use は for the topic and と言っていました \
for the quote. It also replaces と before 言う or 思う: 行くって言った. \
〜って何？ is the everyday "what's a …?". Don't confuse it \
with the っ + て of a て-form: 行って, 待って."""
related = ["wa-particle"]
examples = [
  { tatoeba = "30165_192999", ja = "ユーフォー{って}何？", en = "What is a UFO?" },
  { tatoeba = "29809_192645", ja = "ラグビー{って}何人でするの？", en = "How many people do you need for a rugby game?" },
  { source = "yomeru", ja = "田中さんは来ない{って}。", en = "Tanaka says he isn't coming." },
]

[[point]]
id = "na-prohibition"
pattern = "な"
forms = []
jlpt = "N5"
meaning = "don't (a blunt command)"
formation = ["Verb［る］ + な   (走るな)"]
explanation = """
Forbids an action, bluntly: ここで走るな, "don't run here". It's the \
negative of the command form, common on signs, in sports, and from \
parents, bosses or friends speaking roughly."""
notes = """
It sounds harsh and mostly masculine; politely, use 〜ないでください, or \
〜ないで among friends. The verb stays in the dictionary form: 食べな \
(no る) is a casual 食べなさい, "eat". A sentence-final な after other \
forms is a soft exclamation: いいな, "how nice"."""
related = ["naide-kudasai", "command-form", "nasai"]
examples = [
  { tatoeba = "61929_224594", ja = "ここでは走る{な}。", en = "Don't run here." },
  { tatoeba = "23860_186724", ja = "火を消すのを忘れる{な}。", en = "Don't forget to put out the fire." },
  { source = "yomeru", ja = "危ないから、触る{な}。", en = "It's dangerous, so don't touch it." },
]

[[point]]
id = "nagara"
pattern = "ながら"
forms = []
jlpt = "N4"
meaning = "while (doing two things at once)"
formation = ["Verb［stem］ + ながら   (読みながら, 食べながら)"]
explanation = """
Joins two actions the same person does at the same time. The action \
before ながら is the background one; the main action comes last: \
歯を磨きながらニュースを聞く is listening to the news, while brushing."""
notes = """
Both actions must have the same subject: for "while he slept, I…" use \
〜間に or 〜うちに. The plain て-form also links two actions, but as a \
sequence or a means (歩いて行く, "go on foot"); ながら keeps them \
running side by side. With states or verbs like 知る, ながら(も) means \
"although" (知っていながら, "though he knew"): a separate, later pattern."""
related = ["aida-ni", "nagara-mo"]
examples = [
  { source = "yomeru", ja = "歯を磨き{ながら}ニュースを聞きます。", en = "I listen to the news while brushing my teeth." },
  { tatoeba = "314895_88812", ja = "彼女は手紙を読み{ながら}泣いた。", en = "She wept reading the letter." },
  { tatoeba = "1780_5171", ja = "「おはよう」とトムは微笑み{ながら}言った。", en = "\"Good morning\", said Tom with a smile." },
]

[[point]]
id = "you-ni-suru"
pattern = "ようにする"
forms = ["ようにしている", "ないようにする", "ようにしてください"]
jlpt = "N4"
meaning = "make an effort to, make sure that"
formation = [
  "Verb［る］ + ようにする",
  "Verb［ない］ + ようにする",
]
explanation = """
Says you take care to do something, again and again, or with the \
ない form to keep from doing it. ようにしている is an effort kept up as a habit: 階段を使う\
ようにしている, "I make a point of taking the stairs". ようにしてください is a \
polite way to ask someone to take care to do something."""
notes = """
ようにする is what you do on purpose; ようになる is a change that \
happens over time. Don't confuse it with 〜ようとする, an attempt at one \
moment (ドアを開けようとした, "I went to open the door"), not a lasting effort. Compare ことにする: deciding once, rather than trying \
regularly."""
related = ["you-ni-naru", "koto-ni-suru"]
examples = [
  { tatoeba = "70621_150543", ja = "時間を十分に利用する{ようにしなさい}。", en = "Try to make good use of your time." },
  { tatoeba = "318281_85431", ja = "必要以上にお金を使わない{ようにしなさい}。", en = "Try not to spend more money than is necessary." },
  { source = "yomeru", ja = "会議では、最初に結論を言う{ようにしています}。", en = "In meetings, I make a point of giving my conclusion first." },
]

[[point]]
id = "you-ni-naru"
pattern = "ようになる"
forms = ["ようになった", "ようになりました"]
jlpt = "N4"
meaning = "come to, get to the point of (a gradual change)"
formation = [
  "Verb［る］ + ようになる",
  "Verb［できる］ + ようになる   (泳げるようになる)",
]
explanation = """
Describes a change in ability, habit or attitude that came about over \
time. With a potential verb it means "became able to": 泳げるように\
なった, "I learned to swim". With other verbs it means "came to, \
started to": 料理をするようになった."""
notes = """
する verbs go through できる: 運転できるようになった. It isn't used \
with verbs that already mean a change (増える, 変わる). For a change \
towards not doing or not being able, Japanese usually says Verb［な̶い̶］ + なくなる (泳げなくなった) rather than ないようになる. When the \
change is your own deliberate effort, use ようにする."""
related = ["you-ni-suru", "naku-naru"]
examples = [
  { tatoeba = "293937_109752", ja = "彼は泳げる{ようになった}。", en = "He learned to swim." },
  { tatoeba = "301794_101899", ja = "彼は田舎の生活を楽しむ{ようになった}。", en = "He has begun to enjoy country life." },
  { tatoeba = "293349_110338", ja = "彼はリハビリの後、毎朝散歩する{ようになりました}。", en = "He came to take a walk every morning after rehabilitation." },
]

[[point]]
id = "te-yokatta"
pattern = "てよかった"
forms = ["でよかった", "て良かった", "なくてよかった", "てよかったです"]
jlpt = "N4"
meaning = "I'm glad that, it's a good thing that"
formation = [
  "Verb［て］ + よかった",
  "Verb［なくて］ + よかった",
  "［い］Adjective［くて］ + よかった",
  "［な］Adjective / Noun + でよかった",
]
explanation = """
Expresses relief or happiness about something that happened, or about \
something that didn't (なくてよかった). Common as a reply when things \
turned out well: 間に合ってよかった, "I'm glad we made it in time"."""
notes = """
Don't mix it up with 〜ばよかった, which looks back with regret: 行けば\
よかった, "I should have gone". 〜てよかった is about what did happen."""
related = ["ba-yokatta"]
examples = [
  { tatoeba = "61897_224568", ja = "ここで君に会え{てよかった}。", en = "It was nice meeting you here." },
  { tatoeba = "241066_173404", ja = "行きたい学校に入れ{てよかった}ね。", en = "Congratulations on being accepted to the school you've always wanted to go to." },
  { source = "yomeru", ja = "早めに家を出{てよかった}。電車が止まっていた。", en = "Good thing I left home early: the trains had stopped." },
]

[[point]]
id = "sou-da-appearance"
pattern = "そうだ"
forms = ["そうです", "そうな", "そうに", "そうにない", "なさそう", "よさそう", "そうにしている"]
jlpt = "N4"
meaning = "looks like, seems (from what you can see); about to"
formation = [
  "Verb［stem］ + そうだ   (降りそうだ)",
  "［い］Adjective［い̶］ + そうだ   (おいしそう)",
  "［な］Adjective + そうだ   (元気そう)",
  "いい → よさそう, ない → なさそう",
]
explanation = """
A guess from what you can see or sense right now: おいしそう, "it looks \
tasty". With verbs it often means something is about to happen: 雨が降\
りそうだ, "it looks like it's going to rain". It conjugates like a な-\
adjective: おいしそうなケーキ, 楽しそうに話す."""
notes = """
Not used when the quality is plain to see: a beautiful person is \
きれいな人, not きれいそう. かわいそう is its own word, "poor thing", \
not "looks cute". Compared with ようだ, そうだ is a first impression; \
ようだ is a judgement weighed from evidence. Don't confuse with the hearsay そうだ, which \
follows the plain form (降るそうだ, "I hear it will rain"). Negative \
guesses: なさそう for adjectives, Verb［stem］ + そうにない for verbs. \
〜そうにしている describes how someone looks or acts: 眠そうにしている."""
related = ["sou-da-hearsay", "you-da", "rashii"]
homographs = ["sou-da-hearsay"]
examples = [
  { tatoeba = "241717_172757", ja = "今にも嵐になり{そうだ}。", en = "A storm is imminent." },
  { tatoeba = "315134_88573", ja = "彼女は新しいドレスを着てうれし{そうだった}。", en = "She looked happy in her new dress." },
  { tatoeba = "249815_164692", ja = "私にはその仕事はでき{そうにない}。", en = "I don't feel equal to doing the work." },
]

[[point]]
id = "ta-ato-de"
pattern = "たあとで"
forms = ["だあとで", "た後で", "だ後で", "のあとで", "の後で", "たあとに", "た後に", "あとで", "後で", "あとに", "後に"]
jlpt = "N4"
meaning = "after (doing), after (something); later"
formation = ["Verb［た］ + あとで", "Noun + の + あとで   (授業のあとで)"]
explanation = """
Says that B happens after A. The verb is always in the past form, even \
about the future: 食べたあとで歯を磨く, "I brush my teeth after \
eating". After a noun, add の: 授業のあとで, "after class". On its own, \
あとで means "later": あとで電話します."""
notes = """
The opposite of 前に, which takes the dictionary form: never 食べるあと\
で. When B is an ongoing state rather than one action, drop で: 食べた\
あと、ずっと眠かった, "after eating, I was sleepy the whole time". 〜てから \
also means "after", but insists that A must come first."""
related = ["mae-ni", "te-kara"]
examples = [
  { tatoeba = "39175_201964", ja = "テレビを見{た後で}宿題するよ。", en = "I'll do my homework after I watch television." },
  { tatoeba = "245352_169135", ja = "仕事{の後で}、一杯どう？", en = "How about going out for a drink after work?" },
  { tatoeba = "32616_195442", ja = "また{後で}かけます。", en = "I'll call again later." },
]

[[point]]
id = "nakute-mo-ii"
pattern = "なくてもいい"
forms = ["なくてもいいです", "なくてもかまわない", "なくても構わない", "なくていい"]
jlpt = "N4"
meaning = "don't have to, no need to"
formation = [
  "Verb［な̶い̶］ + なくてもいい",
  "［な］Adjective / Noun + でなくてもいい   (今日でなくてもいい)",
]
explanation = """
Says that something isn't necessary: 急がなくてもいい, "you don't have \
to hurry". It's the negative of 〜てもいい: "it's fine even if you \
don't". As a question it asks to skip something: 行かなくてもいいです\
か, "is it all right if I don't go?"."""
notes = """
The opposite of 〜なくてはいけない, "must". Speech often drops も: なくて\
いい. Don't use 〜てはいけない for "don't have to": that is "must not". \
〜なくてもかまわない is a little more formal."""
related = ["te-mo-ii", "nakute-wa-ikenai", "te-wa-ikenai"]
examples = [
  { tatoeba = "19693_182548", ja = "急が{なくてもいい}よ。", en = "You can take your time." },
  { tatoeba = "281917_122086", ja = "入院し{なくてもいい}です。", en = "You don't have to stay in the hospital." },
  { tatoeba = "277602_126388", ja = "昼食は持ってこ{なくてもいい}よ。", en = "You do not have to bring your lunch." },
]

[[point]]
id = "naide"
pattern = "ないで"
forms = []
jlpt = "N4"
meaning = "without doing; instead of doing"
formation = ["Verb［ない］ + で"]
explanation = """
Says an action happens without another you might expect: 朝ご飯を食べ\
ないで学校に行った, "I went to school without eating breakfast". It \
can also mean "instead of": 寝ないで勉強した, "I studied instead of \
sleeping". At the end of a sentence it's a casual request: 行かないで, \
"don't go"."""
notes = """
〜なくて also joins a negative clause, but gives a cause: 雨が降らなくて\
困った, "it didn't rain, which was a problem". So "without doing" is \
ないで, not なくて. In writing, ずに means the same: 食べずに."""
related = ["naide-kudasai", "zu-ni"]
examples = [
  { tatoeba = "257745_156789", ja = "私は昨日は朝食をとら{ないで}家を出た。", en = "I left home without having breakfast yesterday." },
  { tatoeba = "39168_201957", ja = "テレビを見て{ないで}、外で遊びなさい。", en = "Play outside instead of watching TV." },
  { tatoeba = "250127_164382", ja = "私に手紙を書くのを忘れ{ないで}。", en = "Don't forget to write to me." },
]

[[point]]
id = "koto-ga-dekiru"
pattern = "ことができる"
forms = ["事ができる"]
jlpt = "N4"
meaning = "can, be able to"
formation = ["Verb［る］ + ことができる", "Noun + ができる   (日本語ができる)"]
explanation = """
Says that someone can do something, or that it is possible: 泳ぐことが\
できる, "I can swim". It means the same as the potential form (泳げる) \
but sounds more formal, so it's common in writing, rules and \
announcements: 図書館の本は二週間借りることができます."""
notes = """
In conversation the potential form is more natural. Use が, not を: \
泳ぐことをできる is wrong. The past ことができた means "managed to, was \
able to"; the negative is ことができない. With a skill noun, just が: \
ピアノができる."""
related = ["potential-form"]
examples = [
  { tatoeba = "259192_155347", ja = "私は走る{ことができる}。", en = "I'm able to run." },
  { tatoeba = "253761_160758", ja = "私はこの問題を解く{ことができる}。", en = "I can solve this problem." },
  { tatoeba = "313049_90663", ja = "彼女は感情を抑える{ことができなかった}。", en = "She couldn't suppress her emotions." },
]

[[point]]
id = "shika-nai"
pattern = "しか〜ない"
forms = ["しか", "しかない", "しかありません"]
jlpt = "N4"
meaning = "only, nothing but (with a negative)"
formation = ["Noun + しか + Verb［ない］", "Noun + particle + しか   (ここでしか)"]
explanation = """
Means "only", but always with a negative verb: 百円しかない, literally \
"there's nothing but 100 yen". It stresses that the amount is small or \
the choice limited, often with a sense of "not enough"."""
notes = """
The verb must be negative: 百円しかある is wrong. だけ also means "only" \
but is neutral and takes positive verbs: 百円だけある. しか replaces が \
and を and follows other particles: 日本でしか買えない, "you can only buy \
it in Japan". After a dictionary form, 〜しかない means "the only option \
is": 待つしかない, "all we can do is wait"."""
related = ["dake"]
examples = [
  { tatoeba = "18586_179727", ja = "金は少し{しかない}。", en = "I have little money." },
  { tatoeba = "250488_163005", ja = "私の家には狭い庭{しかない}。", en = "I have only a small garden." },
  { source = "yomeru", ja = "財布に千円{しかありません}。", en = "I only have 1,000 yen in my wallet." },
]

[[point]]
id = "ga-hoshii"
pattern = "がほしい"
forms = ["が欲しい", "ほしい", "欲しい"]
jlpt = "N4"
meaning = "want (something)"
formation = ["Noun + がほしい"]
explanation = """
Says you want a thing: 新しい車がほしい, "I want a new car". ほしい is \
an い-adjective, so the wanted thing takes が and it conjugates: ほしく\
ない, ほしかった. To want to do something, use 〜たい instead."""
notes = """
Like たい, it's for your own wishes or for asking the listener's; for \
someone else, use 〜をほしがっている. Asking a superior 何がほしいですか \
is too direct. Don't confuse with Verb［て］ + ほしい, "I want (you) to \
do". In a shop, 〜をください or 〜がほしいんですが is the polite way."""
related = ["tai", "te-hoshii", "wo-kudasai"]
examples = [
  { tatoeba = "68478_231111", ja = "あの鞄{が欲しい}。", en = "I want that bag." },
  { tatoeba = "270740_143826", ja = "水{が欲しい}のですが。", en = "I'd like some water." },
  { tatoeba = "25072_158166", ja = "私は何か食べるもの{が欲しい}。", en = "I want something to eat." },
]

[[point]]
id = "nasai"
pattern = "なさい"
forms = []
jlpt = "N4"
meaning = "do … (a firm instruction, to children or juniors)"
formation = ["Verb［stem］ + なさい"]
explanation = """
A command that is firm but not rude, used by parents to children, \
teachers to students, and in written instructions: 早く寝なさい, "go to \
bed now"; 次の質問に答えなさい, "answer the following questions". It \
comes from the polite verb なさる."""
notes = """
Only for people below you: to equals or superiors it sounds bossy, so \
use 〜てください. In tests and textbooks it's the standard instruction. \
Softer than the bare command form (食べろ). Casually it can shrink to \
な (早く寝な), not to be confused with the ban 寝るな, "don't sleep". \
ごめんなさい and おやすみなさい are set phrases."""
related = ["te-kudasai", "command-form"]
examples = [
  { tatoeba = "52176_214883", ja = "すぐに宿題をし{なさい}。", en = "Do your homework at once." },
  { tatoeba = "264887_149671", ja = "辞書でその句を調べ{なさい}。", en = "Look up the phrase in your dictionary." },
  { tatoeba = "61957_224622", ja = "ここではなくあそこに置き{なさい}。", en = "Put it there, not here." },
]

[[point]]
id = "toki"
pattern = "とき"
forms = ["時"]
jlpt = "N4"
meaning = "when, at the time (that)"
formation = [
  "Verb / ［い］Adjective + とき",
  "［な］Adjective + な + とき",
  "Noun + の + とき   (子供のとき)",
]
explanation = """
Says when something happens: 暇なとき、本を読む, "when I'm free, I \
read". とき is a noun, so it attaches like one: 子供のとき, "as a \
child"; 寒いとき, "when it's cold". It often takes に for a single \
moment, or は for contrast."""
notes = """
The tense before とき matters: 日本へ行くとき、カメラを買った means I \
bought it before going; 日本へ行ったとき、カメラを買った means I bought \
it once there. The past before とき says A is already done when B \
happens."""
related = ["tara", "aida-ni"]
examples = [
  { tatoeba = "245859_168632", ja = "子供の{とき}母が死んだ。", en = "My mother died when I was a kid." },
  { tatoeba = "246640_167858", ja = "私が家に帰った{とき}、彼女はテレビを見ていました。", en = "She was watching TV when I came home." },
  { source = "yomeru", ja = "暇な{とき}、よく映画を見ます。", en = "When I'm free, I often watch films." },
]

[[point]]
id = "amari-nai"
pattern = "あまり〜ない"
forms = ["あまり", "あんまり"]
jlpt = "N4"
meaning = "not very, not much"
formation = ["あまり + Verb［ない］", "あまり + ［い］Adjective［く］ + ない"]
explanation = """
With a negative, あまり softens it to "not very" or "not much": あまり\
高くない, "not very expensive"; あまり食べない, "I don't eat much". \
It's a polite way to say something is lacking without being blunt. In \
speech it often becomes あんまり."""
notes = """
Without a negative it doesn't mean "not very": あまり(に) with a \
positive means "so much, too much", a later point. 全然〜ない is the \
stronger "not at all". On its own, ええ、あまり… is a soft "not \
really"."""
related = ["zenzen"]
examples = [
  { tatoeba = "62250_224915", ja = "コーヒーは{あまり好きではない}。", en = "I don't care much for coffee." },
  { tatoeba = "41194_203952", ja = "たいていの仕事は{あまり楽しくない}。", en = "Most work is not very pleasant." },
  { tatoeba = "57339_220020", ja = "この部屋は{あまり日が当たらない}。", en = "This room does not get much sun." },
]

[[point]]
id = "sugiru"
pattern = "すぎる"
forms = ["過ぎる", "すぎ", "過ぎ"]
jlpt = "N5"
meaning = "too, too much"
formation = [
  "Verb［stem］ + すぎる   (食べすぎる)",
  "［い］Adjective［い̶］ + すぎる   (高すぎる)",
  "［な］Adjective + すぎる   (静かすぎる)",
]
explanation = """
Says something goes past the right amount: 食べすぎた, "I ate too \
much"; この本は難しすぎる, "this book is too hard". It conjugates as a \
る-verb (すぎた, すぎない). The stem すぎ works as a noun: 飲みすぎ, \
"drinking too much"."""
notes = """
いい becomes よすぎる; ない becomes なさすぎる (自信がなさすぎる). The \
tone is usually negative; for "very" without a problem, use とても. \
Don't confuse with the time すぎ: 三時すぎ, "past three"."""
related = ["amari-nai"]
examples = [
  { tatoeba = "55727_218416", ja = "これは高{すぎる}。", en = "That is too expensive." },
  { tatoeba = "45473_208216", ja = "その棚には本が多{すぎます}。", en = "You have too many books on the shelf." },
  { source = "yomeru", ja = "昨日は飲み{すぎた}。", en = "I drank too much yesterday." },
]

[[point]]
id = "kata"
pattern = "方"
forms = ["かた"]
jlpt = "N4"
meaning = "way of doing, how to"
formation = ["Verb［stem］ + 方   (読み方)", "Noun + の + Verb［stem］ + 方   (漢字の読み方)"]
explanation = """
Turns a verb into a noun meaning "the way of doing it": 読み方, "how \
to read"; 使い方, "how to use". Often with 教える or わかる: 駅への行き\
方を教えてください, "please tell me how to get to the station"."""
notes = """
The object takes の, not を: 漢字の書き方, not 漢字を書き方. For する-\
verbs, use the noun + の仕方: 運転の仕方. Read ほう, the same kanji \
means "side, direction" (〜のほうが): a different word."""
related = ["yori-hou-ga"]
examples = [
  { tatoeba = "284981_118681", ja = "彼に泳ぎ{方}を教えた。", en = "I taught him how to swim." },
  { tatoeba = "20110_182989", ja = "貴方はパソコンの使い{方}を知っていますか。", en = "Do you know how to use a personal computer?" },
  { tatoeba = "35393_198202", ja = "バスでの病院の行き{方}を教えてください。", en = "How can I get to the hospital by bus?" },
]

[[point]]
id = "te-aru"
pattern = "てある"
forms = ["てあります"]
jlpt = "N4"
meaning = "has been done (on purpose, and stays that way)"
formation = ["Verb［て］ + ある   (transitive verbs: 開けてある)"]
explanation = """
Describes a state left by someone's deliberate action: 窓が開けてある, \
"the window has been opened (and is open)". The thing takes が (or は), \
and who did it usually goes unsaid. It often means something is ready: \
名前が書いてある, "the name has been written on it"."""
notes = """
Use it with transitive verbs (開ける, 書く, 置く). Compare 窓が開いて\
いる, an intransitive verb with ている: the window is open, with no hint \
of anyone opening it. With を (切符を買ってある) it stresses the \
preparation. Close to 〜ておく, which is the act of preparing."""
related = ["te-iru", "te-oku"]
examples = [
  { source = "yomeru", ja = "机の上に花が飾っ{てある}。", en = "Some flowers have been set out on the table." },
  { source = "yomeru", ja = "窓が開け{てあります}。", en = "The window has been left open." },
  { source = "yomeru", ja = "冷蔵庫にビールが冷やし{てある}よ。", en = "There's some beer chilling in the fridge." },
]

[[point]]
id = "kashira"
pattern = "かしら"
forms = []
jlpt = "N4"
meaning = "I wonder (soft, mostly feminine)"
formation = ["Verb / ［い］Adjective + かしら", "［な］Adjective / Noun + かしら   (本当かしら)"]
explanation = """
Wonders aloud, half to oneself: 明日は晴れるかしら, "I wonder if it'll \
be sunny tomorrow". It can also soften a request: 手伝ってくれないかし\
ら, "could you help me, I wonder?"."""
notes = """
Traditionally feminine and a little old-fashioned; men and most younger \
speakers use かな instead. No だ before it after nouns: 雨かしら. Common \
in fiction and in older women's speech."""
related = ["kana"]
examples = [
  { source = "yomeru", ja = "このケーキ、おいしい{かしら}。", en = "I wonder if this cake tastes good." },
  { tatoeba = "323294_80422", ja = "明日は晴れる{かしら}。", en = "I wonder if it will clear up tomorrow." },
  { tatoeba = "292259_111424", ja = "彼はなぜ休んだの{かしら}。", en = "I wonder why he was absent." },
]

[[point]]
id = "demo"
pattern = "でも"
forms = []
jlpt = "N4"
meaning = "or something (soft suggestion); even; (opening) but"
formation = [
  "Noun + でも   (お茶でも)",
  "Question word + でも   (何でも, いつでも)",
  "でも + Sentence   (but)",
]
explanation = """
After a noun, でも gives a light example, "… or something": お茶でも飲み\
ませんか, "shall we have tea or something?". It also means "even": 子供\
でもわかる, "even a child understands". After a question word it makes \
"any-": 何でも, "anything"; いつでも, "any time". Opening a sentence, \
it's "but": でも、高いです."""
notes = """
The "or something" use keeps invitations light. As "but", it starts a \
new sentence; inside one sentence use けど or が. 何でも is "anything \
(at all)", while 何も + negative is "nothing"."""
related = ["kedo", "ka-mo-question-words"]
examples = [
  { tatoeba = "266103_148456", ja = "酒{でも}飲もうよ。", en = "Let's have a drink or something." },
  { tatoeba = "17376_233460", ja = "あなたの為なら何{でも}します。", en = "I will do anything for you." },
  { source = "yomeru", ja = "{でも}、今日は時間がありません。", en = "But I don't have time today." },
]

[[point]]
id = "hokani"
pattern = "ほかに"
forms = ["他に", "ほかには", "のほかに"]
jlpt = "N4"
meaning = "besides, other than, anything else"
formation = ["ほかに + Sentence   (ほかに質問はありますか)", "Noun + の + ほかに   (ギターのほかに)"]
explanation = """
Asks about or adds something beyond what was mentioned: ほかに質問は\
ありますか, "any other questions?". After a noun with の, it means \
"besides X": ギターのほかにピアノも弾く. With a negative, "nothing but": \
君のほかに友達がいない."""
notes = """
Shops use it a lot: ほかに何かいりますか, "anything else?". ほか alone \
is a noun, "other": ほかの人, "other people". 以外 is close and more \
formal."""
related = ["shika-nai"]
examples = [
  { tatoeba = "33614_196435", ja = "{ほかに}方法はありませんか。", en = "Is there no alternative to your method?" },
  { tatoeba = "310713_92996", ja = "彼女はギター{のほかに}ピアノも弾く。", en = "She plays piano as well as the guitar." },
  { tatoeba = "73806_236440", ja = "「{ほかに}何か要りますか」「それだけで結構です」", en = "\"Anything else?\" \"No, that's all.\"" },
]

[[point]]
id = "hotondo"
pattern = "ほとんど"
forms = ["殆ど"]
jlpt = "N4"
meaning = "almost, nearly; (with a negative) hardly"
formation = [
  "ほとんど + Verb / Adjective",
  "ほとんど + Verb［ない］",
  "ほとんど + の + Noun   (ほとんどの人)",
]
explanation = """
Means "almost (all)": 宿題はほとんど終わった, "my homework is almost \
done". With a negative, "hardly": ほとんど寝なかった, "I hardly slept". \
As a noun with の: ほとんどの学生, "most students"."""
notes = """
With 〜ところだった it means "nearly did (but didn't)": ほとんど遅れる\
ところだった, though もう少しで is more common there. ほとんど〜ない is \
stronger than あまり〜ない, "not much"."""
related = ["amari-nai", "zenzen"]
examples = [
  { tatoeba = "1439701_196097", ja = "{ほとんど}話せない。", en = "He can hardly speak." },
  { tatoeba = "277204_126886", ja = "地震の起こる危険は{ほとんど}ない。", en = "There is hardly any danger of an earthquake." },
  { source = "yomeru", ja = "クラスの{ほとんど}の人が来ました。", en = "Most people in the class came." },
]

[[point]]
id = "nan-mo"
pattern = "何〜も"
forms = ["何回も", "何度も", "何時間も", "何人も", "何年も", "何日も"]
jlpt = "N4"
meaning = "many (times, hours, people …), for hours"
formation = ["何 + Counter + も   (何回も, 何時間も)"]
explanation = """
何 with a counter and も stresses a large number: 何回も, "many times"; \
何時間も待った, "I waited for hours". It carries feeling, like "who \
knows how many"."""
notes = """
Mind the reading: 何人も is なんにんも, "many people". With a negative, \
one + counter + も means "not even one": 一度も行ったことがない. 何も + \
negative, without a counter, is "nothing": a different pattern."""
related = ["ka-mo-question-words", "ta-koto-ga-aru"]
examples = [
  { tatoeba = "24553_187417", ja = "{何時間も}海を眺めた。", en = "I gazed at the sea for hours." },
  { tatoeba = "43893_206645", ja = "その本を{何度も}読みなさい。", en = "Read the book again and again." },
  { tatoeba = "265438_149120", ja = "車が混んで{何時間も}動かなかった。", en = "We were stuck for hours in a traffic jam." },
]

[[point]]
id = "sorede"
pattern = "それで"
forms = []
jlpt = "N4"
meaning = "so, that's why; (in conversation) and then?"
formation = ["Sentence。 + それで + Sentence"]
explanation = """
Opens a sentence with the result of what came before: 寝坊した。それ\
で、バスに乗り遅れた, "I overslept. So I missed the bus". In conversation, それで？ urges the speaker on: "and \
then?"."""
notes = """
The result is something that happened or was decided; before an order \
or an invitation, use だから: だから、早く寝なさい. それでは (では, じゃ) \
is different: "well then", to move on or wrap up. Casually, それで \
shrinks to で: で、どうなったの？"""
related = ["sorekara", "node"]
examples = [
  { tatoeba = "42966_205721", ja = "{それで}彼らは夢を見ることができなかった。", en = "So they were not able to dream." },
  { source = "yomeru", ja = "財布を忘れた。{それで}、何も買えなかった。", en = "I forgot my wallet, so I couldn't buy anything." },
  { source = "yomeru", ja = "道が混んでいました。{それで}、遅れました。", en = "The roads were busy. That's why I was late." },
]

[[point]]
id = "soreni"
pattern = "それに"
forms = []
jlpt = "N4"
meaning = "besides, moreover, on top of that"
formation = ["Sentence。 + それに + Sentence"]
explanation = """
Adds another point in the same direction, often one more reason: この\
部屋は広い。それに、駅に近い, "this room is big. And on top of that, \
it's close to the station"."""
notes = """
Both points should support the same conclusion (both good, or both \
bad). それに can also be それ + に, "to that": それに賛成です, "I agree \
with that"; context tells them apart. More formal: そのうえ, さらに."""
related = ["sorekara", "shi"]
examples = [
  { tatoeba = "42954_205709", ja = "{それに}、みんなに仲間もできるしね。", en = "And, we get each other's company to boot." },
  { source = "yomeru", ja = "この店は安い。{それに}、おいしい。", en = "This place is cheap. And the food is good, too." },
  { source = "yomeru", ja = "今日は疲れた。{それに}、雨も降っている。", en = "I'm tired today. And it's raining, too." },
]

[[point]]
id = "baai"
pattern = "場合"
forms = ["場合は", "ばあい", "ばあいは"]
jlpt = "N4"
meaning = "in case of, if, when (a possible situation)"
formation = [
  "Verb / ［い］Adjective + 場合",
  "［な］Adjective + な + 場合",
  "Noun + の + 場合   (雨の場合)",
]
explanation = """
Sets up a possible situation and says what applies then: 雨の場合は\
中止です, "in case of rain, it's cancelled"; 遅れる場合は電話してくだ\
さい, "if you're going to be late, please call". Common in rules, \
instructions and notices."""
notes = """
Not for one event that actually happened: for "when I went to Kyoto", \
use とき. Compared with 〜たら, 場合 sounds more formal and suits \
general cases."""
related = ["toki", "tara"]
examples = [
  { tatoeba = "23813_186677", ja = "火事の{場合は}ベルを鳴らせ。", en = "In case of fire, ring the bell." },
  { tatoeba = "18801_179942", ja = "緊急の{場合は}、１１９番に電話しなさい。", en = "In case of emergency, call 119." },
  { tatoeba = "58403_221087", ja = "この{場合は}君が悪い。", en = "You're wrong in this case." },
]

[[point]]
id = "te-ageru"
pattern = "てあげる"
forms = ["であげる", "てさしあげる", "でさしあげる"]
jlpt = "N4"
meaning = "do something for someone (as a favour)"
formation = ["Verb［て］ + あげる"]
explanation = """
You do something that helps someone else, or one person does it for \
another: 妹に本を読んであげた, "I read my little sister a book". Like \
あげる on its own, the favour goes away from you and your side, never \
toward you: for that, use 〜てくれる."""
notes = """
The person helped keeps the particle the verb takes: 友達にお金を貸して\
あげる, 友達を手伝ってあげる, 友達の荷物を持ってあげる. Said to the \
person's face it stresses your kindness, which is fine between friends \
(手伝ってあげようか) but rude to a superior: offer お持ちします instead. \
てさしあげる is the humble version, and てやる is used toward animals, \
plants or younger family."""
related = ["ageru", "te-kureru", "te-morau", "te-yaru"]
examples = [
  { tatoeba = "6897855_178707", ja = "君にこの本を貸し{てあげよう}。", en = "I'll lend you this book." },
  { tatoeba = "308904_94802", ja = "彼女に人形を買っ{てあげた}。", en = "I got her a doll." },
  { tatoeba = "261159_153385", ja = "私は彼女にドレスを作っ{てあげた}。", en = "I made her a dress." },
]

[[point]]
id = "te-kureru"
pattern = "てくれる"
forms = ["でくれる", "てくれませんか", "でくれませんか", "てくれない", "でくれない", "てくれてありがとう", "てくれますか", "でくれますか"]
jlpt = "N4"
meaning = "do something for me / us (a favour received)"
formation = ["Verb［て］ + くれる"]
explanation = """
Someone does something that helps you or your side, and is the \
subject: 友達が駅まで送ってくれた, "a friend drove me to the station". \
It adds that you are grateful, so Japanese uses it much more often than \
English says "for me". As a question, 〜てくれる？ or 〜てくれません\
か asks someone to do something."""
notes = """
Leaving it out sounds cold: 友達が手伝った states a fact, 手伝って\
くれた thanks them. Never for a favour to someone outside your side: \
use 〜てあげる. The respectful version, for superiors, is 〜てくださる. \
Requests from casual to polite: 〜てくれる？, 〜てくれませんか, \
〜てもらえませんか, 〜ていただけませんか. Said of trouble, it turns \
sarcastic: やってくれたね, "well, you've done it now"."""
related = ["kureru", "te-ageru", "te-morau", "te-itadakemasen-ka"]
examples = [
  { tatoeba = "320752_82964", ja = "母は私に新しいドレスを買っ{てくれた}。", en = "My mother bought me a new dress." },
  { tatoeba = "297729_105957", ja = "彼は私に野菜を取っ{てくれた}。", en = "He got me some vegetables." },
  { tatoeba = "39177_201966", ja = "テレビをつけ{てくれる}？", en = "Will you turn on the TV?" },
]

[[point]]
id = "te-morau"
pattern = "てもらう"
forms = ["でもらう", "てもらえますか", "でもらえますか", "てもらえませんか", "でもらえませんか", "てもらえない", "でもらえない"]
jlpt = "N4"
meaning = "have someone do something, get something done (for you)"
formation = ["Person + に + Verb［て］ + もらう"]
explanation = """
You receive a favour: someone does something for you, and you are the \
subject. The person who does it takes に: 友達に写真を撮ってもらった, \
"a friend took my picture for me". 〜てもらえますか and 〜てもらえ\
ませんか, "could you…?", are common polite requests."""
notes = """
The same event, two views: 友達に手伝ってもらった puts you in front, \
友達が手伝ってくれた puts the friend's kindness in front. てもらう also \
covers having a job done by someone paid for it: 時計を直してもらう. \
When something is passed on, like knowledge, から works too: 友達から\
教えてもらった. The humble version, from a superior, is 〜ていただく."""
related = ["morau", "te-kureru", "te-ageru", "te-itadakemasen-ka"]
examples = [
  { tatoeba = "252334_162181", ja = "私は、彼に写真を撮っ{てもらった}。", en = "I had him take my picture." },
  { tatoeba = "52761_215460", ja = "ジョンに時計を直し{てもらう}つもりだ。", en = "I am going to have John repair my watch." },
  { source = "yomeru", ja = "ちょっと手伝っ{てもらえますか}。", en = "Could you help me a little?" },
]

[[point]]
id = "te-itadakemasen-ka"
pattern = "ていただけませんか"
forms = ["でいただけませんか", "ていただけますか", "でいただけますか", "ていただけないでしょうか", "ていただく", "でいただく"]
jlpt = "N4"
meaning = "could you please…? (very polite request)"
formation = ["Verb［て］ + いただけませんか"]
explanation = """
A polite request to a stranger, a customer or someone above you. It is \
built on いただく, the humble word for "receive", in its "can't I?" \
form: roughly "could I not receive the favour of…?". 少し待っていた\
だけませんか, "would you mind waiting a moment?"."""
notes = """
Asking with ませんか is softer than with ますか, and ていただけないで\
しょうか softer still. 〜ていただく on its own is the humble \
〜てもらう: 先生に教えていただいた, "my teacher kindly taught me". \
Between friends it sounds stiff: 〜てくれる？ is enough."""
related = ["te-morau", "te-kureru", "te-kudasai"]
examples = [
  { tatoeba = "267764_146797", ja = "少し待っ{ていただけませんか}。", en = "Would you mind waiting a moment?" },
  { tatoeba = "29780_192616", ja = "ラジオの音を小さくし{ていただけませんか}。", en = "Could you turn down the radio?" },
  { tatoeba = "26020_188873", ja = "駅へ行く道を教え{ていただけません}でしょうか。", en = "Could you tell me the way to the station?" },
]

[[point]]
id = "te-miru"
pattern = "てみる"
forms = ["でみる", "てみたら", "てみると"]
jlpt = "N4"
meaning = "try doing, do and see"
formation = ["Verb［て］ + みる"]
explanation = """
Doing something to find out what it is like or how it turns out: この\
靴をはいてみてもいいですか, "may I try these shoes on?". \
〜てみたい is "I'd like to try", and 〜てみたら？ suggests someone \
give it a go."""
notes = """
It is "try out", not "make an effort": for an attempt that may fail, \
use the volitional + とする: 起きようとした, "I tried to get up". \
So 〜てみた means you really did it, whatever the result. 〜てみたら / \
〜てみると + a past tense tells what you found: 開けてみたら空だった, \
"when I opened it, it was empty". Usually in kana."""
related = ["you-to-suru"]
examples = [
  { tatoeba = "67906_230539", ja = "あの店は行っ{てみました}か。", en = "Have you tried that store?" },
  { tatoeba = "58864_221540", ja = "この辞書とあの辞書を比べ{てみよう}。", en = "Let's compare this dictionary with that one." },
  { tatoeba = "33109_195934", ja = "ホワイトさんに聞い{てみたら}？", en = "Why don't you ask Mr White?" },
]

[[point]]
id = "te-oku"
pattern = "ておく"
forms = ["でおく", "て置く", "で置く"]
jlpt = "N4"
meaning = "do in advance, do for later; leave as is"
formation = [
  "Verb［て］ + おく",
  "Verb［て］ → とく / どく (casual: 買っとく, 読んどく)",
]
explanation = """
Doing something now so that it is ready later: 旅行の前にホテルを予約\
しておく, "book a hotel before the trip". It also means leaving \
something the way it is, on purpose: 窓を開けておいて, "leave the \
window open". In speech ておく shortens to とく, and でおく to どく."""
notes = """
ておく is your action of getting things ready; 〜てある describes the \
state that results: 予約しておいた, "I booked it", 予約してある, "it's \
booked". It needs an action someone chooses to do, so not ×雨が降って\
おく. 考えておきます, "I'll think about it", is also a polite way to \
put off a decision."""
related = ["te-aru", "te-shimau"]
examples = [
  { tatoeba = "257865_156669", ja = "私は三週間前にホテルを予約し{ておいた}。", en = "I reserved my hotel room three weeks in advance." },
  { tatoeba = "452251_213562", ja = "そこ閉め{ておいて}。", en = "Leave it closed." },
  { tatoeba = "286098_117567", ja = "彼の言ったことを覚え{ておき}なさい。", en = "Bear in mind what he said." },
]

[[point]]
id = "te-iku"
pattern = "ていく"
forms = ["でいく", "て行く", "で行く"]
jlpt = "N4"
meaning = "go (doing), take along; (change) from now on"
formation = ["Verb［て］ + いく"]
explanation = """
Two uses. Literally, doing something and then going, or going in a \
certain way: 傘を持っていく, "take an umbrella"; 歩いていく, "walk \
there". With change, something carries on from now into the future: \
これから寒くなっていく, "it'll keep getting colder from here on"."""
notes = """
〜てくる is its mirror: movement toward the speaker, or a change that has \
built up until now. It also says something fades away: 消えていく. In \
speech ていく often shortens to てく: 持ってく. The second use is \
usually written in kana."""
related = ["te-kuru"]
examples = [
  { tatoeba = "281069_122854", ja = "日増しに寒くなっ{ていく}。", en = "It is getting colder day by day." },
  { tatoeba = "276178_137058", ja = "誰かが帽子を忘れ{ていった}。", en = "Somebody has left his hat." },
  { tatoeba = "73197_235817", ja = "１羽の鳥が木に飛ん{でいった}。", en = "A bird flew into the tree." },
]

[[point]]
id = "te-kuru"
pattern = "てくる"
forms = ["でくる", "て来る", "で来る"]
jlpt = "N4"
meaning = "come (doing), go and come back; (change) has begun"
