  { tatoeba = "71219_233846", ja = "あなたと健{とどちらが}背が高いですか。", en = "Who is taller, you or Ken?" },
  { tatoeba = "275094_138141", ja = "太陽と地球{とではどちらが}大きいですか。", en = "Which is larger, the sun or the earth?" },
]

[[point]]
id = "wa-ga"
pattern = "は〜が"
forms = []
jlpt = "N5"
meaning = "as for A, B is … (describing a part or aspect of A)"
formation = ["Noun A + は + Noun B + が + Adjective"]
explanation = """
は sets the topic, and が marks the part or aspect being described: \
キリンは首が長い, "giraffes have long necks" (literally "as for \
giraffes, the neck is long"). The same frame gives likes, skills and \
wants: 私は猫が好きです, 兄は料理が上手です."""
notes = """
With 好き, 嫌い, 上手, ほしい, わかる and できる, the thing takes が, not \
を: 私は猫を好き is wrong. It's the natural way to describe someone's \
body, family or belongings: 彼女は髪が長い. Having は and が in one \
clause is normal."""
related = ["no-ga-suki", "ga-hoshii"]
examples = [
  { tatoeba = "1025484_2310031", ja = "トム{は声が}高い。", en = "Tom has a high-pitched voice." },
