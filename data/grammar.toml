がきっかけで puts the trigger as the subject: 友だちの一言がきっかけで. \
For a cause that simply produces a result (an accident, a delay), use \
で or せいで, not きっかけ: きっかけ is about something beginning. \
を契機に is a stiffer written equivalent."""
related = ["wo-tooshite", "sei-de"]
examples = [
  { tatoeba = "328444_75275", ja = "松川先生との出会い{をきっかけに}、私の人生は変わった。", en = "My life changed, sparked by meeting Mr Matsukawa." },
  { source = "yomeru", ja = "留学{をきっかけに}、料理を始めた。", en = "Studying abroad got me started cooking." },
  { source = "yomeru", ja = "友だちの一言{がきっかけで}、ピアノを習い始めた。", en = "A friend's remark got me to start piano lessons." },
]

[[point]]
id = "wo-chuushin-ni"
pattern = "を中心に"
forms = ["を中心にして", "を中心として", "をちゅうしんに", "を中心とする", "を中心とした"]
jlpt = "N3"
