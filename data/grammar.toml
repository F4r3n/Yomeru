explanation = """
Tells others what you've decided or are thinking of doing: 今年は日本へ\
行こうと思う, "I'm thinking of going to Japan this year". 〜ようと思いま\
す is the polite version."""
notes = """
〜ようと思う often voices a decision made just now; 〜ようと思っている is \
a plan held for a while, and the form for someone else's intention \
(彼は〜ようと思っている). つもりだ sounds firmer and more settled. Don't \
confuse with 〜だろうと思う, "I think it will probably…": a guess, not an \
intention."""
related = ["volitional", "tsumori"]
examples = [
  { tatoeba = "257634_156901", ja = "私は今夜ふろに入{ろうと思います}。", en = "I think I'll take a bath tonight." },
  { tatoeba = "252249_162265", ja = "私は、今の職をやめ{ようと思っています}。", en = "I am going to leave my present job." },
  { source = "yomeru", ja = "夏休みに運転を習{おうと思う}。", en = "I think I'll learn to drive over the summer break." },
]

[[point]]
id = "command-form"
pattern = "命令形"
forms = ["しろ", "来い", "せよ"]
jlpt = "N4"
meaning = "do it! (blunt command form)"
formation = [
  "う-Verb: last kana to the え row   (行く → 行け, 待つ → 待て)",
  "る-Verb: る → ろ   (食べる → 食べろ)",
  "する → しろ (written: せよ), 来る → 来い",
]
explanation = """
The bluntest way to order someone to do something: 早く寝ろ, "go to \
bed!". In conversation it's mostly men with close friends, or shouts in \
emergencies and sports (走れ！). It's common on signs, in slogans and \
exam instructions, and in reported orders: 早く来いと言われた, "I was \
told to hurry up and come"."""
notes = """
Rude in most real situations: 〜てください or 〜なさい are the safe \
choices. The negative command is Verb［る］ + な (行くな, "don't go"). \
Cheering uses it without rudeness: がんばれ！. くれる has its own form, \
くれ: 待ってくれ, "wait for me"."""
related = ["nasai", "na-prohibition", "te-kudasai"]
hover = false
examples = [
  { tatoeba = "52251_214984", ja = "すぐここに{来い}。", en = "Come here at once." },
  { tatoeba = "39030_201818", ja = "ドアをたたくのはやめ{ろ}。", en = "Stop beating on the door!" },
  { source = "yomeru", ja = "危ない！止ま{れ}！", en = "Look out! Stop!" },
]

[[point]]
id = "passive"
pattern = "られる"
forms = ["れる"]
jlpt = "N4"
meaning = "be done (to), get (passive form)"
formation = [
  "う-Verb: last kana to the あ row + れる   (書く → 書かれる, 言う → 言われる)",
  "る-Verb: る → られる   (食べる → 食べられる)",
  "する → される, 来る → 来られる",
]
explanation = """
Turns the sentence around so the one affected becomes the subject, with \
the doer marked by に: 先生にほめられた, "I was praised by the \
teacher". It also states facts with no doer in mind: この橋は二年前に建\
てられた, "this bridge was built two years ago"."""
notes = """
Japanese also uses it to say you were affected, usually badly, even with \
verbs that take no object: 雨に降られた, "I got caught in the rain". \
Something of yours can stay as the object: 財布を盗まれた, "I had my \
wallet stolen". For る-verbs it looks like the potential form \
(食べられる): context tells. For who made or wrote something, use \
〜によって."""
related = ["potential-form", "causative-passive"]
homographs = ["potential-form"]
hover = false
examples = [
  { tatoeba = "59650_222324", ja = "この橋は二年前に建て{られた}。", en = "This bridge was built two years ago." },
  { tatoeba = "64556_227207", ja = "お金を盗ま{れた}。", en = "My money was stolen." },
  { tatoeba = "26767_189616", ja = "雨に降{られて}ぬれちゃったよ。", en = "I was caught in the rain and got wet." },
]

[[point]]
id = "causative"
pattern = "させる"
forms = ["せる", "させます"]
jlpt = "N4"
meaning = "make or let (someone) do"
formation = [
  "う-Verb: last kana to the あ row + せる   (行く → 行かせる)",
  "る-Verb: る → させる   (食べる → 食べさせる)",
  "する → させる, 来る → 来させる",
]
explanation = """
Someone makes or lets another person do something: 子供に野菜を食べさせ\
る, "make the kids eat vegetables". Context decides which: a boss who \
残業させる makes you work late, parents who 遊ばせる let the kids \
play."""
notes = """
The one doing the action takes に when the verb has an object (子供に本\
を読ませる). With verbs that take none, を leans toward "make" (弟を泣か\
せた) and に toward "let". To ask to do something yourself: 〜させてくだ\
さい; with てあげる / てくれる it clearly means "let": 行かせてあげる. It \
goes from above to below: you don't 〜させる a superior."""
related = ["causative-passive", "sasete-kudasai", "passive"]
hover = false
examples = [
  { tatoeba = "306665_97039", ja = "彼らは私たちを一晩中働か{せた}。", en = "They made us work all night." },
  { tatoeba = "293415_110273", ja = "彼はわざと私を待た{せた}。", en = "He kept me waiting on purpose." },
  { tatoeba = "245622_168867", ja = "子どもに酒を飲ま{せて}はいけない。", en = "You should not give liquor to children." },
]

[[point]]
id = "causative-passive"
pattern = "させられる"
forms = ["せられる"]
jlpt = "N4"
meaning = "be made to do (against your will)"
formation = [
  "う-Verb: last kana to the あ row + せられる / される   (行かせられる, 行かされる)",
  "る-Verb: る → させられる   (食べる → 食べさせられる)",
  "する → させられる, 来る → 来させられる",
]
explanation = """
Causative plus passive: someone made you do something, usually something \
you didn't want to: 子供のころ、野菜を食べさせられた, "as a kid I was made \
to eat vegetables". The one who made you takes に."""
notes = """
う-verbs usually take the short form: 待たされる, 飲まされる. Verbs ending \
in す keep the long one (話させられる, not ×話さされる), and る-verbs have \
no short form. It often carries a complaint: 一時間も待たされた, "they \
kept me waiting a whole hour"."""
related = ["causative", "passive"]
examples = [
  { tatoeba = "294483_109208", ja = "彼は歌いたくなかったが、彼らに歌わ{された}。", en = "He didn't like to sing but they made him sing." },
  { tatoeba = "312546_91168", ja = "彼女は一時間以上待た{された}。", en = "She was made to wait for over an hour." },
  { tatoeba = "254089_160432", ja = "私はそこへ行か{された}。", en = "I was made to go there." },
]

[[point]]
id = "sasete-kudasai"
pattern = "させてください"
forms = ["せてください", "させてもらえませんか", "させていただけませんか", "させてくれ"]
jlpt = "N4"
meaning = "please let me (do), allow me to"
formation = ["Verb［causative］［て］ + ください   (行かせてください, 休ませてください)"]
explanation = """
Asks to be allowed to do something yourself, using the causative ("let \
me"): 私に払わせてください, "please let me pay". It is also a polite way \
to step in and do something: 説明させてください, "let me explain"."""
notes = """
More polite: 〜させていただけませんか; casual: 〜させて, or 〜させてくれ \
(rough). 〜させていただきます announces what you're about to do and is \
very common in business speech. 〜てもいいですか asks whether something \
is allowed; 〜させてください asks the listener to let you."""
related = ["causative", "te-mo-ii", "te-kudasai"]
examples = [
  { tatoeba = "250112_164396", ja = "私に行か{せてください}。", en = "Let me go!" },
  { tatoeba = "31471_194298", ja = "もう一度私にやら{せてくれ}ますか。", en = "Will you let me try once more?" },
  { source = "yomeru", ja = "この仕事は私にやら{せてください}。", en = "Please let me do this job." },
]

[[point]]
id = "ba-yokatta"
pattern = "ばよかった"
forms = ["たらよかった", "ばよかったのに", "たらよかったのに", "なければよかった", "なければよかったのに"]
jlpt = "N4"
meaning = "should have, I wish I had (regret)"
formation = [
  "Verb［ば］ + よかった   (行けばよかった)",
  "Verb［た］ + らよかった   (行ったらよかった)",
  "Verb［な̶い̶］ + なければよかった   (言わなければよかった)",
]
explanation = """
Looks back at something you didn't do and wishes you had: もっと勉強す\
ればよかった, "I should have studied more". The negative なければよかった \
regrets something you did: 言わなければよかった, "I wish I hadn't said \
it". 〜たらよかった means the same and is more casual."""
notes = """
Adding のに sounds more frustrated or sorry; about someone else it's a \
mild reproach: 来ればよかったのに, "you should have come". Before the \
fact, 〜ばいい gives advice instead. Don't confuse with 〜てよかった, \
"I'm glad that…"."""
related = ["ba", "tara-ii", "te-yokatta"]
examples = [
  { tatoeba = "237658_176803", ja = "君も一緒に来れ{ばよかったのに}。", en = "I wish you could have come with me." },
  { tatoeba = "66934_229574", ja = "あんなに恐ろしい映画は見{なければよかった}なあ。", en = "I wish I hadn't seen such a horrible film." },
  { tatoeba = "51805_214513", ja = "スペイン語が話せ{たらよかったのに}。", en = "I wish I could have spoken Spanish." },
]

[[point]]
id = "tara-dou"
pattern = "たらどう"
forms = ["だらどう", "たらどうですか", "たらいかがですか", "たら？"]
jlpt = "N4"
