  { source = "yomeru", ja = "経験{から言って}、それは無理だと思う。", en = "Speaking from experience, I don't think that's possible." },
  { source = "yomeru", ja = "値段{から言うと}、こっちのほうがいいね。", en = "In terms of price, this one is better." },
  { source = "yomeru", ja = "十五歳は、日本{で言うと}中学三年生だ。", en = "Fifteen is, in Japan, the third year of junior high." },
]

[[point]]
id = "koso"
pattern = "こそ"
forms = ["こそが", "こそは"]
jlpt = "N3"
meaning = "precisely, the very; this one (and no other)"
formation = ["Noun (+ particle) + こそ   (今度こそ, ここでこそ)"]
explanation = """
Puts strong stress on one item as the one that really counts: 今度こそ\
勝つ, "this time I'll win for sure", which implies the earlier tries \
failed. これこそ探していた本だ is "this is the very book I was looking \
for". In a reply it turns thanks or an apology back: こちらこそ, "no, \
thank *you*"."""
notes = """
こそ takes the place of は, が and を (今年こそ, not ×今年はこそ); other \
particles stay before it (ここでこそ). It also turns a reproach back: \
君こそ遅れたじゃないか, "you're the one who was late!". Compare さえ, "even", and \
だけ, "only". からこそ, "precisely because", has its own entry. \
ようこそ ("welcome") and そこそこ ("fairly") are separate words."""
related = ["kara-koso", "sae", "dake"]
examples = [
  { tatoeba = "17692_178837", ja = "君{こそ}私が探していた人だ。", en = "You are the man I've been looking for." },
  { tatoeba = "56128_218813", ja = "これ{こそ}求めていたものですよ。", en = "That's just what I wanted." },
  { source = "yomeru", ja = "今度{こそ}試験に合格するぞ。", en = "This time I'll pass the exam for sure." },
]

[[point]]
id = "particle-plus-no"
pattern = "への"
forms = ["での", "までの", "からの", "との"]
hover = false
jlpt = "N3"
meaning = "to, at, from, with … (a particle linking to a noun)"
formation = ["Noun + への / での / までの / からの / との + Noun   (友達への手紙)"]
explanation = """
Particles like へ, で, まで, から and と can't describe a noun on their \
own; adding の lets them: 日本での生活, "life in Japan"; 駅までの道, \
"the way to the station"; 母からの手紙, "a letter from my mother"."""
notes = """
に never takes の: 友達への手紙, not ×友達にの手紙, so への stands in \
for both に and へ. Nor do を and が: the object links with plain の \
(日本語の勉強, not ×日本語をの勉強). The pair is a link and nothing more: \
日本での生活 means the same as 日本の生活, with the place stressed."""
related = ["no-particle", "e-particle", "de-particle", "ni-oite"]
examples = [
  { tatoeba = "21507_184379", ja = "学校{への}近道だよ。", en = "It's a shortcut to the school." },
  { tatoeba = "279715_124279", ja = "東京{での}生活には慣れましたか？", en = "Have you got used to living in Tokyo?" },
  { tatoeba = "25998_188851", ja = "駅{までの}道を教えて下さい。", en = "Could you please tell me how to get to the station?" },
]

[[point]]
id = "koto-na-no"
pattern = "ことなの"
forms = ["ことなんだ", "ことなんです", "ことなのです", "ってことなの"]
jlpt = "N3"
meaning = "it's that…, it's a matter of (explaining)"
formation = [
  "Verb / ［い］Adjective + ことなの",
  "［な］Adjective + な + ことなの   (大切なことなんです)",
]
explanation = """
Wraps a point up as a "matter" and gives it the explaining tone of \
んです: 大切なことなんです, "this is something important (so listen)". \
It often closes a definition begun with というのは, and どういうことなの？ \
asks "what is this supposed to mean?", often with surprise or \
annoyance."""
notes = """
Casual ことなの and ことなんだ, polite ことなんです; ことなのです is \
written. Plain んです explains a situation; ことなんです sets out the \
point as a fact to take in. After a noun, こと means "about": 彼のことな\
の is "it's about him"."""
related = ["n-desu", "to-iu-no-wa", "koto-nominalizer"]
examples = [
  { tatoeba = "275788_137448", ja = "大切な{ことなんだ}から。", en = "Now, this is really important." },
  { tatoeba = "25065_187926", ja = "何か深刻な{ことなのです}か。", en = "Is it anything serious?" },
  { tatoeba = "271236_143331", ja = "これはいったいどういう{ことなの}。", en = "What does all this add up to?" },
]

[[point]]
id = "nai-kana"
pattern = "ないかな"
forms = ["ないかなあ", "ないかなぁ", "ないかなー"]
jlpt = "N3"
meaning = "I wish … would; could you … (casual)"
formation = [
  "Verb［ない］ + かな   (来ないかな)",
  "Verb［て］ + くれないかな / もらえないかな   (request)",
]
explanation = """
Wishes for something outside your control, often impatiently: 早くバス\
が来ないかな, "I wish the bus would hurry up and come". The verb is \
negative but you want it to happen. With くれない or もらえない it \
becomes a soft casual request: 手伝ってくれないかな, "could you help \
me?"."""
notes = """
The same words can be a real doubt: 間に合わないかな, "I wonder if \
we'll be late". Context decides; wishes are usually about events, often \
with 早く or もう. Casual only: to a superior, 〜ていただけませんか. \
んじゃないかな is a guess, "probably", not a wish."""
related = ["kana", "nai-ka", "n-ja-nai", "te-kureru"]
examples = [
  { tatoeba = "328794_74925", ja = "何かいいこと{ないかな}。", en = "I wish something nice would happen." },
  { tatoeba = "272061_142509", ja = "静かになら{ないかなぁ}。いらいらするな。", en = "I wish that noise would stop. It gets on my nerves." },
  { tatoeba = "64696_227344", ja = "お願いを聞いてもらえ{ないかな}。", en = "I wonder if you could do me a favor." },
]

[[point]]
id = "te-mo-minai"
pattern = "てもみない"
forms = ["てもみなかった", "でもみない", "でもみなかった", "てもみません", "てもみませんでした"]
jlpt = "N3"
meaning = "never even (thought, imagined)"
formation = ["Verb［て］ + もみない   (思ってもみない)"]
explanation = """
Stresses that something hadn't crossed your mind at all, usually about \
something that then happened: 優勝するなんて思ってもみなかった, "I never \
even imagined we'd win". Almost always with 思う, 考える or 想像する, and \
in the past."""
notes = """
Literally "not even try to think": てみる plus も. Before a noun it \
describes the unexpected: 思ってもみないこと, "something I never \
imagined". 夢にも思わなかった is a stronger set phrase; plain 〜とは思わ\
なかった is a simple "I didn't think"."""
related = ["te-miru", "sae"]
examples = [
  { tatoeba = "254881_486397", ja = "そんなところで彼女と会うなんて、思っ{てもみなかった}。", en = "Never did I expect to see her in such a place." },
  { tatoeba = "50198_212913", ja = "そのときは、母親のことなど考え{てもみなかった}。", en = "At the time, she gave no thought to her mother." },
  { source = "yomeru", ja = "日本に住むなんて、思っ{てもみなかった}。", en = "I never even imagined I'd live in Japan." },
]

[[point]]
id = "to-iu-hodo-de-wa-nai"
pattern = "というほどではない"
forms = ["というほどではありません", "というほどじゃない", "というほどでもない", "ほどではない", "ほどじゃない", "ほどでもない"]
jlpt = "N3"
meaning = "not so much as to call it, not to the point of"
formation = [
  "Noun / Verb / Adjective + というほどではない   (病気というほどではない)",
  "Noun / Verb［る］ + ほどではない   (心配するほどではない)",
]
explanation = """
Plays something down: it's there, but not to the degree the word \
suggests. 頭が少し痛いけど、病気というほどではない, "my head hurts a \
bit, but I wouldn't call it being ill". Without という it measures \
against a level: 心配するほどではない, "it's nothing to worry about"."""
notes = """
ほどでもない adds "not even": それほどでもない is the modest reply to a \
compliment, "oh, not really". ほど〜ない compares two things with an \
adjective (昨日ほど寒くない); here ほどではない closes the sentence on \
its own."""
related = ["hodo-nai", "kurai-extent", "to-iu"]
examples = [
  { tatoeba = "324396_79321", ja = "友達{というほどではない}が知り合いだ。", en = "He is not a friend, but an acquaintance." },
  { tatoeba = "49875_212592", ja = "そのホテルは評判{ほどではない}。", en = "That hotel is not all it's cracked up to be." },
  { tatoeba = "65840_228482", ja = "いやそれ{ほどでもない}よ。何か用かい？", en = "Not really. What's up?" },
]

[[point]]
id = "mono-dakara"
pattern = "ものだから"
forms = ["もんだから", "ものですから", "もので", "もんで"]
jlpt = "N2"
meaning = "because, you see (an excuse or personal reason)"
formation = [
  "Verb / ［い］Adjective + ものだから",
  "［な］Adjective / Noun + な + ものだから   (子供なものだから)",
]
explanation = """
Gives a reason with a feeling of "it couldn't be helped", most often to \
explain or excuse what you did: 道が混んでいたものだから、遅れました, \
"the roads were jammed, you see, so I was late". It sounds softer and \
more personal than から. もので and casual もんだから mean the same."""
notes = """
No command, request or "let's" after it (×近いものだから歩こう): use \
から there. Ending on ものですから leaves the result unsaid, a polite \
way to apologise or decline. Not to be confused with plain もの + で: \
この家は私のもので is "this house is mine, and…"."""
related = ["kara-reason", "node", "mono-reason"]
examples = [
  { tatoeba = "66100_228742", ja = "いつもの列車に乗り遅れた{ものですから}。", en = "It's because I missed my usual train." },
  { source = "yomeru", ja = "道が混んでいた{ものだから}、遅れました。", en = "The roads were jammed, you see, so I was late." },
  { source = "yomeru", ja = "急いでいた{もんで}、財布を忘れちゃった。", en = "I was in a hurry, so I forgot my wallet." },
]

[[point]]
id = "koto-dakara"
pattern = "ことだから"
forms = ["のことだから", "ことですから", "のことですから"]
jlpt = "N2"
meaning = "knowing (X), being who (X) is, so surely…"
formation = ["Noun (a person) + のことだから"]
explanation = """
Bases a confident guess on what a person is like, someone both speakers \
know well: 田中さんのことだから、また遅れるだろう, "knowing Tanaka, \
he'll be late again". The second half is usually a guess with だろう, \
はずだ or に違いない. The trait can be good or bad."""
notes = """
After a verb or adjective, ことだから is often just "since it's a … \
matter": 大事なことだから、よく考えて, "it's important, so think it \
over". It can also mean "since this is a rare chance": せっかく集まった\
ことだから、写真を撮ろう."""
related = ["dake-ni", "no-dakara", "hazu"]
examples = [
  { source = "yomeru", ja = "田中さん{のことだから}、また遅れるだろう。", en = "Knowing Tanaka, he'll be late again." },
  { source = "yomeru", ja = "まじめな彼{のことだから}、もう準備しているよ。", en = "He's so conscientious, he's surely got it ready already." },
  { tatoeba = "19614_182441", ja = "急を要する{ことだから}急いでください。", en = "Please hurry, it's urgent." },
]

[[point]]
id = "dake-ni"
pattern = "だけに"
forms = []
jlpt = "N2"
meaning = "precisely because, all the more since"
formation = [
  "Verb / ［い］Adjective + だけに",
  "［な］Adjective + な + だけに   (有名なだけに)",
  "Noun + だけに   (プロだけに)",
]
explanation = """
Says a result is just what its reason leads you to expect, or stronger \
than usual because of it: 期待していただけに、がっかりした, "I'd had \
high hopes, so I was all the more disappointed". The result can be good \
or bad, and なおさら or かえって often stresses it."""
notes = """
だけに also keeps its plain sense "only (in, to)": 日本だけにいる犬, \
"a dog found only in Japan". Contrast だけあって, which only praises \
(as you'd expect of). Contrast からこそ, which stresses the reason \
itself rather than the size of the result."""
related = ["dake-atte", "kara-koso", "sasuga"]
examples = [
  { source = "yomeru", ja = "期待していた{だけに}、がっかりした。", en = "I'd had high hopes, so I was all the more disappointed." },
  { source = "yomeru", ja = "有名な店{だけに}、いつも混んでいる。", en = "Being a famous restaurant, it's always crowded." },
  { source = "yomeru", ja = "毎日練習した{だけに}、勝ててうれしい。", en = "I practised every day, so I'm all the happier to win." },
]

[[point]]
id = "dake-atte"
pattern = "だけあって"
forms = ["だけのことはある", "だけのことはあって", "だけのことはあります", "だけある"]
jlpt = "N2"
meaning = "as you'd expect of; (it was) worth it, not for nothing"
formation = [
  "Verb / ［い］Adjective + だけあって",
  "［な］Adjective + な + だけあって",
  "Noun + だけあって   (プロだけあって)",
  "Verb / ［い］Adjective + だけのことはある   (sentence end)",
]
explanation = """
Praises a result as fitting its cause, such as talent, effort, price or \
experience: プロだけあって、上手だね, "she's a pro, so of course she's \
good". At the end of a sentence, だけのことはある says something paid \
off: 高かっただけのことはある, "it was worth the price". Often with \
さすが."""
notes = """
Only for good results that have already shown: no future, guesses or \
だろう after it. For disappointment, or for "all the more", use \
だけに. だけある is a casual sentence ending."""
related = ["dake-ni", "sasuga", "gai"]
examples = [
  { tatoeba = "273157_141414", ja = "専門家{だけあって}彼はその分野に詳しい。", en = "As may be expected of an expert, he's well versed in the field." },
  { tatoeba = "304683_99017", ja = "彼は留学した{だけのことはある}。", en = "He hasn't studied abroad for nothing." },
  { source = "yomeru", ja = "高かった{だけあって}、とても丈夫だ。", en = "It was expensive, and it's very sturdy, as you'd expect." },
]

[[point]]
id = "kara-ni-wa"
pattern = "からには"
forms = []
jlpt = "N2"
meaning = "now that, since (… then I must / I will)"
formation = [
  "Verb［る］ / Verb［た］ + からには",
  "［な］Adjective / Noun + である + からには",
]
explanation = """
Takes a fact or a decision as settled and draws the strong consequence: \
やるからには、勝ちたい, "if I'm doing this at all, I want to win". The \
second half is a resolve, a duty or advice: つもりだ, なければならない, \
べきだ, なさい. The idea is "having got this far, see it through"."""
notes = """
Close to 以上は and 上は, which are stiffer. Plain から gives any \
reason; からには insists on what must follow. からは alone is an older, \
written variant (not looked up: it would match inside 明日からは)."""
related = ["ijou-wa", "kara-reason", "beki-da"]
examples = [
  { tatoeba = "29121_191959", ja = "わたしがここに来た{からには}、心配することはない。", en = "Now that I am here, you don't have to worry." },
  { tatoeba = "30188_193023", ja = "やる{からには}、ちゃんとやりなさい。", en = "If you do it at all, do it well." },
]

[[point]]
id = "ijou-wa"
pattern = "以上は"
forms = ["いじょうは"]
jlpt = "N2"
meaning = "now that, since (… naturally / must)"
formation = [
  "Verb［る］ / Verb［た］ + 以上（は）",
  "Noun + である + 以上（は）",
  "Verb［る］ / Verb［た］ + 上は   (written)",
]
explanation = """
Like からには, sets out a fact, then the duty or conclusion that follows \
from it: 約束した以上は、守らなければならない, "now that I've \
promised, I have to keep it". は is often dropped (引き受けた以上、\
最後までやる). 上は is a more formal, written version."""
notes = """
After a number, 以上 means "or more" (三人以上): another entry. The \
second half is a must, a resolve or a firm conclusion, not a neutral \
fact. Bare 上は is ambiguous (頂上は, "the summit"): it means "now \
that" only after a verb."""
related = ["kara-ni-wa", "ijou"]
examples = [
  { source = "yomeru", ja = "約束した{以上は}、守らなければならない。", en = "Now that I've promised, I have to keep it." },
  { source = "yomeru", ja = "引き受けた{以上は}、最後までやります。", en = "Since I've taken it on, I'll see it through." },
  { source = "yomeru", ja = "こうなった{上は}、やるしかない。", en = "Now that it's come to this, there's nothing for it but to act." },
]

[[point]]
id = "kara-suru-to"
pattern = "からすると"
forms = ["からすれば"]
jlpt = "N2"
meaning = "judging from; from the standpoint of"
formation = ["Noun + からすると / からすれば"]
explanation = """
Two close uses. With evidence, it leads to a guess: この空模様からする\
と、雨になりそうだ, "judging from the sky, it's going to rain". With a \
person or group, it gives their point of view: 親からすれば、子供は\
いつまでも子供だ, "to parents, children are always children"."""
notes = """
からして shares the "judging from" use: see that entry. から言うと \
follows a criterion (price, experience), not a person; から見ると \
works best for what can be seen."""
related = ["kara-shite", "kara-miru-to", "kara-iu-to", "ni-shitara"]
examples = [
  { tatoeba = "18150_222272", ja = "この空模様{からすると}、雨になりそうだ。", en = "Judging from the look of the sky, it is likely to rain." },
  { source = "yomeru", ja = "親{からすれば}、子供はいつまでも子供だ。", en = "To parents, children are always children." },
]

[[point]]
id = "kara-shite"
pattern = "からして"
forms = []
jlpt = "N2"
meaning = "even (X, to begin with); judging from"
formation = ["Noun + からして"]
explanation = """
Picks one basic, obvious item to say the whole is the same: この映画は\
題名からして怖い, "even this film's title is scary", so the rest must \
be too. It's also used like からすると, "judging from": 顔つきからして\
、失敗したらしい, "from their faces, they seem to have failed"."""
notes = """
In the first use, the item is the most basic one (the name, the first \
step, the way someone talks), and the comment is usually critical."""
related = ["kara-suru-to", "sae"]
examples = [
  { tatoeba = "305168_98532", ja = "彼らの顔つき{からして}、まあ失敗したのでしょう。", en = "From the way they look, I would say that they failed." },
  { source = "yomeru", ja = "この映画は題名{からして}怖い。", en = "Even this film's title is scary." },
  { source = "yomeru", ja = "あの人は話し方{からして}偉そうだ。", en = "Even the way he talks is arrogant." },
]

[[point]]
id = "kara-miru-to"
pattern = "から見ると"
forms = ["から見れば", "から見て", "から見ても", "から見たら", "からみると", "からみれば", "からみて"]
jlpt = "N2"
meaning = "seen from, from (someone's) point of view"
formation = ["Noun + から見ると / から見れば / から見て / から見ても"]
explanation = """
Gives a judgement as seen by a person or from a position: 私から見れば\
、彼が間違っている, "in my view, he's wrong". から見て often leads to a \
guess, and どこから見ても means "however you look at it": どこから見て\
も学者だ, "he's every inch a scholar"."""
notes = """
Unlike から言うと, it can follow a person, including oneself. It fits \
what can be seen or observed, less so sounds or smells. It also keeps \
its literal sense: 遠くから見ると, "seen from far away"."""
related = ["kara-suru-to", "kara-iu-to", "ni-shitara", "ni-totte"]
examples = [
  { tatoeba = "246586_167912", ja = "私{から見れば}彼が間違っている。", en = "In my eyes, he is wrong." },
  { tatoeba = "292012_111671", ja = "彼はどこ{から見ても}学者だ。", en = "He is every bit a scholar." },
]

[[point]]
id = "ni-shitara"
pattern = "にしたら"
forms = ["にすれば", "にしてみれば", "にしてみたら"]
jlpt = "N2"
meaning = "for (someone), from (someone's) point of view"
formation = ["Noun (a person) + にしたら / にすれば / にしてみれば"]
explanation = """
Imagines how a situation feels to someone else: 子供にしたら、この宿題\
は多すぎる, "for a child, this is too much homework". にしてみれば \
stresses "if you put yourself in their place", and にすれば is a little \
more formal."""
notes = """
Not for your own view (×私にしたら): use 私としては or 私から見ると. \
Don't mix it up with にする "decide on" + たら: コーヒーにしたら？ is \
"how about coffee?"."""
related = ["kara-miru-to", "ni-totte", "kara-suru-to", "to-shite-wa"]
examples = [
  { source = "yomeru", ja = "子供{にしたら}、この宿題は多すぎる。", en = "For a child, this is too much homework." },
  { source = "yomeru", ja = "母{にしてみれば}、心配なのは当然だ。", en = "From my mother's side, it's natural to worry." },
]

[[point]]
id = "tokoro-wo-miru-to"
pattern = "ところを見ると"
forms = ["ところをみると", "ところを見れば"]
jlpt = "N2"
meaning = "judging from (the fact) that, seeing that"
formation = ["Verb (often Verb［ている］) + ところを見ると   (笑っているところを見ると)"]
explanation = """
Turns something the speaker has noticed into a guess: 笑っているところ\
を見ると、合格したらしい, "seeing that she's smiling, she must have \
passed". The guess usually ends with らしい, ようだ, みたいだ, だろう or \
に違いない."""
notes = """
The evidence is something actually observed, often someone's behaviour, \
and the conclusion is a guess, not a fact. からすると and からして \
follow a noun; ところを見ると follows a whole clause."""
related = ["kara-suru-to", "rashii", "you-da"]
examples = [
  { source = "yomeru", ja = "笑っている{ところを見ると}、合格したらしい。", en = "Seeing that she's smiling, she must have passed." },
  { source = "yomeru", ja = "電気が消えている{ところを見ると}、留守のようだ。", en = "Seeing that the lights are off, they seem to be out." },
]

[[point]]
id = "kara-to-itte"
pattern = "からといって"
forms = ["からって", "からと言って"]
jlpt = "N2"
meaning = "just because (… doesn't mean)"
formation = [
  "Verb / ［い］Adjective + からといって",
  "［な］Adjective / Noun + だ + からといって",
]
explanation = """
Rejects a conclusion one might draw from a reason: お金があるからとい\
って、幸せとは限らない, "just because you have money doesn't mean \
you're happy". The second half is a denial or a criticism: とは限らない, \
わけではない, ことにはならない, or a "don't"."""
notes = """
からって is casual. The same words can also just report someone's \
reason: 忙しいからと言って帰った, "he left, saying he was busy"; \
context tells them apart."""
related = ["to-wa-kagiranai", "wake-de-wa-nai", "kara-reason"]
examples = [
  { tatoeba = "318504_85209", ja = "貧しい{からといって}人を軽蔑するな。", en = "Don't look down on a man because he is poor." },
  { tatoeba = "296020_107665", ja = "彼が賢い{からといって}正直だという事にはならない。", en = "Just because he's wise doesn't mean that he's honest." },
]

[[point]]
id = "no-dakara"
pattern = "のだから"
forms = ["んだから", "のですから", "んですから"]
jlpt = "N2"
meaning = "since (as you know), given that"
formation = [
  "Verb / ［い］Adjective + のだから",
  "［な］Adjective / Noun + な + のだから   (学生なのだから)",
]
explanation = """
Gives a reason both speakers already accept, and builds a firm point on \
it, often advice or a reproach: もう大きくなったのだから、行儀良くしな\
さい, "you're a big boy now, so behave yourself". The の presents the \
reason as an established fact."""
notes = """
Pushier than plain から, and odd when the listener doesn't know the \
reason yet. At the end of a sentence, んだから sounds exasperated: \
本当に困った人なんだから, "honestly, you're hopeless"."""
related = ["kara-reason", "n-desu", "kara-ni-wa"]
examples = [
  { tatoeba = "31206_194037", ja = "もう大きくなった{のだから}、行儀良くしなさい。", en = "Now you are a big boy, behave yourself." },
  { tatoeba = "18014_179158", ja = "君がそう言う{んだから}。", en = "Since you say so." },
  { source = "yomeru", ja = "自分で決めた{んだから}、頑張りなさい。", en = "You decided this yourself, so do your best." },
]

[[point]]
id = "to-iu-koto-wa"
pattern = "ということは"
forms = ["ってことは", "と言うことは"]
jlpt = "N2"
meaning = "so that means, in other words"
formation = [
  "Sentence。 + ということは + Sentence",
  "Clause + ということは + (Conclusion) + ということだ",
]
explanation = """
Draws a conclusion from a fact just stated: 電気がついている。というこ\
とは、誰かいるね, "the light's on, so someone's in". At the start of a \
sentence, often as a question, it checks what the other person means. \
Mid-sentence, "X ということは Y ということだ" is "X means Y"."""
notes = """
The same words often just make a clause into a topic, "the fact that": \
地球が丸いということは明らかだ, "that the earth is round is clear". \
Only the "that means" use is this point."""
related = ["to-iu-koto", "to-iu-no-wa", "tsumari"]
examples = [
  { source = "yomeru", ja = "電気がついている。{ということは}、誰かいるね。", en = "The light is on. That means someone's home." },
  { source = "yomeru", ja = "「明日は雨だって。」「{ってことは}、試合は中止？」", en = "\"They say it'll rain tomorrow.\" \"So the match is off?\"" },
]

[[point]]
id = "ue-de"
pattern = "上で"
forms = ["うえで", "の上で", "の上では", "る上で", "る上では"]
hover = false
jlpt = "N2"
meaning = "in terms of, as far as … goes; in (doing), for"
formation = [
  "Noun + の上で（は）   (規則の上では)",
  "Verb［る］ + 上で   (生活する上で)",
]
explanation = """
Noun の上で names the area a statement holds in: 規則の上では、まだ学生\
だ, "according to the rules, he's still a student". Verb［る］上で \
means "when doing, for doing", often with 大切だ, 必要だ or 役に立つ: \
日本で生活する上で、日本語は大切だ, "for living in Japan, Japanese \
matters"."""
notes = """
Verb［た］上で is another pattern, "after doing (first)": see that \
entry. Both lean formal. 上で is also the plain place, "on (top of)": \
机の上で, so this entry stays out of the hover popup."""
related = ["ta-ue-de", "ni-oite", "kara-iu-to"]
examples = [
  { tatoeba = "20226_183105", ja = "規則{の上では}彼はまだ学生だ。", en = "Technically he is still a student." },
  { source = "yomeru", ja = "日本で生活する{上で}、日本語は大切だ。", en = "For living in Japan, Japanese is important." },
]

[[point]]
id = "no-uchi"
pattern = "のうち"
forms = ["のうちで", "のうちでは", "のうちの", "の内"]
jlpt = "N2"
meaning = "among, (out) of"
formation = [
  "Noun + のうち（で）   (四季のうちで)",
  "Number + のうち（の）   (十人のうち三人)",
]
explanation = """
Picks from within a group or range: 四季のうちで春が一番好きだ, "of the \
four seasons, I like spring best". It often goes with comparisons \
(一番, ほう) and with numbers: 十人のうち三人が来た, "three out of ten \
came"."""
notes = """
Means the same as の中で, which is more common in speech. Usually \
written in kana. うちに (while) is another use of the same word: see \
that entry."""
related = ["ga-ichiban", "uchi-ni", "yori-hou-ga"]
examples = [
  { tatoeba = "245519_168968", ja = "四季{のうちで}春が一番好きだ。", en = "Spring is my favourite of the four seasons." },
  { tatoeba = "52752_235467", ja = "２人{のうちでは}、ジョンの方が背が高い。", en = "John is the taller of the two." },
]

[[point]]
id = "mono-no"
pattern = "ものの"
forms = ["とはいうものの", "とは言うものの"]
jlpt = "N2"
meaning = "although, even though (it's true that…, but)"
formation = [
  "Verb + ものの   (決めたものの)",
  "［い］Adjective + ものの",
  "［な］Adjective + なものの / であるものの",
  "Noun + であるものの",
]
explanation = """
Grants that the first part is true, then says that what you'd expect \
from it doesn't follow: 買ったものの、一度も使っていない, "I bought \
it, but I've never used it". It sounds written and a little formal, \
and the second half often admits a doubt, a worry or something left \
undone."""
notes = """
けど and が say the same in everyday speech. のに adds surprise or \
complaint; ものの stays matter-of-fact. とはいうものの, "that said", \
can open a sentence on its own and look back at the one before. Not \
for requests or invitations in the second half."""
related = ["noni", "kedo", "ni-mo-kakawarazu", "nagara-mo"]
examples = [
  { tatoeba = "35684_198491", ja = "パーティーに行くことにした{ものの}、気が進まない。", en = "Though I have decided to go to the party, I'm not looking forward to it." },
  { source = "yomeru", ja = "新しい靴を買った{ものの}、まだ一度もはいていない。", en = "I bought new shoes, but I haven't worn them even once." },
]

[[point]]
id = "ni-mo-kakawarazu"
pattern = "にもかかわらず"
forms = ["にも関わらず", "にも拘らず", "にも拘わらず"]
jlpt = "N2"
meaning = "despite, in spite of, even though"
formation = [
  "Verb + にもかかわらず   (病気だったにもかかわらず)",
  "［い］Adjective + にもかかわらず",
  "［な］Adjective + である + にもかかわらず",
  "Noun + （である） + にもかかわらず   (雨にもかかわらず)",
]
explanation = """
Something happens even though you'd expect the first part to stop it: \
雨にもかかわらず、試合は行われた, "despite the rain, the match went \
ahead". Formal and common in writing and the news; it states the \
contrast as a fact."""
notes = """
Without も, にかかわらず means "regardless of", a different point: \
天気にかかわらず, "whatever the weather". のに says the same with \
feeling and is more personal; にもかかわらず is the formal choice, \
though it can still sound surprised or critical. It can also open a \
sentence, "nevertheless". In speeches and letters, お忙しいにもかかわらず \
thanks people for coming "despite being busy"."""
related = ["ni-kakawarazu", "noni", "mono-no", "nagara-mo"]
examples = [
  { tatoeba = "26775_189622", ja = "雨{にもかかわらず}出発した。", en = "He started in spite of the rain." },
  { tatoeba = "303098_100600", ja = "彼は病気だった{にも関わらず}仕事に出かけた。", en = "He went to work in spite of his illness." },
]

[[point]]
id = "ni-kakawarazu"
pattern = "にかかわらず"
forms = ["に関わらず", "に拘らず", "に拘わらず", "にかかわりなく", "に関わりなく", "に関係なく", "にかんけいなく"]
jlpt = "N2"
meaning = "regardless of, whether or not, no matter"
formation = [
  "Noun + にかかわらず   (天気にかかわらず)",
  "Verb［る］ + Verb［ない］ + にかかわらず   (行く行かないにかかわらず)",
  "［い］Adjective + ［い］Adjective［ない］ + にかかわらず",
]
explanation = """
Says that the thing named makes no difference to what follows. It \
often takes a word that covers a range (年齢, 天気, 経験) or a pair of \
opposites: 好き嫌いにかかわらず、全員参加です, "like it or not, \
everyone takes part"."""
notes = """
Don't confuse with にもかかわらず, "despite": the も changes the \
meaning. に関係なく is the plainer everyday way to say "regardless of". \
を問わず is close but more formal still, and mostly takes nouns like \
年齢 or 国籍."""
related = ["ni-mo-kakawarazu", "wo-towazu", "mo-kamawazu"]
examples = [
  { tatoeba = "328935_74784", ja = "結婚式は天候{にかかわらず}催されるだろう。", en = "The wedding ceremony will be held regardless of the weather." },
  { tatoeba = "241431_173042", ja = "国籍{に関係なく}すべての人に資格がある。", en = "Everyone is eligible regardless of nationality." },
  { source = "yomeru", ja = "行く行かない{にかかわらず}、返事をください。", en = "Whether you go or not, please reply." },
]

[[point]]
id = "ni-hanshite"
pattern = "に反して"
forms = ["に反し", "に反する", "に反した", "にはんして", "にはんする"]
jlpt = "N2"
meaning = "contrary to, against (expectations, wishes, rules)"
formation = [
  "Noun + に反して   (予想に反して)",
  "Noun + に反する / に反した + Noun",
]
explanation = """
With words like 予想, 期待 or 希望, says that the result turned out the \
opposite: 予想に反して、試験は簡単だった, "contrary to what I \
expected, the exam was easy". With 法律, 規則 or 意志 it means going \
against them: 規則に反する, "to break the rules"."""
notes = """
Formal. In speech you'd more often hear 思ったより or 予想と違って. \
Before a noun it becomes に反する or に反した: 規則に反した行為, "an \
act against the rules". Not the same as に対して, "toward, in \
contrast to"."""
related = ["ni-taishite", "ni-mo-kakawarazu"]
examples = [
  { tatoeba = "393793_393792", ja = "予想{に反して}楽に勝てましたね。", en = "Contrary to expectations, they won with ease." },
  { tatoeba = "17346_178494", ja = "君のやったことは規則{に反して}いるよ。", en = "What you did is against the rules." },
  { tatoeba = "258257_156277", ja = "私は自分の意志{に反して}それをした。", en = "I did it against my will." },
]

[[point]]
id = "tatte"
pattern = "たって"
forms = ["くたって", "ったって"]
hover = false
jlpt = "N2"
meaning = "even if, no matter (casual ても)"
formation = [
  "Verb［た］ + って   (行ったって, 読んだって)",
  "［い］Adjective［く］ + たって   (高くたって)",
  "［な］Adjective / Noun + だって   (静かだって)",
]
explanation = """
The casual spoken form of ても: そんなこと言ったって、もう遅いよ, \
"even if you say that, it's too late now". It often comes with 何, \
いくら or どんなに for "no matter what / how much", and with いい for \
"you don't have to": 急がなくたっていい."""
notes = """
Speech only, and a little rough; use ても in writing and polite talk. \
With nouns and な-adjectives it becomes だって, a spelling with \
other uses: "even" (子供だって), "because" (opening a reply), and \
"…, you say?". The same sounds also turn up \
in 立って and 経って, so this entry stays out of the hover popup. \
After the volitional, ったって shortens といっても: 休もうったって、\
いすがない, "you say let's rest, but there are no chairs"."""
related = ["temo", "tatoe-temo", "ikura-temo", "datte-question"]
examples = [
  { tatoeba = "41634_204392", ja = "そんなことやっ{たって}無駄だ。", en = "That won't make any difference." },
  { tatoeba = "41333_204092", ja = "そんな所に行っ{たって}しょうがない。", en = "It isn't worthwhile going there." },
  { tatoeba = "41554_204312", ja = "そんなトゲトゲしい言い方しな{くたって}いいだろう。", en = "You don't have to use such a harsh tone with me." },
]

[[point]]
id = "to-shite-mo"
pattern = "としても"
forms = ["だとしても", "としたって", "にしたとしても"]
jlpt = "N2"
meaning = "even if, even supposing, even granting that"
formation = [
  "Verb + としても   (行くとしても, 行ったとしても)",
  "［い］Adjective + としても",
  "［な］Adjective / Noun + だとしても",
]
explanation = """
Supposes something, or grants it, and says the conclusion still holds: \
今から急いだとしても、間に合わない, "even if we hurry now, we won't \
make it". The supposition can be imaginary or true; たとえ often comes \
in front for emphasis."""
notes = """
ても says much the same; としても makes the "suppose that" part \
clearer. としたら is its opposite partner: "if (we suppose), then…". \
After a noun it can also be として, "as", plus も: 親としても心配だ, \
"as a parent too, I'm worried". XはいいとしてもY: "X is fine, but Y \
isn't". Careful with 〜ようとしても, which is ようとする, "even if you \
try to"."""
related = ["temo", "tatoe-temo", "to-shitara", "ni-shite-mo"]
examples = [
  { tatoeba = "41780_204539", ja = "それを認める{としても}、私は君に同意できない。", en = "Even if I admit that, I cannot agree with you." },
  { tatoeba = "40799_203561", ja = "たとえお金持ち{だとしても}、彼には金をやらない。", en = "Even if I were rich, I wouldn't give money to him." },
]

[[point]]
id = "ni-shite-mo"
pattern = "にしても"
forms = ["にしたって"]
jlpt = "N2"
meaning = "even if, even for; whether … or …"
formation = [
  "Verb + にしても   (行くにしても)",
  "［い］Adjective + にしても",
  "Noun + にしても   (冗談にしても)",
  "A + にしても + B + にしても",
]
explanation = """
Grants something and then adds a reservation: 冗談にしても、ひどい言い\
方だ, "even as a joke, that's a harsh thing to say". With 何, 誰 or どこ \
it means "whatever, whoever": 何をするにしても. Doubled, AにしてもBに\
しても means "whether A or B, either way"."""
notes = """
にしては is different: "for (someone who is), considering", pointing \
at a surprise. にしろ and にせよ are more formal versions of the same \
point. それにしても, "even so, still", is its own sentence opener. \
Casual speech says にしたって. Watch \
for plain にする + ても: 半分にしても, "even if I halve it"."""
related = ["ni-shiro", "to-shite-mo", "ni-shite-wa", "temo"]
examples = [
  { tatoeba = "24730_187593", ja = "何をする{にしても}、全力を尽くさなければならない。", en = "Whatever you do, you must do your best." },
  { source = "yomeru", ja = "冗談{にしても}、それはひどいよ。", en = "Even as a joke, that's terrible." },
  { source = "yomeru", ja = "電車{にしてもバスにしても}、一時間はかかる。", en = "Whether by train or by bus, it takes at least an hour." },
]

[[point]]
id = "ni-shiro"
pattern = "にしろ"
forms = ["にせよ"]
jlpt = "N2"
meaning = "even if, whatever; whether … or … (formal にしても)"
formation = [
  "Verb + にしろ / にせよ   (やるにせよ)",
  "［い］Adjective + にしろ / にせよ",
  "Noun + にしろ / にせよ",
  "A + にしろ + B + にしろ",
]
explanation = """
A firmer, more formal にしても: something is granted, but the main \
point stands regardless. 理由は何にせよ、遅刻はよくない, "whatever the \
reason, being late is not good". Doubled it means "whether A or B": \
肉にしろ魚にしろ, "meat or fish alike"."""
notes = """
にせよ is the most written of the three; にしろ sits between it and \
にしても. いずれにせよ / いずれにしても, "in any case", are set phrases. \
When doubled, keep the same one: にしろ〜にしろ, not にしろ〜にせよ. \
The same spelling is also the command of にする: 静かにしろ, "be \
quiet!", which has nothing to do with this point."""
related = ["ni-shite-mo", "to-shite-mo"]
examples = [
  { tatoeba = "24715_187578", ja = "何をやる{にせよ}、ベストを尽くしなさい。", en = "No matter what you do, do your best." },
  { tatoeba = "276231_137005", ja = "誰がそう言った{にせよ}、それはうそだよ。", en = "Whoever said so, it is false." },
  { source = "yomeru", ja = "肉{にしろ魚にしろ}、新しいものがいい。", en = "Whether it's meat or fish, fresh is best." },
]

[[point]]
id = "wa-tomokaku"
pattern = "はともかく"
forms = ["はともかくとして", "はともかくも", "ならともかく", "ならともかくとして"]
jlpt = "N2"
meaning = "leaving aside, regardless of; if it were …, fine, but"
formation = [
  "Noun + はともかく（として）   (値段はともかく)",
  "Noun / Verb + ならともかく",
]
explanation = """
Puts one matter aside as less important for now, to talk about \
another: 味はともかく、量が多い, "taste aside, the portions are big". \
ならともかく says something would be understandable in one case, but \
not in this one: 子供ならともかく、大人がそんなことをするなんて, "a \
child, maybe, but an adult doing that…"."""
notes = """
は別として is close, but sets something aside as an exception rather \
than as a question for later. はまだしも is like ならともかく, with a \
stronger sense of "this one is too much". ともかく alone, at the start \
of a sentence, means "anyway"."""
related = ["wa-betsu-to-shite", "wa-mada-shimo", "wa-mochiron"]
examples = [
  { tatoeba = "20760_183637", ja = "顔{はともかく}、気立てはとてもいい子だよ。", en = "Looks aside, she is very good-natured." },
  { tatoeba = "268455_12574119", ja = "冗談{はともかく}、頭痛は医者に診てもらうべきだ。", en = "Joking aside, you ought to see a doctor about your headache." },
  { source = "yomeru", ja = "子供{ならともかく}、大人がそんなことをするなんて。", en = "A child, maybe, but for an adult to do that…" },
]

[[point]]
id = "wa-betsu-to-shite"
pattern = "は別として"
forms = ["は別にして", "はべつとして", "はべつにして"]
jlpt = "N2"
meaning = "apart from, except for, setting aside"
formation = [
  "Noun + は別として / は別にして   (猫は別として)",
  "Question + かは別として   (できるかどうかは別として)",
]
explanation = """
Takes one thing out as an exception and says the rest is true without \
it: 日曜日は別として、毎日働いている, "apart from Sundays, I work every \
day". With a question word or a yes/no pair it sets that question \
aside: できるかどうかは別として, "whether we can or not"."""
notes = """
はともかく puts a point aside as less important for now; は別として \
treats it as a separate case. を除いて, "excluding", is a plainer way \
to list exceptions."""
related = ["wa-tomokaku", "igai", "wa-mada-shimo"]
examples = [
  { tatoeba = "282071_121932", ja = "猫{は別として}動物は好きだ。", en = "Apart from cats, I like animals." },
  { tatoeba = "322347_81368", ja = "妹{は別として}、私の家族はテレビを見ません。", en = "Apart from my sister, my family doesn't watch TV." },
  { tatoeba = "35862_198669", ja = "ニンジン{は別にして}、彼が食べないものはない。", en = "Except for carrots, there is nothing he won't eat." },
]

[[point]]
id = "wa-mada-shimo"
pattern = "はまだしも"
forms = ["ならまだしも", "ばまだしも", "たらまだしも", "まだしも"]
jlpt = "N2"
meaning = "X would be (more) acceptable, but Y is too much"
formation = [
  "Noun + はまだしも / ならまだしも   (一回ならまだしも)",
  "Verb［ば］ + まだしも",
]
explanation = """
Compares two things: the first could still be put up with, the second \
can't. 一回ならまだしも、毎日遅刻するのは困る, "once would be one \
thing, but being late every day is a problem". The second half \
usually complains."""
notes = """
Close to ならともかく, with a stronger "but this is going too far". \
Used about things you dislike, not for praise. まだしも alone also \
means "rather, at least (better)": この方がまだしもいい."""
related = ["wa-tomokaku", "wa-betsu-to-shite", "sae"]
examples = [
  { source = "yomeru", ja = "一回{ならまだしも}、毎日遅れるのは困る。", en = "Once would be one thing, but being late every day is a problem." },
  { source = "yomeru", ja = "大人{はまだしも}、子供にこの映画は怖すぎる。", en = "Adults might be fine, but this film is too scary for children." },
]

[[point]]
id = "mo-kamawazu"
pattern = "も構わず"
forms = ["もかまわず", "も構わずに", "もかまわずに", "に構わず", "にかまわず"]
jlpt = "N2"
meaning = "without caring about, without minding"
formation = ["Noun + も構わず   (人目も構わず)"]
explanation = """
Someone acts without paying any attention to something that would \
normally stop them or make them careful: 人目も構わず泣いた, "she \
cried without caring who saw". It often takes words like 人目, 雨, \
服が汚れるの or 時間."""
notes = """
The tone is usually a little critical, or at least surprised. Often \
with a clause made into a noun: 服が汚れるのも構わず. にかまわず is \
the same idea; 構わない alone, "it's fine, I don't mind", is the \
everyday word it comes from."""
related = ["ni-kakawarazu", "te-mo-kamawanai"]
examples = [
  { tatoeba = "315551_88156", ja = "彼女は騒音{にかまわず}話しつづけた。", en = "She carried on talking in spite of the loud noise." },
  { source = "yomeru", ja = "子供たちは雨{も構わず}外で遊んでいる。", en = "The children are playing outside, never minding the rain." },
  { source = "yomeru", ja = "彼女は人目{も構わず}大声で泣いた。", en = "She cried loudly, not caring who saw." },
]

[[point]]
id = "ni-niawazu"
pattern = "に似合わず"
forms = ["ににあわず", "に似合わない"]
jlpt = "N2"
meaning = "unlike (what you'd expect of), for (someone who is)"
formation = ["Noun + に似合わず   (年に似合わず)"]
explanation = """
Says someone or something is not what you'd expect from their age, \
looks or usual self: 父は年に似合わず元気だ, "Dad is full of energy \
for his age". The surprise can be good or bad."""
notes = """
にしては is close: "for, considering". に似合わず is mostly about \
people and leans on a mismatch with their image: 顔に似合わず, \
"despite looking like that". 似合う alone means "to suit": 帽子が似合う."""
related = ["ni-shite-wa", "wari-ni", "kuse-ni"]
examples = [
  { tatoeba = "317635_86076", ja = "彼女顔{に似合わず}、言うことがきついよね。", en = "Her harsh manner of speaking doesn't suit her pretty face." },
  { source = "yomeru", ja = "祖母は年{に似合わず}よく歩く。", en = "My grandmother walks a lot for her age." },
]

[[point]]
id = "sore-nanoni"
pattern = "それなのに"
forms = []
jlpt = "N2"
meaning = "and yet, despite that, even so"
formation = ["Sentence。 それなのに + Sentence"]
explanation = """
Starts a sentence that goes against what the last one led you to \
expect, usually with surprise, regret or blame: 一生懸命勉強した。\
それなのに、落ちた, "I studied hard. And yet I failed"."""
notes = """
It is のに turned into a sentence opener, and carries the same \
feeling. それでも is neutral "even so"; しかし and でも just contrast. \
In speech, なのに alone can open a sentence too."""
related = ["noni", "soredemo", "shikashi", "da-ga"]
examples = [
  { tatoeba = "299081_104610", ja = "彼は若い、{それなのに}分別がある。", en = "He is young, and yet he is prudent." },
  { source = "yomeru", ja = "毎日練習した。{それなのに}、試合に負けた。", en = "I practised every day. And yet I lost the match." },
]

[[point]]
id = "shikashi-nagara"
pattern = "しかしながら"
forms = ["しかし乍ら"]
jlpt = "N2"
meaning = "however, nevertheless (formal)"
formation = ["Sentence。 しかしながら + Sentence"]
explanation = """
A formal, written "however": it opens a sentence that limits or goes \
against the one before. You meet it in reports, speeches and formal \
letters: しかしながら、問題も残っている, "however, problems remain"."""
notes = """
Means the same as しかし, only stiffer; in conversation it sounds \
like a speech. だが and けれども are other ways to say "but", from \
plain to softer."""
related = ["shikashi", "da-ga", "tokoroga"]
examples = [
  { tatoeba = "53567_216263", ja = "{しかしながら}、高すぎる。", en = "However, it is too expensive." },
  { tatoeba = "53566_216262", ja = "{しかしながら}、私はあなたの御意見に賛成できません。", en = "I cannot, however, agree to your opinion." },
]

[[point]]
id = "nai-koto-ni-wa"
pattern = "ないことには"
forms = ["ないことには〜ない"]
jlpt = "N2"
meaning = "unless, if … not (then nothing can happen)"
formation = [
  "Verb［ない］ + ことには   (見ないことには)",
  "［い］Adjective［く］ + ないことには",
  "［な］Adjective / Noun + でないことには",
]
explanation = """
Says the first thing is a must before anything else can happen: \
実際に会ってみないことには、何とも言えない, "until I actually meet \
him, I can't say anything". The second half is negative or close to \
it (わからない, 始まらない, 無理だ)."""
notes = """
Close to なければ and ない限り, but it stresses that X has to come \
first. てからでないと says the same from the other side: "not until \
after X". Don't confuse with 〜ないことに + は after a noun clause, \
"to the things that don't": 関係ないことには口を出すな."""
related = ["te-kara-de-nai-to", "nai-kagiri", "nakereba-naranai"]
examples = [
  { source = "yomeru", ja = "食べてみ{ないことには}、味はわからない。", en = "You can't tell the taste until you try it." },
  { source = "yomeru", ja = "彼が来{ないことには}、会議が始められない。", en = "We can't start the meeting unless he comes." },
]

[[point]]
id = "te-kara-de-nai-to"
pattern = "てからでないと"
forms = ["でからでないと", "てからでなければ", "でからでなければ", "てからじゃないと", "でからじゃないと"]
jlpt = "N2"
meaning = "not until after, unless you first"
formation = ["Verb［て］ + からでないと / からでなければ"]
explanation = """
Something can't happen, or shouldn't, before something else is done: \
宿題をしてからでないと、遊びに行けない, "I can't go out until I've \
done my homework". The second half is negative, or a word like 無理, \
だめ or わからない."""
notes = """
Built on てから, "after doing". ないことには is close: "unless X \
(first)". In speech てからじゃないと is common. A plain てから \
sentence just orders events; this one makes the first a condition."""
related = ["te-kara", "nai-koto-ni-wa", "nai-kagiri"]
examples = [
  { source = "yomeru", ja = "手を洗っ{てからでないと}、食べてはいけません。", en = "You mustn't eat until you've washed your hands." },
  { source = "yomeru", ja = "社長に聞い{てからでないと}、返事できません。", en = "I can't answer until I've asked the president." },
]

[[point]]
id = "nai-kagiri"
pattern = "ない限り"
forms = ["ないかぎり", "ない限りは", "ないかぎりは", "でない限り"]
jlpt = "N2"
meaning = "unless, as long as … not"
formation = [
  "Verb［ない］ + 限り   (雨が降らない限り)",
  "［い］Adjective［く］ + ない限り",
  "［な］Adjective / Noun + でない限り",
]
explanation = """
Says that what follows holds as long as the condition doesn't happen: \
雨が降らない限り、試合はある, "unless it rains, the match is on". It \
often implies that only that one thing could change it."""
notes = """
Firmer than なければ: the speaker sees the condition as the only way \
out. The positive 限り is "as long as": 生きている限り. ないことには \
is close, but needs a negative result and stresses "first"."""
related = ["kagiri", "nai-koto-ni-wa", "te-kara-de-nai-to"]
examples = [
  { tatoeba = "26912_189759", ja = "雨が降ら{ない限り}、試合は日曜日に行います。", en = "Unless it rains, the game will be held on Sunday." },
  { tatoeba = "30369_193204", ja = "もっと勉強し{ない限り}落第しますよ。", en = "You will fail unless you work harder." },
  { tatoeba = "272637_141933", ja = "絶対必要{でない限り}タクシーを使わない。", en = "I don't use taxis unless it's absolutely necessary." },
]

[[point]]
id = "kagiri"
pattern = "限り"
forms = ["かぎり", "限りは", "かぎりは", "限りの", "できる限り", "できるかぎり", "限りなく", "限りで"]
jlpt = "N2"
meaning = "as long as; as much as (possible); the last, until"
formation = [
  "Verb［る］ / Verb［ている］ + 限り   (生きている限り)",
  "Noun + である限り   (学生である限り)",
  "できる限り / 力の限り   (as much as one can)",
  "Noun + 限りで   (今月限りで)",
]
explanation = """
限り means "limit", and has three main uses. After a verb describing \
a state, "as long as": 私がいる限り、大丈夫だ, "as long as I'm here, \
you're fine". できる限り and 力の限り mean "as much as possible". \
After a time word, 限りで marks the end: 今月限りで店を閉める, \
"we close at the end of this month"."""
notes = """
限りなく〜に近い is "infinitely close to": 限りなく黒に近い, "as good \
as guilty". The negative ない限り, "unless", has its own entry, as \
does 限りでは, "as far as (I know)". 見渡す限り is "as far as the eye \
can see"."""
related = ["nai-kagiri", "kagiri-de-wa", "dekiru-dake", "ni-kagiru"]
examples = [
  { tatoeba = "22862_185730", ja = "我々は生きている{限り}学び続けなければならない。", en = "We must continue to study as long as we live." },
  { tatoeba = "272040_142525", ja = "静かにしている{限り}、ここに居てもよろしい。", en = "You may stay here as long as you keep quiet." },
  { tatoeba = "39492_202280", ja = "{できる限り}手伝います。", en = "I will help as much as I can." },
]

[[point]]
id = "kagiri-de-wa"
pattern = "限りでは"
forms = ["かぎりでは"]
jlpt = "N2"
meaning = "as far as (I know, I've seen, I've heard)"
formation = ["Verb (知る, 見る, 聞く, 調べる) + 限りでは   (私の知る限りでは)"]
explanation = """
Limits a statement to what the speaker has seen or heard, leaving \
room for being wrong: 私の知る限りでは、彼はまだ来ていない, "as far \
as I know, he hasn't come yet". It goes with verbs of knowing and \
finding out: 知る, 見る, 聞く, 調べる."""
notes = """
The subject before the verb often takes の: 私の知る限り. With に関する \
it means "as far as … is concerned": 私に関する限り. Don't use it for \
facts you're sure of; that's what it softens."""
related = ["kagiri", "ni-yoru-to", "kara-iu-to"]
examples = [
  { tatoeba = "251456_163057", ja = "私の知る{限りでは}、これが最新版です。", en = "As far as I know, this is the latest edition." },
  { tatoeba = "251460_163053", ja = "私の知る{限りでは}、まだ彼は到着していない。", en = "As far as I know, he has not arrived yet." },
]

[[point]]
id = "mono-nara"
pattern = "ものなら"
forms = ["もんなら"]
jlpt = "N2"
meaning = "if (only) one could, if it were possible"
formation = ["Verb［できる］ + ものなら   (できるものなら, 帰れるものなら)"]
explanation = """
After a potential verb, wishes for something that's hard or \
impossible: 帰れるものなら、今すぐ国に帰りたい, "if I could, I'd go \
home right now". できるものなら is the set "if at all possible". \
Followed by a command, it's a challenge: やれるものならやってみろ, \
"do it if you can"."""
notes = """
The volitional + ものなら is a different point, "if you dare (bad \
things follow)": see ようものなら. Plain もの + なら is everywhere too: \
大事なものなら, "if it's something important", which is not this \
point."""
related = ["you-mono-nara", "potential-form", "nara"]
examples = [
  { tatoeba = "43769_206521", ja = "その問題が解ける{ものなら}解いてみろ。", en = "I defy you to solve the problem." },
  { source = "yomeru", ja = "できる{ものなら}、子供のころに戻りたい。", en = "If I could, I'd like to go back to being a child." },
]

[[point]]
id = "you-mono-nara"
pattern = "ようものなら"
forms = ["おうものなら", "ようもんなら", "おうもんなら"]
jlpt = "N2"
meaning = "if (you) were to (dare), (something bad would happen)"
formation = ["Verb［volitional］ + ものなら   (言おうものなら, 遅れようものなら)"]
explanation = """
Warns that doing something, even once, would bring a bad result: 一分\
でも遅れようものなら、先生にすごく怒られる, "if you're even a minute \
late, the teacher gets really angry". The second half is always \
something unpleasant, often exaggerated."""
notes = """
Don't mix it up with Verb［できる］ + ものなら, "if only one could". \
Mostly about other people's strict reactions or harsh results; it \
sounds a bit dramatic, and you'll hear it in speech too."""
related = ["mono-nara", "volitional", "tara"]
examples = [
  { source = "yomeru", ja = "少しでも遅れ{ようものなら}、父に叱られる。", en = "If I'm even a little late, my father scolds me." },
  { source = "yomeru", ja = "母に本当のことを言{おうものなら}、大変なことになる。", en = "If I told my mother the truth, there'd be big trouble." },
]

[[point]]
id = "you-de-wa"
pattern = "ようでは"
forms = ["ようじゃ", "ようだったら", "ようなら"]
hover = false
jlpt = "N2"
meaning = "if (it's like this), (it won't do); if it seems that"
formation = [
  "Verb + ようでは   (遅刻するようでは)",
  "［な］Adjective + なようでは",
  "Noun + のようでは",
]
explanation = """
Points at a current state and judges it as bad: such-and-such \
can't go well like this. こんな問題ができないようでは、合格は無理だ, \
"if you can't do a question like this, you won't pass". ようなら and \
ようだったら are the neutral "if it seems that": 熱が下がらないような\
ら、病院へ行こう."""
notes = """
The second half of ようでは is critical: 困る, 無理だ, だめだ. Casual \
speech says ようじゃ. The same sounds turn up after the volitional \
(やめようではないか, "let's stop"), so this entry stays out of the \
hover popup."""
related = ["te-wa", "te-ite-wa", "you-da"]
examples = [
  { source = "yomeru", ja = "毎朝遅刻する{ようでは}、仕事は任せられない。", en = "If you're late every morning, I can't trust you with the work." },
  { source = "yomeru", ja = "熱が下がらない{ようなら}、医者に行きなさい。", en = "If the fever doesn't seem to go down, go to the doctor." },
]

[[point]]
id = "te-wa"
pattern = "ては"
forms = []
jlpt = "N2"
meaning = "if (bad result follows); doing … again and again"
formation = [
  "Verb［て］ + は   (そんなに食べては)",
  "［い］Adjective［く］ + ては   (高くては)",
  "［な］Adjective / Noun + では   (病気では)",
  "Verb［て］ + は + Verb［stem］   (書いては消す)",
]
explanation = """
Two uses. As a condition, it says that doing something leads to a \
bad result: そんなに食べては、太るよ, "if you eat that much, you'll \
put on weight". Repeated with a second verb, it shows a cycle: 書いて\
は消し、書いては消し, "writing and erasing, over and over"."""
notes = """
The condition behind てはいけない and てはだめ. Casual speech says \
ちゃ / じゃ: 食べちゃだめ. ていては stresses "if you keep doing". \
Unlike ば or たら, the result is almost always unwelcome."""
related = ["te-wa-ikenai", "te-ite-wa", "you-de-wa", "te-wa-naranai"]
examples = [
  { source = "yomeru", ja = "こんなに高{くては}、買えない。", en = "If it's this expensive, I can't buy it." },
  { source = "yomeru", ja = "そんなに食べ{ては}、おなかをこわすよ。", en = "If you eat that much, you'll upset your stomach." },
  { source = "yomeru", ja = "手紙を書い{ては}消し、なかなか終わらない。", en = "I keep writing and erasing the letter, and it never gets done." },
]

[[point]]
id = "te-ite-wa"
pattern = "ていては"
forms = ["でいては", "てては"]
jlpt = "N2"
meaning = "if you keep (doing), (it won't work out)"
formation = ["Verb［て］ + いては   (寝ていては)"]
explanation = """
Points at an ongoing action or habit and says it stops something good \
from happening: 毎日遊んでいては、合格できない, "if you play every \
day, you won't pass". Often a warning or a complaint."""
notes = """
ては with ている: the stress is on the action going on. Used with an \
unwelcome result, like ては. ようでは is close but judges a state."""
related = ["te-wa", "you-de-wa"]
examples = [
  { source = "yomeru", ja = "毎晩遅くまで起き{ていては}、体をこわすよ。", en = "If you keep staying up late every night, you'll ruin your health." },
  { tatoeba = "18011_179155", ja = "君がそこに立っ{ていては}仕事ができない。", en = "I can't work with you standing there." },
]

[[point]]
id = "te-wa-naranai"
pattern = "てはならない"
forms = ["ではならない", "てはなりません", "ではなりません", "てはならぬ"]
jlpt = "N2"
meaning = "must not (formal: rules, morals)"
formation = ["Verb［て］ + はならない   (忘れてはならない)"]
explanation = """
A formal "must not", for rules, laws and moral duties: 法を破っては\
ならない, "one must not break the law". You see it in written rules, \
speeches and advice to everyone, not in personal conversation."""
notes = """
てはいけない is the everyday version; てはならない is stiffer and more \
general, so it suits signs and principles. 〜ことを忘れてはならない, \
"we must not forget that…", is a common speech phrase. Its partner \
なくてはならない, "must", is in the なくてはいけない entry."""
related = ["te-wa-ikenai", "nakute-wa-ikenai", "beki-da"]
examples = [
  { tatoeba = "321022_82694", ja = "法は破っ{てはならない}。", en = "The law should not be violated." },
  { tatoeba = "16132_177283", ja = "君は今日外に出{てはならない}。", en = "You must not go out today." },
]

[[point]]
id = "ni-koshita-koto-wa-nai"
pattern = "に越したことはない"
forms = ["にこしたことはない", "に越したことはありません", "にこしたことはありません"]
jlpt = "N2"
meaning = "it's best to, nothing beats, you can't go wrong with"
formation = [
  "Verb［る］ + に越したことはない   (早く行くに越したことはない)",
  "［い］Adjective + に越したことはない",
  "Noun / ［な］Adjective + に越したことはない",
]
explanation = """
Says something is the better choice, though not strictly needed: 安い\
に越したことはない, "cheaper is always better". It's common sense \
advice: 用心するに越したことはない, "it never hurts to be careful"."""
notes = """
Literally "nothing goes past it". Softer than べきだ: it recommends \
without insisting, and often follows with "but…": 早いに越したことは\
ないが、急がなくてもいい. に限る, "nothing beats", is a stronger, \
personal preference. After a negative it means "best if there's \
none": 事故がないに越したことはない."""
related = ["ni-kagiru", "hou-ga-ii", "beki-da"]
examples = [
  { tatoeba = "329093_74626", ja = "警戒する{に越したことはない}。", en = "You can't be too vigilant." },
  { source = "yomeru", ja = "旅行の荷物は軽い{に越したことはない}。", en = "For a trip, the lighter your bags, the better." },
]

[[point]]
id = "ba-ii-to-iu-mono-de-wa-nai"
pattern = "ばいいというものではない"
forms = ["ばいいというものでもない", "ばいいってもんじゃない", "ばいいというわけではない", "ばいいというもんじゃない"]
jlpt = "N2"
meaning = "it's not enough just to, it's not just a matter of"
formation = ["Verb［ば］ + いいというものではない   (食べればいいというものではない)"]
explanation = """
Rejects a too-simple idea of what's needed: 勉強は長くやればいいという\
ものではない, "studying isn't just a matter of doing it for long". It \
implies that something more (quality, care, thought) also counts."""
notes = """
Casual speech says ばいいってもんじゃない. というものではない alone \
is "it's not (necessarily) the case that". たらいい / ばいい, \
"you should, it'd be good to", is the plain advice it argues with."""
related = ["to-iu-mono-de-wa-nai", "tara-ii", "wake-de-wa-nai"]
examples = [
  { source = "yomeru", ja = "料理は高い材料を使え{ばいいというものではない}。", en = "Cooking isn't just about using expensive ingredients." },
  { source = "yomeru", ja = "謝れ{ばいいってもんじゃない}よ。", en = "Saying sorry isn't enough, you know." },
]

[[point]]
id = "to-iu-mono-de-wa-nai"
pattern = "というものではない"
forms = ["というものでもない", "ってもんじゃない", "というもんじゃない", "というものではありません"]
jlpt = "N2"
meaning = "it's not (necessarily) the case that, it doesn't follow that"
formation = [
  "Verb + というものではない   (高ければいいというものではない)",
  "［い］Adjective / Noun + というものではない",
]
explanation = """
Denies a common belief or an easy assumption: 有名な店ならおいしいと\
いうものではない, "a famous restaurant isn't necessarily a good one". でもない \
softens it to "not always, not necessarily"."""
notes = """
わけではない is close, but corrects what someone might conclude from \
the situation; というものではない argues with a general idea. とは限ら\
ない, "not always", is also close. Not the same as というもの, "a thing \
called", in 紳士というもの."""
related = ["ba-ii-to-iu-mono-de-wa-nai", "wake-de-wa-nai", "to-wa-kagiranai"]
examples = [
  { tatoeba = "57418_220099", ja = "この品物はどこにでもある{というものではない}。", en = "You can't find this article everywhere." },
  { source = "yomeru", ja = "年を取れば上手になる{というものではない}。", en = "Getting older doesn't mean you get better at it." },
]

[[point]]
id = "to-naru-to"
pattern = "となると"
forms = ["となれば", "となったら", "ことになると", "こととなると"]
jlpt = "N2"
meaning = "when it comes to; if it turns out that, if that's the case"
formation = [
  "Noun + となると   (お金のこととなると)",
  "Verb + となると   (留学するとなると)",
]
explanation = """
Two uses. After a topic, "when it comes to": 料理となると、彼は誰にも\
負けない, "when it comes to cooking, no one beats him". After a \
plan or a new fact, "if that happens, then": 留学するとなると、お金が\
かかる, "if I study abroad, it'll cost money"."""
notes = """
いざとなったら / いざとなれば, "if it comes to it, in a crisis", are set \
phrases. ことになると is the topic use with a clause: 政治のことになると. \
とすると and としたら suppose; となると reacts to something decided or \
real. At the start of a sentence, となると means "in that case": \
となると、明日は休みだね."""
related = ["to-shitara", "to-ieba", "koto-ni-naru"]
examples = [
  { tatoeba = "272499_142071", ja = "折り紙{となると}、私は全く不器用です。", en = "I'm all thumbs when it comes to origami, or paper folding." },
  { tatoeba = "21010_183886", ja = "甘いもの{となると}、自分を抑えられないのです。", en = "When it comes to sweets, I just can't control myself." },
  { source = "yomeru", ja = "引っ越す{となると}、仕事も探さなければ。", en = "If I'm moving, I'll have to look for a job too." },
]

[[point]]
id = "ba-sumu"
pattern = "ばすむ"
forms = ["ば済む", "ばすむことだ", "ば済むことだ", "たら済む"]
jlpt = "N2"
meaning = "it's enough to just, all you have to do is"
formation = ["Verb［ば］ + すむ   (謝ればすむ)"]
explanation = """
Says a problem can be solved simply, with one small action: 電話一本\
かければすむ, "one phone call will do it". The negative turns it \
round: 謝ればすむ問題じゃない, "this isn't something an apology will \
fix"."""
notes = """
済む means "to be settled, to be over". ずにすむ is the partner: "get \
away without having to". ばいい also says "all you need to do", but \
as advice; ばすむ looks at how little it costs."""
related = ["zu-ni-sumu", "tara-ii", "ba-ii-to-iu-mono-de-wa-nai"]
examples = [
  { source = "yomeru", ja = "メール一通送れ{ばすむ}ことだ。", en = "All it takes is sending one email." },
  { source = "yomeru", ja = "謝れ{ば済む}問題じゃない。", en = "This isn't something an apology will fix." },
]
