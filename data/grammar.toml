  { source = "yomeru", ja = "でき{たての}料理は温かい。", en = "Freshly made food is warm." },
  { source = "yomeru", ja = "このペンキは塗り{たて}です。", en = "This paint is wet." },
]

[[point]]
id = "ppanashi"
pattern = "っぱなし"
forms = ["っ放し", "っぱなしにする", "っぱなしだ"]
jlpt = "N3"
meaning = "leave (as is, on, open); keep (doing)"
formation = ["Verb［stem］ + っぱなし   (開けっぱなし)", "Verb［stem］ + っぱなしにする   (leave it so)"]
explanation = """
Joined to a verb stem, says a state is left as it is when it should \
have been dealt with: 窓を開けっぱなしにした, "I left the window \
open". With other verbs, it says something goes on and on: 立ちっぱな\
しだった, "I was on my feet the whole time"."""
notes = """
Usually critical, for carelessness or something tiring. まま says a \
state goes on, neutrally: 窓を開けたまま寝た. っぱなし adds that it \
shouldn't have been left so. Casual; the written form is 〜放し."""
related = ["mama", "te-oku"]
examples = [
  { tatoeba = "65397_228044", ja = "エアコンをつけ{っぱなしにしない}で。", en = "Don't leave the air conditioner on." },
  { tatoeba = "276167_137069", ja = "誰かが水を出し{っぱなしにして}たんだ。", en = "Someone left the water running." },
  { tatoeba = "262190_152360", ja = "私は立ち{っぱなし}だった。", en = "I stood all the way." },
]

[[point]]
id = "gachi"
pattern = "がち"
forms = ["がちだ", "がちな", "がちです"]
jlpt = "N3"
hover = false
meaning = "tend to, apt to (something bad)"
formation = ["Verb［stem］ + がち   (忘れがち)", "Noun + がち   (病気がち)"]
explanation = """
Says something tends to happen often, usually something unwanted: 遅れ\
がちだ, "tend to be late"; 病気がちな子, "a sickly child". It works \
like a な-adjective: がちだ, がちな + noun."""
notes = """
Neutral habits are fine (ついパフェを頼みがち), often with つい or \
うっかり, but praise isn't: ×勉強しがち. やすい is about how easily \
something happens; がち is about how often it does. っぽい is for a \
person's nature (忘れっぽい, "forgetful"); がち is for a pattern. 曇り\
がち, "often cloudy", is common for weather."""
related = ["ppoi", "yasui", "gimi"]
examples = [
  { tatoeba = "301509_102184", ja = "彼は遅刻し{がちだ}。", en = "He is apt to be late." },
  { tatoeba = "251389_163123", ja = "うちの息子は病気{がちだ}。", en = "My son is subject to ill health." },
  { tatoeba = "275853_137383", ja = "大都会に住んでいる人は運動不足になり{がちだ}。", en = "People living in a big city tend to lack exercise." },
]

[[point]]
id = "gimi"
pattern = "気味"
forms = ["ぎみ", "気味だ", "気味の"]
jlpt = "N3"
meaning = "a touch of, slightly, -ish"
formation = ["Noun + 気味   (風邪気味)", "Verb［stem］ + 気味   (疲れ気味)"]
explanation = """
Says there is a slight sign of something, usually not good: 風邪気味, \
"a touch of a cold"; 疲れ気味, "a bit tired"; 太り気味, "a bit \
overweight". It works like a な-adjective: 気味だ, 気味の + noun."""
notes = """
気味 is about a light state right now; がち is about how often \
something happens: 風邪気味 "coming down with a cold", 風邪をひきがち \
"often catch colds". 気味が悪い, "creepy", and 不気味, "eerie", are \
words of their own."""
related = ["gachi", "ppoi"]
